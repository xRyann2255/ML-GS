[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volforecast"
version = "0.2.0"
description = "ML realized volatility forecasting — signal discovery"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.4",
    "scipy>=1.7",
    "statsmodels>=0.13",
    "scikit-learn>=1.0",
    "pypdf>=6.10.2",
    "pytz>=2026.2",
    "matplotlib>=3.5",
    "pyyaml>=6.0",
    "pyarrow>=24.0.0",
    "tqdm>=4.60",
    "rich>=13.0",
    "simple-term-menu>=1.6",
    "plotly>=5.18",
    "jinja2>=3.1",
]

[project.optional-dependencies]
gs = [
    "gs-quant-internal>=1.7",
]
ml = [
    "lightgbm>=3.3",
    "xgboost>=1.7",
    "optuna>=3.5",
    "shap>=0.43",
]
gpu = [
    "lightgbm>=3.3",
    "xgboost>=1.7",
    "torch>=1.12",
    "optuna>=3.5",
]
graph = [
    "torch>=1.12",
    "torch-geometric>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["volforecast"]

[project.scripts]
volforecast = "volforecast.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "mypy>=1.5",
    "ruff>=0.4",
    "pre-commit>=3.5",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default addopts: importlib mode + ignore tests/slow/ dir (real-data tests).
# The `slow` marker (applied via @pytest.mark.slow or module-level pytestmark)
# is filtered separately via `./vol test` (which adds -m "not slow"). Run
# `./vol test-all` for the complete suite including slow tests.
addopts = "--import-mode=importlib --ignore=tests/slow"
cache_dir = "../workspace/tmp/.pytest_cache"
markers = [
    "unit: fast tests using only synthetic data",
    "slow: tests >2s wall (LSTM training, subprocess spawn, full-universe loops). Skipped by ./vol test; included in ./vol test-all.",
    "integration: cross-module integration tests (synthetic data, no network)",
    "formula: mathematical formula verification with gold values from papers",
]
