  config: trial_046_drop_backward_ablation.yaml
  hypothesis: Removing the least-important backward-looking RV features (one at a
    time) frees tree split capacity in the 16-leaf LightGBM, letting the model allocate
    more splits to forward-looking signals (IV, calendar, cross-asset). Each of 8
    variants drops EXACTLY ONE feature; if any variant beats trial-036 at any horizon,
    the dropped feature is net-noise and the freed capacity delivers real QLIKE improvement.
  motivation: "Trial-045 proved hyperparameter tuning cannot fix the 16-leaves / 128-features\
    \ dilution. The structural fix must be feature-level. Trial-045's blanket removals\
    \ (no tree_expansion, no calendar, core_only) ALL hurt because they cut signal\
    \ alongside noise. This trial is the surgical inverse: drop ONE near-noise feature\
    \ per variant, measure marginal effect. Selection uses h=1 gain importance from\
    \ trial-036 fit (src/workspace/tmp/feature_importances.json) \u2014 bottom 8 backward-looking\
    \ features (pure RV/return derived, no IV, no calendar, no cross-asset). Variants\
    \ run 8-wide in parallel; har_iv included as linear sanity-check baseline (9 models\
    \ total)."
