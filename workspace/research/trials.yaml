  priority: 1
- id: trial-051
  date: '2026-06-22'
  config: trial_051_lstm_pool21.yaml
  hypothesis: LSTM (2-layer, hidden=128, attention pool) trained on 2340-bar intraday
    sequences (5 micro features) can learn vol dynamics that beat HAR/HAR-IV on at
    least one horizon.
  motivation: First serious LSTM benchmark. Pool across 21 symbols, 3 horizons, expanding-window
    CV (train=504, test=126). Compare to HAR baselines and LightGBM champion in same
    tournament.
  baseline_config: trial_036_CHAMPION.yaml
  horizons:
    h1:
      lstm: 0.4332
      har: 0.1607
      har_iv: 0.1607
      lgbm_champion: 0.1594
      verdict: CATASTROPHIC FAIL (LSTM 2.7x worse than HAR)
    h5:
      lstm: 0.3895
      har: 0.1377
      har_iv: 0.1377
      lgbm_champion: 0.1382
      verdict: CATASTROPHIC FAIL (LSTM 2.8x worse than HAR)
    h22:
      lstm: 0.3993
      har: 0.1947
      har_iv: 0.1947
      lgbm_champion: 0.1948
      verdict: CATASTROPHIC FAIL (LSTM 2.0x worse than HAR)
  key_insight: "TWO CRITICAL BUGS + ONE FUNDAMENTAL ISSUE:\n(1) BUG: har_iv == har\
    \ (identical to 15 decimal places). Config has\nfeature_layers=[har_core] at top\
    \ level \u2014 tournament models only see 6 HAR\nfeatures, har_iv has no IV data.\
    \ lgbm_champion similarly crippled (only har_core\nfeatures despite model_configs\
    \ specifying base_model=har_iv_1w). The tournament\nresults for baselines are\
    \ INVALID \u2014 they don't represent real HAR-IV or LightGBM\nperformance.\n\
    (2) BUG: lgbm_champion's model_configs doesn't specify feature_layers, so it\n\
    inherits the top-level [har_core] \u2014 only 6 features instead of 128. This\n\
    explains why lgbm_champion (0.1594) is barely better than har (0.1607).\n(3) FUNDAMENTAL:\
    \ LSTM standalone with 5 raw microstructure features (log_ret,\nvol_share, buy_ratio,\
    \ log_n_trades, abs_ret) and QLIKE loss achieves 0.43 \u2014\ncatastrophically\
    \ bad. The model converges in 7-12 epochs to a poor local\nminimum. Root causes:\n\
    \  - Sequence length 2340 is extreme for a 2-layer LSTM (vanishing gradients)\n\
    \  - 5 raw features lack the cumulative/summary statistics that HAR provides\n\
    \    (daily/weekly/monthly RV aggregates)\n  - QLIKE loss is asymmetric and harsh\
    \ on underestimation \u2014 a model that hasn't\n    learned the RV level gets\
    \ punished severely for every spike day\n  - Training set is tiny per fold (504\
    \ days \xD7 21 symbols = ~10K rows) for a\n    model with ~200K parameters\n \
    \ - Early stopping at 5 epochs with val_fraction=0.15 is too aggressive \u2014\
    \n    the model stops before learning useful patterns\nCONCLUSION: The LSTM cannot\
    \ directly predict log-RV from raw bars. It needs\neither (a) a strong init (residual\
    \ on LightGBM), or (b) pre-computed summary\nstatistics as additional input features,\
    \ or (c) much more data per fold.\n"
  status: completed
  priority: 1
- id: trial-053
  date: '2026-06-22'
  config: trial_053_lstm_residual_on_champion_h1.yaml
  hypothesis: LSTM residual learning on top of LightGBM champion (har_iv_0dte init)
    can capture intraday microstructure patterns that the tabular model misses, improving
    h=1 QLIKE by at least 1%.
  motivation: Trial-051 showed standalone LSTM is catastrophic. Residual learning
    gives the LSTM a strong starting point (LightGBM predictions) and only asks it
    to learn the correction. If intraday patterns (e.g., late-day order flow, gamma
    pinning, overnight gap prediction) exist, the LSTM should find them in the residuals.
  baseline_config: trial_036_CHAMPION.yaml
  horizons:
    h1:
      lstm_residual: 0.12878
      lgbm_champion: 0.12887
      har_iv_0dte: 0.13724
      har_iv_1w: 0.14036
      har_iv: 0.14968
      har: 0.16035
      vs_lgbm_bps: 0.9
      verdict: "NEUTRAL \u2014 LSTM residual adds +0.9 bps (noise-level, within seed\
        \ variance)"
  key_insight: "LSTM residual correction is essentially ZERO. The model learns to\
    \ predict\n~0 for the residual (y - lgbm_pred), which means adding it back produces\
    \ the\nsame prediction as LightGBM alone. ROOT CAUSE ANALYSIS:\n\n(1) RESIDUALS\
    \ ARE NOISE: After LightGBM with har_iv_0dte init extracts 153 bps\nof signal\
    \ above HAR-IV, the remaining residual (actual - predicted) is mostly\nunpredictable\
    \ white noise. The LSTM cannot find systematic patterns in noise.\n\n(2) INFORMATION\
    \ CONTENT MISMATCH: The 5 intraday features (log_ret, vol_share,\nbuy_ratio, log_n_trades,\
    \ abs_ret) are CONTEMPORANEOUS measures of TODAY's\ntrading activity. But the\
    \ target is TOMORROW's RV. Today's intraday patterns\npredict today's RV (which\
    \ LightGBM already captures via lag-1 RV features).\nThey do NOT predict the INCREMENTAL\
    \ change in tomorrow's RV above what\nyesterday's RV + IV already tells you.\n\
    \n(3) INSUFFICIENT FORWARD SIGNAL: For the LSTM to beat LightGBM, it would need\n\
    to detect intraday patterns that predict FUTURE vol BETTER than the options\n\
    market (which prices IV). The 5 features don't contain this:\n  - log_ret: already\
    \ captured by close-to-close RV\n  - vol_share/log_n_trades: liquidity = contemporaneous,\
    \ not predictive\n  - buy_ratio: order flow has ~1h half-life, decays to noise\
    \ by next day\n  - abs_ret: IS realized vol, exactly what the target already knows\
    \ via lag-1\n\n(4) TRAIN SIZE LIMITATION: 504 days \xD7 21 symbols \xD7 0.85 (val\
    \ split) = ~9K\ntraining sequences per fold. With 200K+ LSTM parameters, the model\
    \ is\nseverely overparameterized relative to training data. It learns to output\n\
    near-zero (safest prediction under QLIKE for small residuals).\n\n(5) EARLY STOPPING\
    \ TOO AGGRESSIVE: With early_stopping_rounds=5 and a\nnearly-flat loss surface\
    \ (residuals ARE noise), the model stops at epoch\n7-12 having barely moved from\
    \ initialization. The residual prediction\nconverges to the mean (\u22480) which\
    \ is optimal under QLIKE when the true\nsignal is absent.\n\nIMPLICATIONS FOR\
    \ TRIAL-054 AND BEYOND:\n- Single-fold (trial-054) won't help \u2014 more training\
    \ data doesn't create\n  signal where none exists\n- The LSTM needs DIFFERENT\
    \ input features that carry forward-looking\n  information not already in IV:\n\
    \  * VPIN (order flow toxicity \u2014 30min to 2h lead on vol spikes)\n  * Cumulative\
    \ intraday RV trajectory (intraday momentum \u2192 overnight gap)\n  * Late-day\
    \ option flow / gamma exposure changes\n  * Cross-asset contagion (FX vol spikes\
    \ in Asian session \u2192 US open vol)\n- Or the LSTM should predict a DIFFERENT\
    \ target: not next-day RV but\n  same-day RV (nowcasting from partial-day sequences)\n\
    - Or use feature_stack architecture: extract LSTM embedding/attention\n  features\
    \ and feed them as columns to LightGBM (bypass the residual\n  framework entirely)\n"
  status: completed
  priority: 1
