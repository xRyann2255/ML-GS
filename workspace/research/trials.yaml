      best_variant:
        name: lgbm_drop_rk_w_ch
        qlike: 0.16825
        vs_control_bps: -4.1
      all_variants_bps_vs_control:
        drop_rk_w_ch: -4.1
        drop_rsp_w_ch: -9.6
        drop_cont_w_ch: -10.7
        drop_rk_d_zs: -12.1
