  motivation: Trial-036 spec is the project's most-cited champion. Tail-event regimes
    are rare and the model has not seen COVID-magnitude vol spikes in training when
    predicting 2022-2024. Hypothesis is that exposure to COVID teaches regime-conditional
    behavior that generalizes to other stress events. Identical to trial-036 in all
    other respects so the train_size effect is isolated. (Originally created as trial-048
    and renamed because trial-048 was already claimed by the planned bagged5 trial.)
  baseline_config: trial_036_CHAMPION.yaml
  horizons:
    h1:
      qlike: 0.1129
      qlike_trial036_published: 0.1289
      qlike_trial036_reseeded_mean: 0.13679
      vs_trial036_published_bps: 160
      vs_trial036_reseeded_bps: 239
      verdict: QLIKE nominally improved but test window shifted to 2022-05-2024 (post-COVID,
        calmer period; same artifact as trial-030b retraction)
    h5:
      qlike: 0.0867
      qlike_trial036_published: 0.1067
      qlike_trial036_reseeded_mean: 0.10804
      vs_trial036_published_bps: 200
      vs_trial036_reseeded_bps: 213
      verdict: QLIKE nominally improved but test window shifted (same caveat)
    h22:
      qlike: 0.0881
      qlike_trial036_published: 0.1628
      qlike_trial036_reseeded_mean: 0.16826
      qlike_har_iv_reseeded: 0.16755
      vs_trial036_published_bps: 747
      vs_har_iv_reseeded_bps: 795
      verdict: Large QLIKE drop almost certainly dominated by test-set distribution
