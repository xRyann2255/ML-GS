        sharpe_trial049: 0.7553
        delta_sharpe: -0.3475
        position_rate_trial036_pct_short: 48.9
        position_rate_trial049_pct_short: 47.7
      h22:
        sharpe_trial036: 0.0572
        sharpe_trial049: -0.067
        delta_sharpe: -0.1242
    always_long_calibration:
