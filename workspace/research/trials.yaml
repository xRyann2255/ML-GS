- id: trial-042
  date: '2026-06-05'
  config: null
  script: workspace/scripts/gsvivs_threshold_sweep.py
  hypothesis: Sweeping GSVIVS01 short_threshold from 0.00 to 0.10 reveals the precision-Sharpe
    Pareto frontier. Current implementation uses threshold=0 (binary +1/-1 signal).
    Adding a dead zone (flat when |gap| < threshold) may reduce false short signals
    (higher precision) while preserving Sharpe. Tests both 3-state (+1/0/-1) and default_long
    (+1/-1) variants.
  motivation: "Trial-041 GSVIVS backtest used binary signal with no dead zone. The\
    \ short_threshold parameter was passed but NOT actually used in the iv_rv_gap\
    \ code path (dead code bug). This sweep is the cheapest experiment: train model\
    \ once, then apply 11 thresholds \xD7 2 variants post-hoc on the gap series. No\
    \ retraining needed per threshold."
  baseline_config: trial_041_gsvivs_only_test.yaml
  horizons:
    h1:
      eval_period: 2022-07-01 to 2024-11-25 (480 days)
      gap_stats: mean=0.0434 std=0.0296 min=-0.0413 max=0.2051
      best_3state:
        threshold: 0.0
        sharpe: 2.852
        precision: 0.7
        recall: 0.045
      best_default_long:
        threshold: 0.0
        sharpe: 2.852
        precision: 0.7
        recall: 0.045
      baseline_always_long:
        sharpe: 2.615
      verdict: THRESHOLD=0.00 IS OPTIMAL (Sharpe 2.85 vs always_long 2.62, +9%)
  key_insight: 'The gap is ALMOST ALWAYS POSITIVE (mean=4.3%, min=-4.1%). VRP is persistently
    positive in this period (2022-2024). The signal is long 97.9% of days at threshold=0.
    Adding ANY positive threshold (0.01-0.10) HURTS Sharpe because it replaces the
    rare correct short signals with flat. At thresh=0.01+, only 1 day out of 480 triggers
    short (vs 10 at thresh=0). The 10 short days at thresh=0 have 70% precision (7/10
    correctly predicted index drawdowns). Higher thresholds eliminate all short signals.
    CONCLUSION: threshold=0 (binary signal, no dead zone) is already optimal. The
    model adds +24 bps Sharpe over always-long by correctly going short on the 2.1%
    of days when gap < 0. The value is in SHORT signal precision (70%), not in avoiding
    bad longs. Dead zones destroy the small edge. NOTE: Used iv_1w_atm (EDRVS 0DTE
    cache unavailable). With 0DTE var-swap strike the gap distribution may shift,
    worth retesting.'
  status: completed
  priority: 1
