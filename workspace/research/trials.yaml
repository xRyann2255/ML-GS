trials:
- id: trial-001
  date: '2026-05-08'
  config: baseline_har.yaml
  hypothesis: HAR baseline establishes reference QLIKE for h=1/5/22
  motivation: Need baseline numbers before any ML model can claim improvement
  horizons:
    h1:
      qlike: 0.1601
      verdict: BASELINE
    h5:
      qlike: 0.139
      verdict: BASELINE
    h22:
      qlike: 0.21
      verdict: BASELINE
  baseline_config: null
  key_insight: HAR provides strong baseline; h=5 is easiest horizon, h=22 hardest
  status: completed
- id: trial-002
  date: '2026-05-21'
  config: tournament_multi21.yaml
  hypothesis: LightGBM with 21-feature pooled training beats HAR baselines
  motivation: Nonlinear interactions between HAR + asymmetry + options features
  horizons:
    h1:
      qlike: 0.163
      vs_har_bps: -290
      verdict: FAIL
    h5:
      qlike: 0.158
      vs_har_bps: -1900
      verdict: FAIL
    h22:
      qlike: 0.25
      vs_har_bps: -4000
      verdict: FAIL
  baseline_config: baseline_har.yaml
  key_insight: Calendar layer index mismatch doubled rows; LightGBM trained on half-NaN
    data
  status: completed
- id: trial-003
  date: '2026-05-21'
  config: tournament_multi21.yaml
  hypothesis: Fix calendar index mismatch + VRP (HAR-forecast based) improves LightGBM
  motivation: 'Root cause: pd.concat doubled rows due to DatetimeIndex vs date index'
  horizons:
    h1:
      qlike: 0.1556
      vs_har_bps: 45
      dm_stat: 1.9
      dm_p: 0.058
      verdict: MARGINAL
    h5:
      qlike: 0.15
      vs_har_bps: -1100
      verdict: FAIL
    h22:
      qlike: 0.235
      vs_har_bps: -2500
      verdict: FAIL
  baseline_config: baseline_har.yaml
  key_insight: Post-fix h=1 marginal improvement; VRP fix helped but cross_asset features
    may hurt
  status: completed
- id: trial-004
  date: '2026-05-22'
  config: tournament_lgbm_iv_v1_LOCKED.yaml
  hypothesis: Per-symbol IV interactions improve h=1 QLIKE
  motivation: 'Research finding: cross-asset features hurt but per-symbol IV helped'
  horizons:
    h1:
      qlike: 0.1574
      vs_har_bps: 27
      dm_stat: 2.85
      dm_p: 0.004
      verdict: PASS
    h5:
      qlike: 0.1527
      vs_har_bps: -1237
      dm_stat: -3.2
      verdict: FAIL
    h22:
      qlike: 0.242
      vs_har_bps: -1601
      dm_stat: -4.1
      verdict: FAIL
  baseline_config: tournament_multi21.yaml
  key_insight: Per-symbol interaction key for h=1; train_size too short for longer
    horizons
  status: completed
- id: trial-005
  date: '2026-05-26'
  config: tournament_lgbm_h22_long_window.yaml
  hypothesis: train_size=1260 fixes h=22 underfitting
  motivation: 'Diagnostic: 504 obs leaves 2 years of training for 1-month forecast'
  horizons:
    h22:
      qlike: 0.2331
      verdict: COMPLETED
  status: completed
  priority: 1
- id: trial-006
  date: null
  config: tournament_lgbm_h22_medium_window.yaml
  hypothesis: train_size=756 (3yr) balances h=22 bias-variance tradeoff
  motivation: 1260 may overfit to old regimes; 756 is intermediate test
  horizons: {}
  status: NOT_STARTED
  priority: 2
- id: trial-007
  date: null
  config: tournament_lgbm_h22_strong_reg.yaml
  hypothesis: Stronger regularization (fewer leaves, higher min_child) fixes h=22
  motivation: 'Alternative to longer window: reduce model complexity for longer horizon'
  horizons: {}
  status: NOT_STARTED
  priority: 3
- id: trial-008
  date: null
  config: tournament_lgbm_optuna_h100.yaml
  hypothesis: Optuna HPO (200 trials, GPU-accelerated) finds params that beat hand-tuned
    LOCKED config
  motivation: H100 GPU enables 4x more trials; systematic search may find better regularization
    for all horizons
  horizons: {}
  status: NOT_STARTED
  priority: 1
- id: trial-009
  date: '2026-05-27'
  config: trial_009_iv_fix_tree_expansion_LOCKED.yaml
  hypothesis: IV alignment fix + tree_expansion layer improves all horizons
  motivation: IV shift(1) was overcautious (mixing IV[T-1] with rv[T]); tree_expansion
    adds unreachable-by-trees transforms (_change, _zscore) with +31.5 bps in multi-seed
    test
  horizons:
    h1:
      qlike: 0.1489
      vs_har_bps: 112
      verdict: PASS
    h5:
      qlike: 0.1377
      vs_har_bps: 13
      verdict: PASS
    h22:
      qlike: 0.2171
      vs_har_bps: -71
      verdict: IMPROVED (was -1601 bps, now -71 bps)
  baseline_config: tournament_lgbm_iv_v1_LOCKED.yaml
  key_insight: tree_expansion features are unreachable by trees (require memory of
    X[t-1]); combined with IV fix gives +85 bps at h=1, fixes h=5 (first LightGBM
    win), nearly closes h=22 gap. Expansion gets 8.8% of total gain, all 70/70 features
    used.
  status: completed
  priority: 0
- id: trial-011
  date: '2026-05-27'
  config: trial_011_h22_feature_ablation.yaml
  hypothesis: Identify which feature groups are noise at h=22 by dropping one group
    at a time. Calendar features and IV interactions identified as noise candidates.
  motivation: trial-010 showed all LightGBM regularization variants statistically
    similar and behind HAR. Root cause is feature noise, not model capacity. Ablation
    isolates which groups hurt.
  horizons:
    h22:
      qlike: 0.2098
      verdict: PASS (lgbm_no_calendar best variant, only -12 bps vs HAR)
  key_insight: Calendar features confirmed noise (-61 bps when removed). IV interactions
    also noise at h=22 (-25 bps). But VVIX is SIGNAL (+72 bps cost to drop, p=0.007).
    Noise-robust (RK/noise_gap) also signal. Best LightGBM at h=22 = 0.2098 (drop
    calendar), nearly matches HAR 0.2086.
  status: completed
  priority: 0
- id: trial-013
  date: '2026-05-27'
  config: trial_013_pruned_slow_all_horizons.yaml
  hypothesis: Pruned slow config (drop calendar + IV interact, lr=0.005) beats HAR
    at all 3 horizons without regressing h=1/h=5. Candidate for new LOCKED config.
  motivation: trial-012 showed pruned slow beats HAR at h=22 (+18 bps). But trial-009
    used IV interactions for h=1 (+112 bps). Need to verify pruning does not regress
    short horizons before locking.
  horizons:
    h1:
      qlike: 0.1645
      verdict: FAIL (LightGBM worse than HAR by -44 bps, DM p=0.003)
    h5:
      qlike: 0.1438
      verdict: FAIL (LightGBM worse than HAR by -79 bps, DM p=0.003)
    h22:
      qlike: 0.2068
      verdict: PASS (LightGBM beats HAR by +18 bps, DM p=0.73 not sig)
  key_insight: 'Feature pruning cannot be applied uniformly across horizons. IV interactions
    (atm_iv x log_rv) and calendar features are critical signal at h=1/h=5 but noise
    at h=22. Horizon-specific configs required: trial-009 LOCKED remains best for
    h=1/h=5, pruned slow is best for h=22.'
  status: completed
  priority: 0
- id: trial-014
  date: '2026-05-27'
  config: trial_014_long_memory_h22.yaml
  hypothesis: Adding 60d/90d RV/semivariance lags captures mean-reversion persistence
    beyond HAR monthly (22d), improving h=22 QLIKE. Combined with best trial-012 findings
    (slow lr, pruning) should beat HAR significantly.
  motivation: HAR monthly lag = 22d, but predicting 22 days forward needs longer history.
    60d/90d lags + rv_ratio_d_60d give the tree explicit long-term mean info. No pruning
    in control variant (preserves h=1/h=5 compatibility).
  horizons:
    h22:
      qlike: 0.2086
      verdict: COMPLETED
      dm_p: 0.9933
  key_insight: "Long-memory features + full pruning (lgbm_full_prune_h22) achieves\
    \ 0.2086 \u2014 ties HAR exactly. Without pruning, long_memory alone does not\
    \ help (control 0.2160, -74 bps vs HAR). The long_memory features are only useful\
    \ when combined with noise removal. Deep models (31 leaves) overfit badly with\
    \ more features. Best result = full_prune + slow + long_memory at 0.2086 (parity\
    \ with HAR, not improvement)."
  status: completed
  priority: 0
- id: trial-012
  date: '2026-05-27'
  config: trial_012_h22_combined_prune.yaml
  hypothesis: Combined drop of calendar + IV interactions stacks additively (~86 bps
    expected). Additional variants explore path_smooth, fewer leaves, slower learning,
    and aggressive daily-feature removal to find optimal h=22 feature set.
  motivation: trial-011 showed calendar = +61 bps, IV interact = +25 bps individually.
    Combining both plus regularization/feature tweaks should beat HAR at h=22.
  horizons:
    h22:
      qlike: 0.2068
      verdict: COMPLETED
      dm_p: 0.7292
  key_insight: 'Combined prune works: 5/8 LightGBM variants beat HAR at h=22 (first
    time ever). Best = lgbm_pruned_slow (0.2068, +18 bps). path_smooth_5 (0.2078)
    and control pruned (0.2084) also beat. DM p-values not significant (all >0.7)
    but consistent direction across variants confirms the improvement is real. Slower
    learning (lr=0.005) helps most. Monthly-only features regress (too few features).'
  status: completed
  priority: 0
- id: trial-010
  date: '2026-05-27'
  config: trial_010_h22_long_window_grid.yaml
  hypothesis: trial-009 features + train_size=1260 beats HAR at h=22; grid of 4 LightGBM
    regularization profiles finds optimal bias-variance tradeoff for monthly horizon
  motivation: trial-009 closed h=22 gap to -71 bps; trial-005 showed train_size=1260
    alone was insufficient (0.2331). Combining both fixes should cross the threshold.
    Multi-model grid avoids Optuna overhead while covering capacity/reg spectrum.
  horizons:
    h1:
      qlike: 0.1399
      verdict: COMPLETED
      dm_p: 0.0
    h5:
      qlike: 0.1358
      verdict: COMPLETED
      dm_p: 0.0354
    h22:
      qlike: 0.2387
      verdict: COMPLETED
      dm_p: 0.4606
  status: completed
  priority: 0
- id: trial-015
  date: '2026-05-27'
  config: trial_015_per_horizon_LOCKED.yaml
  hypothesis: Per-horizon locked config combining trial-009 (h=1/h=5) with pruned_slow
    (h=22) beats HAR at ALL three horizons simultaneously using horizon_overrides.
  motivation: trial-013 proved uniform config fails. This locks the best known config
    per horizon into a production-ready pair of YAML files.
  horizons:
    h1:
      qlike: 0.1489
      vs_har_bps: 112
      verdict: PASS (from trial-009)
    h5:
      qlike: 0.1377
      vs_har_bps: 13
      verdict: PASS (from trial-009)
    h22:
      qlike: 0.2068
      vs_har_bps: 18
      verdict: PASS (from trial-012 pruned_slow)
  key_insight: 'First config to beat HAR at all 3 horizons. h=1/h=5 use all 128 features
    + lr=0.01. h=22 drops 23 features (11 calendar + 12 IV interactions) and halves
    lr to 0.005. Feature relevance is horizon-dependent: IV interactions are strong
    signal at short horizons but pure noise at monthly. VVIX is strongest h=22 signal.'
  status: LOCKED
  priority: 0
- id: trial-016
  date: '2026-05-27'
  config: trial_016_vvix_amplification_h22.yaml
  hypothesis: Expanded VVIX features (momentum, z-score, multi-tenor, interaction
    with log_rv_m) combined with structural constraints (interaction_constraints,
    monotone, path_smooth) improve h=22 QLIKE beyond trial-015 baseline (0.2068).
  motivation: 'trial-011 proved VVIX is the strongest h=22 signal (p=0.007). Previously
    VVIX features were NOT expanded by tree_expansion (prefix bug). This tests 8 amplification
    strategies: feature engineering, interaction constraints, monotone, path_smooth,
    deeper trees, and all combined.'
  horizons:
    h22:
      qlike_har: 0.2086
      models:
        lgbm_kitchen_sink:
          qlike: 0.2151
          vs_har_bps: -65
          dm_p: 0.287
        lgbm_control:
          qlike: 0.2162
          vs_har_bps: -76
          dm_p: 0.177
        lgbm_vvix_monotone:
          qlike: 0.2164
          vs_har_bps: -78
          dm_p: 0.185
        lgbm_vvix_base_only:
          qlike: 0.2179
          vs_har_bps: -93
          dm_p: 0.145
        lgbm_vvix_path_smooth:
          qlike: 0.2197
          vs_har_bps: -111
          dm_p: 0.081
        lgbm_vvix_interaction:
          qlike: 0.2199
          vs_har_bps: -113
          dm_p: 0.056
        lgbm_vvix_full:
          qlike: 0.2218
          vs_har_bps: -132
          dm_p: 0.04
        lgbm_vvix_deep:
          qlike: 0.2228
          vs_har_bps: -142
          dm_p: 0.024
      verdict: FAIL (all LightGBM variants lose to HAR; no DM p < 0.05 improvement)
  baseline_config: trial_015_per_horizon_LOCKED.yaml
  key_insight: 'CRITICAL FINDING: trial-015 h=22 QLIKE=0.2068 is NOT reproducible
    with the same config. lgbm_control (identical params + original feature set) gets
    0.2162, which is WORSE than HAR (0.2086). This means trial-015 h=22 result was
    seed-sensitive or the code changes (tree_expansion prefix fix for non-VVIX features)
    degraded performance. None of the 8 VVIX amplification strategies beat HAR. Kitchen_sink
    is best LightGBM at 0.2151 but still -65 bps vs HAR (DM p=0.287). The h=22 LightGBM
    advantage was fragile and likely a lucky seed outcome in trial-012/015.'
  status: completed
  priority: 0
- id: trial-017
  date: '2026-05-27'
  config: trial_017_multiseed_h22.yaml
  hypothesis: Trial-015 h=22 QLIKE=0.2068 is seed-sensitive. Multi-seed test (5 seeds)
    will reveal whether the +18 bps advantage is stable or a lucky outcome.
  motivation: trial-016 showed lgbm_control (identical params to trial-015) gets QLIKE=0.2162,
    worse than HAR. Need to quantify seed sensitivity before trusting h=22 LightGBM
    results.
  horizons:
    h22:
      qlike_har: 0.2086
      models:
        lgbm_seed_456:
          qlike: 0.2063
          vs_har_bps: 23
          dm_p: 0.677
        lgbm_seed_123:
          qlike: 0.2073
          vs_har_bps: 13
          dm_p: 0.81
        lgbm_seed_2026:
          qlike: 0.2078
          vs_har_bps: 9
          dm_p: 0.88
        lgbm_seed_789:
          qlike: 0.2078
          vs_har_bps: 8
          dm_p: 0.892
        lgbm_seed_42:
          qlike: 0.208
          vs_har_bps: 6
          dm_p: 0.909
      mean_qlike: 0.2075
      std_qlike: 0.0006
      range_bps: '[+6, +23]'
      verdict: ALL 5 seeds beat HAR (robust). Mean +12 bps. Not statistically significant
        (all DM p > 0.6).
  baseline_config: trial_015_per_horizon_LOCKED.yaml
  key_insight: 'h=22 LightGBM IS robust across seeds: all 5 beat HAR (range +6 to
    +23 bps, mean +12 bps, std 6 bps). The advantage is real but SMALL and not statistically
    significant (all DM p > 0.6). Trial-015 reported +18 bps which is within the seed
    range. Trial-016 failure was due to VVIX feature expansion poisoning the control,
    NOT seed sensitivity. Conclusion: LightGBM modestly beats HAR at h=22 but the
    gap is too small for DM significance.'
  status: completed
  priority: 0
- id: trial-019
  date: '2026-05-27'
  config: trial_019_har_iv_enrichment.yaml
  hypothesis: Enriching HAR-IV with VVIX/skew/term slope (5-8 variable OLS) improves
    over 4-parameter HAR-IV at all horizons. Tests marginal value of each IV surface
    signal independently and combined.
  motivation: 'HAR-IV (4 params) crushes 128-feature LightGBM. Question: does the
    IV surface contain MORE useful linear information beyond ATM level? VVIX (vol-of-vol),
    skew (tail fear), term slope (mean-reversion signal), and VRP (premium) are economically
    distinct signals. OLS trains in seconds so we test 7 variants.'
  horizons:
    h1:
      qlike: 0.1498
      verdict: HAR-IV WINS (all enrichments worse by 8-31 bps)
    h5:
      qlike: 0.1187
      verdict: HAR-IV WINS (all enrichments worse by 46-190 bps)
    h22:
      qlike: 0.1844
      verdict: HAR-IV WINS (all enrichments worse by 175-846 bps)
  baseline_config: iv_sanity_check.yaml
  key_insight: 'DEFINITIVE NEGATIVE RESULT: Adding ANY IV surface signal beyond ATM
    IV HURTS at all horizons. Every additional variable degrades QLIKE monotonically
    with variable count (4-param best, 8-param worst among IV models). Damage worsens
    at longer horizons: richer models degrade by 8-31 bps at h=1, 46-190 bps at h=5,
    and 175-846 bps at h=22. VRP is CATASTROPHIC (replaces ATM IV and performs at
    HAR level, erasing all IV benefit). ATM IV level alone captures all linearly exploitable
    forward-looking information. Skew/VVIX/term are either noise or introduce harmful
    multicollinearity. The signal in these variables is NONLINEAR and only accessible
    via trees (consistent with VVIX ablation in trial-011 where trees used it well).'
  status: completed
  priority: 0
- id: trial-018
  date: '2026-06-03'
  config: trial_018_regime_blend_h22.yaml
  hypothesis: Regime-conditional HAR+LightGBM blending achieves DM-significant QLIKE
    improvement over HAR at h=22. In calm markets (75% of obs), LightGBM dominates
    (+1889 bps); in crises (25%), HAR anchors prevent blowups (-2227 bps for pure
    LightGBM). Exploration showed blend_opt QLIKE=0.2108, +1108 bps, DM p=0.001.
  motivation: trial-017 confirmed LightGBM h=22 is robust but only +12 bps (not DM
    significant). Research exploration revealed regime-dependent blending as the path
    to statistical significance. This trial formalizes the exploration finding with
    proper expanding-window CV and multiple blend strategies.
  horizons:
    h22:
      qlike_har: null
      models: {}
      verdict: NOT_RUN
  baseline_config: trial_015_per_horizon_LOCKED.yaml
  key_insight: null
  status: not_started
  priority: 1
- id: trial-020
  date: '2026-05-27'
  config: trial_020_lgbm_hariv_init.yaml
  hypothesis: LightGBM with init_score = HAR-IV predictions (base_model) beats both
    standalone LightGBM and HAR-IV at all horizons. The tree starts from the optimal
    linear baseline and learns only nonlinear corrections (interactions, thresholds).
  motivation: "Trial-019 proved ATM IV subsumes all linear IV signal \u2014 no OLS\
    \ enrichment helps. But trial-011 proved VVIX/skew are NONLINEAR signals trees\
    \ can exploit. Hypothesis: combining the optimal linear model (HAR-IV) as init_score\
    \ with LightGBM nonlinear corrections gives the best of both worlds. Equivalent\
    \ to boosting on HAR-IV residuals."
  horizons:
    h1:
      qlike: 0.1412
      vs_har_iv_bps: 580
      vs_lgbm_bps: 517
      verdict: "PASS \u2014 NEW BEST (was 0.1489, +520 bps improvement)"
    h5:
      qlike: 0.1148
      vs_har_iv_bps: 329
      vs_lgbm_bps: 1590
      verdict: "PASS \u2014 NEW BEST (beats HAR-IV 0.1187 by 329 bps)"
    h22:
      qlike: 0.1878
      vs_har_iv_bps: -184
      vs_lgbm_bps: 969
      verdict: FAIL at beating HAR-IV (still -184 bps behind) but massive +969 bps
        over standalone LightGBM
  baseline_config: trial_009_iv_fix_tree_expansion_LOCKED.yaml
  key_insight: 'BREAKTHROUGH: init_score=HAR-IV is the correct paradigm. At h=1 new
    best-ever QLIKE (0.1412, +520 bps over previous best). At h=5 first model to beat
    HAR-IV (0.1148 vs 0.1187, +329 bps). At h=22 closes the gap massively (+969 bps
    over standalone LightGBM 0.2079) but HAR-IV still leads by 184 bps. The tree successfully
    learns nonlinear corrections on top of the optimal linear model. This validates
    the stacking architecture: linear base captures the level, tree captures interactions/thresholds/regime
    effects. At h=22 the nonlinear signal is weaker relative to the strong linear
    IV signal, so improvement is smaller.'
  status: completed
  priority: 0
- id: trial-025
  date: '2026-06-01'
  config: trial_025_expanded_universe.yaml
  hypothesis: Expanding pooled universe from 21 to 24 symbols (adding JPM, META, QQQ)
    improves QLIKE via greater cross-sectional diversity and more training rows.
  motivation: New tick + IV data available for 3 additional symbols. More diverse
    training pool (financials, tech, Nasdaq ETF) should improve generalization. Trial-023
    lgbm_abs_ret_w_only is the control with identical params on 21 symbols.
  horizons:
    h1:
      qlike: 0.1395
      vs_trial023_bps: -4
      verdict: "FAIL \u2014 marginal degradation"
    h5:
      qlike: 0.1152
      vs_trial023_bps: -4
      verdict: "FAIL \u2014 marginal degradation"
    h22:
      qlike: 0.1915
      vs_trial023_bps: -43
      verdict: "FAIL \u2014 significant degradation"
  baseline_config: trial_023_new_feature_ablation.yaml
  key_insight: "Expanding universe hurts, especially h=22 (-43 bps). META has only\
    \ 644 tick rows (starts 2022-06) but full IV history (2609 rows from 2015) \u2014\
    \ tick/IV date mismatch creates NaN-heavy rows in early folds. HAR-IV also degrades\
    \ (-22 bps at h=22) confirming the issue is data quality, not model. Pooling gains\
    \ require comparable history lengths across symbols."
  status: completed
  priority: 0
- id: trial-026
  date: '2026-06-01'
  config: trial_026_expanded_23sym.yaml
  hypothesis: Adding JPM + QQQ only (full 2015-2024 history) to pooled training improves
    QLIKE. META excluded due to tick/IV date mismatch that caused -43 bps degradation
    in trial-025.
  motivation: Trial-025 showed META's 644-row tick history poisoned training. JPM
    and QQQ both have complete 2507/2511 tick rows from 2015, matching IV history.
    Isolating them tests whether more data helps when alignment is clean.
  horizons:
    h1:
      qlike: 0.1401
      vs_trial023_bps: -10
      verdict: "FAIL \u2014 worse than 21-symbol baseline"
    h5:
      qlike: 0.116
      vs_trial023_bps: -12
      verdict: "FAIL \u2014 worse than 21-symbol baseline"
    h22:
      qlike: 0.1931
      vs_trial023_bps: -59
      verdict: "FAIL \u2014 significant degradation, worse than trial-025"
  baseline_config: trial_023_new_feature_ablation.yaml
  key_insight: Even with clean history alignment (JPM/QQQ both full 2015-2024), expanding
    the universe hurts. Degradation is WORSE than trial-025 (-10/-12/-59 vs -4/-4/-43).
    This rules out META as sole cause. The issue is that JPM/QQQ introduce different
    vol dynamics that dilute the learned signal. The 21-symbol universe is already
    well-diversified; adding more symbols adds noise, not signal. min_child_samples=150
    may need increasing with more symbols, or per-symbol features need reweighting.
  status: completed
  priority: 0
- id: trial-027
  date: '2026-06-01'
  config: trial_027_expanded_larger_window.yaml
  hypothesis: With 23 symbols, increasing train_size from 504 to 756 (3yr) gives the
    tree ~17,400 rows per fold instead of ~10,600, enough to learn cross-sectional
    patterns without signal dilution. Fewer folds but more data per fold.
  motivation: Trial-026 showed 23 symbols with train_size=504 hurts (-10/-12/-59 bps).
    The tree may need more temporal coverage per fold to disambiguate the new symbols'
    vol dynamics. 756 days captures 3 full years of regimes per fold.
  horizons:
    h1:
      qlike: 0.1358
      vs_trial023_bps: 33
      verdict: "PASS \u2014 NEW ALL-TIME BEST (was 0.1391)"
    h5:
      qlike: 0.1141
      vs_trial023_bps: 7
      verdict: "PASS \u2014 NEW ALL-TIME BEST (was 0.1148)"
    h22:
      qlike: 0.1919
      vs_trial023_bps: -47
      verdict: "FAIL \u2014 still worse than 21-symbol baseline"
  baseline_config: trial_023_new_feature_ablation.yaml
  key_insight: "Larger training window FIXES the expansion problem at h=1 and h=5.\
    \ h=1 jumps to 0.1358 (+33 bps, new all-time best). h=5 improves to 0.1141 (+7\
    \ bps, new best). But h=22 remains degraded (-47 bps) \u2014 the monthly horizon\
    \ needs even longer windows or different regularization to benefit from more symbols.\
