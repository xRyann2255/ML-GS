        on the SAME test dates
  economic_value:
    iv_variant: "Exec Kvar (true fill) \u2014 default gsvivsStatsByHorizon (real GSVIVS01\
      \ execution prices, production metric). Note: dashboard IV switcher only re-plots\
      \ PnL; the Sharpe table is single-variant."
    metric: sharpe_0rf
    gsvivs_exec_kvar:
      h1:
        sharpe_trial036: 1.9526
        sharpe_trial049: 1.3655
        delta_sharpe: -0.5871
        position_rate_trial036_pct_short: 56.7
        position_rate_trial049_pct_short: 54.4
      h5:
