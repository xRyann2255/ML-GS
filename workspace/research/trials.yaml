    trading intensity and liquidity dynamics that precede vol moves.'
  motivation: MicrostructureLayer implemented from cached parquets (29 symbols, 2015-2024).
    12 base features + 24 tree_expansion derivatives = 36 new features. Literature
    (Optiver 2023, CSV 2023) shows VPIN and OFI have significant predictive power
    for short-horizon vol. Trial-036 is current champion (h1=0.1289, h5=0.1067, h22=0.1628).
    This tests whether microstructure adds signal above the IV + RV combination.
  baseline_config: trial_036_lgbm_0dte_tenor_matched.yaml
  horizons:
    h1:
      qlike: 0.1375
      vs_trial036_bps: -86
      dm_p: 3.5e-14
      verdict: FAIL (worse than baseline by 86 bps)
    h5:
      qlike: 0.1077
      vs_trial036_bps: -10
      dm_p: 0.0
      verdict: NEUTRAL (within noise, -10 bps)
    h22:
      qlike: 0.1687
      vs_trial036_bps: -59
      dm_p: 0.0
      verdict: FAIL (worse than baseline by 59 bps)
  key_insight: 'Microstructure features HURT LightGBM performance at h=1 (-86 bps)
    and h=22 (-59 bps). h=5 unchanged. Pattern consistent with signal dilution: adding
    36 features (12 base + 24 tree_expansion) to 128 existing features dilutes splits
