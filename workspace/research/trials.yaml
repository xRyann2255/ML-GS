- id: trial-062
  date: '2026-06-22'
  config: workspace/configs/trial_062_long_flat_optimal.yaml
  hypothesis: long_flat sizing mode with threshold=0 ("flat when gap < 0") is the
    walk-forward-validated optimal signal for GSVIVS01. The simple rule requires no
    threshold tuning and delivers honest Sharpe 1.83 at h=1 with 65% position rate.
  motivation: "Static sweep found t=-0.001 (Sharpe 3.29) but this was OVERFIT to the\
    \ test period. Walk-forward validation (252d trailing window, 16 threshold candidates)\
    \ showed: (1) adaptive threshold Sharpe=1.72 \u2014 WORSE than no threshold; (2)\
    \ threshold=0 Sharpe=1.83 \u2014 best of all. The walk-forward threshold was unstable\
    \ (std=0.0033) and hurt performance. Conclusion: threshold=0 is the correct production\
    \ policy. No tuning needed. Still +42% Sharpe improvement over always-short (1.29)\
    \ with half the drawdown."
  baseline_config: trial_036_CHAMPION.yaml
  design:
    type: economic_value_threshold_optimization
    signal_mode: long_flat
    method: walk_forward_validation
    lookback: 252
    threshold_grid:
    - -0.005 to +0.010
    - 16 values
    - variance-space
    walk_forward_results:
      h1:
        optimal_threshold: 0.0
        sharpe: 1.8258
        position_rate_pct: 65.2
        ann_return_pct: 5.58
        max_dd_pct: -2.53
      h5:
        optimal_threshold: 0.0
        sharpe: 1.6467
        position_rate_pct: 41.4
        ann_return_pct: 3.75
        max_dd_pct: -1.91
      h22:
        optimal_threshold: 0.0
        sharpe: 0.6336
        position_rate_pct: 16.9
        ann_return_pct: 1.43
        max_dd_pct: -3.88
    walk_forward_adaptive_results:
      h1:
        sharpe: 1.7242
        threshold_mean: -0.0007
        threshold_std: 0.0033
      h5:
        sharpe: 0.8124
        threshold_mean: 0.0014
        threshold_std: 0.0029
      h22:
        sharpe: 0.8952
        threshold_mean: 0.0034
        threshold_std: 0.003
    comparisons:
      always_short:
        h1_sharpe: 1.2885
        h5_sharpe: 1.3038
        h22_sharpe: 1.1981
    overfitted_static_sweep:
      note: "Static sweep found t=-0.001 Sharpe=3.29 at h=1 \u2014 OVERFIT (optimized\
        \ on test data)"
      h1:
        threshold: -0.001
        sharpe: 3.2941
      h5:
        threshold: 0.001
        sharpe: 2.4846
      h22:
        threshold: 0.005
        sharpe: 1.9664
  horizons:
    h5:
      qlike: 0.1099
      verdict: COMPLETED
      dm_p: 0.0
    h22:
      qlike: 0.1788
      verdict: COMPLETED
      dm_p: 0.0
    h1:
      qlike: 0.142
      verdict: COMPLETED
      dm_p: 0.0
  status: completed
  priority: 1
  key_insight: "WALK-FORWARD VALIDATES threshold=0: Static threshold optimization\
    \ on\\n    OOS data is overfitting \u2014 sweep Sharpe 3.29 collapsed to 1.83\
    \ under walk-forward.\\n    Adaptive threshold (1.72) is WORSE than no threshold\
    \ (1.83). The simple rule \\\"flat\\n    when gap < 0\\\" is already the correct\
    \ production policy. long_flat(t=0) delivers\\n    +42% Sharpe over always-short\
    \ (1.83 vs 1.29) with half the max drawdown (2.5% vs\\n    5.1%). Walk-forward\
    \ validation is mandatory for any signal-layer hyperparameter."
  notes: "Walk-forward validated on 692 eval days (post-252d warmup). Threshold\\\
    n    stability: mean=-0.0007 std=0.0033 \u2014 unstable, confirming no fixed threshold\\\
