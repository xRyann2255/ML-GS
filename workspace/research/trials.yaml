        biases all model Sharpes upward)
      h5: 1.8905 -> 1.9535 (+0.0630)
      h22: 1.7434 -> 1.9086 (+0.1652)
    adjusted_lgbm_degradation_h1_sharpe: -0.6546
    adjusted_lgbm_degradation_h5_sharpe: -0.4105
    adjusted_lgbm_degradation_h22_sharpe: -0.2894
    har_iv_1w_sharpe_delta:
      h1: -0.4286
      h5: -0.1834
      h22: -0.0315
    note: 'All baseline linear models (har, har_iv, har_iv_1w) also show Sharpe degradation
      on trial-049 test window. This rules out ''model overfitting'' as sole cause.
      The post-COVID test window changes the signal distribution: short-vol carries
      pay smaller premiums in 2022-2024 than in 2017-2021 because realized vol levels
      were lower relative to implied. The COVID-in-train model is more cautious about
      shorting, which hurts on calmer test days when shorts pay reliably.'
  key_insight: "STATISTICAL-LOSS VS ECONOMIC-LOSS DIVERGENCE: QLIKE dropped substantially\
    \ across all horizons but GSVIVS01 Sharpe on Exec-Kvar fills degraded -0.59 /\
    \ -0.35 / -0.12 at h=1/5/22 (sharpe_0rf). After adjusting for the test-period\
    \ advantage that raised always-long Sharpe by +0.07/+0.06/+0.17, the model degraded\
    \ by approximately -0.65 Sharpe at h=1, -0.41 at h=5, -0.29 at h=22. Position\
    \ rate at h=1 dropped from 56.7% to 54.4% short: COVID-in-train biased RV forecasts\
    \ upward, made the IV-RV gap less positive, caused the model to skip profitable\
    \ short days. Importantly, ALL linear baselines (har_iv_1w, har_iv, har) also\
    \ degraded by -0.16 to -0.43 Sharpe \u2014 ruling out model-specific overfitting.\
    \ The QLIKE improvement is partly a test-set artifact (same as trial-030b retraction):\
    \ trial-049 only tests 2022-05-2024 which is calmer than trial-036's 2017-2024\
    \ test window. CONCLUSION: REJECT trial-049 as champion replacement. Three lessons:\
    \ (1) regime-rich training does NOT automatically improve economic value, (2)\
    \ QLIKE is a poor proxy for variance-swap Sharpe because the P&L is asymmetric\
    \ (a missed short costs the full premium), (3) any future trial that changes the\
    \ test window must compare QLIKE on the SAME OOS dates as the baseline to be valid.\
    \ Keep trial-036 spec (better: trial-047 reseed envelope)."
