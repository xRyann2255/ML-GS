      har_iv_1w: 0.16869
      har_iv: 0.15866
      har: 0.17908
      verdict: har_iv (1m, 0.15866) dominates all short-tenor IVs at h=22
  status: completed
  priority: 1
  key_insight: "0DTE and 1DTE IV are essentially interchangeable (delta < 2.5 bps\
    \ at all horizons). The hypothesis that 1DTE is more forward-looking was wrong\
    \ \u2014 both capture similar information. Tenor matching remains the key insight:\
    \ 1w IV for h=5, 1m IV for h=22, 0DTE/1DTE for h=1."
