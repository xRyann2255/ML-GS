# Trial-055: Regularized HAR-IV Tournament — Find Best Linear Init for LightGBM
#
# Hypothesis: Ridge/Lasso/ElasticNet HAR-IV models produce better init_score
# for LightGBM than OLS HAR-IV by (a) stabilizing coefficients on correlated
# HAR lags, (b) shrinking noise from small-sample estimation per fold, and
# (c) potentially discovering sparsity (Lasso zeroing weak terms).
#
# Design: Same universe/CV/dates as trial-036 champion. Tournament of all
# HAR-IV regularization variants. Per-horizon tenor matching preserved:
#   h=1:  0DTE IV (exact 1-day tenor)
#   h=5:  1w IV (exact 5-day tenor)
#   h=22: 1m IV (exact 22-day tenor)
#
# Models tested (per horizon):
#   OLS baselines:        har_iv_0dte, har_iv_1w, har_iv (current champions)
#   Ridge (L2):           ridge_har_iv, ridge_har_iv_1w (+ alpha sweep)
#   Lasso (L1):           lasso_har_iv, lasso_har_iv_1w
#   ElasticNet (L1+L2):   elasticnet_har_iv, elasticnet_har_iv_1w
#   Rich variants (8p):   ridge_harx_iv_h1/h5/h22, lasso_harx_iv_h1/h5/h22, elasticnet_harx_iv_h1/h5/h22
#   Frequency structure:  har_iv_freq, har_iv_optimal (6-9 param OLS)
#
# Success criterion: any regularized variant beats OLS har_iv on QLIKE
# at the corresponding horizon → use as new base_model in trial-036 spec.
#
# Baseline: trial-036 champion (har_iv_0dte for h=1, har_iv_1w for h=5, har_iv for h=22)

name: trial_055_regularized_har_iv_tournament

universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, cross_asset]

# Primary model: ridge_har_iv (placeholder — tournament runs all)
model:
  name: ridge_har_iv
  params:
    alpha: 1.0

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

tournament:
  models:
    # --- OLS baselines (current best inits) ---
    - har_iv
    - har_iv_1w
    - har_iv_0dte
    - har_iv_freq
    - har_iv_optimal
    # --- Ridge (L2) ---
    - ridge_har_iv
    - ridge_har_iv_1w
    - ridge_har_iv_0dte
    # --- Lasso (L1) ---
    - lasso_har_iv
    - lasso_har_iv_1w
    - lasso_har_iv_0dte
    # --- ElasticNet (L1+L2 blend) ---
    - elasticnet_har_iv
    - elasticnet_har_iv_1w
    - elasticnet_har_iv_0dte
    # --- Rich HAR-X (8 features, per-horizon tenor) ---
    - ridge_harx_iv_h1
    - ridge_harx_iv_h5
    - ridge_harx_iv_h22
    - lasso_harx_iv_h1
    - lasso_harx_iv_h5
    - lasso_harx_iv_h22
    - elasticnet_harx_iv_h1
    - elasticnet_harx_iv_h5
    - elasticnet_harx_iv_h22
    # --- Base HAR regularized (no IV, for ablation) ---
    - ridge_har
    - lasso_har
    # --- LightGBM champion (trial-036 spec, for direct comparison) ---
    - lgbm_hariv0dte_init
  baseline: har_iv
  mcs_bootstrap: 10000
  parallel_models: 4
  gsvivs_enabled: true
  dh_enabled: false
  vt_enabled: false

  # Alpha sweep via model_configs (test multiple regularization strengths)
  model_configs:
    ridge_har_iv:
      name: ridge_har_iv
      params:
        alpha: 1.0
    ridge_har_iv_1w:
      name: ridge_har_iv_1w
      params:
        alpha: 1.0
    lasso_har_iv:
      name: lasso_har_iv
      params:
        alpha: 0.01
        l1_ratio: 0.95
    lasso_har_iv_1w:
      name: lasso_har_iv_1w
      params:
        alpha: 0.01
        l1_ratio: 0.95
    elasticnet_har_iv:
      name: elasticnet_har_iv
      params:
        alpha: 0.01
        l1_ratio: 0.5
    elasticnet_har_iv_1w:
      name: elasticnet_har_iv_1w
      params:
        alpha: 0.01
        l1_ratio: 0.5
    ridge_har_iv_0dte:
      name: ridge_har_iv_0dte
      params:
        alpha: 1.0
    lasso_har_iv_0dte:
      name: lasso_har_iv_0dte
      params:
        alpha: 0.01
        l1_ratio: 0.95
    elasticnet_har_iv_0dte:
      name: elasticnet_har_iv_0dte
      params:
        alpha: 0.01
        l1_ratio: 0.5
    ridge_harx_iv_h1:
      name: ridge_harx_iv_h1
      params:
        alpha: 1.0
    ridge_harx_iv_h5:
      name: ridge_harx_iv_h5
      params:
        alpha: 1.0
    ridge_harx_iv_h22:
      name: ridge_harx_iv_h22
      params:
        alpha: 1.0
    lasso_harx_iv_h1:
      name: lasso_harx_iv_h1
      params:
        alpha: 0.01
        l1_ratio: 0.95
    lasso_harx_iv_h5:
      name: lasso_harx_iv_h5
      params:
        alpha: 0.01
        l1_ratio: 0.95
    lasso_harx_iv_h22:
      name: lasso_harx_iv_h22
      params:
        alpha: 0.01
        l1_ratio: 0.95
    elasticnet_harx_iv_h1:
      name: elasticnet_harx_iv_h1
      params:
        alpha: 0.01
        l1_ratio: 0.5
    elasticnet_harx_iv_h5:
      name: elasticnet_harx_iv_h5
      params:
        alpha: 0.01
        l1_ratio: 0.5
    elasticnet_harx_iv_h22:
      name: elasticnet_harx_iv_h22
      params:
        alpha: 0.01
        l1_ratio: 0.5
    ridge_har:
      name: ridge_har
      params:
        alpha: 1.0
    lasso_har:
      name: lasso_har
      params:
        alpha: 0.01
        l1_ratio: 0.95
    lgbm_hariv0dte_init:
      name: lightgbm
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte

training_mode: pooled
seed: 42
output_dir: data/models/trial_055_regularized_har_iv_tournament
