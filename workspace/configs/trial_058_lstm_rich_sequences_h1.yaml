# Trial-058: LSTM residual with enriched sequence features, h=1 only.
#
# Based on trial_057_lstm_residual_h1 EXCEPT:
#   - sequences.features expanded from 5 → 10 channels
#   - name/output_dir updated
#
# NEW sequence features (require _build_sequences_df() additions + re-ingest):
#   net_flow      — signed OFI magnitude: buy_vol - sell_vol (already in parquet)
#   price_accel   — 2nd difference of log prices (Optiver #1 micro feature)
#   rolling_vpin  — rolling |buy-sell|/(buy+sell) over 50 bars (~8 min)
#   cum_rv        — cumulative intraday realized variance (running sum of log_ret²)
#   session_frac  — bar_idx / max_bars [0,1] time-of-day encoding
#                   (LSTM has implicit positional awareness but explicit encoding
#                    may help cross-reference with rolling features)
#
# Architecture (h=1 stacking) — unchanged:
#   har_iv_0dte (linear init) -> LightGBM (tree corrections) -> LSTM (residual)
#
# Hypothesis: richer intraday features (order flow magnitude, price acceleration,
# volume-clock toxicity, within-day vol state) give the LSTM more signal to
# correct the LightGBM champion's residuals at h=1.
#
# Reference baseline (trial-047 reseed envelope, pool21):
#   h=1  har_iv = 0.1521  lgbm_champion_mean = 0.13679

name: trial_058_lstm_rich_sequences_h1
n_gpus: 8
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA
date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

# ---------------------------------------------------------------------------
# Sequence model (LSTM residual learner) — same architecture as trial-057
# ---------------------------------------------------------------------------
model:
  name: lstm
  params:
    hidden_dim: 64
    n_layers: 2
    dropout: 0.2
    bidirectional: true
    learning_rate: 0.001
    weight_decay: 1.0e-4
    max_epochs: 80
    batch_size: 512
    val_fraction: 0.15
    early_stopping_rounds: 7
    loss: qlike
    device: auto
    precision: auto
    compile: true
    seed: 42

sequences:
  features:
    # --- v2 originals (5) ---
    - log_ret
    - vol_share
    - buy_ratio
    - log_n_trades
    - abs_ret
    # --- NEW: Tier 1 (3) ---
    - net_flow         # signed OFI: buy_vol - sell_vol (already in parquet)
    - price_accel      # log_ret[t] - log_ret[t-1] (Optiver #1 feature)
    - rolling_vpin     # rolling |buy-sell|/(buy+sell), 50-bar window
    # --- NEW: Tier 2 (2) ---
    - cum_rv           # cumulative sum of log_ret² within day
    - session_frac     # bar_idx / 2340, explicit time-of-day [0,1]
  max_bars: 2340
  # Phase 2.7: per-symbol z-scoring; see workspace/research/lstm-v2-notes.md
  norm_mode: per_symbol

# ---------------------------------------------------------------------------
# Tabular base model: LightGBM CHAMPION with har_iv_0dte init at h=1
# ---------------------------------------------------------------------------
base_model:
  name: lightgbm
  feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    num_leaves: 16
    max_depth: 4
    min_child_samples: 150
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 3
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    base_model: har_iv_0dte

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 1260
  test_size: 189

# ---------------------------------------------------------------------------
# Hyperparameter Tuning (Optuna, multi-GPU)
# ---------------------------------------------------------------------------
tuning:
  enabled: true
  n_trials: 40
  timeout: 7200
  n_jobs: 8
  storage_dir: data/models/trial_058_lstm_rich_sequences_h1/optuna
  inner_cv:
    method: expanding_window
    train_size: 756
    test_size: 126
    purge_gap: 10

training_mode: pooled

# Per-horizon overrides (h=1 only, base_model already uses har_iv_0dte)
horizon_overrides:
  1:
    base_model:
      params:
        base_model: har_iv_0dte

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: true
  gsvivs_short_threshold: 0.0030
  parallel_models: 1
  baseline: lstm_residual
  mcs_bootstrap: 10000
  models:
    - har
    - har_iv
    - har_iv_0dte
    - lgbm_champion
    - lstm
  model_configs:
    lgbm_champion:
      name: lightgbm
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte

seed: 42
output_dir: data/models/trial_058_lstm_rich_sequences_h1
