# Trial-075: LSTM with IV context vector — Option A architecture
#
# Design: Same setup as trial-074 (LSTM maxwin, single-fold, 21 symbols) but
# with a daily IV context vector concatenated at the pool→head junction.
# Context features (atm_iv_1d, vrp, vvix, iv_skew_25d) are z-score normalised
# using training-fold stats only and fed as a side-input to the MLP head.
#
# Hypothesis: IV-implied features give the LSTM access to forward-looking
# information that intraday microstructure alone cannot capture, bridging
# the gap with XGBoost which already uses these features as tabular inputs.
#
# Comparison: trial-074 LSTM (same architecture, no context) is the baseline.

name: trial_075_lstm_iv_context_h1
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA
date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

feature_layers: [har_core]

model:
  name: lstm
  params:
    hidden_dim: 128
    n_layers: 2
    dropout: 0.2
    bidirectional: true
    learning_rate: 5.0e-4
    weight_decay: 1.0e-4
    max_epochs: 80
    batch_size: 128
    val_fraction: 0.15
    early_stopping_rounds: 8
    loss: qlike
    device: auto
    precision: auto
    compile: false
    seed: 42
    pool_mode: attention
    head_mode: mlp

sequences:
  features:
    - log_ret
    - abs_ret
    - vol_share
    - buy_ratio
    - order_flow_imbalance
    - rolling_vpin
    - cum_rv
    - session_frac
    - price_accel
    - log_n_trades
    - intrabar_rv
    - volume_surprise
  max_bars: 78
  bar_interval: 300
  norm_mode: per_symbol
  source: parquet
  context_features:
    - atm_iv_1d
    - vrp
    - vvix
    - iv_skew_25d

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 2200
  test_size: 252

training_mode: pooled
seed: 42

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: false

output_dir: data/models/trial_075_lstm_iv_context
