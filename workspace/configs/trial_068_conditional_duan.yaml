name: trial_068_conditional_duan
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA
date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

model:
  name: xgboost
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    max_leaves: 16
    max_depth: 4
    min_child_weight: 150
    colsample_bytree: 0.8
    subsample: 0.8
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    device: "cuda"
    base_model: har_iv_0dte

n_gpus: 8

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

horizon_overrides:
  1:
    model:
      params:
        base_model: har_iv_0dte

# Two-stage conditional (heteroscedastic) Duan correction.
# After all folds complete, trains a lightweight XGBoost on squared OOS residuals
# to estimate per-sample forecast variance σ²(x), then applies σ²(x)/2 correction.
# Walk-forward: fold k's variance model uses only residuals from folds 1..k-1.
conditional_duan:
  enabled: true
  n_estimators: 300
  max_leaves: 8
  max_depth: 3
  learning_rate: 0.05
  min_child_weight: 30
  subsample: 0.8
  colsample_bytree: 0.5
  reg_lambda: 3.0
  max_var: 1.0
  min_folds_for_training: 2

tournament:
  gsvivs_enabled: true
  gsvivs_short_threshold: 0
  dh_enabled: false
  vt_enabled: false
  parallel_models: 1
  baseline: har_iv
  mcs_bootstrap: 10000
  models:
    - har
    - har_iv
    - har_iv_0dte
    - xgb_cond_duan
  model_configs:
    xgb_cond_duan:
      name: xgboost
      params:
        seed: 42
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv_0dte

training_mode: pooled
seed: 42
output_dir: data/models/trial_068_conditional_duan
