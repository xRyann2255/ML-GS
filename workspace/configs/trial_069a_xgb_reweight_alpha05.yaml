# Trial-069a: QLIKE-importance sample reweighting (alpha=0.5, conservative)
#
# Hypothesis: Two-pass XGBoost training with QLIKE-derived sample weights
# (alpha=0.5) improves h=1 QLIKE by forcing splits on hard-to-predict days
# (earnings, FOMC, VIX spikes) without overfitting to outliers.
#
# Architecture:
#   Pass 1: Standard XGBoost fit (same as trial-067 champion)
#   Pass 2: Compute per-sample conditional QLIKE from pass-1 residuals,
#            set weight_i = qlike_i^0.5, retrain with DMatrix weight=
#
# source="conditional" means weight is based on how badly the TREE
# predicted (after HAR-IV init), isolating correctable hard samples
# rather than pure black swans.
#
# Baseline: trial-067 (XGBoost h=1 champion, QLIKE 0.1292)

name: trial_069a_xgb_reweight_alpha05
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA
date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

model:
  name: xgboost
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    max_leaves: 16
    max_depth: 4
    min_child_weight: 150
    colsample_bytree: 0.8
    subsample: 0.8
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    device: "cuda"
    base_model: har_iv_0dte
    sample_reweight:
      enabled: true
      alpha: 0.5
      source: "conditional"
      clip_max: 10.0
      normalize: true

n_gpus: 8

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

seed: 42

tournament:
  gsvivs_enabled: true
  gsvivs_short_threshold: 0
  dh_enabled: false
  vt_enabled: false
  parallel_models: 1
  models: [har_iv_0dte, xgboost]
