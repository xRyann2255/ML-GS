# Trial-056: HAR Hybrid Tournament — Orthogonal RV Decompositions + IV
#
# Hypothesis: Enriching the RV side of HAR-IV with orthogonal decompositions
# (asymmetry, continuous/jump, measurement quality, noise gap) improves QLIKE
# beyond the current 4-param har_iv baselines. Trial-034 showed regularization
# doesn't help the simple HAR-IV (sub-1 bps), but richer 5-7 param models
# may benefit from Ridge/Lasso shrinkage.
#
# Design: Same universe/CV/dates as trial-036 champion. Tournament of:
#   10 new OLS variants + 30 regularized variants + 3 existing OLS baselines
#   + trial-036 LightGBM champion (per-horizon tenor-matched init)
#
# New model families:
#   SHAR-IV:        leverage effect (RS+/RS-) + IV  [3 tenors: 1m, 1w, 0dte]
#   HARQ-IV:        measurement quality (RQ×RV) + IV  [2 tenors: 1m, 1w]
#   HAR-IV-2Tenor:  dual IV (1w + 1m simultaneously)
#   HAR-IV-Noise:   noise gap (RV - RK) + IV
#   HAR-CJ-IV-0DTE: continuous/jump + 0DTE IV
#   SHAR-CJ-IV-0DTE: direction + type decomposition + 0DTE IV (6 params)
#   SHARQ-CJ-IV-0DTE: direction + type + quality + 0DTE IV (7 params)
#
# Success criterion: any variant beats har_iv_0dte at h=1, har_iv_1w at h=5,
# or har_iv at h=22 by >5 bps → candidate for new LightGBM init_score.
#
# Baseline: trial-036 champion (LightGBM with per-horizon tenor-matched init)

name: trial_056_har_hybrid_tournament

universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

# Primary model: LightGBM champion (same as trial-036)
model:
  name: lightgbm
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    num_leaves: 16
    max_depth: 4
    min_child_samples: 150
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 3
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    base_model: har_iv_1w

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

# Per-horizon init: exact tenor matching (same as trial-036)
horizon_overrides:
  1:
    model:
      params:
        base_model: har_iv_0dte
  22:
    model:
      params:
        base_model: har_iv

tournament:
  gsvivs_enabled: true
  gsvivs_short_threshold: 0.0030
  dh_enabled: false
  vt_enabled: false
  models:
    # --- Existing baselines ---
    - har_iv
    - har_iv_1w
    - har_iv_0dte

    # --- SHAR-IV family (leverage effect + IV) ---
    - shar_iv
    - shar_iv_1w
    - shar_iv_0dte
    - ridge_shar_iv
    - ridge_shar_iv_1w
    - ridge_shar_iv_0dte
    - lasso_shar_iv
    - lasso_shar_iv_1w
    - lasso_shar_iv_0dte
    - elasticnet_shar_iv
    - elasticnet_shar_iv_1w
    - elasticnet_shar_iv_0dte

    # --- HARQ-IV family (measurement quality + IV) ---
    - harq_iv
    - harq_iv_1w
    - ridge_harq_iv
    - ridge_harq_iv_1w
    - lasso_harq_iv
    - lasso_harq_iv_1w
    - elasticnet_harq_iv
    - elasticnet_harq_iv_1w

    # --- Multi-tenor IV ---
    - har_iv_2tenor
    - ridge_har_iv_2tenor
    - lasso_har_iv_2tenor
    - elasticnet_har_iv_2tenor

    # --- Noise-gap ---
    - har_iv_noise
    - ridge_har_iv_noise
    - lasso_har_iv_noise
    - elasticnet_har_iv_noise

    # --- CJ + IV ---
    - har_cj_iv_0dte
    - ridge_har_cj_iv_0dte
    - lasso_har_cj_iv_0dte
    - elasticnet_har_cj_iv_0dte

    # --- Combined decompositions (strongest candidates) ---
    - shar_cj_iv_0dte
    - ridge_shar_cj_iv_0dte
    - lasso_shar_cj_iv_0dte
    - elasticnet_shar_cj_iv_0dte

    - sharq_cj_iv_0dte
    - ridge_sharq_cj_iv_0dte
    - lasso_sharq_cj_iv_0dte
    - elasticnet_sharq_cj_iv_0dte

    # --- HAR-IV-Freq: Busch, Christensen & Nielsen (2011) frequency-matched ---
    - har_iv_freq
    - ridge_har_iv_freq
    - lasso_har_iv_freq
    - elasticnet_har_iv_freq

    # --- HAR-IV-Freq + VRP (Busch 2011 + BTZ 2009) ---
    - har_iv_freq_vrp
    - ridge_har_iv_freq_vrp
    - lasso_har_iv_freq_vrp
    - elasticnet_har_iv_freq_vrp

    # --- HAR-IV-Optimal: freq + VRP + term slope + VVIX (9 params) ---
    - har_iv_optimal
    - ridge_har_iv_optimal
    - lasso_har_iv_optimal
    - elasticnet_har_iv_optimal

    # --- SHAR-IV-Freq: semivariance + frequency IV (7 params) ---
    - shar_iv_freq
    - ridge_shar_iv_freq
    - lasso_shar_iv_freq
    - elasticnet_shar_iv_freq

    # --- HAR-CJ-IV-Freq: continuous/jump + frequency IV (7 params) ---
    - har_cj_iv_freq
    - ridge_har_cj_iv_freq
    - lasso_har_cj_iv_freq
    - elasticnet_har_cj_iv_freq

    # --- HAR-CJ-IV-Freq-VRP: CJ + frequency IV + VRP (8 params) ---
    - har_cj_iv_freq_vrp
    - ridge_har_cj_iv_freq_vrp
    - lasso_har_cj_iv_freq_vrp
    - elasticnet_har_cj_iv_freq_vrp

    # --- SHAR-CJ-IV-Freq: direction + type + frequency IV (8 params) ---
    - shar_cj_iv_freq
    - ridge_shar_cj_iv_freq
    - lasso_shar_cj_iv_freq
    - elasticnet_shar_cj_iv_freq

    # --- SHAR-CJ-IV-Freq-VRP: direction + type + freq IV + VRP (9 params) ---
    - shar_cj_iv_freq_vrp
    - ridge_shar_cj_iv_freq_vrp
    - lasso_shar_cj_iv_freq_vrp
    - elasticnet_shar_cj_iv_freq_vrp

    # --- SHARQ-CJ-IV-Freq: all RV decomps + frequency IV (9 params) ---
    - sharq_cj_iv_freq
    - ridge_sharq_cj_iv_freq
    - lasso_sharq_cj_iv_freq
    - elasticnet_sharq_cj_iv_freq

    # --- SHARQ-CJ-IV-Freq-VRP: full kitchen sink (10 params) ---
    - sharq_cj_iv_freq_vrp
    - ridge_sharq_cj_iv_freq_vrp
    - lasso_sharq_cj_iv_freq_vrp
    - elasticnet_sharq_cj_iv_freq_vrp

    # --- LightGBM champion (trial-036 spec) ---
    - lgbm_hariv0dte_init

  baseline: lgbm_hariv0dte_init
  mcs_bootstrap: 0
  parallel_models: 4
  model_configs:
    lgbm_hariv0dte_init:
      name: lightgbm
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte

training_mode: pooled
seed: 42
output_dir: data/models/trial_056_har_hybrid_tournament
