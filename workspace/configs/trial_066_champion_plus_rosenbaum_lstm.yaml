# Trial-066: Champion LightGBM tournament + Rosenbaum daily LSTM
#
# Purpose: Run the full champion config (trial-036) with the same test window
# as trial-065, adding the Rosenbaum-style LSTM to the tournament for
# direct QLIKE comparison on identical OOS dates.
#
# Date range pinned to trial-065 window (2015-2024) for apples-to-apples.

name: trial_066_champion_plus_rosenbaum_lstm
n_gpus: 8

universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

date_range: ["2015-01-02", "2024-12-31"]
horizons: [1]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

model:
  name: lightgbm
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    num_leaves: 16
    max_depth: 4
    min_child_samples: 150
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 3
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    base_model: har_iv_0dte

sequences:
  source: daily_lookback
  features:
    - log_rv_d
    - log_rv_w
    - log_rv_m
    - signed_return_d
    - abs_ret_d
  max_bars: 22
  norm_mode: pooled

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

training_mode: pooled
seed: 42

tournament:
  gsvivs_enabled: true
  dh_enabled: false
  vt_enabled: false
  parallel_models: 4
  models:
    - ewma
    - har
    - har_iv
    - har_iv_1w
    - har_iv_0dte
    - same_day_rv
    - lgbm_hariv0dte_init
    - xgb_hariv0dte_init
    - lstm
  model_configs:
    lgbm_hariv0dte_init:
      name: lightgbm
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte
    xgb_hariv0dte_init:
      name: xgboost
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte
    lstm:
      name: lstm
      params:
        hidden_dim: 32
        n_layers: 2
        dropout: 0.0
        bidirectional: false
        learning_rate: 0.001
        weight_decay: 0.0
        max_epochs: 200
        batch_size: 512
        val_fraction: 0.0
        early_stopping_rounds: null
        loss: mse
        device: auto
        precision: auto
        compile: false
        seed: 42
        symbol_embed_dim: 0
        pool_mode: last_hidden
        head_mode: linear

output_dir: data/models/trial_066_champion_plus_rosenbaum_lstm
