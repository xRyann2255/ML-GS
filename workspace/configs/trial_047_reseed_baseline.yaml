# Trial-047: Multi-seed re-baseline of trial-036 champion
#
# Hypothesis: Trial-036's published champion numbers (h1=0.1289, h5=0.1067,
# h22=0.1628) are not reproducible at the single-seed level. Trial-046 found
# the same-config control re-ran at h1=0.1366 (-77 bps) due to LightGBM
# parallel-fit nondeterminism. This trial fits 5 IDENTICAL LightGBM models
# differing ONLY in `seed` to (a) measure seed-noise envelope, (b) report
# mean/std/min/max as the true reproducible champion, (c) fix the stale
# project-state.md scorecard.
#
# Design: One trial run with 5 LightGBM tournament variants (seeds 42, 123,
# 456, 789, 2026 — matching trial-017 multi-seed convention). All five share
# data load, feature build, and CV splits. parallel_models=5 fits all in
# parallel. Linear baselines (har, har_iv) included for absolute reference.
#
# Output: metrics.json contains per-model, per-horizon QLIKE. Aggregate
# across the 5 lgbm_seed_* models to get mean/std/min/max. Updates
# memory/research/project-state.md scorecard from suspect single-seed numbers.
#
# Baseline: trial_036_lgbm_0dte_tenor_matched (h1=0.1289 suspect, h5=0.1067,
# h22=0.1628)

name: trial_047_reseed_baseline
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA
date_range: ["2015-01-02", "2024-12-31"]
horizons: [1, 5, 22]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

# Top-level model = trial-036 champion spec (used for feature_layers context;
# tournament variants override params via model_configs).
model:
  name: lightgbm
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    num_leaves: 16
    max_depth: 4
    min_child_samples: 150
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 3
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    base_model: har_iv_1w

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

# Per-horizon init: exact tenor matching (unchanged from trial-036).
# Merged into EVERY tournament model's params.
horizon_overrides:
  1:
    model:
      params:
        base_model: har_iv_0dte
  22:
    model:
      params:
        base_model: har_iv

tournament:
  gsvivs_enabled: true
  parallel_models: 5      # 5 LightGBM seeds in parallel; har/har_iv slot in
  baseline: lgbm_seed_42  # Reference seed (matches trial-036's seed)
  mcs_bootstrap: 10000
  models:
    - har
    - har_iv
    - lgbm_seed_42
    - lgbm_seed_123
    - lgbm_seed_456
    - lgbm_seed_789
    - lgbm_seed_2026

  model_configs:
    lgbm_seed_42:
      name: lightgbm
      params:
        seed: 42
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_1w

    lgbm_seed_123:
      name: lightgbm
      params:
        seed: 123
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_1w

    lgbm_seed_456:
      name: lightgbm
      params:
        seed: 456
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_1w

    lgbm_seed_789:
      name: lightgbm
      params:
        seed: 789
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_1w

    lgbm_seed_2026:
      name: lightgbm
      params:
        seed: 2026
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
