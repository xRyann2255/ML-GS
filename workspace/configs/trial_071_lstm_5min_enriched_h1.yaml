# Trial-071: Standalone LSTM on 5-min enriched sequences (Plan B)
#
# Hypothesis: 78 bars × 12 features (5-min enriched) produces better
# standalone LSTM QLIKE than 2340 × 5 (trial-051) because:
#   - Shorter sequence → cleaner gradient flow, less padding
#   - Richer features per bar → more signal per timestep
#   - intrabar_rv and volume_surprise add vol-of-vol information
#
# Baseline comparison:
#   - HAR h=1: ~0.1368
#   - Trial-051 LSTM (2340×5): failed / weak
#   - XGBoost champion h=1: 0.1292

name: trial_071_lstm_5min_enriched_h1
universe: [SPY, AAPL]
date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

feature_layers: [har_core]

model:
  name: lstm
  params:
    hidden_dim: 64
    n_layers: 2
    dropout: 0.1
    bidirectional: false
    learning_rate: 0.001
    weight_decay: 1.0e-4
    max_epochs: 50
    batch_size: 64
    val_fraction: 0.15
    early_stopping_rounds: 5
    loss: qlike
    device: auto
    precision: auto
    compile: false
    seed: 42
    pool_mode: attention
    head_mode: mlp

sequences:
  features:
    - log_ret
    - abs_ret
    - vol_share
    - buy_ratio
    - order_flow_imbalance
    - rolling_vpin
    - cum_rv
    - session_frac
    - price_accel
    - log_n_trades
    - intrabar_rv
    - volume_surprise
  max_bars: 78
  bar_interval: 300
  norm_mode: per_symbol
  source: parquet

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 1260
  test_size: 252

training_mode: pooled
seed: 42

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: false
  baseline: lstm_5min
  models:
    - har
    - har_iv
    - lstm

output_dir: data/models/trial_071_lstm_5min_enriched
