# Trial-072: Shallower TCN with wider kernel (reduced overfitting)
#
# Trial-071 produced QLIKE=4.8 — 8 blocks × [64..32] channels had ~100k params
# for ~1000 training samples → severe overfitting / optimization difficulty.
#
# Changes vs trial-071:
#   - 5 blocks (down from 8) with kernel_size=13 (up from 7)
#   - Channels [32,32,32,32,32] (uniform, reduced from [64×4, 32×4])
#   - RF = 2×12×(1+2+4+8+16) = 744 (~48% of 1,560 sequence)
#   - Lower LR (3e-4) with more patience (early_stopping=20)
#   - batch_size=64 for better gradient estimates
#
# Architecture: 5 residual blocks, dilations [1,2,4,8,16], kernel_size=13.

name: trial_072_tcn_shallow_multiday
universe: [SPY, AAPL]
date_range: ["2015-01-02", "2024-12-31"]
horizons: [1]

feature_layers: [har_core]

model:
  name: tcn
  params:
    input_dim: 3
    n_channels: [32, 32, 32, 32, 32]
    kernel_size: 13
    dropout: 0.2
    learning_rate: 0.0003
    weight_decay: 0.0001
    max_epochs: 200
    batch_size: 64
    val_fraction: 0.15
    early_stopping_rounds: 20
    loss: qlike
    device: auto
    precision: auto
    seed: 42

sequences:
  source: parquet_5min_multiday
  features: [log_ret, abs_ret, rv_5min]
  max_bars: 1560
  lookback_days: 20
  norm_mode: pooled

cv:
  method: expanding_window
  purge_gap: 5
  train_size: 504
  test_size: 126

training_mode: pooled

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: false
  models:
    - tcn
    - har
