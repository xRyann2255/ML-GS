# Trial-073: Single-day 5-min TCN with 3 features (extend trial-070)
#
# Trial-070 had QLIKE=0.306 with 1 feature (log_ret), 78 bars, 2 symbols.
# This adds abs_ret + rv_5min (input_dim=3) to give the TCN richer signal
# without multi-day complexity. Also expands to 12 symbols for more
# training data (~6,000 rows/fold instead of ~1,000).
#
# Architecture: same as trial-072 (5 blocks, k=13, 32 channels) but
# max_bars=78 (single day). RF=744 >> 78 → full coverage trivially.

name: trial_073_tcn_1day_3feat
universe: [SPY, AAPL, MSFT, AMZN, GOOGL, META, NVDA, JPM, V, UNH, HD, MA]
date_range: ["2015-01-02", "2024-12-31"]
horizons: [1]

feature_layers: [har_core]

model:
  name: tcn
  params:
    input_dim: 3
    n_channels: [32, 32, 32, 32, 32]
    kernel_size: 13
    dropout: 0.2
    learning_rate: 0.0003
    weight_decay: 0.0001
    max_epochs: 200
    batch_size: 64
    val_fraction: 0.15
    early_stopping_rounds: 20
    loss: qlike
    device: auto
    precision: auto
    seed: 42

sequences:
  source: parquet_5min
  features: [log_ret, abs_ret, rv_5min]
  max_bars: 78
  norm_mode: pooled

cv:
  method: expanding_window
  purge_gap: 5
  train_size: 504
  test_size: 126

training_mode: pooled
fold_cache_enabled: false

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: false
  models:
    - tcn
    - har
