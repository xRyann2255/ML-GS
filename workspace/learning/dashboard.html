ures long-run valuation.", "Drechsler and Yaron (2011): long-run risk model generates VRP from preference for early resolution of uncertainty.", "Not directly used in our RV forecasting -- but motivates WHY VRP time-variation matters economically."], "why_it_matters": "Establishes that VRP is not noise but a genuine risk factor with economic significance -- motivating its inclusion as a feature and its role in economic value tests.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "vrp_predicts_vol": {"chapter": "9", "key_points": ["Mechanism: high VRP -> IV >> RV -> market expects RV to RISE toward IV. VIX carries forward event info.", "Conversely: low/negative VRP -> IV < RV -> market expects RV to FALL. Post-spike normalization signal.", "Why better than lagged RV alone: IV incorporates scheduled events (earnings, FOMC) that lagged RV cannot see.", "Predictive horizon: strongest at h=5 and h=22 days. At h=1 day, lagged RV persistence dominates.", "Empirical: adding VRP to HAR models improves QLIKE by 3-8% at h=5 (Bekaert and Hoerova 2014).", "Direction: when VIX >> RV_recent (high VRP), expect RV to increase toward VIX level over coming weeks."], "why_it_matters": "This is the core mechanism by which Layer 2 features improve RV forecasts -- options markets see scheduled events and regime shifts BEFORE they appear in realized volatility.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "vrp_decomposition": {"chapter": "9", "key_points": ["Bekaert and Hoerova (2014): VRP = expected variance component + pure risk premium component.", "Bollerslev and Todorov (2011): VRP = diffusive VRP + jump-tail VRP. Most time-variation from tail component.", "Diffusive VRP: compensation for bearing continuous variance risk. Relatively stable over time.", "Jump-tail VRP: compensation for bearing crash risk (large negative jumps). Spikes dramatically in crises.", "Implication: during 'normal' times, VRP ~ constant. During stress, tail VRP dominates all variation.", "For feature engineering: total VRP + a tail-specific measure (VVIX or deep OTM put IV) captures both."], "why_it_matters": "Explains why multiple options features are needed: ATM IV captures level, VRP captures the gap, but VVIX and butterfly specifically target the TAIL component that drives crisis dynamics.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "vvix_vol_of_vol": {"chapter": "9", "key_points": ["VVIX = implied volatility of VIX options. Computed the same way as VIX but using VIX options as underlying.", "Interpretation: how uncertain is the market about FUTURE vol? High VVIX = vol could go anywhere.", "Typical range: VVIX 80-100 (calm), 100-120 (elevated), 120-170 (crisis). Mean ~ 90.", "Realized vol-of-VIX: in code, computed from 22-day rolling sum of squared VIX log-returns * 252.", "VVIX risk premium (in code: vvix_rp_d) = VVIX/100 - realized_vol_of_vix. Implied minus realized vol-of-vol.", "Predictive power: high VVIX predicts larger VIX moves (both up and down) -- useful for RV forecasting at h=5+.", "Captures the TAIL component of VRP (Bollerslev-Todorov): jump risk uncertainty specifically."], "why_it_matters": "VVIX adds information orthogonal to VIX level -- it captures the market's uncertainty about whether vol will spike or collapse, directly relevant to forecast confidence at h=5 and h=22.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "layer2_feature_set": {"chapter": "5, 9", "key_points": ["Core features (from code): log_atm_iv_{d,w,m}, vrp_{d,w,m}, iv_skew_{d,w}, iv_term_slope_{d,w}, iv_butterfly_{d,w}, vvix_d, iv_rv_gap_d, iv_momentum_d.", "Interaction features: atm_iv_x_log_rv_d (per-symbol ATM IV * log RV -- CSV 2023 #1 ML gain source), vix_x_log_rv_d (market-wide).", "Vol-of-vol features: vvix_innovation_d, realized_vol_of_vix_d, vvix_rp_d (implied - realized vol-of-vol).", "Market-wide context: iv_dispersion_d (cross-sectional IV std), vix (raw level for interactions).", "Term structure extras: VTS = ATM_3m/ATM_1m (Bennett 2014), forward_vol_1m3m = sqrt(max(sigma_3m^2*T3-sigma_1m^2*T1,0)/(T3-T1)).", "ALL features use t-1 close (shift(1) in code) to prevent look-ahead bias. Same-day IV is not available at forecast time.", "Data source: Marquee EDRVOL_PERCENT_STANDARD for SPX; per-symbol ATM IV from IVSurfaceLayer cache."], "why_it_matters": "This is the complete specification of Layer 2 in our feature pipeline -- these features represent the options market's forward view and provide the largest QLIKE improvement at h=5 and h=22.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "horizon_dependence_options": {"chapter": "5, 9", "key_points": ["h=1 day: lagged RV persistence is very strong (~0.6 autocorrelation). Hard for options to beat yesterday's RV. Gain: +1-3% QLIKE.", "h=5 days: persistence decays. HAR's weekly component weakens. Options fill gap with EVENT info. Gain: +5-8% QLIKE.", "h=22 days: persistence nearly gone. Monthly RV unpredictable from past alone. Options provide most signal. Gain: +5-10% QLIKE.", "Mechanism: options price SCHEDULED events (FOMC in 2 weeks, earnings in 10 days). These are invisible to lagged RV.", "Analogy: weather -- tomorrow's ~ today's (persistence). Next month's needs atmospheric models (forward info).", "Implication for model design: at h=1, weight Layer 0-1 heavily. At h=5+, weight Layer 2 features more."], "why_it_matters": "Explains the strategic value of Layer 2: our biggest QLIKE gains (5-10%) come at h=5 and h=22 where options features shine -- this is where academic novelty and trading desk value converge.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "vrp_as_ml_feature": {"chapter": "9", "key_points": ["Circular feedback: VRP = IV^2 - E^P[RV]. ML gives better E^P[RV] so VRP estimate becomes less noisy.", "Fouhy (2024): hierarchical XGBoost pipeline -- first model forecasts RV, VRP drives trading signal.", "Standard VRP proxy (VIX^2 - lagged_RV^2) is noisy because lagged RV != expected future RV. ML fixes denominator.", "In practice: first estimate RV_hat from Layer 0-1 features. Then compute VRP_hat = IV^2 - RV_hat. Use VRP_hat in Layer 2.", "This is a SEQUENTIAL pipeline, not simultaneous: base forecast first, then VRP feature second.", "The atm_iv_x_log_rv interaction (in code) directly captures the non-linear relationship between IV level and RV state."], "why_it_matters": "This creates a virtuous cycle: better QLIKE -> cleaner VRP -> better trading signal -> higher Sharpe. It's the mechanism by which statistical improvement translates to economic value.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "gamma_pnl_formula": {"chapter": "17", "key_points": ["Daily P&L = 0.5 * Gamma * S^2 * (sigma^2_realized - sigma^2_implied) * dt. The core formula of vol trading.", "Derivation: from BS PDE, theta + 0.5*G*S^2*sigma^2 = cost of carry. If RV != IV, there's a P&L residual.", "Long gamma (positive G): profits when realized moves EXCEED implied. Lose when markets are quiet.", "Short gamma (negative G): profits when realized moves are SMALLER than implied. Lose on big moves.", "Path dependence: Gamma changes with S (moneyness drift). Total P&L = sum of daily gamma P&L, each with different G_t.", "KEY INSIGHT: P&L is proportional to (RV^2 - IV^2). Our model forecasts RV. If forecast > IV, buy gamma.", "In code: raw_pnl = 0.5 * gamma * spot^2 * (realized_var - iv^2 * dt) per day in economic_value.py."], "why_it_matters": "This formula directly connects our RV forecast to dollar P&L -- every basis point of QLIKE improvement translates to a better estimate of (sigma^2_real - sigma^2_imp), which IS the trading signal.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "atm_straddle_gamma": {"chapter": "17", "key_points": ["Gamma_straddle = 2 * Gamma_call = 2 / (S * sigma_imp * sqrt(T)) for ATM straddle (call + put at same strike).", "Peak at ATM: gamma is maximized when S = K. Falls off as |S-K| increases.", "Maturity effect: Gamma proportional to 1/sqrt(T). Short-dated options have HIGHER gamma.", "Dollar gamma: $G = 0.5 * Gamma * S^2 = S / (sigma_imp * sqrt(T)). Times (sigma^2_real - sigma^2_imp)*dt = daily P&L.", "Practical: with 1-month ATM straddle, 1 variance point difference ~ 3-5 bps P&L per day on notional.", "In code: gamma = 2.0 / (spot * iv_safe * sqrt(T)) where T = tenor_days/252.", "As spot moves from strike: gamma decreases -> P&L sensitivity drops -> 'gamma bleed' from moneyness drift."], "why_it_matters": "Quantifies how much P&L we extract per unit forecast accuracy -- the higher the gamma, the more our RV forecast edge translates into realized trading profit.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "delta_hedged_straddle": {"chapter": "17", "key_points": ["Strategy: Buy (or sell) ATM straddle + delta-hedge. Removes directional S exposure entirely.", "Signal: SELL straddle when ML forecast of RV < IV (expect low vol). BUY when RV_forecast > IV.", "In code: signal = +1 (sell vol) when gap > threshold, -1 (buy vol) when gap < -threshold, 0 otherwise.", "P&L per day = -signal * 0.5 * Gamma * S^2 * (realized_var - iv^2*dt). Normalized by spot for returns.", "Holding period: typically match forecast horizon (h=5 -> hold 1 week, h=22 -> hold 1 month).", "Duan correction: must apply retransformation bias when converting log-RV forecast to variance for IV comparison.", "In code: delta_hedged_sharpe() takes log_rv_predictions, converts to annualized vol, computes signal and P&L."], "why_it_matters": "This is the PRIMARY economic value test for our ML model -- it directly monetizes the RV forecast by trading the gap between our prediction and the market's implied expectation.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "vol_trading_transaction_costs": {"chapter": "17", "key_points": ["Option bid-ask: SPX ATM straddle spread ~ 0.3-0.5 vol points. Per leg: ~0.15-0.25 vol points.", "In code: cost_vol_points = 0.5 per leg. Vega_norm = sqrt(T)*0.3989. Daily cost = 2*cost*vega_norm/holding_period.", "Delta-hedging cost: each hedge ~ 0.5-1 bp of notional. Daily hedging for 22 days ~ 15-22 bp total.", "Amortization: spread paid at entry, amortized over holding_period (22 days default in code).", "Breakeven: need RV forecast error < (bid-ask + hedge costs). Typically ~20-30 var bps accuracy edge.", "QLIKE gains of 30-80 bps over HAR translate to ~ 10-25 var bps better accuracy -> marginal after costs.", "Regime-dependent: costs lower in calm markets but VRP also lower. Costs higher in crisis but VRP wider."], "why_it_matters": "Sets the bar for how much forecast improvement is economically meaningful -- our 30-80 bps QLIKE target translates to barely enough edge to cover costs, making every bps valuable.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "why_delta_hedged_straddle_works": {"chapter": "17", "key_points": ["VRP is positive ~85% of the time (Carr and Wu 2009). Short straddle collects theta > average realized gamma losses.", "Base rate: unconditional short vol earns ~ 4 vol points/year (VRP). Sharpe ~ 0.3-0.5. But left tail is brutal.", "ML edge: better RV forecast identifies WHEN premium is genuinely rich (VRP > cost) vs fair (VRP ~ cost).", "Hit rate: with ML timing, hit rate ~ 88.8% vs 85% unconditional. Small improvement, large P&L impact.", "Conditional entry: only sell when model confidence is high AND VRP exceeds cost threshold. Reduces drawdown.", "Risk management: max position limits, stop-losses, circuit breakers for VIX > 40.", "Key insight: model only needs to correctly rank whether RV will be above or below IV, not predict exact level."], "why_it_matters": "Connects statistical forecasting to real money: the model needs to identify rich premium with high hit rate -- this is the ultimate test of whether our QLIKE improvement has practical value.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "ewma_baseline": {"chapter": "17", "key_points": ["Formula: sigma^2_t = (1-lambda)*r^2_{t-1} + lambda*sigma^2_{t-1}. Exponential decay of past squared returns.", "One parameter: lambda (decay factor). Higher lambda = longer memory. RiskMetrics default: lambda = 0.94 (half-life ~ 11 days).", "Half-life: h = -ln(2)/ln(lambda). Typical range for vol-targeting: 20-60 days. lambda=0.97 -> h~23 days.", "Strengths: simple, no estimation needed, daily updates, captures vol clustering mechanically.", "Weaknesses: symmetric (no leverage effect), equal weighting of up/down, no regime detection, no forward-looking info.", "Industry standard: most risk systems use EWMA or GARCH(1,1) for position sizing. Must beat this or ML adds no value.", "Calibration: optimize lambda to minimize QLIKE over training period. Or use half-life=20 as reasonable default."], "why_it_matters": "EWMA is the practical bar: trading desks already use it for position sizing. Our ML model must demonstrate CLEAR OOS Sharpe improvement over EWMA-based vol-targeting to justify complexity.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "vol_targeting_formula": {"chapter": "17", "key_points": ["Core formula: w_t = sigma_target / sigma_hat_t. Position weight inversely proportional to forecast vol.", "sigma_target: desired portfolio vol level (e.g., 10% annualized). Chosen to match risk budget.", "sigma_hat_t: forecast of next-period vol. From pipeline: sqrt(252 * exp(log_rv_hat)) after Duan correction.", "Leverage cap: w_t = min(sigma_target / sigma_hat_t, max_leverage). Typically max_leverage = 2.0.", "Portfolio return: r_VT_t = w_t * r_asset_t. Realized portfolio vol ~ sigma_target if forecast is accurate.", "In code: vol_targeting_pnl() takes returns + vol_forecast, returns weighted portfolio returns.", "In code: vol_targeting_sharpe() converts log-RV predictions to annualized vol via sqrt(252*exp(log_rv))."], "why_it_matters": "This formula is the mechanism by which every log-RV forecast we produce becomes a portfolio allocation decision -- the entire statistical pipeline terminates here for the vol-targeting economic value test.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "why_vol_targeting_adds_sharpe": {"chapter": "17", "key_points": ["Moreira and Muir (2017): vol-targeting adds +0.3 Sharpe across equities, bonds, FX, commodities.", "Mechanism 1: vol is PREDICTABLE (clustering). Rising vol -> reduce exposure BEFORE drawdown.", "Mechanism 2: leverage effect. Rising vol IS correlated with falling prices. Cutting high-vol = cutting before losses.", "Mechanism 3: return/vol ratio is NOT constant. High-vol periods don't proportionally reward risk.", "The Sharpe gain comes almost entirely from REDUCING LEFT TAIL exposure, not from increasing right returns.", "Better forecast -> earlier detection of vol rise -> more timely position cut -> larger left-tail truncation.", "Quantification: HAR-based targeting gives Sharpe ~ 0.65. EWMA gives ~ 0.55. ML target: >= 0.70."], "why_it_matters": "This is the economic mechanism behind our evaluation target: ML's ability to detect vol spikes EARLIER than EWMA (via forward-looking features) translates directly to Sharpe through left-tail truncation.", "next_review": null, "last_tested": null, "consecutive_passes": 0}, "vol_targeting_failure_modes": {"chapter": "17", "key_points": ["Failure mode 1: UNDERPREDICTION in crisis onset. Model slow to detect regime shift -> overweight INTO drawdown.", "Failure mode 2: OVERPREDICTION in recovery. Model keeps predicting high vol during recovery -> underweight rebound.", "Failure mode 3: Low-vol leverage. VIX < 12 -> formula implies leverage > 2x -> amplifies sudden jumps.", "Mitigation FM1: safety floor -- vol_estimate = max(ML_forecast, 1.5*EWMA). Never trust ML below 1.5x EWMA alone.", "Mitigation FM3: hard leverage cap at 2x. In code: np.minimum(target_vol / vol_safe, max_leverage).", "COVID example: models trained on norma // ===== CONSTANTS =====
const TIER_COLORS = {
  untested: '#f85149',
  recognized: '#e07d3c',
  understood: '#f0db4f',
  mastered: '#3fb950'
};

const LAYER_COLORS = {
  0: '#58a6ff',
  1: '#bc8cff',
  99: '#f778ba'
};

// ===== STATE =====
let selectedNode = null;
let highlightedNodes = new Set();
let activeLayer = null;

// ===== INIT =====
function init() {
  renderHeader();
  renderGraph();
  document.getElementById('gen-stamp').textContent = `Generated: ${DATA.generated}`;
  document.getElementById('sidebar-close').addEventListener('click', closeSidebar);
  document.getElementById('graph-container').addEventListener('click', (e) => {
    if (e.target === e.currentTarget || e.target.tagName === 'svg') {
      closeSidebar();
      clearHighlight();
    }
  });
}

// ===== HEADER =====
function renderHeader() {
  const totalNodes = DATA.nodes.length;
  const masteredCount = DATA.nodes.filter(n => n.tier === 'mastered').length;
  document.getElementById('mastered-count').textContent = `${masteredCount}/${totalNodes}`;

  const dueCount = DATA.due_today.length;
  const dueEl = document.getElementById('due-count');
  dueEl.textContent = dueCount;
  if (dueCount > 0) dueEl.classList.add('urgent');

  const barsEl = document.getElementById('layer-bars');
  DATA.layers.forEach(layer => {
    const pct = layer.total > 0 ? ((layer.mastered + layer.understood) / layer.total * 100) : 0;
    const color = layer.mastered > 0 ? TIER_COLORS.mastered :
                  layer.understood > 0 ? TIER_COLORS.understood :
                  layer.recognized > 0 ? TIER_COLORS.recognized : TIER_COLORS.untested;
    const div = document.createElement('div');
    div.className = 'layer-bar';
    div.dataset.layer = layer.id;
    div.innerHTML = `
      <span>L${layer.id === 99 ? 'E' : layer.id}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <span>${layer.understood + layer.mastered}/${layer.total}</span>
    `;
    div.addEventListener('click', () => toggleLayerFilter(layer.id));
    barsEl.appendChild(div);
  });
}

// ===== GRAPH =====
function renderGraph() {
  const container = document.getElementById('graph-container');
  let width = container.clientWidth;
  let height = container.clientHeight;

  const svg = d3.select(container)
    .append('svg')
    .attr('width', width)
    .attr('height', height);

  // Zoom
  const g = svg.append('g');
  const zoom = d3.zoom()
    .scaleExtent([0.2, 5])
    .on('zoom', (event) => g.attr('transform', event.transform));
  svg.call(zoom);

  // Center initially
  svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.7));

  // Resize handler (debounced)
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      width = container.clientWidth;
      height = container.clientHeight;
      svg.attr('width', width).attr('height', height);
      const currentTransform = d3.zoomTransform(svg.node());
      svg.call(zoom.transform, d3.zoomIdentity
        .translate(width / 2, height / 2)
        .scale(currentTransform.k));
    }, 150);
  });

  // Arrow marker (adjusted refX for line endpoints)
  svg.append('defs').append('marker')
    .attr('id', 'arrow')
    .attr('viewBox', '0 -5 10 10')
    .attr('refX', 20)
    .attr('refY', 0)
    .attr('markerWidth', 4)
    .attr('markerHeight', 4)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-4L10,0L0,4')
    .attr('fill', '#6e7681')
    .attr('class', 'link-arrow');

  // Build node map for lookup
  const nodeMap = new Map(DATA.nodes.map(n => [n.id, n]));

  // Compute topological depth for Y positioning
  const depths = computeDepths(DATA.nodes, nodeMap);
  const maxDepth = Math.max(...Object.values(depths), 1);

  // Prepare link data
  const links = DATA.edges.filter(e => nodeMap.has(e.source) && nodeMap.has(e.target));

  // Simulation — structured top-down layout
  const simulation = d3.forceSimulation(DATA.nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(90).strength(0.15))
    .force('charge', d3.forceManyBody().strength(-350).distanceMax(350))
    .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 12).strength(0.7))
    .force('x', d3.forceX(d => layerXPosition(d.layer, width)).strength(0.12))
    .force('y', d3.forceY(d => depthYPosition(depths[d.id] || 0, maxDepth, height)).strength(0.35))
    .velocityDecay(0.55)
    .alphaDecay(0.06)
    .alphaMin(0.02)
    .stop();  // Don't auto-start — we batch ticks off-screen

  // Batch simulation off-screen (no DOM updates until settled)
  for (let i = 0; i < 300; i++) simulation.tick();

  // Layer hull groups
  const hullGroup = g.append('g').attr('class', 'hulls');

  // Links — straight lines (much faster than curved paths per frame)
  const linkGroup = g.append('g').attr('class', 'links');
  const link = linkGroup.selectAll('line')
    .data(links)
    .join('line')
    .attr('class', 'link')
    .attr('stroke', '#6e7681')
    .attr('stroke-width', 1.4)
    .attr('marker-end', 'url(#arrow)');

  // Nodes
  const nodeGroup = g.append('g').attr('class', 'nodes');
  const node = nodeGroup.selectAll('g')
    .data(DATA.nodes)
    .join('g')
    .attr('class', d => {
      let cls = 'node-group';
      if (d.overdue) cls += ' node-overdue';
      return cls;
    });

  node.append('circle')
    .attr('class', 'node-circle')
    .attr('r', d => nodeRadius(d))
    .attr('fill', d => TIER_COLORS[d.tier] || TIER_COLORS.untested)
    .attr('stroke', d => d.overdue ? TIER_COLORS.untested : darken(TIER_COLORS[d.tier] || TIER_COLORS.untested))
    .attr('stroke-width', d => d.overdue ? 2.5 : 1.5);

  node.append('text')
    .attr('class', 'node-label')
    .attr('dy', d => nodeRadius(d) + 14)
    .text(d => formatLabel(d.id));

  // Render settled positions in one paint
  function renderPositions() {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  }

  renderPositions();
  updateHulls(hullGroup, DATA.nodes);

  // Interactions — tooltip with RAF-debounced mousemove
  const tooltip = document.getElementById('tooltip');
  let tooltipRaf = false;

  node.on('mouseenter', (event, d) => {
    tooltip.innerHTML = `<div class="node-name">${d.name}</div><div class="node-tier">${d.tier}${d.overdue ? ' • OVERDUE' : ''}</div>`;
    tooltip.classList.add('visible');
  })
  .on('mousemove', (event) => {
    if (tooltipRaf) return;
    tooltipRaf = true;
    requestAnimationFrame(() => {
      tooltipRaf = false;
      const rect = container.getBoundingClientRect();
      tooltip.style.left = (event.clientX - rect.left + 12) + 'px';
      tooltip.style.top = (event.clientY - rect.top - 8) + 'px';
    });
  })
  .on('mouseleave', () => {
    tooltip.classList.remove('visible');
  })
  .on('click', (event, d) => {
    event.stopPropagation();
    selectNode(d);
    highlightPrereqs(d, nodeMap, links);
  });

  // Drag — restart simulation only during drag, freeze after
  node.call(d3.drag()
    .on('start', (event, d) => {
      if (!event.active) simulation.alphaTarget(0.1).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on('drag', (event, d) => {
      d.fx = event.x; d.fy = event.y;
    })
    .on('end', (event, d) => {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    })
  );

  // Tick handler — only active during drag interactions
  let rafScheduled = false;
  simulation.on('tick', () => {
    if (!rafScheduled) {
      rafScheduled = true;
      requestAnimationFrame(() => {
        rafScheduled = false;
        renderPositions();
      });
    }
  });

  simulation.on('end', () => {
    renderPositions();
    updateHulls(hullGroup, DATA.nodes);
  });

  // Store references for highlight and resize
  window._graph = { node, link, nodeMap, svg: g, simulation, zoom, svgEl: svg };
}

function nodeRadius(d) {
  const base = 10;
  const extra = Math.min(d.downstream_count * 1.2, 12);
  return base + extra;
}

function layerXPosition(layer, w) {
  // Spread layers horizontally across available space
  const spread = Math.min(w || 1200, 1400) * 0.35;
  const positions = { 0: -spread, 1: 0, 99: spread };
  return positions[layer] || 0;
}

function depthYPosition(depth, maxDepth, h) {
  // Roots at top, deepest nodes at bottom
  const usable = Math.min(h || 800, 1000) * 0.7;
  return -usable / 2 + (depth / Math.max(maxDepth, 1)) * usable;
}

function computeDepths(nodes, nodeMap) {
  // BFS from roots to assign depth (longest path from any root)
  const depths = {};
  const children = {};
  nodes.forEach(n => { depths[n.id] = 0; children[n.id] = []; });
  nodes.forEach(n => {
    n.requires.forEach(req => {
      if (children[req]) children[req].push(n.id);
    });
  });
  // Topological sort via Kahn's
  const inDegree = {};
  nodes.forEach(n => { inDegree[n.id] = n.requires.filter(r => nodeMap.has(r)).length; });
  const queue = nodes.filter(n => inDegree[n.id] === 0).map(n => n.id);
  while (queue.length) {
    const id = queue.shift();
    children[id].forEach(childId => {
      depths[childId] = Math.max(depths[childId], depths[id] + 1);
      inDegree[childId]--;
      if (inDegree[childId] === 0) queue.push(childId);
    });
  }
  return depths;
}

function formatLabel(id) {
  // Convert snake_case to readable: "har_model" -> "HAR Model"
  return id.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function darken(hex) {
  // Return a slightly darker/more transparent version for stroke
  return hex + '99';
}

function truncate(str, max) {
  return str.length > max ? str.slice(0, max - 1) + '…' : str;
}

function updateHulls(hullGroup, nodes) {
  const layerGroups = {};
  nodes.forEach(n => {
    if (n.x === undefined) return;
    if (!layerGroups[n.layer]) layerGroups[n.layer] = [];
    layerGroups[n.layer].push([n.x, n.y]);
  });

  hullGroup.selectAll('path').remove();
  Object.entries(layerGroups).forEach(([layer, points]) => {
    if (points.length < 3) return;
    const hull = d3.polygonHull(points);
    if (!hull) return;
    const color = LAYER_COLORS[layer] || '#8b949e';
    hullGroup.append('path')
      .attr('class', 'layer-hull')
      .attr('d', hullPath(hull, 30))
      .attr('fill', color)
      .attr('stroke', color);
  });
}

function hullPath(hull, padding) {
  // Expand hull outward by padding
  const centroid = d3.polygonCentroid(hull);
  const expanded = hull.map(p => {
    const dx = p[0] - centroid[0];
    const dy = p[1] - centroid[1];
    const dist = Math.sqrt(dx * dx + dy * dy);
    const scale = (dist + padding) / dist;
    return [centroid[0] + dx * scale, centroid[1] + dy * scale];
  });
  return `M${expanded.map(p => p.join(',')).join('L')}Z`;
}

// ===== HIGHLIGHT =====
function highlightPrereqs(d, nodeMap, links) {
  const ancestors = new Set();
  const queue = [...d.requires];
  while (queue.length) {
    const id = queue.pop();
    if (ancestors.has(id)) continue;
    ancestors.add(id);
    const n = nodeMap.get(id);
    if (n) queue.push(...n.requires);
  }
  ancestors.add(d.id);

  const { node, link, svg } = window._graph;
  svg.classed('graph-highlight', true);
  node.classed('node-highlighted', n => ancestors.has(n.id));
  link.classed('link-highlighted', l => ancestors.has(l.source.id) && ancestors.has(l.target.id));
}

function clearHighlight() {
  const { node, link, svg } = window._graph;
  if (!svg) return;
  svg.classed('graph-highlight', false);
  node.classed('node-highlighted', false);
  link.classed('link-highlighted', false);
}

// ===== SIDEBAR =====
function selectNode(d) {
  selectedNode = d;
  const sidebar = document.getElementById('sidebar');
  const content = document.getElementById('sidebar-content');
  const nodeMap = window._graph.nodeMap;
  const detail = DATA.detail[d.id] || {};

  const prereqsHtml = d.requires.length > 0
    ? d.requires.map(rid => {
        const rn = nodeMap.get(rid);
        const met = rn && (rn.tier === 'understood' || rn.tier === 'mastered');
        return `<li><span class="prereq-icon ${met ? 'met' : 'unmet'}">${met ? '✓' : '✗'}</span>${rn ? rn.name : rid}</li>`;
      }).join('')
    : '<li style="color:var(--text-muted)">None (root node)</li>';

  const keyPoints = detail.key_points || [];
  const whyItMatters = detail.why_it_matters || '';
  const chapter = detail.chapter || '';
  const consecutivePasses = detail.consecutive_passes || 0;
  const lastTested = detail.last_tested || 'never';
  const nextReview = detail.next_review || '—';

  content.innerHTML = `
    <h2>${d.name}</h2>
    <span class="tier-badge tier-${d.tier}">${d.tier}</span>

    <section>
      <h3>Key Points</h3>
      <ul>${keyPoints.map(kp => `<li>${kp}</li>`).join('')}</ul>
    </section>

    ${whyItMatters ? `<section><h3>Why It Matters</h3><p class="why-text">${whyItMatters}</p></section>` : ''}

    ${chapter ? `<section><h3>Chapter</h3><span class="chapter-ref">Ch. ${chapter}</span></section>` : ''}

    <section>
      <h3>Mastery</h3>
      <div class="mastery-info">
        <div class="mastery-item"><div class="label">Tier</div><div class="value">${d.tier}</div></div>
        <div class="mastery-item"><div class="label">Passes</div><div class="value">${consecutivePasses}</div></div>
        <div class="mastery-item"><div class="label">Last tested</div><div class="value">${lastTested}</div></div>
        <div class="mastery-item"><div class="label">Next review</div><div class="value">${nextReview}</div></div>
      </div>
    </section>

    <section>
      <h3>Prerequisites</h3>
      <ul class="prereq-list">${prereqsHtml}</ul>
    </section>
  `;

  sidebar.classList.add('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  selectedNode = null;
  clearHighlight();
}

// ===== LAYER FILTER =====
function toggleLayerFilter(layerId) {
  const bars = document.querySelectorAll('.layer-bar');
  if (activeLayer === layerId) {
    activeLayer = null;
    bars.forEach(b => b.classList.remove('active'));
    window._graph.node.style('display', null);
    window._graph.link.style('display', null);
  } else {
    activeLayer = layerId;
    bars.forEach(b => b.classList.toggle('active', parseInt(b.dataset.layer) === layerId));
    window._graph.node.style('display', d => d.layer === layerId ? null : 'none');
    window._graph.link.style('display', l => {
      const sameLayer = l.source.layer === layerId && l.target.layer === layerId;
      const crossesIn = l.target.layer === layerId;
      return (sameLayer || crossesIn) ? null : 'none';
    });
  }
}

init();
