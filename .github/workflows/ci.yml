name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy volforecast/ --ignore-missing-imports

      - name: Test with coverage
        run: uv run pytest tests/ --cov=volforecast --cov-report=term-missing --cov-fail-under=30

      - name: Suggest debug on failure
        if: failure()
        run: |
          echo "::warning::Tests or checks failed. To debug, use: /debug <failing_test_name>"
          echo "Attach the error output above when invoking the debug workflow."
