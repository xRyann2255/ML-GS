<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailhead — payments-core</title>
<style>
/* ============================================================
   TRAILHEAD — generated codebase walkthrough
   Aesthetic: field survey document / terminal ledger
   Self-contained: no external requests, no fonts, no scripts
   ============================================================ */

:root{
  --ink:#0c0b09; --ink2:#13110e; --ink3:#1b1814; --ink4:#221e18;
  --bone:#e9e3d5; --dim:#a09884; --faint:#6a6355;
  --rule:#2b261e; --rule2:#3a3328;
  --ok:#9dc25f; --inf:#d9a13d; --bad:#c8574a;
  --okd:#1e2a15; --infd:#2c2211; --badd:#2a1512;
  --mono:"Cascadia Code","JetBrains Mono","SF Mono","Berkeley Mono","IBM Plex Mono",ui-monospace,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --base:16px; --rail:270px; --bar:52px;
}
:root[data-theme="light"]{
  --ink:#e8e3d6; --ink2:#e0dacb; --ink3:#d6cfbe; --ink4:#cdc5b1;
  --bone:#1b1813; --dim:#5c5546; --faint:#8a8271;
  --rule:#c2b9a4; --rule2:#aaa08a;
  --ok:#4f6b21; --inf:#8a5c10; --bad:#992e22;
  --okd:#d8dcc0; --infd:#e2d4b0; --badd:#e6cdc6;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme]){--ink:#e8e3d6;--bone:#1b1813;}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink); color:var(--bone);
  font:var(--base)/1.65 var(--mono);
  font-feature-settings:"ss01","cv01";
  overflow-x:hidden; letter-spacing:-.005em;
}
/* contour ground + vignette */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent 0 47px,var(--rule) 47px 48px),
    repeating-linear-gradient(90deg,transparent 0 47px,var(--rule) 47px 48px),
    radial-gradient(120% 80% at 22% -10%,rgba(157,194,95,.05),transparent 60%);
  opacity:.35;
}
/* grain */
body::after{
  content:""; position:fixed; inset:0; z-index:9998; pointer-events:none; opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
}
::selection{background:var(--ok);color:var(--ink)}

/* ---------- top bar ---------- */
.bar{
  position:fixed; top:0; left:0; right:0; height:var(--bar); z-index:60;
  display:flex; align-items:center; gap:18px; padding:0 18px;
  background:var(--ink); border-bottom:1px solid var(--rule2);
}
.brand{display:flex;align-items:baseline;gap:11px;min-width:0}
.brand b{font:600 15px var(--mono);letter-spacing:.02em}
.meta{color:var(--faint);font-size:11.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sample{
  font-size:9.5px;letter-spacing:.16em;padding:2px 6px;border:1px solid var(--inf);
  color:var(--inf);flex:none
}
.badge{
  margin-left:auto;display:flex;align-items:center;gap:0;border:1px solid var(--rule2);
  background:var(--ink2);cursor:pointer;flex:none;font-size:11px;letter-spacing:.03em
}
.badge:hover{border-color:var(--ok)}
.badge span{padding:5px 9px;border-right:1px solid var(--rule)}
.badge span:last-child{border-right:0}
.badge .n{color:var(--bone);font-weight:600;font-style:normal}
.badge .d{color:var(--inf)} .badge .f{color:var(--bad)}
.tools{display:flex;gap:5px;flex:none}
.tbtn{
  background:transparent;border:1px solid var(--rule2);color:var(--dim);cursor:pointer;
  font:11px var(--mono);letter-spacing:.05em;padding:5px 8px
}
.tbtn:hover{color:var(--bone);border-color:var(--dim)}
.tbtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--ink);font-weight:600}
.tbtn:focus-visible,a:focus-visible,button:focus-visible,li:focus-visible{outline:2px solid var(--ok);outline-offset:2px}

/* ---------- rail ---------- */
.rail{
  position:fixed;top:var(--bar);bottom:0;left:0;width:var(--rail);z-index:50;
  overflow-y:auto;border-right:1px solid var(--rule2);
  background:var(--ink2);padding:16px 0 90px
}
.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb{background:var(--rule2)}
.track{margin-bottom:4px}
.track h3{
  font:600 9.5px var(--mono);letter-spacing:.2em;color:var(--faint);
  padding:14px 18px 7px;display:flex;justify-content:space-between
}
.track h3 i{font-style:normal;opacity:.6}
.stop{
  display:flex;gap:10px;align-items:baseline;padding:6px 18px 6px 16px;cursor:pointer;
  border-left:2px solid transparent;color:var(--dim);font-size:13px;line-height:1.4
}
.stop:hover{background:var(--ink3);color:var(--bone)}
.stop .num{font-size:10.5px;color:var(--faint);flex:none;width:16px;letter-spacing:.02em;position:relative;text-align:right}
.stop.on{border-left-color:var(--ok);background:var(--ink3);color:var(--bone)}
.stop.on .num{color:var(--ok)}
.stop.done .num{color:transparent}
.stop.done .num::after{content:"✓";position:absolute;left:0;right:0;text-align:right;color:var(--ok)}
.stop.cp{font-style:italic}
.prog{
  position:fixed;bottom:0;left:0;width:var(--rail);z-index:51;
  background:var(--ink);border-top:1px solid var(--rule2);border-right:1px solid var(--rule2);
  padding:11px 18px 13px
}
.prog .lab{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;color:var(--faint);margin-bottom:7px}
.sprocket{display:flex;gap:2px}
.sprocket i{flex:1;height:5px;background:var(--rule2)}
.sprocket i.f{background:var(--ok)}

/* ---------- main ---------- */
main{margin-left:var(--rail);padding:calc(var(--bar) + 46px) 0 120px;position:relative;z-index:1}
.wrap{max-width:1010px;padding:0 clamp(20px,4vw,58px)}
.plate{
  display:flex;align-items:center;gap:13px;font-size:10px;letter-spacing:.22em;
  color:var(--faint);margin-bottom:16px
}
.plate hr{flex:1;border:0;border-top:1px solid var(--rule2)}
h1{
  font:400 clamp(30px,4.6vw,46px)/1.08 var(--serif);letter-spacing:-.02em;
  margin-bottom:14px;max-width:24ch
}
h1 em{font-style:italic;color:var(--ok)}
.lede{color:var(--dim);font-size:14px;max-width:70ch;margin-bottom:38px;letter-spacing:0}
.blocks>*{margin-bottom:30px;animation:rise .5s both}
.blocks>*:nth-child(1){animation-delay:.02s} .blocks>*:nth-child(2){animation-delay:.07s}
.blocks>*:nth-child(3){animation-delay:.12s} .blocks>*:nth-child(4){animation-delay:.17s}
.blocks>*:nth-child(5){animation-delay:.22s} .blocks>*:nth-child(6){animation-delay:.27s}
.blocks>*:nth-child(n+7){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* prose + claims */
.prose{font-size:15px}
.prose p{margin-bottom:13px;max-width:72ch}
.claim{border-bottom:1px solid var(--rule2);padding-bottom:1px}
.mark{
  font:600 10px var(--mono);color:var(--ok);background:var(--okd);border:1px solid var(--ok);
  cursor:pointer;padding:0 4px;margin-left:4px;vertical-align:1.5px;letter-spacing:.02em
}
.mark:hover{background:var(--ok);color:var(--ink)}
.mark[aria-expanded="true"]{background:var(--ok);color:var(--ink)}
.claim.inf{border-bottom:1px dotted var(--inf)}
.tag{
  font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--inf);border:1px solid var(--inf);
  padding:1px 5px;margin-left:6px;vertical-align:1.5px;white-space:nowrap
}
.pop{margin:11px 0 20px;border-left:2px solid var(--ok);animation:rise .25s both}

/* excerpt */
.ex{border:1px solid var(--rule2);background:var(--ink2)}
.ex>header{
  display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid var(--rule);
  font-size:11.5px;color:var(--dim);letter-spacing:.02em;background:var(--ink3)
}
.ex>header b{color:var(--bone);font-weight:600}
.ex>header .sp{flex:1}
.cp-btn{background:transparent;border:1px solid var(--rule2);color:var(--faint);cursor:pointer;font:10px var(--mono);letter-spacing:.09em;padding:2px 6px}
.cp-btn:hover{color:var(--ok);border-color:var(--ok)}
.code{overflow:auto;max-height:430px}
.code table{border-collapse:collapse;width:100%;font-size:12.8px;line-height:1.62}
.code td{padding:0;white-space:pre;vertical-align:top}
.code .ln{
  width:1%;text-align:right;padding:0 11px 0 12px;color:var(--faint);
  user-select:none;font-size:11.5px;position:relative;border-right:1px solid var(--rule)
}
.code .src{padding:0 16px 0 13px;color:var(--bone)}
.code tr.hl{background:var(--okd)}
.code tr.hl .ln{color:var(--ok);font-weight:600}
.code tr.hl .ln::before{content:"▸";position:absolute;left:3px}
.code tr.el td{color:var(--faint);font-size:11px;padding:2px 0 2px 13px;font-style:italic}
.ex figcaption{padding:7px 12px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--faint);background:var(--ink3)}

/* command */
.cmd{border:1px solid var(--rule2);background:var(--ink2)}
.cmd.fail{border-color:var(--bad)}
.cmd>header{display:flex;align-items:center;gap:12px;padding:9px 12px;font-size:13px}
.cmd>header .pr{color:var(--ok);flex:none;font-weight:600}
.cmd>header code{flex:1;font:13px var(--mono);color:var(--bone);overflow:auto;white-space:nowrap}
.pill{font:600 10.5px var(--mono);letter-spacing:.07em;padding:2px 7px;flex:none;border:1px solid}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--okd)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--badd)}
.dur{color:var(--faint);font-size:11px;flex:none;letter-spacing:.03em}
.brk{
  display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--bad);
  font-size:13px;background:
    repeating-linear-gradient(135deg,var(--badd) 0 6px,transparent 6px 12px)
}
.brk b{color:var(--bad);letter-spacing:.1em;font-size:10px;flex:none;margin-top:3px}
.out{border-top:1px solid var(--rule)}
.out summary{padding:7px 12px;cursor:pointer;font-size:11.5px;color:var(--dim);letter-spacing:.04em;list-style:none}
.out summary::before{content:"▸ ";color:var(--faint)}
.out[open] summary::before{content:"▾ "}
.out summary:hover{color:var(--bone)}
.out pre{padding:11px 14px;font-size:12px;line-height:1.6;color:var(--dim);overflow:auto;max-height:290px;border-top:1px solid var(--rule);white-space:pre}
.envnote{padding:6px 12px;border-top:1px solid var(--rule);font-size:10.5px;color:var(--faint);letter-spacing:.03em}

/* map */
.mapbox{border:1px solid var(--rule2);background:var(--ink2);position:relative}
.mapbox svg{display:block;width:100%;height:auto;touch-action:none}
.mapbox .hint{position:absolute;bottom:8px;left:11px;font-size:10px;color:var(--faint);letter-spacing:.09em}
.n-body{fill:var(--ink3);stroke:var(--rule2);transition:stroke .15s,fill .15s}
.n-lab{fill:var(--bone);font:600 11.5px var(--mono);letter-spacing:.01em}
.n-loc{fill:var(--faint);font:10px var(--mono)}
.node{cursor:pointer}
.node:hover .n-body,.node.sel .n-body{fill:var(--okd);stroke:var(--ok)}
.node.dim{opacity:.24}
.edge{stroke:var(--rule2);fill:none;transition:stroke .15s,opacity .15s}
.edge.lit{stroke:var(--ok)}
.edge.dim{opacity:.13}
.tick{stroke:var(--rule2)} .ticklab{fill:var(--faint);font:9px var(--mono);letter-spacing:.1em}
.fallback summary{cursor:pointer;font-size:11.5px;color:var(--dim);letter-spacing:.05em;padding:9px 0;list-style:none}
.fallback summary::before{content:"▸ ";color:var(--faint)}
.fallback[open] summary::before{content:"▾ "}
.fallback ul{margin-left:20px;font-size:13px;color:var(--dim)}
.fallback li{margin:3px 0;list-style:"— "}

/* drawer */
.drawer{
  position:fixed;top:var(--bar);right:0;bottom:0;width:min(430px,92vw);z-index:70;
  background:var(--ink2);border-left:1px solid var(--ok);overflow-y:auto;padding:22px;
  transform:translateX(101%);transition:transform .22s cubic-bezier(.3,.8,.3,1)
}
.drawer.open{transform:none}
.drawer h4{font:400 25px var(--serif);margin-bottom:4px}
.drawer .sub{font-size:11px;color:var(--faint);letter-spacing:.1em;margin-bottom:18px}
.drawer .x{position:absolute;top:15px;right:16px}
.dl{border-top:1px solid var(--rule);padding:9px 0;display:flex;gap:14px;font-size:12.5px}
.dl b{color:var(--faint);font-weight:400;width:88px;flex:none;letter-spacing:.06em;font-size:10.5px;padding-top:2px}
.dl span{color:var(--bone)}
.drawer h5{font:600 9.5px var(--mono);letter-spacing:.2em;color:var(--faint);margin:22px 0 9px}

/* table */
.tbl{border:1px solid var(--rule2);overflow:auto;background:var(--ink2)}
.tbl table{border-collapse:collapse;width:100%;font-size:12.8px;min-width:660px}
.tbl th{
  text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule2);background:var(--ink3);
  font:600 9.5px var(--mono);letter-spacing:.16em;color:var(--faint);cursor:pointer;white-space:nowrap
}
.tbl th:hover{color:var(--ok)}
.tbl th[data-dir]::after{content:" ▲";color:var(--ok)}
.tbl th[data-dir="-1"]::after{content:" ▼"}
.tbl td{padding:7px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--ink3)}
.tbl .r{text-align:right;color:var(--dim);white-space:nowrap}
.tbl code{font-size:12.3px;color:var(--bone)}
.tbl .st{font-size:10px;letter-spacing:.1em;padding:1px 5px;border:1px solid}
.st.v{color:var(--ok);border-color:var(--ok)} .st.i{color:var(--inf);border-color:var(--inf)}
.st.x{color:var(--bad);border-color:var(--bad)}

/* trace */
.trace{position:relative;padding-left:38px;max-width:86ch}
.trace::before{content:"";position:absolute;left:13px;top:8px;bottom:34px;border-left:1px dashed var(--rule2)}
.hop{margin-bottom:26px;position:relative}
.hop>.dot{
  position:absolute;left:-38px;top:0;width:27px;height:27px;border:1px solid var(--ok);
  background:var(--ink);color:var(--ok);display:grid;place-items:center;font:600 11.5px var(--mono);
  border-radius:50%
}
.hop h4{font:600 13.5px var(--mono);margin-bottom:3px;letter-spacing:0}
.hop .an{font-size:11px;color:var(--faint);letter-spacing:.03em;margin-bottom:9px}
.hop .nx{font-size:11.5px;color:var(--dim);margin-top:9px;letter-spacing:.02em}
.hop .nx b{color:var(--ok);font-weight:400}

/* checkpoint */
.cpx{border:1px dashed var(--rule2);background:var(--ink2);padding:19px 21px;max-width:78ch}
.cpx>.k{font:600 9.5px var(--mono);letter-spacing:.2em;color:var(--faint);margin-bottom:11px}
.cpx h4{font:400 20px var(--serif);margin-bottom:15px;letter-spacing:-.01em}
.opt{
  display:flex;gap:11px;align-items:flex-start;padding:9px 12px;border:1px solid var(--rule);
  margin-bottom:6px;cursor:pointer;font-size:13.5px;background:var(--ink)
}
.opt:hover{border-color:var(--dim)}
.opt.pick{border-color:var(--ok);background:var(--okd)}
.opt.right{border-color:var(--ok);background:var(--okd)}
.opt.wrong{border-color:var(--bad);background:var(--badd)}
.opt .i{color:var(--faint);flex:none;font-size:11px;width:15px;padding-top:2px;letter-spacing:.02em}
.opt.right .i,.opt.wrong .i{font-weight:600}
.opt.right .i{color:var(--ok)} .opt.wrong .i{color:var(--bad)}
.cpx .act{display:flex;gap:9px;align-items:center;margin-top:13px}
.sub{background:var(--ok);border:1px solid var(--ok);color:var(--ink);font:600 11.5px var(--mono);letter-spacing:.09em;padding:7px 15px;cursor:pointer}
.sub:disabled{background:transparent;color:var(--faint);border-color:var(--rule2);cursor:not-allowed}
.verdict{font-size:12px;letter-spacing:.06em}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--bad)}
.expl{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px;font-size:13px;color:var(--dim);max-width:66ch}
.prov{margin-top:9px;font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.prov b{color:var(--ok);font-weight:400;letter-spacing:.1em}
.ordr{display:flex;gap:9px;align-items:center;padding:8px 11px;border:1px solid var(--rule);margin-bottom:6px;background:var(--ink);font-size:13px}
.ordr select{background:var(--ink3);color:var(--bone);border:1px solid var(--rule2);font:12px var(--mono);padding:3px 5px}

/* callout */
.call{border-left:2px solid var(--rule2);padding:12px 0 12px 16px;font-size:14px;color:var(--dim);max-width:72ch}
.call b{display:block;font:600 9.5px var(--mono);letter-spacing:.2em;margin-bottom:6px;color:var(--faint)}
.call.inferred{border-color:var(--inf)} .call.inferred b{color:var(--inf)}
.call.broken{border-color:var(--bad)} .call.broken b{color:var(--bad)}

/* footer nav */
.fnav{display:flex;gap:1px;margin-top:56px;border-top:1px solid var(--rule2);padding-top:1px}
.fnav button{
  flex:1;background:var(--ink2);border:1px solid var(--rule2);color:var(--dim);cursor:pointer;
  padding:15px 17px;text-align:left;font:12px var(--mono)
}
.fnav button:hover:not(:disabled){border-color:var(--ok);color:var(--bone)}
.fnav button:disabled{opacity:.32;cursor:not-allowed}
.fnav .k{display:block;font-size:9.5px;letter-spacing:.2em;color:var(--faint);margin-bottom:4px}
.fnav .nxt{text-align:right}

/* audit modal */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(4,4,3,.72);backdrop-filter:blur(3px);display:none}
.scrim.open{display:block}
.modal{
  position:fixed;z-index:81;inset:6vh 5vw;background:var(--ink);border:1px solid var(--ok);
  display:none;flex-direction:column;overflow:hidden
}
.modal.open{display:flex}
.modal>header{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--rule2)}
.modal>header h3{font:400 23px var(--serif)}
.modal .body{overflow:auto;padding:20px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:1px;background:var(--rule);margin-bottom:22px}
.sumgrid div{background:var(--ink2);padding:12px 14px}
.sumgrid .v{font:600 22px var(--mono);letter-spacing:-.02em}
.sumgrid .l{font-size:9.5px;letter-spacing:.16em;color:var(--faint);margin-top:3px}
.filt{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filt button{background:transparent;border:1px solid var(--rule2);color:var(--dim);cursor:pointer;font:10.5px var(--mono);letter-spacing:.11em;padding:5px 10px}
.filt button[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}

/* projector */
:root[data-proj="1"]{--base:20px;--rail:0px}
:root[data-proj="1"] .rail,:root[data-proj="1"] .prog{display:none}
:root[data-proj="1"] .wrap{max-width:1180px}
:root[data-proj="1"] .code table{font-size:16px}
:root[data-proj="1"] .code{max-height:340px}

/* responsive */
@media (max-width:900px){
  :root{--rail:0px}
  .rail{
    top:var(--bar);width:100%;height:auto;max-height:58vh;border-right:0;
    border-bottom:1px solid var(--rule2);transform:translateY(-101%);transition:transform .2s;
    padding-bottom:16px
  }
  .rail.open{transform:none}
  .prog{width:100%}
  main{margin-left:0}
  .meta{display:none}
}
@media (min-width:901px){.menu{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* print */
@media print{
  body::before,body::after,.bar,.rail,.prog,.fnav,.tools,.drawer,.scrim{display:none!important}
  :root{--ink:#fff;--ink2:#fff;--ink3:#f4f2ec;--bone:#111;--dim:#333;--faint:#666;--rule:#ccc;--rule2:#999}
  main{margin:0;padding:0}
  .out{display:block!important} .out pre{max-height:none;display:block!important}
  .code{max-height:none}
  .stopwrap{break-after:page}
  .blocks>*{animation:none!important}
  a::after{content:" (" attr(href) ")";font-size:10px;color:#666}
}
</style>
</head>
<body>

<header class="bar">
  <button class="tbtn menu" id="menu" aria-label="Toggle outline">☰</button>
  <div class="brand">

   <details class="out"><summary>output (${b.out.split("\n").length} lines)</summary><pre>${esc(b.out)}</pre></details>

 callout:b=>`<div class="call ${b.level}"><b>${esc(b.title)}</b>${esc(b.text)}</div>`,

 table:b=>`<div class="tbl"><table>
   <thead><tr>${b.columns.map((c,i)=>`<th ${b.sortable?`data-sort="${i}"`:""}>${c}</th>`).join("")}</tr></thead>
   <tbody>${b.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i>1&&/^[\d,]+$|^—$/.test(c)?"r":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
   </table></div>${b.caption?`<div class="envnote" style="border:1px solid var(--rule2);border-top:0">${esc(b.caption)}</div>`:""}`,

 graph:()=>graph(),

 trace:b=>`<div class="trace">${b.steps.map((s,i)=>`<div class="hop">
   <div class="dot">${i+1}</div>
   <h4>${esc(s.anchor.file.split("/").pop())}</h4>
   <div class="an">${esc(s.anchor.file)} : ${s.anchor.start}–${s.anchor.end}</div>
   <div class="prose" style="margin-bottom:10px"><span class="claim">${esc(s.claim)}</span></div>
   ${excerpt(s.anchor,"")}
   ${s.next?`<div class="nx">next → <b>${esc(s.next)}</b></div>`:`<div class="nx">response leaves the process</div>`}
 </div>`).join("")}</div>`,

 checkpoint:b=>{
  const a=S.ans[b.id];
  if(b.kind==="order"){
    const opts=b.options.map((o,i)=>`<div class="ordr"><select data-ord="${b.id}" data-i="${i}" ${a?"disabled":""}>
        <option value="">–</option>${b.options.map((_,k)=>`<option value="${k+1}" ${a&&a.pick[i]===k+1?"selected":""}>${k+1}</option>`).join("")}
      </select><span>${o}</span>${a?(a.pick[i]===b.answer[i]?`<span class="verdict y" style="margin-left:auto">✓</span>`:`<span class="verdict n" style="margin-left:auto">✕ ${b.answer[i]}</span>`):""}</div>`).join("");
    return `<div class="cpx" data-cp="${b.id}"><div class="k">CHECKPOINT · ORDER</div><h4>${esc(b.prompt)}</h4>${opts}
      ${a?verdict(b,a):`<div class="act"><button class="sub" data-go="${b.id}">CHECK</button></div>`}</div>`;
  }
  const opts=b.options.map((o,i)=>{
    let cls="opt"; if(a){ if(i===b.answer)cls+=" right"; else if(a.pick===i)cls+=" wrong"; }
    return `<div class="${cls}" data-pick="${b.id}" data-i="${i}" tabindex="0" role="button">
      <span class="i">${a?(i===b.answer?"✓":(a.pick===i?"✕":String.fromCharCode(65+i))):String.fromCharCode(65+i)}</span><span>${o}</span></div>`;
  }).join("");
  return `<div class="cpx" data-cp="${b.id}"><div class="k">CHECKPOINT · SINGLE ANSWER</div>
    <h4>${esc(b.prompt)}</h4>${opts}${a?verdict(b,a):""}</div>`;
 },

 ledger:()=>ledgerTable()
};
function verdict(b,a){
  return `<div class="act"><span class="verdict ${a.ok?"y":"n"}">${a.ok?"CORRECT":"NOT QUITE"}</span></div>
    <div class="expl">${esc(b.explanation)}<div class="prov"><b>ANSWER KEY</b> ${esc(b.provenance)}</div></div>`;
}
function ledgerTable(){
  return `<div class="sumgrid">
    <div><div class="v">${D.report.claims}</div><div class="l">CLAIMS MADE</div></div>
    <div><div class="v" style="color:var(--ok)">${D.report.verified}</div><div class="l">VERIFIED</div></div>
    <div><div class="v" style="color:var(--inf)">${D.report.inferred}</div><div class="l">INFERRED</div></div>
    <div><div class="v" style="color:var(--bad)">${D.report.dropped}</div><div class="l">DELETED</div></div>
    <div><div class="v">${D.report.commands}</div><div class="l">COMMANDS RUN</div></div>
    <div><div class="v" style="color:var(--bad)">${D.report.failed}</div><div class="l">COMMANDS FAILED</div></div>
  </div>
  <div class="tbl"><table><thead><tr><th>ID</th><th>DELETED CLAIM</th><th>TARGET</th><th>REASON</th></tr></thead>
  <tbody>${D.dropped.map(d=>`<tr><td><code>${d.id}</code></td><td style="color:var(--dim)">${esc(d.text)}</td>
    <td><code>${esc(d.file)}</code></td><td><span class="st x">${esc(d.reason)}</span></td></tr>`).join("")}</tbody></table></div>
  <div class="envnote" style="border:1px solid var(--rule2);border-top:0">Regenerate: <code>trailhead build . --out trailhead.html</code></div>`;
}

/* ---- map ---- */
function graph(){
  const N=D.map.nodes, E=D.map.edges, W=900,H=400;
  const at=id=>N.find(n=>n.id===id);
  const h=n=>34+Math.sqrt(n.loc)/9;
  const edges=E.map(e=>{
    const a=at(e.a),b=at(e.b);
    const x1=a.x+a.w,y1=a.y+h(a)/2, x2=b.x,y2=b.y+h(b)/2, mx=(x1+x2)/2;
    return `<path class="edge" data-a="${e.a}" data-b="${e.b}" stroke-width="${.7+e.n/16}"
      d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"/>`;
  }).join("");
  const ticks=[0,1,2,3,4,5,6,7,8].map(i=>`<line class="tick" x1="${i*100+20}" y1="${H-14}" x2="${i*100+20}" y2="${H-8}"/>
    <text class="ticklab" x="${i*100+20}" y="${H-19}" text-anchor="middle">${String(i*100).padStart(3,"0")}</text>`).join("");
  const nodes=N.map(n=>`<g class="node" data-id="${n.id}" tabindex="0" role="button">
      <rect class="n-body" x="${n.x}" y="${n.y}" width="${n.w}" height="${h(n)}" rx="2"/>
      <text class="n-lab" x="${n.x+11}" y="${n.y+21}">${n.label}</text>
      <text class="n-loc" x="${n.x+11}" y="${n.y+h(n)-9}">${n.loc.toLocaleString()} loc · ${n.files} files</text>
    </g>`).join("");
  return `<div class="mapbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Module dependency graph">
      <g>${ticks}</g><g id="edges">${edges}</g><g id="nodes">${nodes}</g></svg>
      <div class="hint">HOVER TO ISOLATE · CLICK TO OPEN · ESC TO CLOSE</div></div>
    <details class="fallback"><summary>Text equivalent (${N.length} modules, ${E.length} dependencies)</summary>
      <ul>${N.map(n=>`<li><b>${n.label}</b> — ${n.loc.toLocaleString()} loc, ${n.files} files. Imports:
        ${E.filter(e=>e.a===n.id).map(e=>at(e.b).label+" ×"+e.n).join(", ")||"none"}</li>`).join("")}</ul></details>`;
}

/* ---- rail ---- */
function rail(){
  $("#rail").innerHTML=D.tracks.map(t=>`<div class="track">
    <h3>${t.title}<i>${t.minutes}m</i></h3>
    ${t.stops.map(s=>{const i=STOPS.findIndex(x=>x.id===s.id);
      return `<div class="stop ${i===S.cur?"on":""} ${S.done[s.id]?"done":""} ${s.kind==="cp"?"cp":""}"
        data-go="${i}" tabindex="0" role="button"><span class="num">${String(i).padStart(2,"0")}</span><span>${s.title}</span></div>`;
    }).join("")}</div>`).join("");
  const n=STOPS.length, d=Object.keys(S.done).length;
  $("#sprocket").innerHTML=STOPS.map((s,i)=>`<i class="${S.done[s.id]?"f":""}"></i>`).join("");
  $("#ppct").textContent=Math.round(d/n*100)+"%";
  $("#plab").textContent=d+" / "+n+" STOPS";
}

/* ---- stage ---- */
function draw(i){
  S.cur=Math.max(0,Math.min(STOPS.length-1,i)); save();
  const s=STOPS[S.cur];
  $("#stage").innerHTML=`<div class="stopwrap">
    <div class="plate"><span>PLATE ${String(S.cur).padStart(2,"0")} / ${String(STOPS.length-1).padStart(2,"0")}</span>
      <hr><span>${s.track}</span><hr><span>${s.minutes} MIN</span></div>
    <h1>${s.title.replace(/^(\w+)/, m=>m)}</h1>
    ${s.lede?`<p class="lede">${esc(s.lede)}</p>`:""}
    <div class="blocks">${s.blocks.map(b=>B[b.type](b)).join("")}</div>
    <div class="fnav">
      <button ${S.cur===0?"disabled":""} data-nav="-1"><span class="k">← PREV</span>${S.cur>0?esc(STOPS[S.cur-1].title):"—"}</button>
      <button class="nxt" ${S.cur===STOPS.length-1?"disabled":""} data-nav="1"><span class="k">NEXT →</span>${S.cur<STOPS.length-1?esc(STOPS[S.cur+1].title):"—"}</button>
    </div></div>`;
  if(s.kind!=="cp"){S.done[s.id]=1;save();}
  location.hash="#"+s.id;
  rail(); window.scrollTo({top:0,behavior:"instant"});
  wireMap();
}

/* ---- map interactions ---- */
function wireMap(){
  const box=$(".mapbox"); if(!box)return;
  const nodes=$$(".node",box), edges=$$(".edge",box);
  const clear=()=>{nodes.forEach(n=>n.classList.remove("dim"));edges.forEach(e=>e.classList.remove("dim","lit"))};
  nodes.forEach(g=>{
    const id=g.dataset.id;
    const lit=()=>{
      const keep=new Set([id]);
      edges.forEach(e=>{if(e.dataset.a===id||e.dataset.b===id){e.classList.add("lit");keep.add(e.dataset.a);keep.add(e.dataset.b)}else e.classList.add("dim")});
      nodes.forEach(n=>{if(!keep.has(n.dataset.id))n.classList.add("dim")});
    };
    g.addEventListener("mouseenter",lit); g.addEventListener("focus",lit);
    g.addEventListener("mouseleave",clear); g.addEventListener("blur",clear);
    const open=()=>{
      const n=D.map.nodes.find(x=>x.id===id);
      nodes.forEach(x=>x.classList.toggle("sel",x.dataset.id===id));
      const ins=D.map.edges.filter(e=>e.b===id), outs=D.map.edges.filter(e=>e.a===id);
      const nm=k=>D.map.nodes.find(x=>x.id===k).label;
      $("#dbody").innerHTML=`<h4>${n.label}</h4><div class="sub">${n.loc.toLocaleString()} LOC · ${n.files} FILES</div>
        <div class="prose" style="font-size:14px"><span class="claim">${esc(n.why)}</span></div>
        <h5>DEPENDS ON</h5>${outs.length?outs.map(e=>`<div class="dl"><b>×${e.n}</b><span>${nm(e.b)}</span></div>`).join(""):`<div class="dl"><span style="color:var(--faint)">nothing</span></div>`}
        <h5>DEPENDED ON BY</h5>${ins.length?ins.map(e=>`<div class="dl"><b>×${e.n}</b><span>${nm(e.a)}</span></div>`).join(""):`<div class="dl"><span style="color:var(--faint)">nothing</span></div>`}
        <h5>MOST-EDITED FILES</h5>${n.top.map(f=>`<div class="dl"><span><code>${esc(f)}</code></span></div>`).join("")}`;
      $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden","false");
    };
    g.addEventListener("click",open);
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
  });
}
const shut=()=>{$("#drawer").classList.remove("open");$("#drawer").setAttribute("aria-hidden","true");$$(".node").forEach(n=>n.classList.remove("sel"))};

/* ---- events ---- */
document.addEventListener("click",e=>{
  const t=e.target;
  const go=t.closest("[data-go]");
  if(go&&go.dataset.go!==undefined&&!go.classList.contains("sub")){
    if(go.hasAttribute("data-go")&&/^\d+$/.test(go.dataset.go)){draw(+go.dataset.go);$("#rail").classList.remove("open");return}
  }
  const nav=t.closest("[data-nav]"); if(nav){draw(S.cur+ +nav.dataset.nav);return}

  const mk=t.closest(".mark");
  if(mk){const p=$(`[data-pop="${mk.dataset.claim}"]`);const open=p.hidden;p.hidden=!open;mk.setAttribute("aria-expanded",open);return}

  const cp=t.closest("[data-copy]");
  if(cp){navigator.clipboard?.writeText(cp.dataset.copy.replace(/&quot;/g,'"'));cp.textContent="COPIED";setTimeout(()=>cp.textContent="COPY",1200);return}

  const pk=t.closest("[data-pick]");
  if(pk){const id=pk.dataset.pick;if(S.ans[id])return;
    const b=allCP().find(x=>x.id===id), i=+pk.dataset.i;
    S.ans[id]={pick:i,ok:i===b.answer};S.done[STOPS[S.cur].id]=1;save();draw(S.cur);return}

  const chk=t.closest("[data-go].sub, .sub[data-go]");
  if(chk){const id=chk.dataset.go, b=allCP().find(x=>x.id===id);
    const pick=$$(`[data-ord="${id}"]`).map(s=>s.value?+s.value:0);
    if(pick.some(v=>!v))return;
    S.ans[id]={pick,ok:pick.every((v,k)=>v===b.answer[k])};S.done[STOPS[S.cur].id]=1;save();draw(S.cur);return}

  const th=t.closest("th[data-sort]");
  if(th){const tb=th.closest("table").tBodies[0], i=+th.dataset.sort;
    const dir=th.dataset.dir==="1"?-1:1;
    $$("th",th.closest("thead")).forEach(x=>x.removeAttribute("data-dir")); th.dataset.dir=dir;
    [...tb.rows].sort((a,b)=>{
      const A=a.cells[i].textContent.trim(), B=b.cells[i].textContent.trim();
      const na=parseFloat(A.replace(/,/g,"")), nb=parseFloat(B.replace(/,/g,""));
      return (isNaN(na)||isNaN(nb)? A.localeCompare(B) : na-nb)*dir;
    }).forEach(r=>tb.appendChild(r)); return}

  if(t.closest("#badge")){modal(true);return}
  if(t.closest("#mx")||t.id==="scrim"){modal(false);return}
  if(t.closest("#dx")){shut();return}
  if(t.closest("#menu")){$("#rail").classList.toggle("open");return}
  if(t.closest("#theme")){
    const d=document.documentElement.dataset.theme==="dark"?"light":"dark";
    document.documentElement.dataset.theme=d;return}
  if(t.closest("#proj")){
    const on=document.documentElement.dataset.proj==="1";
    document.documentElement.dataset.proj=on?"0":"1";
    $("#proj").setAttribute("aria-pressed",!on);return}
  if(t.closest("#reset")){S={cur:0,done:{},ans:{}};save();draw(0);return}
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea"))return;
  if(e.key==="Escape"){shut();modal(false);return}
  if(e.key==="ArrowRight")draw(S.cur+1);
  if(e.key==="ArrowLeft")draw(S.cur-1);
});
document.addEventListener("keydown",e=>{
  const o=e.target.closest("[data-pick]");
  if(o&&(e.key==="Enter"||e.key===" ")){e.preventDefault();o.click()}
});
function allCP(){return STOPS.flatMap(s=>s.blocks.filter(b=>b.type==="checkpoint"))}
function modal(on){
  if(on)$("#mbody").innerHTML=ledgerTable();
  $("#modal").classList.toggle("open",on); $("#scrim").classList.toggle("open",on);
}

/* ---- boot ---- */
const h=location.hash.slice(1);
const at=STOPS.findIndex(s=>s.id===h);
draw(at>=0?at:(S.cur||0));
</script>
</body>
</html>
