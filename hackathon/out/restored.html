ing: this snapshot imports 14 modules that have no file on disk, volforecast.config among them, and the roughly 2,700 tests under src\u002ftests never ran, so the very interpreter that returned 0 here fails the moment vol run asks for ExperimentConfig.","status":"inferred"}]},{"type":"callout","level":"info","title":"THIS IS A SMOKE CHECK, NOT A TEST SUITE","text":"python -c \"import volforecast\" proves the package imports from the source root the survey resolved. It does not run a single test, and this page will not pretend otherwise."}]}]},{"title":"INSIDE THE SYSTEM","minutes":15,"stops":[{"id":"dive-src-volforecast-models","title":"Inside models","kind":"stop","minutes":4,"lede":"A closer read of models. The claims here are checked the same way as everywhere else on this page, and anything marked INFERRED could not be anchored to a line and says so.","blocks":[{"type":"prose","claims":[{"id":"c-201","text":"This package supplies the contestants for the repo's tournaments: the same `vol run` configs that fit a single [[HAR]] baseline can field 13 models and compare them with statistical tests, so every design choice here is built to be raced, not admired.","status":"verified","anchor":{"file":"README.md","start":43,"end":62,"focus":[52],"sha256":"c0500f2f43d30187bd7ebb47768ec435827f90c35c3f847abcf99241b06846f4"}},{"id":"c-202","text":"The signature move: training loss equals evaluation loss, LightGBM's custom objective hands the booster the analytic [[QLIKE]] gradient 1 - exp(y_true - y_pred) and hessian exp(y_true - y_pred) in log-RV space, so trees split on the exact metric the tournament scores.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fmodels\u002flightgbm.py","start":63,"end":85,"focus":[76],"sha256":"3e02953e0e34f65f7f7b49190bdbaf8656f3807a68d879f7c2047b891813240b"}},{"id":"c-203","text":"The objective knows its data: log RV for these assets spans roughly -14 to -4, so the symmetric clip at plus or minus 10 is pure float64 overflow protection, with QLIKE's natural exponential already penalizing under-predicted volatility harder than over-predicted.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fmodels\u002flightgbm.py","start":82,"end":104,"focus":[93],"sha256":"832a200687ccfda874c841fa0b62427095e618b06c5cdc8cba8a440c9d52fa13"}},{"id":"c-204","text":"`xgboost` is the deliberate second opinion: an independent boosting library carrying the identical QLIKE gradient and hessian, so any LightGBM edge that fails to replicate there reads as a library artifact, not signal.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fmodels\u002fxgboost.py","start":49,"end":72,"focus":[59],"sha256":"1ec4c9e642987080ec8f06f16248ace6fcf83cc921c42781314e1d3ffe31fb7e"}},{"id":"c-205","text":"The graph family reframes forecasting across assets instead of across time: each trading date becomes one graph whose nodes are symbols and whose edges come from rolling correlation, and `requires_graph = True` routes these snapshots to the model instead of tabular features.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fmodels\u002fgnn.py","start":191,"end":214,"focus":[200,204],"sha256":"f482749dc34057c7589641d659a74e1a9cc051b1946a34a15d2f3d2d01fbe0ee"}},{"id":"c-206","text":"The torch side makes the same commitment: graph models train on `_qlike_loss`, exp(y - y_hat) - (y - y_hat) - 1 in log-RV space with the same clamp at 10, so no family in the zoo gets to optimize a friendlier loss than the one it is judged on.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fmodels\u002fgnn.py","start":48,"end":52,"focus":[49],"sha256":"77be4281d7821b4e70d7cefab3d7bf53a4b81f47682f80ca2dda714135eb47a9"}},{"id":"c-207","text":"Hyperparameter search respects time the same way the outer evaluation does: Optuna tunes over ExpandingWindowCV walk-forward splits to prevent look-ahead bias, and each worker process is pinned round-robin to its own GPU so 8 devices run all trials in parallel.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fmodels\u002fxgboost.py","start":1132,"end":1155,"focus":[1142],"sha256":"38b41d771e668d8dbc70e2ea350c4322b024daca1c033bce2bfdd300687ce1e4"}},{"id":"c-208","text":"What the zoo does not do is judge itself: a model only emits log-RV predictions under the shared base contract, while fold construction, the Duan retransformation, QLIKE ranking and Diebold-Mariano testing all live outside this package.","status":"inferred"}]},{"type":"excerpt","anchor":{"file":"src\u002fvolforecast\u002fmodels\u002flightgbm.py","start":63,"end":86,"focus":[76,77],"sha256":"1cda7b87952e7b203ee6039ad3ddaa459da51cbb077d45449ffb54e9b0a69b67"},"caption":"The hand-derived QLIKE gradient and hessian LightGBM splits on: training loss equals the tournament's metric."},{"type":"stats","items":[{"v":"9,802","l":"LINES OF CODE"},{"v":"22","l":"FILES"},{"v":"0","l":"FAN-IN","s":"groups that import this one"},{"v":"6","l":"FAN-OUT","s":"groups this one imports"}]}]},{"id":"dive-src-volforecast-cli","title":"Inside cli","kind":"stop","minutes":4,"lede":"What cli actually does, read from its own source. Each sentence carries a claim marker, and the sentences that failed their re-check are in the ledger rather than on this stop.","blocks":[{"type":"prose","claims":[{"id":"c-221","text":"The cli package is the operator surface of the volatility platform: every `vol run --config` invocation takes the [[tournament]] code path, so even a single-model config produces ranked tables and an interactive Plotly dashboard, with `mode: ingest` the only special case.","status":"verified","anchor":{"file":"README.md","start":30,"end":52,"focus":[42],"sha256":"ec9f01d65ff8a28c7c7bf2bdd4dc1440086415686fb67d1f0e9a58cde7908772"}},{"id":"c-222","text":"`vol forecast` is the live end product: a config-driven ensemble trains each configured model on full history, predicts next-day realized volatility, compares it to current ATM implied volatility, and emits a weighted LONG, SHORT, or FLAT call on the [[IV-RV gap]].","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fcli\u002fforecast.py","start":45,"end":67,"focus":[53],"sha256":"f50fc940e7f6973e745b027a2d876039d2d06a3b93f8bbeeea76fea5583572be"}},{"id":"c-223","text":"`vol audit` is the data-quality gate for everything downstream: it checks every cached parquet against its manifest contract, assesses per-layer readiness, and regenerates `data\u002fmanifest.json` while syncing `data\u002fmanifest.yaml`.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fcli\u002faudit.py","start":140,"end":162,"focus":[154],"sha256":"77f572bd9228213603f364dcf82a516b5f3226c3205af314880ac756ae142400"}},{"id":"c-224","text":"The audit deliberately distrusts its own records: the symbol universe is rebuilt each run from the parquets actually on disk merged with `SYMBOL_UNIVERSE`, and the manifest's stale symbol list is ignored.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fcli\u002faudit.py","start":85,"end":94,"focus":[88,90],"sha256":"5bddf9fe74bc3df81ef337c54982616fa09d7f49f17f56baab30d7873d2f029b"}},{"id":"c-225","text":"Data readiness is machine-checkable: the audit exits 0 only when no source has critical issues, returns 1 when any does, and 2 on outright failure, so agents and CI can gate a training run on data health without parsing the Markdown report.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fcli\u002faudit.py","start":769,"end":790,"focus":[778,785],"sha256":"270a4159e7e3de416e51641bf97ff5dc42e6ebe8481eb7f362b12a95ac5baf4a"}},{"id":"c-226","text":"`vol backfill-rk` retrofits the noise-robust estimator: it finds cached dates where the realized kernel is NaN, refetches ticks from the [[Chunk Store]] in five-day batches, recomputes `realized_kernel` from tick log-prices, and updates each symbol's parquet in place.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fcli\u002fbackfill_rk.py","start":37,"end":55,"focus":[44],"sha256":"52af6bd47f4b847610c4219f809e54dcf82848fbfd971a3c7451935a1e60cd86"}},{"id":"c-227","text":"Every audit run also appends a dated data-state summary to `workspace\u002fresearch\u002fresearch-journal.md`, so the research journal that orients each new session records data readiness alongside experiment results.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fcli\u002faudit.py","start":416,"end":439,"focus":[430,431],"sha256":"ce3001c6936930357fe187290a4ad6676c3a3d5a5a918c24a11b9dafc460fea9"}},{"id":"c-228","text":"None of the volatility mathematics lives here: the cli modules orchestrate ingestion, auditing, backfill, and the live signal, but every estimator, model, and statistic they invoke is implemented in `volforecast.data`, `volforecast.models`, and `volforecast.evaluation`.","status":"inferred"}]},{"type":"excerpt","anchor":{"file":"src\u002fvolforecast\u002fcli\u002f__init__.py","start":1,"end":11,"focus":[3],"sha256":"9ab88a8a0bc2896ea295e697c0b5ade3500adc02fd95070695054c5be7ee0b1c"},"caption":"The package docstring: one CLI module per workflow skill."},{"type":"stats","items":[{"v":"7,342","l":"LINES OF CODE"},{"v":"28","l":"FILES"},{"v":"0","l":"FAN-IN","s":"groups that import this one"},{"v":"5","l":"FAN-OUT","s":"groups this one imports"}]}]},{"id":"dive-src-volforecast-features","title":"Inside features","kind":"stop","minutes":4,"lede":"A few minutes inside features. The rules are the same here as on every other stop: a sentence is either anchored to a real line range or marked as unproven on its face.","blocks":[{"type":"prose","claims":[{"id":"c-241","text":"The features package is the design matrix factory: eighteen modules organized as feature layers 0-6 that turn daily realized-variance panels and merged market columns into model inputs, each layer a class registered into `FEATURE_REGISTRY` and stacked by name from config.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002ffeatures\u002f__init__.py","start":1,"end":9,"focus":[1,3],"sha256":"97d518f718893a5dac0ec5ba749811e31268ac03cdede138ed83e517ddfd35ad"}},{"id":"c-242","text":"Layer 2 carries the project's punchline: `OptionsLayer` reads IV columns pre-merged upstream by `IVSurfaceLayer` and derives the forward-looking set, VRP, skew, term slope, and the IV-RV gap the README promises to make tradeable.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002ffeatures\u002foptions.py","start":109,"end":131,"focus":[117,123],"sha256":"f925fedd0258285b7637c942da7e1a4ce09fea5dee8e613cee80f314da7424be"}},{"id":"c-243","text":"`compute_vrp` prices the volatility insurance premium as the Carr and Wu 2009 ex-post proxy, VRP = (atm_iv\u002f100)^2 - rv*252, while the conditional Bollerslev, Tauchen and Zhou variant lives in `build_iv_feature_panel` with a HAR-CJ forecast of future RV.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002ffeatures\u002foptions.py","start":25,"end":47,"focus":[28],"sha256":"7be481a4cceb17b82027e010bb892c39f7d25a6eb68365f91980570ec2331c1c"}},{"id":"c-244","text":"The IV term structure doubles as a regime gauge: `compute_term_slope` returns ATM_3m minus ATM_1m, positive in normal contango markets and negative in backwardation, which is the stress signature.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002ffeatures\u002foptions.py","start":71,"end":89,"focus":[74,75],"sha256":"a832ea782a8ca60e8a992290b6017edfc529208a645d09d264671bdb478a068f"}},{"id":"c-245","text":"Layer 3 never touches a live feed: `MicrostructureLayer` loads per-symbol daily aggregates and intraday bar sequences from cache, requires a symbol in its context, and emits order-flow features like the log signed volume ratio at daily and 5 day horizons.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002ffeatures\u002fmicrostructure.py","start":346,"end":368,"focus":[357,358],"sha256":"a20f9ff3e66c68f178c2963ca8dbec8c1af21ceb6db1a1a295e7c002cc553dca"}},{"id":"c-246","text":"Price impact is measured the textbook way: Kyle's lambda is the OLS slope of per-bar price changes on signed net flow, Cov(dP, Q) \u002f Var(Q), and a higher lambda means each unit of signed volume moves price more, which reads as informed trading or thin liquidity.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002ffeatures\u002fmicrostructure.py","start":33,"end":55,"focus":[44,46],"sha256":"dcc583d9fc0b3a986c7798085d1d79ad29b0e89c6e91f76be50b110ae0524056"}},{"id":"c-247","text":"Calendar is the one layer allowed to see its own day, FOMC, NFP, and OpEx timing is known in advance, and its event math is auditable: a meeting day scores `days_to_fomc` of 0, distances count business days, and dates beyond the hardcoded 2026 list fall back to 30, not NaN.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002ffeatures\u002fcalendar.py","start":235,"end":258,"focus":[245,249],"sha256":"9c7d18a621429f1905dfb9c9ed80de134ec3c4521ae85646b55bb073078e5200"}},{"id":"c-248","text":"What the package does not do is fit anything: no layer trains a model, scores QLIKE, or fetches raw data, the layers only assemble columns from caches the data stage wrote, and a missing cache degrades a layer to empty or NaN output rather than failing the run.","status":"inferred"}]},{"type":"excerpt","anchor":{"file":"src\u002fvolforecast\u002ffeatures\u002foptions.py","start":25,"end":47,"focus":[28,47],"sha256":"7be481a4cceb17b82027e010bb892c39f7d25a6eb68365f91980570ec2331c1c"},"caption":"The flagship options feature: implied variance minus annualized realized variance, the Carr and Wu ex-post VRP proxy."},{"type":"stats","items":[{"v":"3,110","l":"LINES OF CODE"},{"v":"18","l":"FILES"},{"v":"0","l":"FAN-IN","s":"groups that import this one"},{"v":"3","l":"FAN-OUT","s":"groups this one imports"}]}]},{"id":"dive-src-volforecast-data","title":"Inside data","kind":"stop","minutes":4,"lede":"The shape of data, up close. Nothing below asks to be taken on trust; every claim marker opens the evidence behind its sentence, or says plainly that there is none.","blocks":[{"type":"prose","claims":[{"id":"c-261","text":"The data layer starts at Chunk Store, Goldman's tick service: `chunk_store.py` fetches L1 trade and quote ticks for all 34 symbols plus L2 order book depth for the E-mini S&P 500, the raw material for realized volatility at 5 minute, 1 minute, or tick-by-tick frequency.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fdata\u002fchunk_store.py","start":411,"end":434,"focus":[427],"sha256":"30786ff2589b211d5d057e75d0fbb8ebf18759dd8c08657e33656ae77c8d7d2e"}},{"id":"c-262","text":"`rv_panel.py` turns those ticks into the project's target, one realized variance number per symbol per day, running as a streaming batch pipeline, fetch then compute then checkpoint then release, so peak memory never exceeds one sub-batch of tick data.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fdata\u002frv_panel.py","start":36,"end":56,"focus":[48],"sha256":"6821a376a62fc2956905d898cac603d8bb7f880e348091d035e70f78ab7ff342"}},{"id":"c-263","text":"`micro.py` adds the order-flow view: ticks become 10 second bars server-side, client-side BVC then classifies each bar buy or sell by the tick rule, and the bars feed daily aggregates (VPIN, order flow imbalance) plus per-bar sequences for the LSTM and TCN models.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fdata\u002fmicro.py","start":49,"end":71,"focus":[61],"sha256":"7a5fbf220e5dbdcb3d55d80944e5d66f75a80fd3a1213324f45d3c2157fe261d"}},{"id":"c-264","text":"VPIN follows Easley, Lopez de Prado and O'Hara 2012, Eq. 1: buy and sell volume is sliced into equal-volume buckets and the day's informed-trading probability is the mean absolute buy-sell imbalance across them.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fdata\u002fmicro.py","start":316,"end":338,"focus":[331],"sha256":"618b3c167517b4f1bf14a259f9b1d63b0b2a2777abe3712433311e2b4e6f51c2"}},{"id":"c-265","text":"A newcomer would not guess the fetch layer knows futures conventions: to pull E-mini depth it resolves each date to the correct front-month contract, rolling to the next quarterly expiry on the Thursday before the third Friday of the expiry month.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fdata\u002fchunk_store.py","start":137,"end":160,"focus":[149,150],"sha256":"d97751546ae7be59033cc3725fafca25813fbd2277e8fb64355b8beb70f2b117"}},{"id":"c-266","text":"Ingestion is crash-safe by construction: each fetched batch lands in a staging directory, and consolidation merges staging chunks with the existing sequences parquet, deduplicates, and writes the final file before staging is removed, so reruns resume instead of restarting.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fdata\u002fmicro.py","start":1001,"end":1023,"focus":[1011,1012],"sha256":"7a37d299e47119605f6c32bc80c2df9de6cb1e9cc2fba96d6bd8b79ca641265a"}},{"id":"c-267","text":"You can audit completeness from the cache itself: `detect_gaps` compares the requested date range against the sequences parquet and returns exactly which trading days are missing, so a partial ingest is visible rather than silent.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fdata\u002fmicro.py","start":904,"end":921,"focus":[911],"sha256":"1d1e0e0a344c62aa9f6b33c7171ea34069cfc4ece2b7a9539322ffaee3589cc7"}},{"id":"c-268","text":"What this layer does not do is model anything: it stops at cached parquet panels and bar sequences, and away from Goldman's network, where pytickclient and TSDB are unreachable, it can only serve dates the caches under data\u002fraw\u002f already hold.","status":"inferred"}]},{"type":"excerpt","anchor":{"file":"src\u002fvolforecast\u002fdata\u002fchunk_store.py","start":411,"end":434,"focus":[417],"sha256":"30786ff2589b211d5d057e75d0fbb8ebf18759dd8c08657e33656ae77c8d7d2e"},"caption":"Ticks arrive in batched chunk queries: contiguous day runs, one API call per batch."},{"type":"stats","items":[{"v":"9,195","l":"LINES OF CODE"},{"v":"21","l":"FILES"},{"v":"3","l":"FAN-IN","s":"groups that import this one"},{"v":"2","l":"FAN-OUT","s":"groups this one imports"}]}]},{"id":"dive-src-volforecast-evaluation","title":"Inside evaluation","kind":"stop","minutes":4,"lede":"A closer read of evaluation. The claims here are checked the same way as everywhere else on this page, and anything marked INFERRED could not be anchored to a line and says so.","blocks":[{"type":"prose","claims":[{"id":"c-281","text":"Every horizon is judged against implied vol of matching maturity: one day ahead uses the prev close 1 DTE varswap fair vol captured with no lookahead, weekly horizons the 1 week ATM tenor, monthly the 1 month, so the IV-RV gap always compares like with like.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fevaluation\u002feconomic_value.py","start":28,"end":44,"focus":[32],"sha256":"0b39dcd8df18afad7c6353323843c60c537042cf29f0272c9a3a51b4f6c99d4e"}},{"id":"c-282","text":"The units here have already survived one real bug: Kvar and the RV forecast are both annualized, an earlier sqrt(h) deflation artificially suppressed the implied side of the gap beyond one day, and the fix is documented as a deliberate no-op.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fevaluation\u002feconomic_value.py","start":47,"end":60,"focus":[54],"sha256":"bd928b7604b17ec9a61f4c4f877f4e286fde87d0b1bb831c96bd99890bdcdc1f"}},{"id":"c-283","text":"The GSVIVS signal ships four sizing variants as one dashboard toggle, `binary`, `asym_long`, `zscore`, and `long_flat`, each a frozen spec, so every variant a reader meets in a results table is reproducible from config.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fevaluation\u002feconomic_value.py","start":188,"end":211,"focus":[202],"sha256":"0c5c3b60451be62cde33b6fa9422ffdda4b9e58bfc774e3567c4b09b77afb78e"}},{"id":"c-284","text":"Model comparison is panel aware: the Diebold-Mariano test averages loss differentials per date before its Newey-West variance, so serial correlation lags never cross symbol boundaries in a pooled multi-symbol panel.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fevaluation\u002fstatistical_tests.py","start":46,"end":61,"focus":[58],"sha256":"49b2c034d56ae06860d094179b62851a10ae6598370abca1bdf8df23256b0527"}},{"id":"c-285","text":"Every run ends in a tournament: all models score against a named baseline, `har` by default, and a [[Model Confidence Set]] bootstrapped 10,000 times says which models are statistically indistinguishable from the best.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fevaluation\u002fstatistical_tests.py","start":460,"end":482,"focus":[471,474],"sha256":"a5437070fa7a60b02ac1707d6a887980c9920e4b9306411c7e8732de85470055"}},{"id":"c-286","text":"Costs are honest: option spreads follow the Doshi et al. 2025 schedule, 4.5 times base inside 6 remaining trading days and 1.75 times inside 13, which is exactly why the realistic backtest rolls positions before expiry.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fevaluation\u002frealistic_straddle.py","start":48,"end":68,"focus":[64],"sha256":"5fc27692222f882323d69c216be143d8fe3b200fddceeed2a1a3bbd40e4da762"}},{"id":"c-287","text":"Discrete hedging risk is priced rather than ignored: a Boyle-Emanuel 1980 variance term for 26 rebalances a day inflates the Sharpe denominator, so a strategy cannot look sharp by pretending it hedges continuously.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fevaluation\u002frealistic_straddle.py","start":240,"end":263,"focus":[255],"sha256":"3e55839cacdc613708654becfb7de517c8eb1992dec15a0863347236f1933876"}},{"id":"c-288","text":"What this package does not do is trade: every number is a backtest over cached data, and its most actionable output is a Sharpe ratio with honest error bars, not an order.","status":"inferred"}]},{"type":"excerpt","anchor":{"file":"src\u002fvolforecast\u002fevaluation\u002fstatistical_tests.py","start":26,"end":49,"focus":[35,42],"sha256":"2cb93a3664f68df612b22a8d02e104bd30744a5d403f423d0027a3040059729f"},"caption":"Every pairwise comparison in the tournament runs through this test, panel-aware and HAC-corrected."},{"type":"stats","items":[{"v":"7,031","l":"LINES OF CODE"},{"v":"14","l":"FILES"},{"v":"4","l":"FAN-IN","s":"groups that import this one"},{"v":"1","l":"FAN-OUT","s":"groups this one imports"}]}]}]},{"title":"FOLLOW ONE PATH","minutes":25,"stops":[{"id":"trace","title":"One path, end to end","kind":"stop","minutes":12,"lede":"8 hops, each one a real line range in this repo, from the entry point to where the work actually happens. This is the path to hold in your head.","blocks":[{"type":"trace","steps":[{"claim":"The vol shell wrapper is the front door: its ingest-ohlcv case forwards every argument unchanged to python -m volforecast ingest-ohlcv, deciding nothing itself beyond the nix library path the Python process needs.","next":"main in src\u002fvolforecast\u002f__main__.py","predict":"This hop ends in vol. Which file does the path reach next?","anchor":{"file":"vol","start":302,"end":324,"focus":[313,314],"sha256":"e8882aba791359cc3269def61a70ca0169107a1d3a7d30247e5beb05003a70a5"}},{"claim":"Inside Python the module entry lands in main, which builds the full command tree once, lets argparse decide that ingest-ohlcv was the command asked for, and simply prints help and exits cleanly when no subcommand is given.","next":"_build_parser in src\u002fvolforecast\u002f__main__.py","anchor":{"file":"src\u002fvolforecast\u002f__main__.py","start":801,"end":823,"focus":[809,810],"sha256":"7259892a58c561cf9835cfbd472cddb7386638dc27edb6d4ba231549832f7c40"}},{"claim":"_build_parser does not define the subcommand itself, it imports the ingest_ohlcv module's register function and hands it the subparsers object, the lazy registration pattern all of the roughly two dozen utility commands follow.","next":"register in src\u002fvolforecast\u002fcli\u002fingest_ohlcv.py","predict":"This hop ends in __main__.py. Which file does the path reach next?","anchor":{"file":"src\u002fvolforecast\u002f__main__.py","start":181,"end":204,"focus":[193,195],"sha256":"88e46d14a4b018e7fbb9a5515e9e452d28b200e68d0c258e3ada3ff0cacc5a6f"}},{"claim":"register declares what the command means in data terms, fetching split-adjusted daily OHLCV from the TSDB eqpad_ namespace, with a start date defaulting to 2015-01-02, an end date defaulting to yesterday, a symbol filter, and a force flag to bypass the cache.","next":"handle in src\u002fvolforecast\u002fcli\u002fingest_ohlcv.py","anchor":{"file":"src\u002fvolforecast\u002fcli\u002fingest_ohlcv.py","start":101,"end":123,"focus":[108,112,113],"sha256":"06ecfc53fadaef9bc81b36dafcdda7562af18ac3ae184da100fd7cb0fe8507e3"}},{"claim":"set_defaults binds handle as this subcommand's callable, and handle converts the parsed strings into real date objects, filling in yesterday when no end date was given, before delegating the actual work to run.","next":"run in src\u002fvolforecast\u002fcli\u002fingest_ohlcv.py","anchor":{"file":"src\u002fvolforecast\u002fcli\u002fingest_ohlcv.py","start":127,"end":143,"focus":[133,136,143],"sha256":"249c5d1b3ee3c88a7f178eddacf2a0a057c5f688a35d40b08986b46ada8b3bba"}},{"claim":"run is the ingestion pipeline proper: for each symbol it skips anything the parquet cache already covers, fetches split-adjusted daily prices from TSDB otherwise, and hands every non-empty frame to save_ohlcv_cache while recording the ingestion in the data manifest.","next":"save_ohlcv_cache in src\u002fvolforecast\u002fdata\u002fohlcv.py","predict":"This hop ends in ingest_ohlcv.py. Which file does the path reach next?","anchor":{"file":"src\u002fvolforecast\u002fcli\u002fingest_ohlcv.py","start":68,"end":91,"focus":[77,82],"sha256":"e46a6ec5fb2466c9c1b0333e141b7ab3285dc8d3d0373befb4787f7d669261f0"}},{"claim":"Each fetched frame lands in save_ohlcv_cache, which merges new rows over any existing history and writes the parquet through a temporary file swapped in with os.replace, so a crash mid-write can never leave a half-written cache on disk.","next":"ohlcv_cache_path in src\u002fvolforecast\u002futils\u002fpaths.py","predict":"This hop ends in ohlcv.py. Which file does the path reach next?","anchor":{"file":"src\u002fvolforecast\u002fdata\u002fohlcv.py","start":175,"end":198,"focus":[184,185,193],"sha256":"6546c47a10098ad6a6467005cf8f775317ecc54a3a2e121a9bb277e928030b85"}},{"claim":"The destination is decided by ohlcv_cache_path: one parquet per symbol under data\u002fraw\u002fohlcv\u002f, resolved from the repo root by marker files so the cache lands in the same place no matter which directory the command was launched from.","next":null,"anchor":{"file":"src\u002fvolforecast\u002futils\u002fpaths.py","start":76,"end":98,"focus":[88,90],"sha256":"2b2a6a65f942c2201998f4db4760a05a5568170ce83c5cb3f22ff20595968974"}}]},{"type":"callout","level":"inferred","title":"WHAT THIS TRACE DOES NOT PROVE","text":"The hops above are a static read of the source: each anchor was re-read and hash-matched, but nothing was executed along this path during generation. The deterministic stage also found 14 imported modules with no file on disk (volforecast.config, volforecast.data.edrvol), so parts of this path cannot run as written."}]},{"id":"cp-c","title":"Checkpoint C","kind":"cp","minutes":4,"blocks":[{"kind":"order","prompt":"Order these packages from the one that imports the most to the one the rest of the repo depends on the most.","options":["\u003ccode>evaluation\u003c\u002fcode> · 7,031 loc, 14 files","\u003ccode>data\u003c\u002fcode> · 9,195 loc, 21 files","\u003ccode>models\u003c\u002fcode> · 9,802 loc, 22 files","\u003ccode>utils\u003c\u002fcode> · 1,552 loc, 7 files"],"answer":[3,2,1,4],"provenance":"map.json → node column index: columns are ordered by (fan-in − fan-out) over the import DAG, one option per column, largest node in each; options shuffled deterministically by the commit seed, so a regenerated page asks the same question the same way.","explanation":"models sits in the leftmost column: it imports more than it is imported by. utils sits in the rightmost: everything points at it and it points at nothing. That left-to-right order is the dependency order, which is why the map is laid out that way rather than alphabetically.","type":"checkpoint","id":"cp-c1"},{"kind":"single","prompt":"The trace starts in vol and crosses 5 files. Which one does the chain end in?","options":["\u003ccode>src\u002fvolforecast\u002f__main__.py\u003c\u002fcode>","\u003ccode>src\u002fvolforecast\u002fcli\u002fingest_ohlcv.py\u003c\u002fcode>","\u003ccode>src\u002fvolforecast\u002futils\u002fpaths.py\u003c\u002fcode>","\u003ccode>src\u002fvolforecast\u002fdata\u002fohlcv.py\u003c\u002fcode>"],"answer":2,"provenance":"trace hops → hop 8 of 8, its file = src\u002fvolforecast\u002futils\u002fpaths.py; every hop is anchored to a line range and sha256-verified in the ledger; options shuffled deterministically by the commit seed, so a regenerated page asks the same question the same way.","explanation":"The chain ends in src\u002fvolforecast\u002futils\u002fpaths.py. The other three options are real hops in the same trace, earlier in the chain: each is where the chain would appear to end if you stopped following it one call too soon.","type":"checkpoint","id":"cp-c2"}]}]},{"title":"CONVENTIONS","minutes":8,"stops":[{"id":"conv","title":"Conventions and gotchas","kind":"stop","minutes":8,"lede":"Everything on this page is inferred from patterns in the code. None of it is verified against a written standard, because this repo does not have one. Treat it as a strong hint, not a rule.","blocks":[{"type":"callout","level":"inferred","title":"THIS ENTIRE STOP IS UNVERIFIED","text":"Nothing below could be anchored to a line. It is a read of the codebase, quarantined here and marked once rather than mixed into the verified material and diluting it."},{"type":"prose","claims":[{"id":"c-101","text":"Modules are laid out as the forecasting pipeline reads: volforecast.data ingests, features transforms, models fits, evaluation scores and cli drives, with the shared volforecast.utils at the highest fan-in in the repo, so imports flow the same direction the data does.","status":"inferred"},{"id":"c-102","text":"Errors are contained where they happen: Optuna workers catch exceptions so one failed trial cannot kill a tuning study, ingestion writes parquet atomically via a staging directory and merges rather than overwrites, and the audit command signals problems with a non-zero exit code.","status":"inferred"},{"id":"c-103","text":"Mathematics is defended twice, in docstrings that write out the QLIKE gradient and hessian and cite Easley, Lopez de Prado and O'Hara for VPIN, and in a 45,000 line unit suite that checks those formulas against numerical differentiation on seeded synthetic data.","status":"inferred"},{"id":"c-104","text":"The habit the authors clearly cared most about is look-ahead hygiene: hyperparameter tuning uses expanding window walk-forward CV, holdout splits carry explicit purge gaps, and Optuna study names hash the model config so trials from a stale setup are never silently reused.","status":"inferred"}]}]}]},{"title":"CLOSE","minutes":6,"stops":[{"id":"gloss","title":"The glossary","kind":"stop","minutes":2,"lede":"Every dotted term on this page, in one table. The definitions travel with the page and open in place when you click a term.","blocks":[{"type":"table","caption":"Click any dotted term in the prose to open the same definition in place.","sortable":true,"columns":["TERM","DEFINITION"],"rows":[["\u003cb>realized variance (RV)\u003c\u002fb>","The sum of squared intraday returns over one trading day, computed from 5 minute returns with no mean subtraction. It is the quantity every model in this repo forecasts."],["\u003cb>QLIKE\u003c\u002fb>","The quasi-likelihood loss for variance forecasts, exp(e) - e - 1 on the log-space error e. It is exactly zero for a perfect forecast and punishes under-predicting volatility more than over-predicting it, which is why the tournament ranks models by it."],["\u003cb>HAR\u003c\u002fb>","The heterogeneous autoregressive baseline: regress tomorrow&#x27;s log RV on the daily value `log_rv_d`, the 5 day mean `log_rv_w`, and the 22 day mean `log_rv_m`. Three coefficients, brutally hard to beat, and the benchmark every ML model in the tournament is scored against."],["\u003cb>realized kernel (RK)\u003c\u002fb>","A microstructure-noise-robust variance estimator that weights return autocovariances with a flat-top Parzen kernel. On clean prices it agrees with 5 minute RV; on noisy tick data it recovers true variance where naive tick-by-tick RV is inflated."],["\u003cb>Chunk Store\u003c\u002fb>","The GS internal tick store, reached through `pytickclient`. It supplies the L1 trades and quotes (and L2 depth for the E-mini) that every realized measure is computed from; tests mock its query layer because it is unreachable outside the GS network."],["\u003cb>tournament\u003c\u002fb>","The evaluation mode where every candidate model, 13 in the full config, is trained and scored on identical folds, ranked by QLIKE, and compared with statistical tests. Every `vol run --config` invocation uses this code path, even for a single model."],["\u003cb>purge gap\u003c\u002fb>","A buffer of observations deleted between CV training and test blocks so overlapping RV windows cannot leak across the boundary. The pipeline enforces an effective purge of at least the forecast horizon h on every fold."],["\u003cb>Duan correction\u003c\u002fb>","The retransformation applied when log-space forecasts are converted back to variance levels: plain exponentiation is biased low, so predictions are scaled by the mean of exponentiated residuals. The Pipeline applies it per fold, from that fold&#x27;s training residuals only."],["\u003cb>IV-RV gap\u003c\u002fb>","The spread between options-implied volatility and forecast realized volatility. Implied usually sits above subsequent realized (the variance risk premium), and turning QLIKE improvements into a tradeable read on this gap is the project&#x27;s stated goal."],["\u003cb>variance risk premium\u003c\u002fb>","Option-implied variance minus subsequently realized variance. Usually positive: investors pay a premium for volatility protection, and the project computes it as squared ATM implied vol minus annualized realized variance."],["\u003cb>VPIN\u003c\u002fb>","Volume-Synchronized Probability of Informed Trading: the mean absolute buy-sell volume imbalance across equal-volume buckets, a daily order-flow toxicity measure from the microstructure layer."],["\u003cb>implied volatility\u003c\u002fb>","The volatility the options market prices in. The project compares it with the forecast of realized volatility: when implied looks rich against the forecast, the strategies sell vol, and when cheap they buy."],["\u003cb>Model Confidence Set\u003c\u002fb>","The Hansen et al. 2011 procedure returning the set of models statistically indistinguishable from the best at a chosen confidence level, via sequential bootstrap elimination. Membership, not rank, is the honest headline."],["\u003cb>DSR\u003c\u002fb>","Deflated Sharpe Ratio: the probability that an observed Sharpe beats the maximum expected by chance given how many strategy configurations were tried, correcting backtest results for selection luck."]]}]},{"id":"audit","title":"The ledger","kind":"stop","minutes":6,"lede":"What the tool claimed, what survived, and what it deleted. The deleted rows are the interesting ones.","blocks":[{"type":"callout","level":"info","title":"WHY THIS PAGE EXISTS","text":"Anyone can generate confident documentation. The only useful question is which parts to trust. The claims below were wri /* ============================================================
   RENDER: knows only the block types below. Every number it shows
   comes off the payload; nothing here invents content. A generated
   artifact carries exactly one payload in BUNDLES; the demo bundle
   may carry more, behind the repo selector.
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* claim / lede text supports two inline forms after escaping:
   `code`  ->  <code>code</code>
   [[term]] or [[id|label]]  ->  glossary term button */
const GLO={};
function rich(s){
  let h=esc(s);
  h=h.replace(/`([^`]+)`/g,(m,c)=>`<code>${c}</code>`);
  h=h.replace(/\[\[([a-z0-9-]+)\|([^\]]+)\]\]/g,(m,id,lab)=>
    GLO[id]?`<span class="gterm" role="button" tabindex="0" data-g="${id}">${lab}</span>`:lab);
  h=h.replace(/\[\[([^\]|]+)\]\]/g,(m,lab)=>{
    const id=lab.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    return GLO[id]?`<span class="gterm" role="button" tabindex="0" data-g="${id}">${lab}</span>`:lab;
  });
  return h;
}
let D=null, KEY, STOPS, S;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* switching repo is a full reload of the walkthrough: new payload, new
   outline, new progress key. A generated artifact has one entry and the
   selector stays hidden. */
function loadRepo(name){
  D=BUNDLES[name]||BUNDLES[Object.keys(BUNDLES)[0]];
  Object.keys(GLO).forEach(k=>delete GLO[k]);
  /* index each entry under its id, then under its full-term slug as a
     fallback alias: the id strips a trailing parenthetical ("realized
     variance (RV)" -> realized-variance), so a bare [[realized variance (RV)]]
     marker still finds its entry. Ids always win over aliases. */
  (D.glossary||[]).forEach(g=>{
    const a=String(g.term||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    if(a&&!GLO[a])GLO[a]=g;
  });
  (D.glossary||[]).forEach(g=>GLO[g.id]=g);
  KEY="trailhead:"+D.repo.name+":"+D.repo.commit;
  STOPS=D.tracks.flatMap((t,ti)=>t.stops.map(s=>({...s,ti,track:t.title})));
  S={cur:0,done:{},ans:{},pred:{},conf:{}};
  try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
  S.pred=S.pred||{}; S.conf=S.conf||{};
  try{localStorage.setItem("trailhead:repo",D.repo.name)}catch(e){}
  shell();
}

function boot(){
  let want=null;
  try{want=localStorage.getItem("trailhead:repo")}catch(e){}
  loadRepo(want&&BUNDLES[want]?want:Object.keys(BUNDLES)[0]);
  const h=location.hash.replace("#","");
  const i=STOPS.findIndex(s=>s.id===h);
  draw(i>=0?i:S.cur||0);
}

function shell(){
  const r=D.repo||{}, p=D.report||{}, names=Object.keys(BUNDLES);
  document.title="Trailhead · "+r.name;
  $("#rname").textContent=r.name;
  $("#rmeta").textContent=[r.commit,
    "generated "+(r.generated_at||"").replace("T"," ").replace("Z"," UTC"),
    "trailhead "+p.tool_version].join(" · ");
  const sel=$("#rsel");
  sel.hidden=names.length<2;
  sel.innerHTML=names.map(n=>`<option value="${esc(n)}"${n===r.name?" selected":""}>${esc(n)}</option>`).join("");
  const lo=p.claims>0&&p.dropped/p.claims>0.40;
  $("#badge").innerHTML=
     `<span><i class="n">${p.claims}</i> claims</span>`
    +`<span class="d">${p.dropped} dropped</span>`
    +`<span><i class="n">${p.commands}</i> cmds</span>`
    +`<span class="f">${p.failed} failing</span>`
    +(lo?`<span class="lo">low confidence · ${Math.round(100*p.dropped/p.claims)}% dropped</span>`:"");
  $("#badge").classList.toggle("lowconf",lo);
}

/* ---- predict-then-reveal ---- */
function predict(id,question,options,key,prov){
  const a=S.pred[id];
  const opts=options.map((o,i)=>{
    let cls="popt";
    if(a){ if(i===key)cls+=" right"; else if(a.pick===i)cls+=" wrong"; }
    return `<div class="${cls}" ${a?"":`data-pi="${i}"`} ${a?"":'tabindex="0" role="button"'}>
      <span class="i">${a?(i===key?"✓":(a.pick===i?"✕":String.fromCharCode(65+i))):String.fromCharCode(65+i)}</span><span>${o}</span></div>`;
  }).join("");
  return `<div class="pred${a?(a.ok?" done ok":" done no"):""}" data-pred="${esc(id)}" data-key="${key}">
    <div class="q"><b>PREDICT</b>${esc(question)}</div>
    <div class="popts">${opts}</div>
    ${a?`<div class="pfoot"><span class="verdict ${a.ok?"y":"n"}">${a.ok?"CORRECT":"NOT QUITE"}</span>
         <span class="prov"><b>ANSWER KEY</b> ${esc(prov)}</span></div>`:""}
  </div>`;
}

/* ---- excerpt ---- */
function excerpt(a,cap){
  const f=D.files[a.file]||{}, focus=new Set(a.focus||[]);
  let rows="",prev=null;
  for(let n=a.start;n<=a.end;n++){
    if(!(n in f)){ if(prev!==null){rows+=`<tr class="el"><td colspan="2">… elided</td></tr>`;prev=null;} continue; }
    rows+=`<tr class="${focus.has(n)?"hl":""}"><td class="ln">${n}</td><td class="src">${esc(f[n])}</td></tr>`;
    prev=n;
  }
  const raw=Object.keys(f).filter(n=>+n>=a.start&&+n<=a.end).map(n=>f[n]).join("\n");
  return `<figure class="ex">
    <header><b>${esc(a.file)}</b><span>: ${a.start}-${a.end}</span><span class="sp"></span>
      ${a.sha256?`<span class="sha" title="sha256 over these source lines, recomputed by the verifier">#${a.sha256.slice(0,10)}</span>`:""}
      <button class="cp-btn" data-copy="${esc(raw).replace(/"/g,"&quot;")}">COPY</button></header>
    <div class="code"><table>${rows}</table></div>
    ${cap?`<figcaption>${cap}</figcaption>`:""}
  </figure>`;
}

const openPred=b=>b.type==="command"&&b.predict&&!S.pred["pc:"+b.cmd];
function veil(blocks){
  const cut=blocks.findIndex(openPred);
  const html=blocks.map((b,i)=>
    (cut>=0&&i>cut)?`<div class="veil">${B[b.type](b)}</div>`:B[b.type](b)).join("");
  return html+((cut>=0&&cut<blocks.length-1)
    ?`<div class="veilnote">The rest of this stop stays hidden until you answer the prediction above.</div>`:"");
}

/* ---- blocks ---- */
const B={
 prose:b=>`<div class="prose">${b.claims.map(c=>
   c.status==="inferred"
    ? `<p><span class="claim inf">${rich(c.text)}</span><span class="tag">INFERRED</span></p>`
    : `<p><span class="claim" role="button" tabindex="0" aria-expanded="false" data-claim="${c.id}">${rich(c.text)}</span><button class="mark" tabindex="-1" data-claim="${c.id}">${c.id.slice(-3)}</button></p>
       <div class="pop" data-pop="${c.id}" hidden>${excerpt(c.anchor,"Anchor for claim "+c.id+": re-read and hash-matched at build time.")}</div>`
  ).join("")}</div>`,

 excerpt:b=>excerpt(b.anchor,b.caption),

 command:b=>{
   const pid="pc:"+b.cmd, a=b.predict?S.pred[pid]:1, shut=b.predict&&!S.pred[pid];
   return `<div class="cmd ${b.exit&&!shut?"fail":""}">
   <header><span class="pr">$</span><code>${esc(b.cmd)}</code>
     ${shut?`<span class="pill wait">RESULT HIDDEN</span>`:""}
     <span class="res${shut?" veil":""}"><span class="pill ${b.exit?"bad":"ok"}">exit ${b.exit}</span><span class="dur">${b.dur}</span></span></header>
   ${b.predict?predict(pid,b.predict,["It passes (exit 0)","It fails (non-zero exit)"],b.exit?1:0,
       "the exit code captured by the command runner: "+esc(b.env)):""}
   <div class="${shut?"veil":""}">${b.broken?`<div class="brk"><b>BROKEN</b><div>${esc(b.broken)}
     ${b.hypothesis?`<div style="margin-top:8px;font-size:12.5px;color:var(--dim)"><span class="tag" style="margin:0 6px 0 0;vertical-align:0">INFERRED</span>${esc(b.hypothesis)}</div>`:""}</div></div>`:""}
   <details class="out"><summary>output (${b.out.split("\n").length} lines)</summary><pre>${esc(b.out)}</pre></details>
   <div class="envnote">${esc(b.env)}</div></div></div>`;
 },

 callout:b=>`<div class="call ${b.level}"><b>${esc(b.title)}</b>${rich(b.text)}</div>`,

 stats:b=>`<div class="stats">${b.items.map(x=>`<div class="stat">
   <div class="v"${x.color?` style="color:var(--${x.color})"`:""}>${x.v}${x.of?`<span class="of"> / ${x.of}</span>`:""}</div>
   <div class="l">${esc(x.l)}</div>${x.s?`<div class="s">${esc(x.s)}</div>`:""}</div>`).join("")}</div>`,

 table:b=>`<div class="tbl"><table>
   <thead><tr>${b.columns.map((c,i)=>`<th ${b.sortable?`data-sort="${i}"`:""}>${c}</th>`).join("")}</tr></thead>
   <tbody>${b.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${/^[\d,.]+( |&nbsp;)?[a-z%]*$|^n\/a$/.test(String(c).replace(/<[^>]+>/g,""))&&i>0?"r":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
   </table></div>${b.caption?`<div class="envnote" style="border:1px solid var(--rule2);border-top:0">${esc(b.caption)}</div>`:""}`,

 graph:()=>graph(),

 trace:b=>{
   const files=[...new Set(b.steps.map(s=>s.anchor.file))].sort();
   const cut=b.steps.findIndex((s,i)=>s.predict&&b.steps[i+1]&&!S.pred["pt:"+s.anchor.file]);
   return `<div class="trace">${b.steps.map((s,i)=>{
     const nx=b.steps[i+1]&&b.steps[i+1].anchor.file;
     const ask=s.predict&&nx, pid="pt:"+s.anchor.file, done=!ask||S.pred[pid];
     return `<div class="hop${cut>=0&&i>cut?" veil":""}">
   <div class="dot">${i+1}</div>
   <h4>${esc(s.anchor.file.split("/").pop())}</h4>
   <div class="an">${esc(s.anchor.file)} : ${s.anchor.start}-${s.anchor.end}</div>
   <div class="prose" style="margin-bottom:10px"><span class="claim inf" style="border-bottom:0;cursor:default">${rich(s.claim)}</span></div>
   ${excerpt(s.anchor,"")}
   ${ask?predict(pid,s.predict,files.map(f=>"<code>"+f+"</code>"),files.indexOf(nx),
       "the next hop's resolved anchor: "+esc(nx)):""}
   <div class="${done?"":"veil"}">${s.next?`<div class="nx">next → <b>${esc(s.next)}</b></div>`:`<div class="nx">the chain ends here</div>`}</div>
 </div>`;}).join("")}</div>`;
 },

 checkpoint:b=>{
  const a=S.ans[b.id], k=S.conf[b.id];
  const gate=!a&&!k;
  const conf=(!a&&!k)
    ? `<div class="conf"><span>Before you answer, how sure are you?</span>
        <button class="cbtn" data-conf="${b.id}" data-c="sure">I'M SURE</button>
        <button class="cbtn" data-conf="${b.id}" data-c="guess">I'M GUESSING</button></div>`
    : (k?`<div class="conf said"><span>You said you were <b>${k==="sure"?"sure":"guessing"}</b>.</span></div>`:"");
  if(b.kind==="order"){
    const opts=b.options.map((o,i)=>`<div class="ordr"><select data-ord="${b.id}" data-i="${i}" ${a||gate?"disabled":""} aria-label="Position of option ${i+1}">
        <option value="">-</option>${b.options.map((_,k2)=>`<option value="${k2+1}" ${a&&a.pick[i]===k2+1?"selected":""}>${k2+1}</option>`).join("")}
      </select><span>${o}</span>${a?(a.pick[i]===b.answer[i]?`<span class="verdict y" style="margin-left:auto">✓</span>`:`<span class="verdict n" style="margin-left:auto">✕ ${b.answer[i]}</span>`):""}</div>`).join("");
    return `<div class="cpx" data-cp="${b.id}"><div class="k">CHECKPOINT · ORDER</div><h4>${esc(b.prompt)}</h4>
      ${conf}${opts}
      ${a?verdict(b,a):`<div class="act"><button class="sub" data-go-cp="${b.id}" ${gate?"disabled":""}>CHECK</button></div>`}</div>`;
  }
  const opts=b.options.map((o,i)=>{
    let cls="opt"; if(a){ if(i===b.answer)cls+=" right"; else if(a.pick===i)cls+=" wrong"; }
    if(gate)cls+=" gated";
    return `<div class="${cls}" ${gate||a?"":`data-pick="${b.id}" data-i="${i}" tabindex="0" role="button"`}>
      <span class="i">${a?(i===b.answer?"✓":(a.pick===i?"✕":String.fromCharCode(65+i))):String.fromCharCode(65+i)}</span><span>${o}</span></div>`;
  }).join("");
  return `<div class="cpx" data-cp="${b.id}"><div class="k">CHECKPOINT · SINGLE ANSWER</div>
    <h4>${esc(b.prompt)}</h4>${conf}${opts}${a?verdict(b,a):""}</div>`;
 },

 ledger:()=>ledgerTable(),

 /* Lineage: values move left to right through fixed stages. Status is a word
    first and a colour second. An anchored stage is a button that opens the
    evidence; an unanchored one is inert, because a button that opened an
    empty panel would be a lie about what evidence exists. */
 lineage:b=>{
   const ents=b.entities||[];
   const steps=ents.flatMap(e=>e.steps||[]);
   const n=s=>steps.filter(x=>x.status===s).length;
   const sum=`<div class="linsum">
     <div><div class="v">${ents.length}</div><div class="l">DATA ENTITIES</div></div>
     <div><div class="v" style="color:var(--ok)">${n("verified")}</div><div class="l">VERIFIED STEPS</div></div>
     <div><div class="v" style="color:var(--brand2)">${n("derived")}</div><div class="l">DERIVED STEPS</div></div>
     <div><div class="v" style="color:var(--inf)">${n("inferred")}</div><div class="l">INFERRED STEPS</div></div>
     <div><div class="v" style="color:var(--bad)">${ents.filter(e=>e.failure_mode).length}</div><div class="l">FAILURE MODES</div></div>
   </div>`;
   return sum+ents.map((e,ei)=>{
     const flow=(e.steps||[]).map((s,si)=>{
       const id=`${e.id}:${si}`; LINSTEPS[id]={s,e};
       const has=!!s.anchor;
       const inner=`<span class="sk">${esc(s.stage)}</span>
         <span class="sl">${esc(s.label)}</span>
         <span class="sd">${esc(s.description)}</span>
         <span class="sm">${estat(s.status)}<span class="etype">${esc(s.evidence_type||"")}</span>
           ${has?`<span class="lnref">${esc(s.anchor.file.split("/").pop())}:${s.anchor.start}-${s.anchor.end}</span>`:""}</span>`;
       const cell=has
         ?`<button class="lstage" data-lin="${esc(id)}" title="Open evidence">${inner}</button>`
         :`<div class="lstage">${inner}</div>`;
       const nx=(e.steps||[])[si+1];
       return cell+(nx?`<span class="conn${nx.status==="inferred"?" inf":""}" aria-hidden="true"></span>`:"");
     }).join("");
     const rows=[];
     if(e.failure_mode)rows.push(`<div class="erow fail"><span class="rk">FAILURE MODE</span>
       <span>${esc(e.failure_mode.text)} ${estat(e.failure_mode.status)}</span></div>`);
     if(e.boundary)rows.push(`<div class="erow bound"><span class="rk">REPOSITORY BOUNDARY</span>
       <span>${esc(e.boundary.text)} ${estat(e.boundary.status==="verified"?"verified":"inferred")}</span></div>`);
     rows.push(`<div class="erow"><span class="rk">TESTS</span><span>${
       (e.tests&&e.tests.length)
         ? e.tests.map(t=>`<code>${esc(t.label)}</code>${t.note?" : "+esc(t.note):""}`).join("<br>")
         : "No direct test was found for this data flow."}</span></div>`);
     return `<div class="ent">
       <header><span class="k">DATA ENTITY ${String(ei+1).padStart(2,"0")}</span>
         <h4>${esc(e.name)}</h4>${estat(e.status)}</header>
       <div class="mean">${esc(e.meaning)}</div>
       <div class="flow">${flow}</div>
       ${rows.join("")}
     </div>`;
   }).join("");
 },
};

/* Lineage status chips: the label is always rendered, so the states stay
   separable without relying on hue. Registry rebuilt per render like the
   checkpoint lookup. */
const EST={verified:["v","VERIFIED"],derived:["d","DERIVED"],inferred:["i","INFERRED"],
           unknown:["i","UNKNOWN"],broken:["x","BROKEN"]};
const estat=s=>{const p=EST[s]||EST.inferred;return `<span class="est ${p[0]}">${p[1]}</span>`};
const LINSTEPS={};
function openLinEvidence(key){
  const rec=LINSTEPS[key]; if(!rec||!rec.s.anchor)return;
  closeOverlays();
  const s=rec.s, st=(EST[s.status]||EST.inferred);
  $("#overlay").innerHTML=`<div class="scrim" data-close="1"></div>
  <div class="modal" role="dialog" aria-label="Evidence for ${esc(s.label)}">
    <button class="xbtn" data-close="1">ESC ✕</button>
    <h3>${esc(s.label)}</h3>
    <div class="dep" style="margin-bottom:10px">${esc(rec.e.name)} · ${esc(s.stage)} · ${st[1]}<span class="etype" style="margin-left:8px">${esc(s.evidence_type||"")}</span></div>
    <p style="color:var(--dim);margin-bottom:14px">${esc(s.description)}</p>
    ${excerpt(s.anchor,"The range was located by searching the file for the quoted code, then hashed; the gate recomputes that hash from the bundled excerpt.")}</div>`;
}

function verdict(b,a){
  return `<div class="act"><span class="verdict ${a.ok?"y":"n"}">${a.ok?"CORRECT":"NOT QUITE"}</span></div>
    <div class="expl">${esc(b.explanation)}<span class="prov"><b>ANSWER KEY</b> ${esc(b.provenance)}</span></div>`;
}
function allCP(){return STOPS.flatMap(s=>s.blocks.filter(b=>b.type==="checkpoint"))}
function ledgerRows(){
  const d=D.dropped||[], n=(D.report||{}).claims||0;
  if(d.length)return d.map(x=>`<tr><td><code>${esc(x.id)}</code></td><td style="color:var(--dim)">${esc(x.text)}</td>
    <td><code>${esc(x.file)}</code></td><td><span class="st x">${esc(x.reason)}</span></td></tr>`).join("");
  const why=n
    ? `Nothing was deleted in this build. All ${n} claims resolved against this snapshot, so every sentence in the walkthrough carries a live anchor.`
    : `Nothing was deleted because nothing was claimed. That is a zero from an empty run, not a clean bill of health.`;
  return `<tr><td colspan="4" style="color:var(--dim);font-style:italic;padding:14px 12px">${why}</td></tr>`;
}
function ledgerTable(){
  const r=D.report||{};
  return `<div class="sumgrid">
    <div><div class="v">${r.claims}</div><div class="l">CLAIMS MADE</div></div>
    <div><div class="v" style="color:var(--ok)">${r.verified}</div><div class="l">VERIFIED</div></div>
    <div><div class="v" style="color:var(--inf)">${r.inferred}</div><div class="l">INFERRED</div></div>
    <div><div class="v" style="color:var(--bad)">${r.dropped}</div><div class="l">DELETED</div></div>
    <div><div class="v">${r.commands}</div><div class="l">COMMANDS RUN</div></div>
    <div><div class="v" style="color:var(--bad)">${r.failed}</div><div class="l">COMMANDS FAILED</div></div>
  </div>
  ${yourScore()}
  <div class="tbl"><table><thead><tr><th>ID</th><th>DELETED CLAIM</th><th>TARGET</th><th>REASON</th></tr></thead>
  <tbody>${ledgerRows()}</tbody></table></div>
  <div class="envnote" style="border:1px solid var(--rule2);border-top:0">${esc((D.report||{}).regen||"Every anchor was re-read from disk and hash-matched by the verify stage; the gate re-hashes the bundled excerpts.")}</div>`;
}
function yourScore(){
  const ps=Object.values(S.pred), pOk=ps.filter(p=>p.ok).length;
  const cs=allCP().map(c=>({a:S.ans[c.id],k:S.conf[c.id]})).filter(x=>x.a);
  const cOk=cs.filter(x=>x.a.ok).length;
  const sure=cs.filter(x=>x.k==="sure"), sureWrong=sure.filter(x=>!x.a.ok).length;
  if(!ps.length&&!cs.length)return "";
  const bits=[];
  if(ps.length)bits.push(`<div><div class="v">${pOk}<span class="of"> / ${ps.length}</span></div><div class="l">PREDICTIONS RIGHT</div></div>`);
  if(cs.length)bits.push(`<div><div class="v">${cOk}<span class="of"> / ${cs.length}</span></div><div class="l">CHECKPOINTS RIGHT</div></div>`);
  if(sure.length)bits.push(`<div><div class="v" style="color:${sureWrong?"var(--bad)":"var(--ok)"}">${sureWrong}<span class="of"> / ${sure.length}</span></div><div class="l">CONFIDENT AND WRONG</div></div>`);
  return `<h5 class="yh">YOUR RECORD</h5><div class="sumgrid">${bits.join("")}</div>
    <div class="envnote" style="border:0;padding-left:0">Stored in this browser only, cleared by RESET, never part of the artifact.</div>`;
}

/* ---- map: a layered board, columns are pipeline stages ---- */
let TOUR=-1;
/* node height: @3 payloads carry h explicitly; an @2 payload derives it
   here exactly as the old renderer did, so both contracts draw. */
const nodeH=n=>n.h||Math.round(44+Math.sqrt(n.loc||0)/6);
function graph(){
  const m=D.map, N=m.nodes, E=m.edges, W=m.w||900, H=m.h||400;
  const at=id=>N.find(n=>n.id===id);
  const cols=(m.columns||[]).map(c=>
    `<text class="map-collab" x="${c.x}" y="20" text-anchor="middle">${esc(c.label)}</text>
     <line class="map-colline" x1="${c.x}" y1="28" x2="${c.x}" y2="${H-10}" opacity="${c.line?".5":"0"}"/>`).join("");
  const edges=E.map(e=>{
    const a=at(e.a),b=at(e.b); if(!a||!b)return "";
    const x1=a.x+a.w,y1=a.y+nodeH(a)/2, x2=b.x,y2=b.y+nodeH(b)/2, mx=(x1+x2)/2;
    return `<path class="edge" data-a="${e.a}" data-b="${e.b}" stroke-width="${.8+Math.min(e.n,40)/12}"
      d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"><title>${esc(at(e.a).label+" imports "+at(e.b).label+" from "+e.n+" sites")}</title></path>`;
  }).join("");
  const nodes=N.map(n=>`<g class="node" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.label)} module, open details">
      <rect class="n-body" x="${n.x}" y="${n.y}" width="${n.w}" height="${nodeH(n)}" rx="2"/>
      <text class="n-lab" x="${n.x+10}" y="${n.y+19}">${esc(n.label)}</text>
      <text class="n-loc" x="${n.x+10}" y="${n.y+nodeH(n)-9}">${(n.loc||0).toLocaleString()} loc · ${n.files} files</text>
    </g>`).join("");
  return `<div class="mapwrap"><div class="mapbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Module dependency board, columns ordered by pipeline stage">
      <g>${cols}</g><g id="edges">${edges}</g><g id="nodes">${nodes}</g></svg>
      ${(m.tour||[]).length?`<div class="maptools"><button class="tbtn" id="tourbtn">${TOUR>=0?"EXIT TOUR":"GUIDED TOUR"}</button></div>`:""}
      <div class="hint">HOVER TO ISOLATE · CLICK A MODULE FOR DETAIL · ESC CLOSES</div></div>
    <div id="tourbox">${TOUR>=0?tourCard():""}</div>
    ${m.note?`<div class="call info" style="margin-top:12px"><b>${esc(m.note.title)}</b>${rich(m.note.text)}</div>`:""}
    <details class="fallback"><summary>Text equivalent (${N.length} modules, ${E.length} dependencies)</summary>
      <ul>${N.map(n=>`<li><b>${esc(n.label)}</b>: ${n.loc.toLocaleString()} loc, ${n.files} files. Imports:
        ${E.filter(e=>e.a===n.id).map(e=>esc(at(e.b).label)+" ×"+e.n).join(", ")||"none"}</li>`).join("")}</ul></details></div>`;
}
function tourCard(){
  const t=D.map.tour||[]; if(TOUR<0||TOUR>=t.length)return "";
  const s=t[TOUR];
  return `<div class="tourcard"><div class="tk">TOUR · STEP ${TOUR+1} OF ${t.length}</div>
    <p>${rich(s.text)}</p>
    <div class="tnav">
      <button class="tbtn" id="tprev" ${TOUR===0?"disabled":""}>← BACK</button>
      <button class="tbtn" id="tnext">${TOUR===t.length-1?"FINISH":"NEXT →"}</button>
      <button class="tbtn" id="topen">OPEN ${esc((D.map.nodes.find(n=>n.id===s.id)||{}).label||"")}</button>
    </div></div>`;
}
function tourPaint(){
  const t=D.map.tour||[];
  $$(".node").forEach(g=>g.classList.remove("tourlit","dim"));
  $$(".edge").forEach(e=>e.classList.remove("lit","dim"));
  if(TOUR>=0&&t[TOUR]){
    const id=t[TOUR].id;
    $$(".node").forEach(g=>g.classList.toggle("tourlit",g.dataset.id===id));
    $$(".node").forEach(g=>{if(g.dataset.id!==id)g.classList.add("dim")});
    $$(".edge").forEach(e=>{
      if(e.dataset.a===id||e.dataset.b===id)e.classList.add("lit");else e.classList.add("dim")});
  }
  const tb=$("#tourbox"); if(tb)tb.innerHTML=TOUR>=0?tourCard():"";
  const btn=$("#tourbtn"); if(btn)btn.textContent=TOUR>=0?"EXIT TOUR":"GUIDED TOUR";
}

/* ---- node drawer ---- */
function openDrawer(id){
  const n=D.map.nodes.find(x=>x.id===id); if(!n)return;
  closeOverlays();
  /* @3 nodes carry narrated role paragraphs; an @2 node falls back to its
     mechanical why string so the drawer is never empty. */
  const role=(n.role&&n.role.length)
    ? n.role.map(p=>`<p>${rich(p)}</p>`).join("")
    : (n.why?`<p>${esc(n.why)}</p>`:"");
  const topList=(!n.key_files||!n.key_files.length)&&n.top&&n.top.length
    ? `<h5>Busiest files</h5><div class="kf">${n.top.map(t=>`<div>${esc(t)}</div>`).join("")}</div>`
    : "";
  const dIn=D.map.edges.filter(e=>e.b===id).map(e=>D.map.nodes.find(x=>x.id===e.a)),
        dOut=D.map.edges.filter(e=>e.a===id).map(e=>D.map.nodes.find(x=>x.id===e.b));
  $("#overlay").innerHTML=`<div class="scrim" data-close="1"></div>
  <aside class="drawer" role="dialog" aria-label="${esc(n.label)} module detail">
    <button class="xbtn" data-close="1">ESC ✕</button>
    <div class="k">MODULE</div><h4>${esc(n.label)}</h4>
    <div class="dsub">${esc(n.path||"")} · ${n.loc.toLocaleString()} loc · ${n.files} files</div>
    <div class="role">${role}</div>
    ${n.reads?`<h5>What flows in</h5><div class="dep">${rich(n.reads)}</div>`:""}
    ${n.feeds?`<h5>What flows out</h5><div class="dep">${rich(n.feeds)}</div>`:""}
    ${(n.key_files&&n.key_files.length)?`<h5>Key files</h5><div class="kf">${n.key_files.map(k=>`<div><code>${esc(k.file)}</code> · ${rich(k.purpose)}</div>`).join("")}</div>`:topList}
    ${(n.concepts||[]).length?`<h5>Concepts that live here</h5><div class="chips">${n.concepts.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`:""}
    <h5>Dependencies</h5>
    <div class="dep"><b>imports</b> ${dOut.map(x=>esc(x.label)).join(", ")||"nothing on this board"}</div>
    <div class="dep"><b>imported by</b> ${dIn.map(x=>esc(x.label)).join(", ")||"nothing on this board"}</div>
    ${n.anchor?`<h5>One excerpt</h5>${excerpt(n.anchor,n.anchor_caption||"")}`:""}
  </aside>`;
  $(".drawer").focus&&$(".drawer").focus();
}
function openGloss(id,x,y){
  const g=GLO[id]; if(!g)return;
  closeGloss();
  const div=document.createElement("div");
  div.className="gpop"; div.id="gpop";
  div.innerHTML=`<div class="gt">${esc(g.term)}</div><div class="gd">${esc(g.def)}</div>
    ${g.anchor?`<div class="gsrc">defined at <button data-gev="${id}">${esc(g.anchor.file)}:${g.anchor.focus&&g.anchor.focus[0]||g.anchor.start}</button></div>`:""}`;
  document.body.appendChild(div);
  const r=div.getBoundingClientRect();
  let left=Math.min(x,window.innerWidth-r.width-16), top=y+14;
  if(top+r.height>window.innerHeight-10)top=y-r.height-10;
  div.style.left=Math.max(8,left)+"px"; div.style.top=Math.max(8,top+window.scrollY)+"px";
}
function closeGloss(){const p=$("#gpop");if(p)p.remove()}
function openAudit(){
  closeOverlays();
  $("#overlay").innerHTML=`<div class="scrim" data-close="1"></div>
  <div class="modal" role="dialog" aria-label="Verification ledger">
    <button class="xbtn" data-close="1">ESC ✕</button>
    <h3>The verification ledger</h3>${ledgerTable()}</div>`;
}
function openEvidence(id){
  const g=GLO[id]; if(!g||!g.anchor)return;
  closeOverlays();
  $("#overlay").innerHTML=`<div class="scrim" data-close="1"></div>
  <div class="modal" role="dialog" aria-label="Evidence for ${esc(g.term)}">
    <button class="xbtn" data-close="1">ESC ✕</button>
    <h3>${esc(g.term)}</h3><p style="color:var(--dim);margin-bottom:14px">${esc(g.def)}</p>
    ${excerpt(g.anchor,"Where this concept lives in the code.")}</div>`;
}
function closeOverlays(){$("#overlay").innerHTML="";closeGloss()}

/* ---- rail ---- */
function rail(){
  $("#rail").innerHTML=D.tracks.map(t=>`<div class="track">
    <h3>${esc(t.title)}<i>${t.minutes}m</i></h3>
    ${t.stops.map(s=>{const i=STOPS.findIndex(x=>x.id===s.id);
      return `<div class="stop ${i===S.cur?"on":""} ${S.done[s.id]?"done":""} ${s.kind==="cp"?"cp":""}"
        data-go="${i}" tabindex="0" role="button"><span class="num">${String(i).padStart(2,"0")}</span><span>${esc(s.title)}</span></div>`;
    }).join("")}</div>`).join("")
  +`<div class="prog"><div class="lab"><span id="plab"></span><span id="ppct"></span></div>
     <div class="pbar"><i id="pfill"></i></div></div>`;
  const n=STOPS.length, d=Object.keys(S.done).length;
  $("#ppct").textContent=Math.round(d/n*100)+"%";
  $("#plab").textContent=d+" / "+n+" STOPS";
  $("#pfill").style.width=Math.round(d/n*100)+"%";
}

/* ---- stage ---- */
function draw(i){
  TOUR=-1; closeOverlays();
  S.cur=Math.max(0,Math.min(STOPS.length-1,i)); save();
  const s=STOPS[S.cur];
  $("#stage").innerHTML=`<div class="stopwrap ${s.id==="cover"?"cover":""}">
    <div class="plate"><span>STOP ${String(S.cur).padStart(2,"0")} / ${String(STOPS.length-1).padStart(2,"0")}</span>
      <hr><span>${esc(s.track)}</span><hr><span>${s.minutes} MIN</span></div>
    <h1>${esc(s.title)}</h1>
    ${s.lede?`<p class="lede">${rich(s.lede)}</p>`:""}
    <div class="blocks">${veil(s.blocks)}</div>
    ${s.id==="cover"?`<div class="startrow"><button class="start" data-nav="1">START THE WALKTHROUGH →</button><span style="font:11.5px var(--sans);color:var(--faint)">or use the arrow keys</span></div>`:""}
    <div class="fnav">
      <button ${S.cur===0?"disabled":""} data-nav="-1"><span class="k">← PREV</span>${S.cur>0?esc(STOPS[S.cur-1].title):""}</button>
      <button class="nxt" ${S.cur===STOPS.length-1?"disabled":""} data-nav="1"><span class="k">NEXT →</span>${S.cur<STOPS.length-1?esc(STOPS[S.cur+1].title):""}</button>
    </div></div>`;
  if(s.kind!=="cp"){S.done[s.id]=1;save();}
  history.replaceState(null,"","#"+s.id);
  rail(); window.scrollTo({top:0,behavior:"instant"});
  wireMap();
}

/* ---- map interactions ---- */
function wireMap(){
  const box=$(".mapbox"); if(!box)return;
  const nodes=$$(".node",box), edges=$$(".edge",box);
  const clear=()=>{if(TOUR>=0)return tourPaint();
    nodes.forEach(n=>n.classList.remove("dim"));edges.forEach(e=>e.classList.remove("dim","lit"))};
  nodes.forEach(g=>{
    const id=g.dataset.id;
    g.addEventListener("mouseenter",()=>{ if(TOUR>=0)return;
      nodes.forEach(n=>n.classList.toggle("dim",n!==g));
      edges.forEach(e=>{const hit=e.dataset.a===id||e.dataset.b===id;
        e.classList.toggle("lit",hit);e.classList.toggle("dim",!hit);
        if(hit){[e.dataset.a,e.dataset.b].forEach(o=>{const n2=nodes.find(x=>x.dataset.id===o);n2&&n2.classList.remove("dim")})}});
    });
    g.addEventListener("mouseleave",clear);
  });
  tourPaint();
}

/* ---- printing: linearise every stop ---- */
let PRINTSAVE=null;
window.addEventListener("beforeprint",()=>{
  PRINTSAVE=$("#stage").innerHTML;
  document.body.classList.add("printall");
  $("#stage").innerHTML=STOPS.map((s,i)=>`<div class="stopwrap">
    <div class="plate"><span>STOP ${String(i).padStart(2,"0")}</span><hr><span>${esc(s.track)}</span></div>
    <h1>${esc(s.title)}</h1>${s.lede?`<p class="lede">${rich(s.lede)}</p>`:""}
    <div class="blocks">${s.blocks.map(b=>B[b.type](b)).join("")}</div></div>`).join("");
  $$("#stage details").forEach(d=>d.open=true);
});
window.addEventListener("afterprint",()=>{
  document.body.classList.remove("printall");
  if(PRINTSAVE!==null){$("#stage").innerHTML=PRINTSAVE;PRINTSAVE=null;wireMap()}
});

/* ---- events ---- */
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#railbtn")){$("#rail").classList.toggle("open");return}
  const go=t.closest("[data-go]"); if(go){draw(+go.dataset.go);$("#rail").classList.remove("open");return}
  const nav=t.closest("[data-nav]"); if(nav&&!nav.disabled){draw(S.cur+ +nav.dataset.nav);return}
  if(t.closest("#badge")){openAudit();return}
  if(t.closest("[data-close]")){closeOverlays();return}
  if(t.closest("#resetbtn")){
    if(confirm("Clear local progress, answers and predictions for this walkthrough?")){
      localStorage.removeItem(KEY);S={cur:S.cur,done:{},ans:{},pred:{},conf:{}};save();draw(S.cur);}
    return}
  if(t.closest("#themebtn")){
    const r=document.documentElement;
    const cur=r.dataset.theme||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark");
    r.dataset.theme=cur==="dark"?"light":"dark";
    try{localStorage.setItem("trailhead:theme",r.dataset.theme)}catch(err){} return}
  if(t.closest("#projbtn")){
    const r=document.documentElement,b=$("#projbtn");
    const on=r.dataset.proj==="1"; r.dataset.proj=on?"":"1";
    b.setAttribute("aria-pressed",String(!on)); return}
  const gev=t.closest("[data-gev]"); if(gev){openEvidence(gev.dataset.gev);return}
  const lin=t.closest("[data-lin]"); if(lin){openLinEvidence(lin.dataset.lin);return}
  const gt=t.closest(".gterm"); if(gt){e.stopPropagation();openGloss(gt.dataset.g,e.clientX,e.clientY);return}
  const cl=t.closest("[data-claim]"); if(cl){
    const id=cl.dataset.claim,pop=$(`[data-pop="${id}"]`);
    if(pop){pop.hidden=!pop.hidden;
      $$(`[data-claim="${id}"]`).forEach(x=>x.setAttribute&&x.setAttribute("aria-expanded",String(!pop.hidden)));}
    return}
  const cp=t.closest("[data-copy]"); if(cp){
    navigator.clipboard&&navigator.clipboard.writeText(cp.dataset.copy);
    cp.textContent="COPIED";setTimeout(()=>cp.textContent="COPY",900); return}
  const cf=t.closest("[data-conf]"); if(cf){S.conf[cf.dataset.conf]=cf.dataset.c;save();draw(S.cur);return}
  const pk=t.closest("[data-pick]"); if(pk){
    const id=pk.dataset.pick,b=allCP().find(x=>x.id===id);
    const pick=+pk.dataset.i, ok=pick===b.answer;
    S.ans[id]={pick,ok};save();cpDone();draw(S.cur);return}
  const sb=t.closest("[data-go-cp]"); if(sb){
    const id=sb.dataset.goCp,b=allCP().find(x=>x.id===id);
    const sels=$$(`select[data-ord="${id}"]`),pick=sels.map(x=>+x.value||0);
    if(pick.some(v=>!v))return alert("Give every row a position first.");
    const ok=pick.every((v,i2)=>v===b.answer[i2]);
    S.ans[id]={pick,ok};save();cpDone();draw(S.cur);return}
  const po=t.closest(".popt[data-pi]"); if(po){
    const wrap=po.closest("[data-pred]"),id=wrap.dataset.pred,key=+wrap.dataset.key;
    const pick=+po.dataset.pi;S.pred[id]={pick,ok:pick===key};save();draw(S.cur);return}
  const node=t.closest(".node"); if(node){ if(TOUR>=0){TOUR=-1}
    openDrawer(node.dataset.id);return}
  if(t.closest("#tourbtn")){TOUR=TOUR>=0?-1:0;tourPaint();return}
  if(t.closest("#tprev")){TOUR=Math.max(0,TOUR-1);tourPaint();return}
  if(t.closest("#tnext")){const n=(D.map.tour||[]).length;TOUR=TOUR+1>=n?-1:TOUR+1;tourPaint();return}
  if(t.closest("#topen")){const s=(D.map.tour||[])[TOUR];if(s)openDrawer(s.id);return}
  const th=t.closest("th[data-sort]"); if(th){sortTable(th);return}
  if(!t.closest(".gpop"))closeGloss();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(TOUR>=0){TOUR=-1;tourPaint();}closeOverlays();return}
  const el=document.activeElement;
  if(el&&(el.tagName==="INPUT"||el.tagName==="SELECT"||el.tagName==="TEXTAREA"))return;
  if(e.key==="Enter"||e.key===" "){
    const b=el&&el.closest&&el.closest('[role="button"]');
    if(b){e.preventDefault();b.click();return}}
  if(e.key==="ArrowLeft"&&S.cur>0)draw(S.cur-1);
  if(e.key==="ArrowRight"&&S.cur<STOPS.length-1)draw(S.cur+1);
});
function cpDone(){
  for(const s of STOPS){
    if(s.kind!=="cp")continue;
    const cps=s.blocks.filter(b=>b.type==="checkpoint");
    if(cps.length&&cps.every(b=>S.ans[b.id]))S.done[s.id]=1;
  }
  save();
}
function sortTable(th){
  const table=th.closest("table"),i=+th.dataset.sort;
  const rows=[...table.tBodies[0].rows];
  const dir=th.dataset.dir==="a"?"d":"a"; th.dataset.dir=dir;
  $$("th",table).forEach(x=>{const a=x.querySelector(".ar");if(a)a.remove()});
  th.insertAdjacentHTML("beforeend",`<span class="ar"> ${dir==="a"?"▲":"▼"}</span>`);
  const num=s=>parseFloat(String(s).replace(/[^\d.-]/g,""));
  rows.sort((r1,r2)=>{
    const a=r1.cells[i].textContent.trim(),b=r2.cells[i].textContent.trim();
    const n1=num(a),n2=num(b);
    const c=(!isNaN(n1)&&!isNaN(n2))?n1-n2:a.localeCompare(b);
    return dir==="a"?c:-c;
  });
  rows.forEach(r=>table.tBodies[0].appendChild(r));
}
window.addEventListener("hashchange",()=>{
  const i=STOPS.findIndex(s=>s.id===location.hash.replace("#",""));
  if(i>=0&&i!==S.cur)draw(i);
});
document.addEventListener("change",e=>{
  if(e.target.id!=="rsel")return;
  loadRepo(e.target.value);
  history.replaceState(null,"",location.pathname+location.search);
  draw(S.cur||0);
});
try{const t=localStorage.getItem("trailhead:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
boot();
</script>
