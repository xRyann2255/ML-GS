<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailhead</title>
<style>
/* ============================================================
   TRAILHEAD, hand-built target artifact: the walkthrough the
   generator should aspire to produce.
   Aesthetic: GS institutional workstation.
     - cool navy-slate surfaces; sky blue is the one interactive accent
     - workflow status (verified / inferred / broken) kept strictly
       separate from brand colour
     - sans for interface text; mono confined to code, commands, paths
       and figures; serif reserved for display headings
     - tabular numerals wherever a number appears
     - a quiet engineering grid sits behind everything: the page is a
       drawing board, not a poster
   Self-contained: no external requests, no fonts, no scripts.
   Goldman Sans / GS Sans cannot ship in this file (embedded font
   at-rules are barred by the bundle gate), so --sans approximates it
   from system faces.
   ============================================================ */

:root{
  /* surfaces */
  --ink:#0a0e14; --ink2:#111722; --ink3:#18202d; --ink4:#212b3a;
  /* text */
  --bone:#e8ecf2; --dim:#9ba8ba; --faint:#8494a8;
  /* structure */
  --rule:#1e2735; --rule2:#2c3849;
  /* brand / interactive: GS sky blue */
  --brand:#7399c6; --brand2:#acd4f1; --brandd:#12243a;
  /* workflow status */
  --ok:#4fa97a; --inf:#d8a23c; --bad:#e06c5b;
  --okd:#0f2a20; --infd:#2a2210; --badd:#2e1614;
  /* the engineering grid */
  --grid:rgba(115,153,198,.055); --grid2:rgba(115,153,198,.10);
  /* type */
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,"Times New Roman",Times,serif;
  --mono:"Cascadia Code","JetBrains Mono","SF Mono","Berkeley Mono","IBM Plex Mono",ui-monospace,monospace;
  /* shape + elevation: nothing rounder than 4px */
  --r1:2px; --r2:4px;
  --e1:0 1px 2px rgba(4,8,14,.28);
  --e2:0 8px 24px rgba(4,8,14,.40);
  --base:16px; --rail:272px; --bar:52px;
}
/* Sky blue is the dark-theme interactive colour; on white it fails 4.5:1
   as text, so light drops to deep navy with Mariner for hover. */
:root[data-theme="light"]{
  --ink:#ffffff; --ink2:#f5f7fa; --ink3:#eaeef4; --ink4:#dde4ed;
  --bone:#14181f; --dim:#4a5464; --faint:#5c6775;
  --rule:#e3e8ef; --rule2:#c2ccd9;
  --brand:#00355f; --brand2:#2178c4; --brandd:#e8f1fa;
  --ok:#1a6b43; --inf:#8a5c10; --bad:#b3261e;
  --okd:#e4f2ea; --infd:#fbf0da; --badd:#fbe9e7;
  --grid:rgba(0,53,95,.05); --grid2:rgba(0,53,95,.09);
  --e1:0 1px 2px rgba(20,24,31,.10);
  --e2:0 8px 24px rgba(20,24,31,.16);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme]){
    --ink:#ffffff; --ink2:#f5f7fa; --ink3:#eaeef4; --ink4:#dde4ed;
    --bone:#14181f; --dim:#4a5464; --faint:#5c6775;
    --rule:#e3e8ef; --rule2:#c2ccd9;
    --brand:#00355f; --brand2:#2178c4; --brandd:#e8f1fa;
    --ok:#1a6b43; --inf:#8a5c10; --bad:#b3261e;
    --okd:#e4f2ea; --infd:#fbf0da; --badd:#fbe9e7;
    --grid:rgba(0,53,95,.05); --grid2:rgba(0,53,95,.09);
    --e1:0 1px 2px rgba(20,24,31,.10);
    --e2:0 8px 24px rgba(20,24,31,.16);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink); color:var(--bone);
  font:var(--base)/1.6 var(--sans);
  overflow-x:hidden;
}
/* The grid: a fine 26px pitch with a heavier line every 130px, fixed so
   content scrolls over a stable board. Decoration budget spent here and
   nowhere else. */
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:
    linear-gradient(var(--grid2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:130px 130px,130px 130px,26px 26px,26px 26px;
}
code,pre,samp,kbd{font-family:var(--mono)}
.badge,.dur,.stop .num,.prog .lab,.code .ln,.sumgrid .v,.tbl .r,
.drawer .dsub,.opt .i,.hop>.dot,.meta,.stat .v{font-variant-numeric:tabular-nums}
::selection{background:var(--brand);color:var(--ink)}

/* ---------- top bar ---------- */
.bar{
  position:fixed; top:0; left:0; right:0; height:var(--bar); z-index:60;
  display:flex; align-items:center; gap:16px; padding:0 16px;
  background:var(--ink2); border-bottom:1px solid var(--rule2); box-shadow:var(--e1);
}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand .tm{font:600 11px var(--sans);letter-spacing:.14em;color:var(--brand);flex:none}
.brand b{font:600 15px var(--sans);letter-spacing:-.01em;white-space:nowrap}
.meta{font:11.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsel{
  background:var(--ink3);color:var(--bone);border:1px solid var(--rule2);border-radius:var(--r1);
  font:600 11.5px var(--sans);padding:3px 6px;cursor:pointer;flex:none;max-width:170px
}
.rsel:hover{border-color:var(--brand)}
.badge{
  margin-left:auto;display:flex;align-items:center;border:1px solid var(--rule2);
  border-radius:var(--r1);background:var(--ink3);cursor:pointer;flex:none;
  font:11.5px var(--sans);overflow:hidden;color:var(--dim)
}
.badge:hover{border-color:var(--brand)}
.badge span{padding:5px 10px;border-right:1px solid var(--rule)}
.badge span:last-child{border-right:0}
.badge .n{color:var(--bone);font-weight:600;font-style:normal}
.badge .d{color:var(--inf)} .badge .f{color:var(--bad)}
.badge.lowconf{border-color:var(--inf)} .badge .lo{color:var(--inf);font-weight:600}
.tools{display:flex;gap:4px;flex:none}
.tbtn{
  background:transparent;border:1px solid var(--rule2);border-radius:var(--r1);
  color:var(--dim);cursor:pointer;font:600 11px var(--sans);letter-spacing:.04em;padding:5px 8px
}
.tbtn:hover{color:var(--bone);border-color:var(--brand)}
.tbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--ink)}

/* ---------- shell ---------- */
.wrap{display:flex;min-height:100vh;padding-top:var(--bar)}
.rail{
  width:var(--rail);flex:none;position:sticky;top:var(--bar);
  height:calc(100vh - var(--bar));overflow-y:auto;
  background:var(--ink2);border-right:1px solid var(--rule);
  padding:16px 0 24px;
}
.track{margin-bottom:4px}
.track h3{
  font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:12px 16px 6px;display:flex;justify-content:space-between;align-items:baseline
}
.track h3 i{font-style:normal;font-weight:400;color:var(--faint);font-size:10.5px}
.stop{
  display:flex;gap:10px;align-items:baseline;padding:7px 16px 7px 14px;cursor:pointer;
  border-left:2px solid transparent;font-size:13.5px;color:var(--dim)
}
.stop:hover{background:var(--ink3);color:var(--bone)}
.stop.on{border-left-color:var(--brand);background:var(--ink3);color:var(--bone)}
.stop .num{font:500 11px var(--mono);color:var(--faint);flex:none;width:20px;position:relative}
.stop.done .num{color:var(--ok)}
.stop.done .num::after{content:"✓";position:absolute;left:20px;font-size:9px;top:-3px}
.stop.cp .num{color:var(--inf)}
.prog{padding:14px 16px 4px;border-top:1px solid var(--rule);margin-top:12px}
.prog .lab{font:11px var(--mono);color:var(--faint);display:flex;justify-content:space-between;margin-bottom:6px}
.pbar{height:4px;background:var(--ink4);border-radius:var(--r1);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);width:0}

.stage{flex:1;min-width:0;padding:36px 40px 80px}
.stopwrap{max-width:860px;margin:0 auto}
.plate{
  display:flex;gap:10px;align-items:center;font:600 10.5px var(--sans);
  letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-bottom:14px
}
.plate hr{flex:none;width:24px;border:0;border-top:1px solid var(--rule2)}
h1{font:700 34px/1.15 var(--serif);letter-spacing:-.01em;margin-bottom:10px}
.lede{color:var(--dim);font-size:16.5px;max-width:72ch;margin-bottom:28px}
.blocks>*{margin-bottom:24px}
.blocks .prose p{max-width:72ch;margin-bottom:14px}

/* ---------- claims: the atomic unit ---------- */
.claim{cursor:pointer;border-bottom:1px solid rgba(79,169,122,.55);padding-bottom:1px}
.claim:hover{border-bottom-color:var(--ok);background:rgba(79,169,122,.07)}
.claim[aria-expanded="true"]{background:rgba(79,169,122,.10)}
.claim.inf{cursor:default;border-bottom:1px dotted var(--inf);background:none}
.claim.inf:hover{background:rgba(216,162,60,.07)}
.mark{
  display:inline-block;vertical-align:super;font:600 9px var(--mono);
  color:var(--ok);background:var(--okd);border:1px solid var(--ok);
  border-radius:var(--r1);padding:0 4px;margin-left:5px;cursor:pointer;line-height:1.5
}
.mark:hover{background:var(--ok);color:var(--ink)}
.tag{
  display:inline-block;font:600 9px var(--sans);letter-spacing:.06em;color:var(--inf);
  background:var(--infd);border:1px solid var(--inf);border-radius:var(--r1);
  padding:0 5px;margin-left:6px;vertical-align:super;line-height:1.6
}
.pop{margin:4px 0 18px}

/* glossary terms */
.gterm{
  cursor:help;border-bottom:1px dotted var(--brand);color:inherit;
  background:none;border-top:0;border-left:0;border-right:0;font:inherit;padding:0
}
.gterm:hover{color:var(--brand2);border-bottom-style:solid}
.gpop{
  position:absolute;z-index:80;max-width:380px;background:var(--ink2);
  border:1px solid var(--rule2);border-left:2px solid var(--brand);
  border-radius:var(--r2);box-shadow:var(--e2);padding:12px 14px;font-size:13px
}
.gpop .gt{font:600 12px var(--sans);letter-spacing:.03em;margin-bottom:4px}
.gpop .gd{color:var(--dim);margin-bottom:8px}
.gpop .gsrc{font:11px var(--mono);color:var(--faint)}
.gpop .gsrc button{
  background:none;border:0;color:var(--brand);cursor:pointer;font:inherit;padding:0;text-decoration:underline
}

/* ---------- code excerpt ---------- */
.ex{border:1px solid var(--rule2);border-radius:var(--r2);overflow:hidden;background:var(--ink2)}
.ex header{
  display:flex;align-items:center;gap:6px;background:var(--ink3);
  padding:7px 12px;font:12px var(--mono);color:var(--dim);border-bottom:1px solid var(--rule)
}
.ex header b{color:var(--bone);font-weight:500}
.ex header .sp{flex:1}
.ex header .sha{color:var(--faint);font-size:10.5px}
.cp-btn{
  background:none;border:1px solid var(--rule2);border-radius:var(--r1);color:var(--dim);
  cursor:pointer;font:600 10px var(--sans);letter-spacing:.05em;padding:2px 7px
}
.cp-btn:hover{color:var(--bone);border-color:var(--brand)}
.code{max-height:432px;overflow:auto}
.code table{border-collapse:collapse;width:100%;font:12.5px/1.55 var(--mono)}
.code .ln{
  color:var(--faint);text-align:right;padding:0 10px 0 14px;user-select:none;
  width:1%;white-space:nowrap;vertical-align:top
}
.code .src{white-space:pre;padding-right:16px}
.code tr.hl{background:var(--okd)}
.code tr.hl .ln{color:var(--ok);position:relative}
.code tr.hl .ln::before{content:"▸";position:absolute;left:3px;color:var(--ok)}
.code tr.el td{color:var(--faint);font-style:italic;padding:2px 14px}
.ex figcaption{padding:8px 12px;font-size:12px;color:var(--faint);border-top:1px solid var(--rule)}

/* ---------- command block ---------- */
.cmd{border:1px solid var(--rule2);border-radius:var(--r2);overflow:hidden;background:var(--ink2)}
.cmd.fail{border-left:2px solid var(--bad)}
.cmd header{
  display:flex;align-items:center;gap:10px;background:var(--ink3);
  padding:9px 12px;font:13px var(--mono)
}
.cmd .pr{color:var(--dim)}
.cmd header code{color:var(--bone)}
.cmd .res{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{font:600 10.5px var(--mono);border-radius:var(--r1);padding:2px 7px}
.pill.ok{color:var(--ok);background:var(--okd)}
.pill.bad{color:var(--bad);background:var(--badd)}
.pill.wait{color:var(--inf);background:var(--infd);margin-left:auto}
.dur{font:11.5px var(--mono);color:var(--faint)}
.brk{background:var(--badd);border-top:1px solid var(--rule);padding:10px 12px;font-size:13px}
.brk b{color:var(--bad);font:600 10.5px var(--sans);letter-spacing:.06em;display:block;margin-bottom:4px}
.out{border-top:1px solid var(--rule)}
.out summary{
  cursor:pointer;padding:7px 12px;font:600 11px var(--sans);letter-spacing:.04em;color:var(--dim);list-style:none
}
.out summary::before{content:"▸ ";color:var(--faint)}
.out[open] summary::before{content:"▾ "}
.out summary:hover{color:var(--bone)}
.out pre{
  padding:10px 14px;font:12px/1.5 var(--mono);color:var(--dim);
  overflow-x:auto;max-height:420px;overflow-y:auto;border-top:1px solid var(--rule)
}
.envnote{padding:6px 12px;font:11px var(--mono);color:var(--faint);border-top:1px solid var(--rule)}

/* predict-then-reveal */
.pred{border-top:1px solid var(--rule);padding:10px 12px;background:var(--ink2)}
.pred .q{font-size:13.5px;margin-bottom:8px}
.pred .q b{
  font:600 9.5px var(--sans);letter-spacing:.08em;color:var(--brand);
  border:1px solid var(--brand);border-radius:var(--r1);padding:1px 5px;margin-right:8px;vertical-align:1px
}
.popts{display:flex;flex-direction:column;gap:6px}
.popt{
  display:flex;gap:10px;align-items:baseline;border:1px solid var(--rule2);
  border-radius:var(--r1);padding:6px 10px;cursor:pointer;font-size:13px
}
.popt:hover{border-color:var(--brand);background:var(--brandd)}
.popt .i{font:600 11px var(--mono);color:var(--faint);flex:none}
.pred.done .popt{cursor:default}
.pred.done .popt:hover{border-color:var(--rule2);background:none}
.popt.right{border-color:var(--ok);background:var(--okd)}
.popt.right .i{color:var(--ok)}
.popt.wrong{border-color:var(--bad);background:var(--badd)}
.popt.wrong .i{color:var(--bad)}
.pfoot{display:flex;gap:12px;align-items:baseline;margin-top:8px;flex-wrap:wrap}
.verdict{font:600 11px var(--sans);letter-spacing:.05em}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--bad)}
.prov{font:11.5px var(--mono);color:var(--faint)}
.prov b{font:600 9.5px var(--sans);letter-spacing:.06em;color:var(--dim);margin-right:6px}
.veil{visibility:hidden;height:0;overflow:hidden;margin:0 !important}
.veilnote{
  border:1px dashed var(--rule2);border-radius:var(--r2);color:var(--faint);
  font-size:12.5px;padding:10px 14px
}

/* ---------- callout ---------- */
.call{
  border:1px solid var(--rule2);border-left:2px solid var(--rule2);
  border-radius:var(--r2);padding:12px 16px;font-size:13.5px;color:var(--dim);
  background:var(--ink2);max-width:none
}
.call b{
  display:block;font:600 10.5px var(--sans);letter-spacing:.07em;
  color:var(--faint);margin-bottom:5px
}
.call.inferred{border-left-color:var(--inf)} .call.inferred b{color:var(--inf)}
.call.broken{border-left-color:var(--bad)} .call.broken b{color:var(--bad)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--rule2);border:1px solid var(--rule2);border-radius:var(--r2);overflow:hidden}
.stat{background:var(--ink2);padding:14px 16px}
.stat .v{font:600 26px/1.1 var(--sans);letter-spacing:-.01em}
.stat .v .of{font-size:15px;color:var(--faint);font-weight:400}
.stat .l{font:600 10px var(--sans);letter-spacing:.07em;color:var(--faint);margin-top:4px;text-transform:uppercase}
.stat .s{font:11.5px var(--sans);color:var(--dim);margin-top:2px}

/* ---------- table ---------- */
.tbl{border:1px solid var(--rule2);border-radius:var(--r2);overflow:auto;max-height:560px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.tbl th{
  position:sticky;top:0;background:var(--ink3);text-align:left;
  font:600 10.5px var(--sans);letter-spacing:.06em;color:var(--faint);
  padding:8px 12px;border-bottom:1px solid var(--rule2);white-space:nowrap
}
.tbl th[data-sort]{cursor:pointer}
.tbl th[data-sort]:hover{color:var(--bone)}
.tbl th .ar{color:var(--brand)}
.tbl td{padding:7px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl td.r{text-align:right;font-family:var(--mono);font-size:12.5px}
.tbl td code{font-size:12px;color:var(--brand2)}
:root[data-theme="light"] .tbl td code{color:var(--brand)}
.tbl tr:hover td{background:var(--ink3)}

/* ---------- lineage: a flow record, not a diagram ---------- */
.linsum{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;
  background:var(--rule2);border:1px solid var(--rule2);border-radius:var(--r2);margin-bottom:18px;overflow:hidden
}
.linsum>div{background:var(--ink2);padding:12px 14px}
.linsum .v{font:600 22px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.linsum .l{font:600 10px var(--sans);letter-spacing:.07em;color:var(--faint);margin-top:3px}
.ent{border:1px solid var(--rule2);border-radius:var(--r2);margin-bottom:16px;background:var(--ink2)}
.ent>header{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.ent>header .k{font:600 10px var(--sans);letter-spacing:.07em;color:var(--faint)}
.ent>header h4{font:600 15px var(--sans);letter-spacing:-.01em;margin:0;flex:1 0 auto}
.ent .mean{padding:10px 14px 14px;color:var(--dim);font-size:13.5px;border-bottom:1px solid var(--rule)}
.est{display:inline-flex;align-items:center;gap:5px;border:1px solid;border-radius:var(--r1);
  font:600 9.5px var(--sans);letter-spacing:.07em;padding:2px 6px;white-space:nowrap}
.est.v{color:var(--ok);border-color:var(--ok);background:var(--okd)}
.est.d{color:var(--brand2);border-color:var(--brand);background:var(--brandd)}
.est.i{color:var(--inf);border-color:var(--inf);background:var(--infd)}
.est.x{color:var(--bad);border-color:var(--bad);background:var(--badd)}
.etype{font:600 9.5px var(--mono);letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.flow{display:flex;align-items:stretch;padding:14px;gap:0;overflow-x:auto}
.lstage{flex:1 1 0;min-width:150px;display:flex;flex-direction:column;gap:6px;
  background:transparent;border:1px solid var(--rule2);border-radius:var(--r1);
  padding:10px 11px;text-align:left;color:inherit;font:inherit;cursor:default}
button.lstage{cursor:pointer}
button.lstage:hover{border-color:var(--brand);background:var(--ink3)}
.lstage .sk{font:600 9.5px var(--sans);letter-spacing:.08em;color:var(--faint)}
.lstage .sl{font:600 12.5px var(--mono);color:var(--bone);overflow-wrap:anywhere}
.lstage .sd{font-size:12px;color:var(--dim);line-height:1.5}
.lstage .sm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.lstage .lnref{font:11px var(--mono);color:var(--faint);overflow-wrap:anywhere}
.conn{flex:0 0 26px;position:relative;align-self:center;height:1px;background:var(--rule2)}
.conn::after{content:"";position:absolute;right:0;top:-3px;
  border-left:6px solid var(--rule2);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.conn.inf{background:var(--inf)} .conn.inf::after{border-left-color:var(--inf)}
.erow{display:flex;gap:12px;align-items:baseline;padding:10px 14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--dim)}
.erow .rk{font:600 9.5px var(--sans);letter-spacing:.07em;color:var(--faint);flex:0 0 132px}
.erow.fail .rk{color:var(--bad)}
.erow.bound .rk{color:var(--inf)}
@media (max-width:760px){
  .flow{flex-direction:column;padding:12px}
  .lstage{min-width:0}
  .conn{width:1px;height:16px;align-self:flex-start;margin-left:18px;flex:0 0 16px}
  .conn::after{right:-3px;top:auto;bottom:0;
    border-left:3.5px solid transparent;border-right:3.5px solid transparent;
    border-top:6px solid var(--rule2);border-bottom:0}
  .linsum{grid-template-columns:repeat(2,1fr)}
  .erow{flex-direction:column;gap:4px}
  .erow .rk{flex:none}
}

/* ---------- map ---------- */
.mapwrap{max-width:1080px}
.mapbox{
  border:1px solid var(--rule2);border-radius:var(--r2);background:var(--ink2);
  position:relative;overflow:hidden
}

.map-collab{font:600 10px var(--sans);letter-spacing:.1em;fill:var(--faint)}

.edge.lit{opacity:.85;stroke:var(--brand)}
.edge.dim{opacity:.04}

.node .n-body{fill:var(--ink3);stroke:var(--rule2);transition:fill .15s,stroke .15s}

.node.dim{opacity:.30}
.node.tourlit .n-body{stroke:var(--brand);stroke-width:2;fill:var(--brandd)}
.n-lab{font:600 12.5px var(--sans);fill:var(--bone);pointer-events:none}

}
.maptools{display:flex;gap:6px;position:absolute;left:10px;bottom:8px}
.tourcard{

}
.tourcard .tk{font:600 10px var(--sans);letter-spacing:.08em;color:var(--brand);margin-bottom:4px}

  position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);z-index:75;

.drawer h5{

}

}

/* ---------- cover ---------- */

.cover .thesis{font-size:18px;color:var(--dim);max-width:64ch;margin-bottom:26px}
.startrow{display:flex;gap:12px;align-items:center;margin:26px 0 6px}

}
:root[data-theme="light"] .start{color:#fff}

:root[data-proj="1"] .code{max-height:300px}
:root[data-proj="1"] .stopwrap{max-width:1000px}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

const BUNDLES = {"volforecast":{"contract":"trailhead\u002fverified\u00403","repo":{"name":"volforecast","commit":"5248556","generated_at":"2026-07-31T08:03:12Z"},"report":{"claims":63,"verified":49,"dropped":0,"inferred":14,"commands":4,"failed":3,"tool_version":"0.4.0","duration_s":1,"regen":"Regenerate: PYTHONPATH=src python -m trailhead build restored -o out\u002frestored.html --run-commands safe","anchors":72},"map":{"nodes":[{"id":"n-src-volforecast-models","label":"models","loc":9802,"files":22,"x":65,"y":40,"w":150,"h":59,"path":"src\u002fvolforecast\u002fmodels","why":"22 files, 9,802 loc. Imports 6 of these; imported by 3. Busiest file: _base.py (commits 1).","top":["_base.py - commits 1","blend.py - commits 1","calibrated.py - commits 1"],"role":["The model zoo of `volforecast`: every forecaster the tournament can run, registered under a string name in `MODEL_REGISTRY` so a YAML config picks models by name alone. The families span nine naive baselines that set the [[QLIKE]] floor, the linear [[HAR]] family (its registration file is missing from this snapshot), gradient boosting via LightGBM, its DART dropout variant, and XGBoost, a seven-model graph suite, and five ensembles from seed bagging to a regime-dependent blend.","The signature move is that training loss equals evaluation loss. LightGBM and XGBoost train on a hand-derived QLIKE custom objective, gradient 1 - exp(y_true - y_pred) and hessian exp(y_true - y_pred) in log RV space, and the torch graph models share a `_qlike_loss` of the same form, so trees split and gradients descend on the exact metric the tournament ranks by, one that penalizes under-predicting volatility harder than over-predicting it.","Tuning is industrial: Optuna searches run under walk-forward expanding-window CV to prevent look-ahead bias, with parallel worker processes coordinated through journal storage and, for XGBoost, each worker pinned round-robin to its own GPU. The `gnn` model treats every trading date as one graph snapshot, symbols as nodes and rolling-correlation edges, learning cross-asset volatility spillovers with GATv2 attention and flagging `requires_graph = True` so the pipeline runner dispatches graph data instead of tabular features."],"reads":"Feature matrices from the layers each model declares in REQUIRED_LAYERS, plus per-date graph snapshots built from rolling realized correlations for the graph models.","feeds":"Out-of-sample log RV predictions per fold into `evaluation`, where the tournament ranks every model by QLIKE and backs the ranking with statistical tests.","key_files":[{"file":"lightgbm.py","purpose":"The workhorse: custom QLIKE objective with analytic gradient and hessian, parallel Optuna tuning, and the `lightgbm_dart` dropout variant for less overconfident predictions."},{"file":"xgboost.py","purpose":"Independent cross-check of LightGBM with the same QLIKE objective, plus a multi-GPU Optuna harness that pins each worker round-robin to its own device."},{"file":"gnn.py","purpose":"GATv2 attention over per-date correlation graphs, plus the shared QLIKE loss and device and precision helpers the torch graph models use."},{"file":"__init__.py","purpose":"The package's public surface: re-exports `MODEL_REGISTRY` and `register_model`, and points at `ensure_registered()`, the call that fires every model's registration decorator."}],"concepts":["QLIKE custom objective","log RV space","MODEL_REGISTRY","naive floor","graph snapshots","walk-forward tuning"],"anchor":{"file":"src\u002fvolforecast\u002fmodels\u002flightgbm.py","start":63,"end":86,"focus":[76,77],"sha256":"1cda7b87952e7b203ee6039ad3ddaa459da51cbb077d45449ffb54e9b0a69b67"},"anchor_caption":"The hand-derived QLIKE gradient and hessian LightGBM splits on: training loss equals the tournament's metric."},{"id":"n-src-volforecast-cli","label":"cli","loc":7342,"files":28,"x":65,"y":125,"w":150,"h":56,"path":"src\u002fvolforecast\u002fcli","why":"28 files, 7,342 loc. Imports 5 of these; imported by 2. Busiest file: audit.py (commits 1).","top":["audit.py - commits 1","backfill_rk.py - commits 1","build_features.py - commits 1"],"role":["One module per subcommand, each exposing a `register(subparsers)` hook that the entry point calls lazily, so the command surface is owned by the modules that implement it. The package docstring maps modules to workflow skills, ingest for DATA_INGEST, build_features for FEATURE_BUILD, train for MODEL_TRAIN, evaluate for EVALUATE, so the CLI mirrors the research loop rather than accumulating loose scripts.","`vol audit` is the data-quality gate: it validates every cached parquet against its manifest contract, assesses per-layer readiness, regenerates data\u002fmanifest.json, and appends a dated summary to the research journal at workspace\u002fresearch\u002fresearch-journal.md, exiting 1 when critical issues are found. `vol backfill-rk` repairs the realized kernel column: it finds dates where `rk` is NaN, refetches raw ticks from Chunk Store in multi-day batches, and recomputes RK and `noise_gap` in place, checkpointing progress so an interrupt loses nothing.","`vol forecast` is the live end product: a config-driven multi-model ensemble that trains each model on full history, predicts next-day [[realized variance]], compares it to current ATM [[implied volatility]] fetched live from TSDB, and emits a weighted LONG, SHORT, or FLAT signal. The distinctive habit is engineering around expensive data: backfill fetches five days per API call and requests only the trade-price field, roughly three times less data per fetch."],"reads":"User intent plus cached data: argv and YAML configs from workspace\u002fconfigs\u002f, RV parquet caches, manifest contracts, raw ticks from Chunk Store, and live ATM IV from the gs_quant TSDB session.","feeds":"Its outputs, a regenerated data\u002fmanifest.json, repaired rk and noise_gap columns in the parquet cache, and the daily LONG, SHORT, or FLAT call, feed the tournament's training data, the research journal, and the trading decision itself.","key_files":[{"file":"__init__.py","purpose":"the docstring that maps each CLI module to one workflow skill, DATA_INGEST through RESEARCH; the quickest map of the command surface"},{"file":"audit.py","purpose":"validates every cached parquet against manifest contracts, regenerates data\u002fmanifest.json, and writes audit summaries to the research journal"},{"file":"backfill_rk.py","purpose":"repairs NaN realized kernel dates from raw ticks, batched five days per API call with symbol-level parallelism"},{"file":"forecast.py","purpose":"the live signal: multi-model ensemble to LONG, SHORT, or FLAT against current ATM IV"}],"concepts":["register() pattern","manifest contract","realized kernel","noise_gap","IV-RV gap signal","layer readiness"],"anchor":{"file":"src\u002fvolforecast\u002fcli\u002f__init__.py","start":1,"end":11,"focus":[3],"sha256":"9ab88a8a0bc2896ea295e697c0b5ade3500adc02fd95070695054c5be7ee0b1c"},"anchor_caption":"The package docstring: one CLI module per workflow skill."},{"id":"n-src-volforecast-pipeline","label":"pipeline","loc":1307,"files":6,"x":305,"y":40,"w":150,"h":48,"path":"src\u002fvolforecast\u002fpipeline","why":"6 files, 1,307 loc. Imports 4 of these; imported by 2. Busiest file: conditional_duan.py (commits 1).","top":["conditional_duan.py - commits 1","feature_selection.py - commits 1","fold_cache.py - commits 1"],"role":["Fold-level orchestration that sits between the CV splitters and the models, built to make leakage structurally difficult. Every step runs inside the fold that owns it: `feature_selection.py` does Boruta-style TreeSHAP shadow selection, keeping only features whose mean absolute SHAP beats a threshold set by permuted shadow copies of themselves, and `norm.py` fits per-symbol z-score normalisers from training rows alone so one symbol's vol regime cannot contaminate another's scaling.","`fold_cache.py` content-addresses expensive LSTM and TCN training: a deterministic fingerprint over config, horizon, fold number, train and test date hashes, and base-model predictions decides whether a fold can be skipped, so nothing retrains by accident and a change to any input invalidates exactly the right cache entries. `conditional_duan.py` then upgrades the global Duan log-to-level bias correction to a per-sample one, training a lightweight XGBoost variance model on OOS residuals from strictly prior folds, or reading squared VVIX as a direct uncertainty proxy."],"reads":"Fold splits from the CV splitters in utils\u002fcv.py, plus the feature matrices, log-RV targets, and base-model predictions produced upstream by the data, features, and models packages.","feeds":"Leakage-controlled inputs into `models` and bias-corrected predictions into `evaluation`, where the tournament ranks everything by QLIKE.","key_files":[{"file":"fold_cache.py","purpose":"The fingerprint-keyed cache that skips retraining sequence-model folds when config, dates, and base-model predictions are all unchanged."},{"file":"conditional_duan.py","purpose":"The per-sample walk-forward Duan correction, estimated from prior folds' OOS residuals or a calibrated VVIX proxy."},{"file":"feature_selection.py","purpose":"Boruta-style TreeSHAP selection inside each fold, keeping only features that beat their own shuffled shadows."},{"file":"__init__.py","purpose":"Five docstring lines that scope the package: CLI entry points moved to volforecast.cli and only orchestration lives here."}],"concepts":["fold fingerprint","shadow features","conditional Duan correction","walk-forward residuals","per-symbol normalisation","VVIX proxy"],"anchor":{"file":"src\u002fvolforecast\u002fpipeline\u002fconditional_duan.py","start":82,"end":104,"focus":[94,97],"sha256":"858e16f39f839c378bd69484cb8fe56f2e17af596f4303f7a9f3737d82c86a80"},"anchor_caption":"The per-sample correction formula: the Duan fix redistributed by walk-forward estimated conditional variance."},{"id":"n-src-volforecast-features","label":"features","loc":3110,"files":18,"x":65,"y":207,"w":150,"h":51,"path":"src\u002fvolforecast\u002ffeatures","why":"18 files, 3,110 loc. Imports 3 of these; imported by 2. Busiest file: asymmetry.py (commits 1).","top":["asymmetry.py - commits 1","calendar.py - commits 1","cross_asset.py - commits 1"],"role":["Eighteen registered feature layers turn daily realized measures and enriched market columns into the design matrix every tabular model trains on. The numbered spine runs from Layer 0, the [[HAR]] backbone of log [[realized variance]] lags, through asymmetry, options, microstructure, and cross-asset layers, to the Layer 5 calendar. Each layer is a class registered under a short name via `register_feature_layer`, so a config stacks layers declaratively through `FEATURE_REGISTRY` instead of importing them.","The layers here span three information sources. `options.py` extracts forward looking signals from the SPX [[implied volatility]] surface: the variance risk premium as squared ATM implied vol minus annualized realized variance, the 25-delta risk reversal, term slope, and butterfly convexity. `microstructure.py` distills order flow from cached 10 second bars: Kyle's lambda, the OLS slope of price changes on signed volume, plus the Amihud illiquidity ratio, volume concentration, and flow persistence. `calendar.py` encodes scheduled events: FOMC, NFP, and OpEx proximity in trading days.","The distinctive discipline is leakage control at the feature level: features built from market data are lagged one day before use, while calendar features are deliberately not shifted because event dates are known in advance, and `day_of_week` and `month` stay integer dtype so LightGBM treats them as categoricals. NFP is derived as the first Friday of each month and OpEx as the third, while FOMC dates are hardcoded through 2026 with a distance fallback of 30 beyond them."],"reads":"Daily realized measures and IV enriched market columns from `volforecast.data`, plus per-symbol microstructure caches, daily aggregates and 10 second bar sequences, under data\u002fraw\u002fmicro\u002f.","feeds":"The design matrix consumed by the [[HAR]] baselines and LightGBM models in `volforecast.models`, whose forecasts the evaluation tournament ranks by [[QLIKE]].","key_files":[{"file":"options.py","purpose":"Layer 2, the forward looking half of the feature set: VRP, 25-delta skew, term slope, and butterfly from the SPX IV surface."},{"file":"microstructure.py","purpose":"Layer 3: Kyle's lambda, Amihud illiquidity, VPIN, volume concentration, and flow persistence from daily aggregates and 10 second bar caches."},{"file":"calendar.py","purpose":"Layer 5: FOMC, NFP, and OpEx proximity plus day-of-week and month dummies, unshifted because event dates are known in advance."},{"file":"__init__.py","purpose":"Declares the layer 0-6 architecture and re-exports `FEATURE_REGISTRY`, the dict configs resolve layer names against."}],"concepts":["variance risk premium","Kyle's lambda","Amihud illiquidity","VPIN","FOMC\u002fNFP\u002fOpEx proximity","feature layer registry"],"anchor":{"file":"src\u002fvolforecast\u002ffeatures\u002foptions.py","start":25,"end":47,"focus":[28,47],"sha256":"7be481a4cceb17b82027e010bb892c39f7d25a6eb68365f91980570ec2331c1c"},"anchor_caption":"The flagship options feature: implied variance minus annualized realized variance, the Carr and Wu ex-post VRP proxy."},{"id":"n-src-volforecast-reporting","label":"reporting","loc":461,"files":9,"x":65,"y":284,"w":150,"h":46,"path":"src\u002fvolforecast\u002freporting","why":"9 files, 461 loc. Imports 1 of these; imported by 0. Busiest file: html_report.py (commits 1).","top":["html_report.py - commits 1","__init__.py - commits 1","diagnostics.py - commits 1"],"role":["The experiment report layer, and the most honestly unfinished corner of the repo: `generate_report` in `html_report.py` is a documented stub whose comment block spells out the full assembly plan, load metrics and predictions from the experiment directory, render six section fragments, pour them into a Jinja2 `base.html` template, write one self-contained HTML file, then raises `NotImplementedError`. Five of the six section renderers (summary, forecast vs actual, QLIKE analysis, statistical tests, diagnostics) are stubs pointing at workspace\u002fplans\u002fhtml-report.md for their specs.","The one section that actually runs is economic value: `sections\u002feconomic_value.py` joins stored per-symbol, per-horizon prediction frames with market data carrying `iv_1m_atm` and `close`, and hands each pair to `realistic_delta_hedged_sharpe`, the Phase 1 analytic straddle engine with tenor-decayed gamma and vanna and volga terms. It renders Sharpe, [[DSR]], 95% CI and cumulative P&L tables plus a cost-band sensitivity table at 0.5, 1.0 and 1.5 vol point option spreads, and degrades to a plain placeholder when the IV columns are missing."],"reads":"A finished experiment directory, stored predictions, metrics and the config snapshot, plus daily market data with `iv_1m_atm` and `close` columns for the economic value section.","feeds":"One self-contained `report.html` per experiment once the orchestrator is implemented; today only the economic value fragment can actually be produced.","key_files":[{"file":"html_report.py","purpose":"The orchestrator stub: its comment block is the clearest statement of what the finished report will contain and in what order."},{"file":"economic_value.py","purpose":"The only implemented section: runs the realistic delta-hedged straddle engine per symbol and horizon and renders Sharpe, DSR and cost-band tables."},{"file":"forecast_vs_actual.py","purpose":"The planned centerpiece chart, predicted vs realized log-RV with horizon and symbol dropdowns and COVID shading, still a stub."},{"file":"statistical_tests.py","purpose":"Stub for the Diebold-Mariano, Model Confidence Set and Mincer-Zarnowitz tables, designed to show a placeholder when the underlying tests raise."},{"file":"__init__.py","purpose":"Exports `generate_report`, the package's single public entry point."}],"concepts":["section renderers","realistic straddle engine","cost-band sensitivity","deflated Sharpe ratio","graceful placeholders"],"anchor":{"file":"src\u002fvolforecast\u002freporting\u002fhtml_report.py","start":35,"end":46,"focus":[42,46],"sha256":"cbf7d2fbd35ec8575e14075534833bdf473d496330f7cf2f6043b7c576f7d0d1"},"anchor_caption":"The whole report, specified in a comment: the stub documents exactly what it will become."},{"id":"n-src-volforecast-data","label":"data","loc":9195,"files":21,"x":305,"y":114,"w":150,"h":58,"path":"src\u002fvolforecast\u002fdata","why":"21 files, 9,195 loc. Imports 4 of these; imported by 4. Busiest file: chunk_store.py (commits 1).","top":["chunk_store.py - commits 1","correlation_ingest.py - commits 1","cross_asset_ingest.py - commits 1"],"role":["The ingestion and caching tier of the pipeline: it turns GS internal market data services into per-symbol parquet caches that everything downstream consumes. `chunk_store.py` pulls raw L1 trade and quote ticks for the 34 symbol universe from Chunk Store via pytickclient, plus L2 order book depth for the E-mini S&P 500, and rolls the front ES futures contract on the Thursday before the third Friday of each expiry month.","`rv_panel.py` distills those ticks into the daily [[realized variance]] panel through a streaming batch pipeline: trading calendar, batched fetch, per-day RV computation, checkpoint to parquet, release. Peak memory stays bounded to one sub-batch of tick data at a time, so a multi-year backfill survives on a workstation and resumes from its checkpoint instead of starting over.","`micro.py` works below the daily grain: server-classified ticks become 10 second signed-volume bars, from which it computes daily aggregates, signed volume ratio, order flow imbalance, and [[VPIN]] per Easley, Lopez de Prado and O'Hara 2012, plus per-bar sequences for the LSTM and TCN models. Cache writes are atomic and merging, never destructive, and a staging directory lets an interrupted ingest resume where it stopped."],"reads":"Raw L1 and L2 ticks and server-aggregated 5-min bars from Chunk Store via pytickclient, a GS internal tick service reachable only with a live pyslang session.","feeds":"Daily RV panels feed the feature layers, 10 second bar sequences feed the LSTM and TCN models, and the CLI ingest commands drive its caches; at fan-in 8 it is one of the most imported modules in the repo.","key_files":[{"file":"chunk_store.py","purpose":"the Chunk Store client: L1 trades and quotes, 5-min bars via server-side AggGroupBy, ES futures roll logic, timeout-guarded batched queries"},{"file":"rv_panel.py","purpose":"streaming, checkpointed builder that turns tick batches into the per-symbol daily RV panel cache"},{"file":"micro.py","purpose":"10 second signed-volume bars, BVC classification, VPIN and order-flow aggregates, LSTM and TCN sequences with resumable staging"},{"file":"__init__.py","purpose":"one line stating the package charter: data access for tick data, daily OHLCV, and IV surfaces"}],"concepts":["realized variance","VPIN","Chunk Store","ES futures roll","atomic parquet caches","BVC tick rule"],"anchor":{"file":"src\u002fvolforecast\u002fdata\u002fchunk_store.py","start":411,"end":434,"focus":[417],"sha256":"30786ff2589b211d5d057e75d0fbb8ebf18759dd8c08657e33656ae77c8d7d2e"},"anchor_caption":"Ticks arrive in batched chunk queries: contiguous day runs, one API call per batch."},{"id":"n-src-volforecast","label":"volforecast","loc":1013,"files":3,"x":545,"y":40,"w":150,"h":47,"path":"src\u002fvolforecast","why":"3 files, 1,013 loc. Imports 5 of these; imported by 5. Busiest file: __main__.py (commits 1).","top":["__main__.py - commits 1","registry.py - commits 1"],"role":["The package root states the thesis and owns the entry point. The `__init__` docstring declares it plainly: progressively enrich [[HAR]]-family baselines with microstructure, options-implied, and cross-asset features via gradient boosting until the [[QLIKE]] improvement is statistically significant and the IV-RV gap is tradeable. `__main__.py` routes every `vol run --config` invocation through the tournament code path, one model or thirteen, and every run ends in an interactive Plotly dashboard.","A run earns its data before it trains: unless --skip-ingest is passed, an ingest gate fetches exactly the universe symbols whose realized-volatility cache parquet is missing on disk, and a config with mode: ingest exits after ingestion alone. Tuning is a command-line decision too, --tune, --no-tune, and --n-trials override the YAML's Optuna settings.","The satellite entry points are working tools, not demos: `vol audit` validates every cached parquet against its manifest contract and regenerates data\u002fmanifest.json, `vol backfill-rk` repairs NaN realized-kernel days from raw Chunk Store ticks in batched API calls, and `vol forecast` is the live product, an ensemble that predicts next-day RV, compares it to current ATM implied volatility, and prints LONG, SHORT, or FLAT."],"reads":"A YAML experiment config parsed through ExperimentConfig.from_yaml (a module missing from this restore), plus argv overrides for symbols, workers, and Optuna tuning.","feeds":"Everything downstream: the ingest gate triggers data fetches, the tournament trains and ranks every configured model, and completed runs update the trial registry at workspace\u002fresearch\u002ftrials.yaml.","key_files":[{"file":"__main__.py","purpose":"The entry point: config load, tuning overrides, the ingest gate, then tournament routing, all behind vol run."},{"file":"__init__.py","purpose":"Eight lines that state the whole project thesis and the package version."},{"file":"forecast.py","purpose":"The live signal: a multi-model ensemble predicting next-day RV against current ATM IV, output LONG, SHORT, or FLAT."},{"file":"audit.py","purpose":"The data-quality gate: audits every cached parquet against manifest contracts and regenerates data\u002fmanifest.json."},{"file":"backfill_rk.py","purpose":"Cache repair: finds NaN realized-kernel days, refetches raw ticks in multi-day batches, recomputes RK and noise_gap in place."},{"file":"chunk_store.py","purpose":"Tick access: batched Chunk Store queries with retry and timeout, plus the E-mini front-month roll logic."}],"concepts":["tournament code path","ingest gate","QLIKE","IV-RV gap signal","realized kernel","manifest audit"],"anchor":{"file":"src\u002fvolforecast\u002f__main__.py","start":835,"end":857,"focus":[845,850],"sha256":"b20e4d9ba319edad872793050626fe8c1007443e6d7aa622975d63474a89a0bd"},"anchor_caption":"The ingest gate: before any model trains, data is fetched for exactly the universe symbols whose RV cache is missing."},{"id":"n-src-volforecast-visualization","label":"visualization","loc":102,"files":2,"x":65,"y":356,"w":150,"h":44,"path":"src\u002fvolforecast\u002fvisualization","why":"2 files, 102 loc. Imports 0 of these; imported by 0. Busiest file: lineage.py (commits 1).","top":["lineage.py - commits 1"]},{"id":"n-src-volforecast-evaluation","label":"evaluation","loc":7031,"files":14,"x":545,"y":113,"w":150,"h":56,"path":"src\u002fvolforecast\u002fevaluation","why":"14 files, 7,031 loc. Imports 3 of these; imported by 4. Busiest file: aggregate.py (commits 1).","top":["aggregate.py - commits 1","checkpoint.py - commits 1","discrete_straddle.py - commits 1"],"role":["Where model claims go to die. statistical_tests.py turns per-model predictions into one ranked tournament table per horizon: element-wise [[QLIKE]] losses, Diebold-Mariano tests against the HAR baseline with Newey-West HAC errors that average loss differentials per date so lags never cross symbol boundaries, Mincer-Zarnowitz efficiency regressions, the Hansen Model Confidence Set via block bootstrap, and a calm versus turbulent split so you can see where a model earns its keep.","Then the forecasts are traded on paper. economic_value.py generates the IV-RV gap signal, selling vol when implied is rich against the forecast, and backtests delta-hedged straddles, vol-targeting portfolios, and the GSVIVS01 short-vol index against always-long, always-short, and random baselines that use no forecast at all. realistic_straddle.py is the honest engine: a full P&L waterfall of tenor-decayed gamma, vanna, volga, maturity-widening option spreads, and Boyle-Emanuel hedge-error variance that inflates the risk denominator rather than hiding it.","The distinctive habit is refusing to let anything look good by accident: Sharpe ratios are deflated for selection luck per Bailey and Lopez de Prado (2014), bracketed with block-bootstrap confidence intervals, and re-priced across cost bands from timing-aware to quoted spreads. Even a repaired bug is documented in place: `normalize_exec_kvar_for_horizon` is a deliberate no-op because the old sqrt(h) deflation artificially suppressed the implied side of the IV-RV gap at horizons past one day."],"reads":"Out-of-sample log-RV predictions per model and horizon from the tournament, plus implied-vol series, spot prices, and GSVIVS01 index levels from the data caches.","feeds":"The ranked tournament tables, metrics.json, and the interactive Plotly dashboard that every `vol run --config` invocation ends in.","key_files":[{"file":"statistical_tests.py","purpose":"The tournament's referee: Diebold-Mariano, Model Confidence Set, Mincer-Zarnowitz, and the ranked QLIKE table, all panel-aware."},{"file":"economic_value.py","purpose":"Signal generation (IV-RV and Kvar-RV gaps), straddle and vol-targeting P&L, Sharpe and drawdown metrics, the GSVIVS01 backtest and its naive baselines."},{"file":"realistic_straddle.py","purpose":"The full-cost straddle engine: gamma, vanna, volga, the Doshi spread schedule, Boyle-Emanuel hedge error, deflated Sharpe, bootstrap CIs."}],"concepts":["QLIKE","Diebold-Mariano test","Model Confidence Set","IV-RV gap","delta-hedged straddle","deflated Sharpe ratio"],"anchor":{"file":"src\u002fvolforecast\u002fevaluation\u002fstatistical_tests.py","start":26,"end":49,"focus":[35,42],"sha256":"2cb93a3664f68df612b22a8d02e104bd30744a5d403f423d0027a3040059729f"},"anchor_caption":"Every pairwise comparison in the tournament runs through this test, panel-aware and HAC-corrected."},{"id":"n-src-volforecast-graphs","label":"graphs","loc":826,"files":9,"x":785,"y":40,"w":150,"h":47,"path":"src\u002fvolforecast\u002fgraphs","why":"9 files, 826 loc. Imports 1 of these; imported by 3. Busiest file: base.py (commits 1).","top":["base.py - commits 1","correlation.py - commits 1","diagnostics.py - commits 1"],"role":["Point-in-time graph construction for the graph-based volatility models. The rule that defines the package: a graph used to forecast date t is estimated on data up to t only, re-estimated every 21 trading days on a trailing 252-day window, and frozen between refits, so the network structure itself cannot leak the future. `build_graph_schedule` turns any builder into such a schedule, and dates with too little history get an empty snapshot rather than a peek ahead.","Every builder satisfies the `GraphBuilder` protocol and returns an immutable `GraphSnapshot`: COO edge indices and float32 weights over an ordered symbol tuple. Numpy-first by design: linear models like GHAR consume dense adjacencies without importing torch, and neural models call `to_torch()`. Estimated builders (correlation threshold, kNN, GLASSO, the directed Diebold-Yilmaz spillover graph) sit alongside the structural controls in simple.py, where identity is the no-graph control: GHAR on the identity graph equals plain pooled [[HAR]].","diagnostics.py watches two published failure modes, crisis density explosion of thresholded correlation graphs and GLASSO edge instability across refits, tracked as consecutive-refit edge-set Jaccard. It also supplies the magnetic Laplacian and graph signal energy diagnostics that back the GSP-HAR model."],"reads":"Trailing windows of the daily returns panel from `data`, pre-sliced so a builder only ever sees rows at or before its estimation date.","feeds":"GraphSnapshot schedules feed the GHAR and GNN models in `models`: dense adjacencies for the linear models, torch tensors for the neural ones.","key_files":[{"file":"base.py","purpose":"GraphSnapshot, the GraphBuilder protocol, and build_graph_schedule, the point-in-time scheduler with window=252 and refit_every=21 defaults."},{"file":"diagnostics.py","purpose":"Density and degree stats, refit-to-refit edge Jaccard stability, and the magnetic Laplacian and graph signal energy behind GSP-HAR."},{"file":"simple.py","purpose":"Structural builders needing no estimation: identity (the no-graph control), full with uniform 1\u002f(N-1) weights, and the GICS sector graph."},{"file":"__init__.py","purpose":"Re-exports the snapshot, protocol, and scheduler that every graph consumer imports."}],"concepts":["point-in-time protocol","GraphSnapshot","GraphBuilder protocol","edge Jaccard","magnetic Laplacian","no-graph control"],"anchor":{"file":"src\u002fvolforecast\u002fgraphs\u002fbase.py","start":98,"end":120,"focus":[110,111],"sha256":"36196227eb2e6ef2bf2524a16c330337592081a49ef66cc871831ea06345724b"},"anchor_caption":"The point-in-time scheduler: refit every 21 trading days on a trailing 252-day window."},{"id":"n-src-volforecast-utils","label":"utils","loc":1552,"files":7,"x":785,"y":113,"w":150,"h":49,"path":"src\u002fvolforecast\u002futils","why":"7 files, 1,552 loc. Imports 0 of these; imported by 7. Busiest file: cv.py (commits 1).","top":["cv.py - commits 1","manifest.py - commits 1","manifest_schema.py - commits 1"],"role":["The foundation drawer, imported by ten module groups and importing none of them back. Its centerpiece is `cv.py`, the leakage firewall: purged k-fold deletes observations within a purge gap of each test block so overlapping realized volatility windows cannot leak, blocked k-fold keeps contiguous time blocks, expanding and rolling windows walk forward, and `PanelExpandingWindowCV` splits the panel on unique dates so every symbol on a date lands in the same fold. Random k-fold is banned as look-ahead bias.","`manifest.py` is the data ledger with two layers, a contract stating what data should exist (expected columns, value bounds, a NaN budget) and a state recording what does exist per symbol. Ingest commands update the state and `vol audit` validates it against the contract, through a typed YAML `ManifestManager` plus legacy JSON wrappers kept alive during migration.","`persistence.py` is the experiment memory: it writes fitted models, out-of-sample predictions, and a consolidated metrics.json under data\u002fmodels\u002f, then fingerprints every training-relevant config field plus each symbol's data file so a rerun with nothing changed skips retraining, and `check_fingerprint` names exactly what changed when the hashes disagree."],"reads":"`ExperimentConfig` objects from the experiment runner, ingestion results handed over by the CLI ingest commands, and cache locations resolved against the repo root by its own `paths.py`.","feeds":"Ten module groups build on it: ingestion records into the manifest, model training runs inside its CV splits, and evaluation, reporting, and the CLI read the predictions, metrics, and fingerprints it persists.","key_files":[{"file":"cv.py","purpose":"The leakage firewall: purged, blocked, expanding, rolling, and panel-aware CV splitters, with random k-fold banned in the docstring."},{"file":"manifest.py","purpose":"The ingestion contract and state ledger behind `vol status` and `vol audit`: what data should exist versus what actually does."},{"file":"persistence.py","purpose":"Experiment artifacts and fingerprinting: models, OOS predictions, metrics.json, and the config plus data hash that lets unchanged reruns skip retraining."}],"concepts":["purge gap","embargo","walk-forward CV","look-ahead bias","ingestion manifest","config fingerprint"],"anchor":{"file":"src\u002fvolforecast\u002futils\u002fcv.py","start":38,"end":61,"focus":[50,53],"sha256":"9642c184b41a7dedc127663ce25982cd0ce2e10fa24fa4e073140407694d36cc"},"anchor_caption":"Purging and embargo, the mechanics that keep overlapping RV windows from leaking across the train and test cut."}],"edges":[{"a":"n-src-volforecast","b":"n-src-volforecast-graphs","n":6},{"a":"n-src-volforecast","b":"n-src-volforecast-utils","n":2},{"a":"n-src-volforecast-cli","b":"n-src-volforecast","n":6},{"a":"n-src-volforecast-cli","b":"n-src-volforecast-data","n":48},{"a":"n-src-volforecast-cli","b":"n-src-volforecast-evaluation","n":1},{"a":"n-src-volforecast-cli","b":"n-src-volforecast-pipeline","n":4},{"a":"n-src-volforecast-cli","b":"n-src-volforecast-utils","n":33},{"a":"n-src-volforecast-data","b":"n-src-volforecast","n":2},{"a":"n-src-volforecast-data","b":"n-src-volforecast-utils","n":22},{"a":"n-src-volforecast-evaluation","b":"n-src-volforecast-utils","n":3},{"a":"n-src-volforecast-features","b":"n-src-volforecast","n":17},{"a":"n-src-volforecast-features","b":"n-src-volforecast-data","n":17},{"a":"n-src-volforecast-features","b":"n-src-volforecast-utils","n":3},{"a":"n-src-volforecast-models","b":"n-src-volforecast","n":37},{"a":"n-src-volforecast-models","b":"n-src-volforecast-data","n":3},{"a":"n-src-volforecast-models","b":"n-src-volforecast-evaluation","n":6},{"a":"n-src-volforecast-models","b":"n-src-volforecast-graphs","n":1},{"a":"n-src-volforecast-models","b":"n-src-volforecast-pipeline","n":2},{"a":"n-src-volforecast-models","b":"n-src-volforecast-utils","n":5},{"a":"n-src-volforecast-pipeline","b":"n-src-volforecast-evaluation","n":2},{"a":"n-src-volforecast-pipeline","b":"n-src-volforecast-graphs","n":1},{"a":"n-src-volforecast-pipeline","b":"n-src-volforecast-utils","n":4},{"a":"n-src-volforecast-reporting","b":"n-src-volforecast-evaluation","n":1}],"w":1000,"h":434,"columns":[{"label":"MODELS AND CLI","x":140,"line":false},{"label":"DATA PIPELINE","x":380,"line":true},{"label":"EVALUATION","x":620,"line":true},{"label":"SHARED UTILS","x":860,"line":true}],"note":{"title":"WHAT IS NOT ON THIS BOARD","text":"Not drawn: src\u002ftests (225 files, 55,156 loc). Test containers import every column and their edges bury the structure, so they are listed here instead of on the board. The survey also counts 14 imported module names with no file at this commit, across 706 import sites."},"tour":[{"id":"n-src-volforecast-cli","text":"Start here. Every interaction is a `vol` subcommand: one primary command, `vol run --config`, drives ingest, training, and evaluation from a single YAML file, and around it sit the ingest, audit, and live forecast commands. Each subcommand registers itself, so the surface grows without touching the entry point."},{"id":"n-src-volforecast-models","text":"The zoo: naive baselines that set the floor, LightGBM and XGBoost trained on a custom [[QLIKE]] objective, and a graph suite whose controls deliberately nest the simpler models. One shared contract means a random walk and a graph attention network take the same walk through the same folds."},{"id":"n-src-volforecast-features","text":"The design matrix factory: layered feature classes turn daily measures into model inputs, from [[HAR]] lags through options-implied signals like the [[variance risk premium]] to calendar effects. A config stacks layers by name; the registry finds them."},{"id":"n-src-volforecast-reporting","text":"The HTML experiment report, honestly unfinished: most sections are documented stubs, and the one real section prices the forecasts with the realistic straddle engine, lagging implied vol by a day to avoid look-ahead."},{"id":"n-src-volforecast-visualization","text":"The smallest box on the board: what survives here renders model lineage as a flowchart for dashboards. The dashboard builder itself is one of the modules this snapshot lost."},{"id":"n-src-volforecast-pipeline","text":"The anti-cheating layer: per-symbol normalisers fitted on training rows only, a fingerprint-keyed cache that decides when an expensive fold may be skipped, and a per-sample Duan correction estimated strictly walk-forward from earlier folds."},{"id":"n-src-volforecast-data","text":"The heaviest lifting: ticks from Chunk Store, daily series from TSDB, the SPX vol surface from Marquee, all cached as per-symbol parquet. Its estimators turn millions of ticks into the daily [[realized variance]] panel everything downstream trains on."},{"id":"n-src-volforecast","text":"The hub. The registry maps model, feature, and graph names to classes, which is why most of the repo imports this tiny package: a YAML config names components, the registry turns names into code, and the tournament routing lives beside it."},{"id":"n-src-volforecast-evaluation","text":"Where claims go to die: [[QLIKE]] ranking, Diebold-Mariano tests, the Model Confidence Set, then the money tests, realistic delta-hedged straddles and the GSVIVS01 signal, with Sharpe ratios deflated for selection luck."},{"id":"n-src-volforecast-graphs","text":"Point-in-time graph construction for the graph models: a graph used to forecast a date is estimated only on data up to that date, re-estimated on a schedule, and frozen between refits, so the network structure itself cannot leak the future."},{"id":"n-src-volforecast-utils","text":"Last, the quiet foundation: paths.py anchors every cache to the repo root, and cv.py holds the purged and walk-forward splitters that keep every result honest. Everything above imports these seven files; nothing here imports back."}]},"files":{"src\u002fvolforecast\u002f__main__.py":{"68":"    if lines:","69":"        console.print(\"\\n[bold cyan]━━━ Output ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━[\u002f]\")","70":"        for label, path in lines:","71":"            console.print(f\"  [dim]{label}:[\u002fdim]  {path}\")","72":"        console.print(\"[bold cyan]━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━[\u002f]\\n\")","73":"","74":"","75":"def _build_parser() -> argparse.ArgumentParser:","76":"    parser = argparse.ArgumentParser(","77":"        prog=\"vol\",","78":"        description=(","79":"            \"ML Realized Volatility Forecasting \u2014 Signal Discovery\\n\\n\"","80":"            \"Primary command: vol run --config \u003cyaml>\\n\"","81":"            \"Runs tournament (1 or N models) and produces an interactive dashboard.\"","82":"        ),","83":"        formatter_class=argparse.RawDescriptionHelpFormatter,","84":"    )","85":"    subparsers = parser.add_subparsers(dest=\"command\", help=\"Available commands\")","86":"","87":"    # ─── PRIMARY: vol run --config ───","88":"    run_parser = subparsers.add_parser(","89":"        \"run\",","90":"        help=\"Run experiment from YAML config (tournament + dashboard)\",","812":"","813":"    if args.command is None:","814":"        parser.print_help()","815":"        return 0","816":"","817":"    # ─── PRIMARY: vol run --config ───","818":"    if args.command == \"run\":","819":"        if args.config is None:","820":"            from volforecast.cli.config_picker import pick_config","821":"","822":"            selected = pick_config()","823":"            if selected is None:","824":"                return 0","825":"            args.config = str(selected)","826":"","827":"        from volforecast.config import ExperimentConfig","828":"","829":"        config = ExperimentConfig.from_yaml(args.config)","830":"        symbols = args.symbols.split(\",\") if args.symbols else None","831":"        workers = args.workers or config.ingest.workers","832":"","833":"        # Apply tuning CLI overrides","834":"        if getattr(args, \"tune\", None):","835":"            config.tuning.enabled = True","801":"            pp.log(\"INGEST\", f\"ERROR: {e}\")","802":"            return 1","803":"        pp.finish_stage(\"INGEST\")","804":"","805":"    _print_output_summary(str(config.output_dir))","806":"    return 0","807":"","808":"","809":"def main( perimentProgress","854":"","855":"                with ExperimentProgress(config.name, missing, [\"INGEST\"]) as pp:","856":"                    pp.start_stage(\"INGEST\")","857":"                    try:"},"src\u002fvolforecast\u002fcli\u002fbackfill_rk.py":{"188":"        \"date\": day,","189":"        \"rk\": rk_value,","190":"        \"noise_gap\": gap,","191":"        \"n_ticks\": len(prices),","192":"    }","193":"","194":"","195":"def _fetch_and_compute_rk_batch(","196":"    symbol: str,","197":"    days: list[date],","198":"    rv_lookup: dict[date, float | None],","199":"    timeout_s: float = 120.0,","200":") -> list[dict]:","201":"    \"\"\"Fetch raw ticks for multiple days in ONE chunk_query and compute RK per day.","202":"","203":"    Batching N days into a single API call eliminates N-1 round-trips worth of","204":"    TCP\u002fsession overhead. For TRDPRC_1-only payloads this is safe up to ~5 days.","205":"","206":"    Returns a list of result dicts (same schema as _fetch_and_compute_rk_one_day).","207":"    \"\"\"","208":"    from volforecast.data.chunk_store import (","209":"        CHUNKDB,","210":"        TICKER_TO_RIC,","37":"# L1_FIELDS has 6 columns (BID, ASK, sizes, volume) which triples payload.","38":"_RK_FIELDS = [\"TRDPRC_1\"]","39":"","40":"","41":"def parse_args(argv: list[str] | None = None) -> argparse.Namespace:","42":"    parser = argparse.ArgumentParser(","43":"        prog=\"volforecast backfill-rk\",","44":"        description=\"Backfill realized kernel and noise_gap into existing RV parquets\",","45":"    )","46":"    parser.add_argument(","47":"        \"--symbols\",","48":"        type=str,","49":"        default=None,","50":"        help=\"Comma-separated symbol subset (default: all cached parquets)\",","51":"    )","52":"    parser.add_argument(","53":"        \"--symbol-workers\",","54":"        type=int,","55":"        default=1,"},"README.md":{"43":"","44":"Optional overrides: `--symbols SPY,AAPL` (override YAML universe), `--skip-ingest` (skip data fetch), `--workers 8` (thread count).","45":"","46":"### Examples","47":"","48":"```bash","49":"# Single-model experiment (ingest + train + evaluate + dashboard)","50":"vol run --config workspace\u002fconfigs\u002fbaseline_har.yaml","51":"","52":"# Tournament: 13 models compared with statistical tests","53":"vol run --config workspace\u002fconfigs\u002ftournament_full_spy.yaml","54":"","55":"# Skip ingestion (data already cached), subset of symbols","56":"vol run --config workspace\u002fconfigs\u002ftournament_har_dev.yaml --skip-ingest --symbols SPY,AAPL","57":"","58":"# Ingest only","59":"vol run --config workspace\u002fconfigs\u002fingest_full_universe.yaml --workers 8","60":"","61":"# Tests","62":"vol test -k test_har -v","30":"vol status                    # show data ingestion manifest","31":"vol lint                      # ruff check (read-only)","32":"vol fmt                       # ruff auto-format","33":"vol typecheck                 # mypy","34":"vol sync                      # install\u002fupdate deps","35":"vol shell                     # REPL with volforecast importable","36":"vol notebook                  # jupyter","37":"vol help                      # usage","38":"```","39":"","40":"### Primary Command: `vol run --config \u003cyaml>`","41":"","42":"Every `vol run --config` invocation uses the tournament code path \u2014 even single-model configs produce ranked tables and an interactive Plotly HTML dashboard. The only special case is `mode: ingest` (data ingestion only)."},"src\u002fvolforecast\u002fevaluation\u002feconomic_value.py":{"57":"    function get the identity (copy) back.","58":"    \"\"\"","59":"    kvar = np.asarray(kvar, dtype=np.float64)","60":"    return kvar.copy()","61":"","62":"","63":"def iv_rv_gap_signal(","64":"    iv_forecast: np.ndarray,","65":"    rv_forecast: np.ndarray,","66":"    threshold: float = 0.0,","67":"    short_threshold: float | None = None,","68":"    default_long: bool = False,","69":") -> np.ndarray:","70":"    \"\"\"Generate trading signal from IV-RV gap.","71":"","72":"    Signal = +1 (sell vol) when IV > RV_forecast + threshold","73":"    Signal = -1 (buy vol) when IV \u003c RV_forecast - short_threshold","74":"    Signal = 0 otherwise (or +1 if default_long=True).","75":"","76":"    Both inputs must be in the same units (annualized variance or","77":"    annualized volatility). Thresholds are in the same units.","78":"","1417":"            realized_vol=series[\"realized_vol\"],  # type: ignore[arg-type]","1418":"            implied_vol=series[\"implied_vol\"],  # type: ignore[arg-type]","1419":"            spot_prices=series[\"spot\"],  # type: ignore[arg-type]","1420":"            daily_returns=series[\"daily_returns\"],  # type: ignore[arg-type]","1421":"            vol_forecast=series[\"vol_forecast\"],  # type: ignore[arg-type]","1422":"            model_name=spec.get(\"model_name\", \"\"),","1423":"        )","1424":"        body = json.dumps(result, indent=2, default=float)","1425":"    except Exception as exc:  # noqa: BLE001 \u2014 every failure must reach the sentinel file","1426":"        rc = 1","1427":"        body = json.dumps({\"error\": f\"{type(exc).__name__}: {exc}\"})","1428":"","1429":"    out_file.parent.mkdir(parents=True, exist_ok=True)","1430":"    out_file.write_text(f\"{body}\\nEXIT_CODE={rc}\\n\", encoding=\"utf-8\")","1431":"    print(f\"OUTPUT_FILE={out_file}\")","1432":"    return rc","1433":"","1434":"","1435":"if __name__ == \"__main__\":  # pragma: no cover","1436":"    import sys","1437":"","1438":"    sys.exit(main())","28":"def iv_tenor_for_horizon(horizon: int) -> tuple[str, int]:","29":"    \"\"\"Map forecast horizon to the appropriate IV column and tenor days.","30":"","31":"    Uses the closest available tenor to match the forecast window:","32":"      - h == 1:  iv_vs_0dte with tenor_days=1 (prev-close 1-DTE varswap","33":"                 from EDRVS_EXPIRY_INTRADAY \u2014 correct measure for GSVIVS","34":"                 signal. Captured at 16:00 ET day before, no lookahead.)","35":"      - h \u003c= 5:  iv_1w_atm with tenor_days=5 (weekly straddle)","36":"      - h > 5:   iv_1m_atm with tenor_days=22 (monthly straddle)","37":"","38":"    Returns (iv_column_name, tenor_days).","39":"    \"\"\"","40":"    if horizon == 1:","41":"        return \"iv_vs_0dte\", 1","42":"    if horizon \u003c= 5:","43":"        return \"iv_1w_atm\", 5","44":"    return \"iv_1m_atm\", 22","47":"def normalize_exec_kvar_for_horizon(kvar: np.ndarray, tenor_days: int) -> np.ndarray:","48":"    \"\"\"No-op \u2014 Kvar is already in annualized vol and needs no horizon scaling.","49":"","50":"    Previously this divided by sqrt(h) to convert the 24h-tenor Kvar into a","51":"    multi-day proxy.  That was incorrect: both the Kvar (annualized from T=24h)","52":"    and the RV forecast (annualized via sqrt(252 * daily_var)) are already in","53":"    the same units regardless of forecast horizon h.  The sqrt(h) deflation","54":"    artificially suppressed the implied-vol side of the IV-RV gap at h>1.","55":"","56":"    Retained for backward compatibility \u2014 callers that still pass through this","188":"","189":"GSVIVS_SIZING_MODES = (\"binary\", \"asym_long\", \"zscore\", \"long_flat\")","190":"DEFAULT_GSVIVS_SIZING_MODE = \"asym_long\"","191":"","192":"# Modes that have no leverage knob (label omits ``L=...``).","193":"_GSVIVS_UNLEVERED_MODES = (\"binary\", \"long_flat\")","194":"","195":"","196":"\u0040dataclass(frozen=True)","197":"class GsvivsSizingSpec:","198":"    \"\"\"A single GSVIVS signal-sizing configuration.","199":"","200":"    One spec drives one variant of the trading signal in the dashboard. The","201":"    default 4-element list (:data:`DEFAULT_GSVIVS_SIZING_SPECS`) is the","202":"    four-option toggle exposed on the GSVIVS table: ``binary``,","203":"    ``asym_long`` (L=2), ``zscore`` (L=1), ``long_flat``.","204":"","205":"    Notes","206":"    -----","207":"    ``max_leverage`` and ``lookback`` are ignored for ``mode == \"binary\"`` and","208":"    ``mode == \"long_flat\"`` (both emit only un-sized {-1\u002f0, +1} or {0, +1}","209":"    positions).","210":"    \"\"\"","211":""},"src\u002fvolforecast\u002fmodels\u002flightgbm.py":{"63":"        \"gpu_device_id\",","64":"        \"drop_features\",","65":"        \"monotone_constraints_named\",","66":"        \"residual_scale\",","67":"        \"sample_reweight\",","68":"    }","69":")","70":"","71":"","72":"def qlike_objective(y_pred: np.ndarray, dtrain: Any) -> tuple[np.ndarray, np.ndarray]:","73":"    \"\"\"Custom QLIKE objective for LightGBM.","74":"","75":"    Log-space QLIKE: L = exp(y_true - y_pred) - (y_true - y_pred) - 1","76":"    gradient (dL\u002fdy_pred) = 1 - exp(y_true - y_pred)","77":"    hessian  (d²L\u002fdy_pred²) = exp(y_true - y_pred)","78":"","79":"    Parameters","80":"    ----------","81":"    y_pred : np.ndarray","82":"        Current predictions (log-RV space).","83":"    dtrain : lgb.Dataset","84":"        Training dataset (labels accessed via get_label()).","85":"","86":"    Returns","87":"    -------","88":"    tuple[np.ndarray, np.ndarray]","89":"        (gradient, hessian) pair.","90":"    \"\"\"","91":"    y_true = dtrain.get_label()","92":"    # Symmetric clip: pure overflow protection. exp(709) overflows float64.","93":"    # Data range is ~10 (log RV spans -14 to -4), so ±10 covers all cases.","94":"    # QLIKE's natural exponential already penalizes under-prediction harder.","95":"    diff = np.clip(y_true - y_pred, -10.0, 10.0)","96":"    exp_diff = np.exp(diff)","97":"    grad = 1.0 - exp_diff","98":"    hess = np.maximum(exp_diff, 1e-6)","99":"    return grad, hess","100":"","101":"","102":"def _make_weighted_qlike_objective(","103":"    weights: np.ndarray,","104":") -> callable:"},"src\u002fvolforecast\u002fmodels\u002fxgboost.py":{"49":"        \"drop_features\",","50":"        \"residual_scale\",","51":"        \"sample_reweight\",","52":"        \"objective\",","53":"        \"device\",","54":"    }","55":")","56":"","57":"","58":"def qlike_objective_xgb(y_pred: np.ndarray, dtrain: Any) -> tuple[np.ndarray, np.ndarray]:","59":"    \"\"\"Custom QLIKE objective for XGBoost.","60":"","61":"    Log-space QLIKE: L = exp(y_true - y_pred) - (y_true - y_pred) - 1","62":"    gradient (dL\u002fdy_pred) = 1 - exp(y_true - y_pred)","63":"    hessian  (d²L\u002fdy_pred²) = exp(y_true - y_pred)","64":"","65":"    Parameters","66":"    ----------","67":"    y_pred : np.ndarray","68":"        Current predictions (log-RV space).","69":"    dtrain : xgb.DMatrix","70":"        Training dataset (labels accessed via get_label()).","71":"","72":"    Returns","1132":"    seed: int = 42,","1133":"    on_trial_complete: Any | None = None,","1134":"    on_hpo_event: Any | None = None,","1135":"    base_params: dict[str, Any] | None = None,","1136":"    n_workers: int = 1,","1137":"    gpu_device_ids: list[int] | None = None,","1138":"    base_model: Any | None = None,","1139":") -> dict[str, Any]:","1140":"    \"\"\"Tune XGBoost hyperparameters via Optuna with walk-forward CV.","1141":"","1142":"    Uses ExpandingWindowCV (walk-forward) to prevent look-ahead bias.","1143":"    Optimizes QLIKE loss with TPE sampler.","1144":"","1145":"    When gpu_device_ids is provided, each worker is pinned to a separate","1146":"    GPU (round-robin). With 8 GPUs and 8 workers, all trials run in","1147":"    parallel on different devices.","1148":"","1149":"    Parameters","1150":"    ----------","1151":"    X : pd.DataFrame","1152":"        Full training features.","1153":"    y : pd.Series","1154":"        Full training target (log RV).","1155":"    cv_config : CVConfig, optional"},"src\u002fvolforecast\u002fmodels\u002fgnn.py":{"191":"# ---------------------------------------------------------------------------","192":"# Registered model class","193":"# ---------------------------------------------------------------------------","194":"","195":"","196":"\u0040register_model(\"gnn\")","197":"class GNNVolModel(_BaseModel):","198":"    \"\"\"Graph Attention Network for multi-symbol RV forecasting.","199":"","200":"    Operates on graph snapshots: each date = one graph with N nodes","201":"    (symbols) and edges from rolling correlation. Integrates with the","202":"    feature_stack pipeline via extract_features().","203":"","204":"    Set ``requires_graph = True`` so the pipeline runner can detect","205":"    graph-mode and dispatch appropriately.","206":"    \"\"\"","207":"","208":"    REQUIRED_LAYERS: list[str] = []","209":"    requires_sequences: bool = False  # Does NOT use SequenceTensor","210":"    requires_graph: bool = True  # New flag for pipeline detection","211":"    supports_tuning: bool = True","212":"    name = \"gnn\"","213":"    family = \"gnn\"","214":"    description = \"Graph Attention Network with cross-asset spillover learning\"","48":"def _qlike_loss(pred: torch.Tensor, target: torch.Tensor) -> torch.Tensor:","49":"    \"\"\"QLIKE in log-RV space: exp(y - y_hat) - (y - y_hat) - 1.\"\"\"","50":"    diff = target - pred","51":"    diff = torch.clamp(diff, min=-10.0, max=10.0)","52":"    return torch.mean(torch.exp(diff) - diff - 1.0)"},"src\u002fvolforecast\u002fcli\u002fforecast.py":{"45":"        raise FileNotFoundError(f\"No RV data for {symbol} at {path}\")","46":"    df = pd.read_parquet(path)","47":"    df.index = pd.DatetimeIndex(df.index)","48":"    df.index.name = \"date\"","49":"    return df","50":"","51":"","52":"def _fetch_live_iv(symbol: str) -> float | None:","53":"    \"\"\"Attempt to fetch current ATM IV from TSDB.","54":"","55":"    Returns IV in vol points (e.g. 18.5 = 18.5%) or None if unavailable.","56":"    \"\"\"","57":"    try:","58":"        from gs_quant.session import GsSession","59":"","60":"        GsSession.use()","61":"        from gs_quant_internal.tsdb import TSDBSymbol","62":"","63":"        from volforecast.constants import TICKER_TO_EDRVOL_RIC",  by competition: every vol run is a tournament, 13 models compared with statistical tests in the full configuration, ranked on QLIKE, an asymmetric loss that punishes underestimating volatility, and only statistically significant wins over HAR count.","status":"verified","anchor":{"file":"README.md","start":43,"end":62,"focus":[52],"sha256":"c0500f2f43d30187bd7ebb47768ec435827f90c35c3f847abcf99241b06846f4"}},{"id":"c-004","text":"The winning forecasts feed paper trading: economic_value.py turns the gap between implied and forecast volatility into a long or short vol signal, prices it as delta-hedged straddle and vol-targeting P&L, and reports Sharpe, maximum drawdown, and GSVIVS01 index performance.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fevaluation\u002feconomic_value.py","start":57,"end":78,"focus":[70],"sha256":"ef0b4a8166d758350f5a35a2d174baca1d169df0f4a122c9f64da63e6983157b"}},{"id":"c-005","text":"What a newcomer would not guess: GitHub Copilot agents run this repo as much as people do, and the evaluation code is written to be driven by them: the BACKTEST skill records every outcome, crash included, in a machine-readable sentinel, so no agent ever waits on a run that died.","status":"verified","anchor":{"file":"src\u002fvolforecast\u002fevaluation\u002feconomic_value.py","start":1417,"end":1438,"focus":[1425,1430],"sha256":"8b6e042cd3c28cdc49d205e9ca51afdc4d74e27134bf5d353913b2f0250f12bf"}},{"id":"c-006","text":"What it is not: a live trading system, nothing listens on a socket, every entry point is a batch command that runs to completion, and the closest thing to an order it ever emits is a printed LONG, SHORT, or FLAT signal.","status":"inferred"}]},{"type":"callout","level":"inferred","title":"WHY AN AMBER SENTENCE IS AMBER","text":"An absence cannot be anchored to a line of code. Where this tool searched and found nothing, it reports that as inferred rather than dressing it up as verified. Every amber mark in this document means th
