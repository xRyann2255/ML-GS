cal pre-commit hook runs the same 21 checks with always_run true at every commit, a lesson learned after an earlier CI trigger silently watched the wrong branches.","status":"verified","anchor":{"file":".pre-commit-config.yaml","start":11,"end":21,"focus":[16,17,20],"sha256":"1576c98328301f481023e4c0a52007fedfc86bf330fc4e9c9659936023065f35"}},{"id":"c-015","text":"GitHub Actions CI is explicitly a mirror-only safety net: the real remote is GS GitLab where Actions never fire, so ci.yml runs ruff, mypy, and pytest with the project's only coverage gate (30 percent) on the personal mirror alone.","status":"verified","anchor":{"file":".github/workflows/ci.yml","start":1,"end":2,"focus":[2],"sha256":"3f50d29341001dca05d78766e72f58e6ec3db20e813eda1113e478f01bb1dab0"}},{"id":"c-016","text":"On the GS Windows surface, compute goes through 45 predefined VS Code tasks that pass parameters as JSON args files under workspace/tmp/, so no agent ever composes free-form shell.","status":"verified","anchor":{"file":".vscode/tasks.json","start":1,"end":18,"focus":[5,9],"sha256":"75a723f7855b36024ca3ac2e1b7805c24a75f6afde648685316a18f562a34896"}}]}]},{"id":"cp-b","title":"Checkpoint B","kind":"cp","minutes":3,"blocks":[{"type":"checkpoint","id":"cp-b1","kind":"single","prompt":"pytest collection explodes with 61 errors on this snapshot. The chain starts in tests/conftest.py. Which missing module is at the end of it?","options":["\u003ccode>volforecast.constants\u003c/code>","\u003ccode>volforecast.config\u003c/code>","\u003ccode>volforecast.pipeline.runner\u003c/code>","\u003ccode>volforecast.evaluation.tournament\u003c/code>"],"answer":0,"provenance":"tests/conftest.py imports volforecast.data.chunk_store; chunk_store.py line 35 imports volforecast.constants, which is absent. Captured in the pytest run above.","explanation":"The conftest mocks the tick processor by importing chunk_store, and chunk_store needs CHUNKDB and SYMBOL_UNIVERSE from constants. The other three are also missing, but they break different doors."},{"type":"checkpoint","id":"cp-b2","kind":"single","prompt":"How many governance checks does workspace/lint/lint_all.py run, and how many failed on this snapshot?","options":["21 checks, 2 failing","45 checks, 2 failing","21 checks, 0 failing","9 checks, 5 failing"],"answer":0,"provenance":"The LINTS registry in workspace/lint/lint_all.py holds 21 entries; the captured run above ends FAILED (2/21): broken refs, canonical schema.","explanation":"Both failures chase references into the restore gaps. 45 is the number of VS Code tasks, a different surface."}]}]},{"title":"THE FORECASTING MACHINE","minutes":32,"stops":[{"id":"config","title":"An experiment is a YAML file","kind":"stop","minutes":5,"lede":"Everything the pipeline does is driven by one config file per experiment. Learn this shape and you can read every one of the 100+ trials in workspace/configs/.","blocks":[{"type":"prose","claims":[{"id":"c-017","text":"Every experiment is one YAML file parsed by ExperimentConfig.from_yaml; the canonical example in workspace/configs/ documents every accepted field, and names the missing config.py as its source of truth.","status":"verified","anchor":{"file":"workspace/configs/_CANONICAL_EXAMPLE.yaml","start":3,"end":17,"focus":[4,8],"sha256":"93592de5ba2bcff9f991bf19b6fe214129ea3c56f642634cad28b5466868dbc2"}},{"id":"c-018","text":"A config picks a symbol universe of up to 34 tickers and forecasts at three horizons: 1, 5, and 22 trading days, that is daily, weekly, and monthly.","status":"verified","anchor":{"file":"workspace/configs/_CANONICAL_EXAMPLE.yaml","start":14,"end":27,"focus":[19,26],"sha256":"afae3a56c8c7ab2f2f671ea82733c1e6782a5c4b92ad17e3b5817fa7bed092ed"}},{"id":"c-019","text":"Feature layers are order-sensitive, and the config file itself documents the two hard rules: iv_surface must precede options because it supplies the data options consumes, and tree_expansion must come last because it expands everything before it.","status":"verified","anchor":{"file":"workspace/configs/_CANONICAL_EXAMPLE.yaml","start":46,"end":58,"focus":[48,49],"sha256":"3d248954be4234ff8e59f830c20f3884ba1fb30118b6ccaa1e6203cb82b5dc18"}},{"id":"c-020","text":"Model choice is a one-line registry name: the same YAML slot accepts lightgbm, xgboost, seven graph models, ensembles, deep sequence models, or a naive baseline, with no code changes.","status":"verified","anchor":{"file":"workspace/configs/_CANONICAL_EXAMPLE.yaml","start":81,"end":88,"focus":[85,86,87],"sha256":"de32fb8920f3566c38e041a2ae2214bc8dfb8a9908350db3b60a89f1c57e772f"}},{"id":"c-021","text":"Cross-validation defaults are conservative by construction: an expanding window with a 10-date [[purge-gap|purge gap]] between train and test, declared right in the config schema.","status":"verified","anchor":{"file":"workspace/configs/_CANONICAL_EXAMPLE.yaml","start":237,"end":241,"focus":[241],"sha256":"0533113baa949944213b52e5b8e1cc37522a2c3bee6d44e6724fbda7aabc3093"}},{"id":"c-022","text":"The default windows are long: an initial training window of 504 trading days, two full years, with 126 day test folds, six months each.","status":"verified","anchor":{"file":"workspace/configs/_CANONICAL_EXAMPLE.yaml","start":243,"end":246,"focus":[243,244],"sha256":"995b4427b2a52c4a24bb6539c0e53ab863a0ce8095c318b818c5752e1a1e40a9"}},{"id":"c-023","text":"The tournament block also switches on the economics: delta-hedged straddle P&L, vol-targeting Sharpe, and the [[gsvivs|GSVIVS01]] signal backtest are each one toggle in the same file.","status":"verified","anchor":{"file":"workspace/configs/_CANONICAL_EXAMPLE.yaml","start":302,"end":319,"focus":[307,309,312],"sha256":"f783da5bbd77c953313a989cf73ec5cf2fefc22ad9a340b56cad8f24d069ddac"}}]},{"type":"excerpt","anchor":{"file":"workspace/configs/trial_036_CHAMPION.yaml","start":78,"end":92,"focus":[83],"sha256":"4f2a950455e334492690821a1ae0fa7a7c1957f0f6a6223d918162cb76826f8b"},"caption":"A real champion config: trial_036 trades GSVIVS01 with a tuned dead-band threshold, and the comment records exactly what the threshold bought and what would supersede it."},{"type":"callout","level":"info","title":"CONFIGS ARE PRE-REGISTRATION","text":"Trial configs carry their hypothesis and success criteria in the header comments, so the YAML is not just parameters: it is the experiment's pre-registration. trial_077 exists specifically to settle a champion discrepancy between two earlier trials under one shared protocol."}]},{"id":"data","title":"From ticks to a number per day","kind":"stop","minutes":6,"lede":"The target of the whole project is one number per symbol per day: realized variance. This stop is how millions of ticks become that number, and why there are six different estimators of it.","blocks":[{"type":"prose","claims":[{"id":"c-024","text":"The daily realized variance measure is the plain sum of squared intraday returns with no mean subtraction, following Andersen et al. 2003.","status":"verified","anchor":{"file":"src/volforecast/data/measures.py","start":20,"end":34,"focus":[25],"sha256":"3e702197c8dc7e1fcd36039d84e45ea0c42d1169785c3b65109731ae7d4b5ae1"}},{"id":"c-025","text":"Alongside it comes [[bpv|bipower variation]], computed as (pi/2) times the sum of adjacent absolute return products: a jump-robust estimate of integrated variance, per Barndorff-Nielsen and Shephard 2004.","status":"verified","anchor":{"file":"src/volforecast/data/measures.py","start":70,"end":85,"focus":[75,76],"sha256":"8a3647ebf19e14f2486f061072d037e647a8aeffddeddaceaf56b823e99ad8a0"}},{"id":"c-026","text":"Days with statistically significant jumps are flagged by the BNS z-test, Z = (RV - BPV) / sqrt(theta * RTQ / n), and RV is then decomposed into continuous and jump components, the raw inputs for HAR-CJ models.","status":"verified","anchor":{"file":"src/volforecast/data/measures.py","start":109,"end":124,"focus":[114,115],"sha256":"9574afdd2fe267484e04e127b47f713f49c84b3066c66240100db68a543ab436"}},{"id":"c-027","text":"Good and bad volatility come from Patton-Sheppard [[semivariance|realized semivariances]], with the >= 0 convention chosen so RS+ plus RS- always equals RV exactly.","status":"verified","anchor":{"file":"src/volforecast/data/measures.py","start":48,"end":66,"focus":[53,54,56,57],"sha256":"32e40e8dd11ddba221fbd9a39780d03274ba81ccf4f4c02706439e7e8ff856cf"}},{"id":"c-028","text":"For noisy tick data there is the [[rk|realized kernel]]: autocovariances weighted by a flat-top Parzen kernel, consistent under microstructure noise at the optimal convergence rate.","status":"verified","anchor":{"file":"src/volforecast/data/measures.py","start":268,"end":285,"focus":[273,275,276],"sha256":"82ad9a932ac8db6872d672872dd761445a0f423e7bfb9597d5a99ec827f4c757"}},{"id":"c-029","text":"The microstructure side condenses order flow into daily aggregates: [[vpin|VPIN]] over volume-time buckets, following Easley, Lopez de Prado and O'Hara 2012.","status":"verified","anchor":{"file":"src/volforecast/data/micro.py","start":326,"end":342,"focus":[331,333],"sha256":"4da28c17e94bc7d4cf228d42d8dd3f9fc9d12cc28bfce4f3d265904eefe0f0e5"}},{"id":"c-030","text":"Causality is enforced at the data layer, not left to the models: every IV-derived feature is shifted one day so the value at t reflects only information available at close t-1.","status":"verified","anchor":{"file":"src/volforecast/data/iv_features.py","start":107,"end":122,"focus":[112,113],"sha256":"7d7205219f2edf3c3e20b2a3f070aa474dc0e9f76ec89bbd34c0bf02db833d02"}},{"id":"c-031","text":"For the deep models, sequence_cache.py pre-stacks per-symbol 10 second bars into one padded (dates, bars, features) tensor, so training is pure GPU tensor ops with no pandas in the loop.","status":"verified","anchor":{"file":"src/volforecast/data/sequence_cache.py","start":1,"end":11,"focus":[3,4,5],"sha256":"f3c58ef221f172fc8267c648e33b576b649aaf31eb31b5cdf66d465eb189ebb5"}}]},{"type":"excerpt","anchor":{"file":"src/volforecast/utils/paths.py","start":59,"end":93,"focus":[64,74,84],"sha256":"ecce047814fd8c006965a282a57b388c7baf17f12a93b8746ac7158211ae95ff"},"caption":"The cache layout in one file: every raw source lands under data/raw/, every path resolved from the repo root."}]},{"id":"features","title":"The feature stack","kind":"stop","minutes":5,"lede":"Layers 0 to 5, each one hypothesis about what moves tomorrow's volatility. A config stacks them; the registry finds them; the suffixes tell you what you are looking at.","blocks":[{"type":"prose","claims":[{"id":"c-032","text":"The feature engineering package is organized as layers 0-6 for realized volatility forecasting, with every layer class registered in a FEATURE_REGISTRY dict rather than imported directly.","status":"verified","anchor":{"file":"src/volforecast/features/__init__.py","start":1,"end":10,"focus":[1,3],"sha256":"e0e6ac51a4422fb82583db546796549bb0e475cc4bf0e080da4cb74fcdebc0f4"}},{"id":"c-033","text":"Layer 0 is the [[har|HAR]] backbone: the weekly lag is the mean of the last 5 daily RV values and the monthly lag the mean of the last 22, giving the log_rv_d, log_rv_w, log_rv_m trio every model receives.","status":"verified","anchor":{"file":"src/volforecast/features/har.py","start":38,"end":53,"focus":[43,44],"sha256":"2bfca4097fa644c22a95731ab8ced0cecac12460b5e13f1a4ed2f95b0241696e"}},{"id":"c-034","text":"The HARQ extension adds sqrt realized quarticity and its interaction with RV, so a model can trust noisy RV measurements less.","status":"verified","anchor":{"file":"src/volforecast/features/har.py","start":68,"end":83,"focus":[73,74],"sha256":"127de9a7078dd75d99da191fedefd7111c9bf417dc4265935a2ddf7898807361"}},{"id":"c-035","text":"Layer 2 is where the option market enters: the [[vrp|variance risk premium]] is computed as (atm_iv/100)^2 minus rv times 252, the Carr and Wu ex-post proxy.","status":"verified","anchor":{"file":"src/volforecast/features/options.py","start":23,"end":56,"focus":[28,47],"sha256":"aa0b556bd0bc594ae2df4c9334f8ad64d87d5b1612146f60d61e67f088e39ebf"}},{"id":"c-036","text":"The code flags one family as the number one source of ML gain per a 2023 study: interactions of ATM implied vol and VIX with log RV at all three horizons.","status":"verified","anchor":{"file":"src/volforecast/features/options.py","start":281,"end":291,"focus":[283],"sha256":"a7676dde75b7bfd6606996499b64a185995b31e67ca0becd09c36ba77e26cbe1"}},{"id":"c-037","text":"When [[zero-dte|0DTE]] implied vol is available, the layer emits an exact tenor match for one-day-ahead forecasting plus an ultra-short term slope against the 1 week tenor.","status":"verified","anchor":{"file":"src/volforecast/features/options.py","start":191,"end":208,"focus":[196,199],"sha256":"150adebb6cc92b3e54e7f686655c447d9b21c63bed7973a702fd9fd60c923458"}},{"id":"c-038","text":"Layer 5 encodes what is known in advance: FOMC, NFP, and OpEx proximity, all fully predictable in advance, so unlike every market-derived layer no lag shift is applied.","status":"verified","anchor":{"file":"src/volforecast/features/calendar.py","start":1,"end":8,"focus":[1,4,5,6],"sha256":"07b050503f2eb6b9bf70e9a48fd9b127d5b0e00085258c1f96aaa2478508aafb"}},{"id":"c-039","text":"The event dates are derived deterministically: NFP is the first Friday of the month and OpEx the third Friday, while the FOMC statement dates 2015 through 2026 are hardcoded as a list.","status":"verified","anchor":{"file":"src/volforecast/features/calendar.py","start":184,"end":213,"focus":[189,204],"sha256":"1bc810995e0337c8a9089f0620eec638307e2ed8d95ba26bda6a8e10cdc753f2"}},{"id":"c-040","text":"The 73-feature gsvivs_signals layer reproduces the exact input set of the GSVIVS01 short-variance strategy, from SPX, VIX, and VX1 dynamics to put-skew and credit returns.","status":"verified","anchor":{"file":"src/volforecast/features/gsvivs_signals.py","start":1,"end":13,"focus":[1,3,4],"sha256":"c70cb3552196ececda17c5681c48e80669b21891cb9d4350d705c9d2174ac417"}}]}]},{"id":"models","title":"The model zoo","kind":"stop","minutes":6,"lede":"24 registered names, one contract. The interesting design choice is not any single model: it is that the naive baselines, the champion, and the controls all take the same walk through the same folds.","blocks":[{"type":"prose","claims":[{"id":"c-041","text":"Every model self-registers under a string name via a class decorator, 24 names in all, so the pipeline instantiates any of them from configuration alone.","status":"verified","anchor":{"file":"src/volforecast/registry.py","start":74,"end":88,"focus":[79],"sha256":"14a34b75e38315b77f8387ca63e2f0a4b2d7cfeb1dc895b1e5a01493eb3ed870"}},{"id":"c-042","text":"All of them inherit one base contract that declares which feature layers a model needs, capability flags for tuning, progress, SHAP selection and GPU device, and joblib persistence.","status":"verified","anchor":{"file":"src/volforecast/models/_base.py","start":16,"end":30,"focus":[21,22],"sha256":"a515ab1162580739cb774998cbc614cfeeff8901590fbc22dd0275b69066d5f5"}},{"id":"c-043","text":"Nine naive baselines, from random walk to VIX-implied and ATM-IV-implied, share the same interface and exist to set the QLIKE floor any useful model must beat.","status":"verified","anchor":{"file":"src/volforecast/models/naive.py","start":1,"end":14,"focus":[3,4,5],"sha256":"3f215430dd691bb207ecc4758865553af1a3dd64ec15a2732bdabb0e154a70c2"}},{"id":"c-044","text":"LightGBM trains directly on the loss the tournament scores: a custom objective with analytic gradient 1 - exp(e) and hessian exp(e), the [[qlike-objective|QLIKE objective]] in log space.","status":"verified","anchor":{"file":"src/volforecast/models/lightgbm.py","start":70,"end":86,"focus":[75,76,77],"sha256":"4084db37b56a2a7c5162bfc25ec87cac3449ab3a0e9b804ce3b8dab6eeb7814e"}},{"id":"c-045","text":"XGBoost is the deliberate second opinion: same objective, same six feature layers, an independent boosting library to cross-check LightGBM, and per the research journal, the current h=1 champion.","status":"verified","anchor":{"file":"src/volforecast/models/xgboost.py","start":101,"end":117,"focus":[106,107,108],"sha256":"6308c2084e3fbbf2aa6caccac0f9b4beb773e49df7dc1b12a0bf30eef4b3b52e"}},{"id":"c-046","text":"The graph suite is engineered for honest attribution: stid runs the same harness while ignoring edges entirely, so if it matches the GNN the conclusion is that pooling plus asset identity suffices, not that spillovers matter.","status":"verified","anchor":{"file":"src/volforecast/models/stid.py","start":1,"end":9,"focus":[6,7,8],"sha256":"6566927b7deede8911c371a45adde662891d27fbdd91fec01dd15e3883da8c37"}},{"id":"c-047","text":"Even randomness is measured: lightgbm_bagged exists because a reseed study put the [[seed-envelope|seed envelope]] at 6.6 bps, meaning single-seed improvements under roughly 10 bps are indistinguishable from noise.","status":"verified","anchor":{"file":"src/volforecast/models/ensemble.py","start":37,"end":53,"focus":[42,43,44],"sha256":"aec95ab7cfeb2d504355fa40fa2714dcb6ea1d5c4bf4be200d3f9501101d1932"}},{"id":"c-048","text":"And regimes are respected: the optimal HAR weight in a HAR plus LightGBM blend was found to be about 0.05 in calm markets but about 0.80 in high-vol regimes, so regime_blend switches weights on a volatility percentile.","status":"verified","anchor":{"file":"src/volforecast/models/regime_blend.py","start":1,"end":15,"focus":[3,4,5,6],"sha256":"65d3419736eb0de21337faa35cf02d6615d24c8a94beb3e7927eb69382fbba6a"}}]},{"type":"callout","level":"broken","title":"TWO MODELS ARE MISSING FROM THIS SNAPSHOT","text":"registry.py imports models/har_family.py (the entire linear HAR family) and models/lstm.py, and both are absent, so ensure_registered() raises ImportError here. Their supporting code survives: the OLS base class, the deterministic alpha-grid tuner, and the LSTM tuning harness all read fine, which is how this page can still describe them."}]},{"id":"scoring","title":"How forecasts are judged","kind":"stop","minutes":6,"lede":"The evaluation layer is unusually rigorous for a research repo. The one-sentence summary: nothing is allowed to look good by accident.","blocks":[{"type":"prose","claims":[{"id":"c-049","text":"The primary loss is [[qlike|QLIKE]] rather than RMSE because it penalizes underestimating volatility more severely than overestimating it, matching the economics: being short of realized vol is the expensive mistake.","status":"verified","anchor":{"file":"src/volforecast/evaluation/metrics.py","start":1,"end":16,"focus":[6,7],"sha256":"c535204f855d2dae512b928c5977d00489885eeb85fea27c8c9063548784065e"}},{"id":"c-050","text":"The cross-validation module bans random k-fold outright, calling it catastrophic look-ahead bias, and supplies purged, blocked, expanding, rolling, and panel-aware splitters instead.","status":"verified","anchor":{"file":"src/volforecast/utils/cv.py","start":4,"end":12,"focus":[9,10],"sha256":"13f52a9d581b0efb1c15cf8af9ae1f5cef2893cff807a7d396c83ac374053db7"}},{"id":"c-051","text":"The panel splitter divides on unique dates rather than rows, so every symbol observed on a date lands in the same fold and no model trains on Tuesday for one symbol while being tested on Tuesday for another.","status":"verified","anchor":{"file":"src/volforecast/utils/cv.py","start":202,"end":218,"focus":[207,208,209],"sha256":"11850f156a42063801872cefb4ba57815d10b6bedf7ec27ec41e673eda604e89"}},{"id":"c-052","text":"Because models predict log RV, converting back to levels uses the [[duan|Duan retransformation]]: exp of an unbiased log forecast is biased low, so predictions are scaled by the mean of exponentiated residuals.","status":"verified","anchor":{"file":"src/volforecast/evaluation/metrics.py","start":103,"end":118,"focus":[108,109],"sha256":"e9ca8bd097f678df8c68752dcb19c04c0796df61c4db1747f48f075f42b7ef2d"}},{"id":"c-053","text":"The conditional variant of that correction is trained strictly walk-forward: the variance model for fold k fits only on out-of-sample residuals from folds 1 through k-1.","status":"verified","anchor":{"file":"src/volforecast/pipeline/conditional_duan.py","start":2,"end":7,"focus":[7],"sha256":"a893ac844bcde023b121e61468c0071fb98e0df61efdab700f00fa1543dbd4e8"}},{"id":"c-054","text":"The [[dm|Diebold-Mariano]] implementation is panel-aware: loss differentials are averaged per date before the HAC variance so Newey-West lags never cross symbol boundaries.","status":"verified","anchor":{"file":"src/volforecast/evaluation/statistical_tests.py","start":52,"end":61,"focus":[57,58,59],"sha256":"5896a4112506738a2bc7b8a616caaf20a7c2adf1fe44bedae0c33fbd3690ffde"}},{"id":"c-055","text":"Scoring is regime-conditional too: QLIKE is split into calm and turbulent buckets by top-decile market RV dates, implementing the Zhang et al. 2025 protocol, so you can see exactly where a model earns its edge.","status":"verified","anchor":{"file":"src/volforecast/evaluation/statistical_tests.py","start":650,"end":667,"focus":[655,656,657,658],"sha256":"4aeddb9278ff6c86732bf40d795d88dbf4640b050580c6b8d50ade56898ff15c"}},{"id":"c-056","text":"And the math itself is audited: FORMULAS.md maps every mathematical function to its source paper, equation number, implementation, test, and hand-computed gold values.","status":"verified","anchor":{"file":"src/tests/unit/formulas/FORMULAS.md","start":1,"end":12,"focus":[3],"sha256":"b700522bf1aa4dbfd7011d42392fbb9248f8f27238e34f2d6e5c164ab42b7bb0"}}]},{"type":"excerpt","anchor":{"file":"src/volforecast/evaluation/metrics.py","start":17,"end":32,"focus":[22,23],"sha256":"5f284d555ac89f21e6593ca51a3d1ea6f33dac59e7559adb3a6a7d5ee85de8a0"},"caption":"The loss that runs the show, in both algebraic forms."}]},{"id":"economics","title":"From forecasts to money","kind":"stop","minutes":5,"lede":"A better QLIKE is not the product. The product is a tradeable signal, and this repo prices its own claims with unusual honesty: costs widen near expiry, Sharpes get deflated, and one champion got retracted.","blocks":[{"type":"prose","claims":[{"id":"c-057","text":"The realistic straddle engine models the full P&L waterfall: tenor-decayed gamma, vanna and volga leakage, maturity-varying option costs, and per-rebalance hedge costs.","status":"verified","anchor":{"file":"src/volforecast/evaluation/realistic_straddle.py","start":1,"end":17,"focus":[3,4,5,6,7,8],"sha256":"f7b3bce27bcb2644f82d7b68b8e8c46d52ee24832681827a08ca7f4da701b11a"}},{"id":"c-058","text":"Costs are not flat: per the Doshi et al. 2025 schedule, option spreads are charged at 4.5 times base inside 6 trading days to expiry and 1.75 times inside 13.","status":"verified","anchor":{"file":"src/volforecast/evaluation/realistic_straddle.py","start":58,"end":75,"focus":[63,64,65,66],"sha256":"8e27910d7321321bd1f7b45354674104ecb7dd655a97e614d78a35e1082485b7"}},{"id":"c-059","text":"Discrete hedging risk is priced with the Boyle-Emanuel variance formula and added to the Sharpe denominator, so rebalancing only 26 times a day cannot be quietly ignored.","status":"verified","anchor":{"file":"src/volforecast/evaluation/realistic_straddle.py","start":252,"end":266,"focus":[257],"sha256":"92139058aa6655951634c8499e9c518cfd14079f7240b00119ea2591a59413b4"}},{"id":"c-060","text":"Sharpe ratios face the [[dsr|deflated Sharpe ratio]]: the probability the observed Sharpe beats the maximum expected by chance given how many configurations were tried.","status":"verified","anchor":{"file":"src/volforecast/evaluation/realistic_straddle.py","start":611,"end":625,"focus":[616],"sha256":"958de64eb155dedf945ff35832cf718809d0e47e75196b204d3fa52d1665e0b7"}},{"id":"c-061","text":"The [[gsvivs|GSVIVS01]] backtest runs against a registry of six IV sources, from the 09:10 AllDay mark Kvar to the true-fill [[kvar|exec Kvar]], each flagged for calendar versus trading-day annualization.","status":"verified","anchor":{"file":"src/volforecast/evaluation/gsvivs.py","start":34,"end":55,"focus":[39,40,41,42,43,44,45,46],"sha256":"9b0a452602b5998c26e99f6613af233cfca9cf432aeac0230da12aada2a2d4d7"}},{"id":"c-062","text":"Annualization conventions are handled explicitly: exec Kvar arrives in 365-day vol points and is rescaled by sqrt(252/365), about 0.831, before it may be compared with the forecast.","status":"verified","anchor":{"file":"src/volforecast/evaluation/economic_value.py","start":161,"end":176,"focus":[166,167],"sha256":"f5f208659c00c8c8d38ff7346d725411efa9751cb3344f46b021c33a54d2da2d"}}]},{"type":"table","caption":"Real recorded results from the research journal and trial configs, each anchored in the claims above and on the agent-layer stop.","sortable":false,"columns":["TRIAL","FINDING","NUMBER"],"rows":[["trial-067","XGBoost with QLIKE objective and har_iv_0dte init: current h=1 champion","QLIKE 0.1292"],["trial-032","tenor matching: har_iv_1w vs har_iv at h=1, DM p = 0.0","0.1403 vs 0.1500"],["trial-055","best linear model: ridge HAR with CJ decomposition plus 0DTE IV","QLIKE 0.13397"],["trial-036","LightGBM champion RETRACTED: sat below the 5-seed envelope minimum","was 0.1289"],["GNN program","five graph trials landed within 1 bp of the linear baseline: honest null","within 1 bp"],["GSVIVS01","walk-forward threshold study: honest Sharpe after retracting an overfit 3.29","Sharpe 1.83"]]},{"type":"prose","claims":[{"id":"c-063","text":"The graph program is the culture in one line: five completed graph trials landed within 1 basis point of the linear baseline at every horizon, and the journal records that as a defensible null rather than burying it.","status":"verified","anchor":{"file":"workspace/research/research-journal.md","start":112,"end":119,"focus":[113],"sha256":"c767113ad2c9e80ee6c93c756653dd9d4191bb0a4bb1c49081daaf552e19960b"}},{"id":"c-064","text":"Retraction is routine, not scandal: the trial-036 champion numbers were formally withdrawn after a reseed study showed each sat below the 5-seed variance envelope minimum.","status":"verified","anchor":{"file":"workspace/research/research-journal.md","start":18,"end":28,"focus":[23,24,25],"sha256":"521e1357deeaaed37e4792b490134937d50abf7e2e0302833fc36aa24a1a866c"}}]}]},{"id":"cp-c","title":"Checkpoint C","kind":"cp","minutes":4,"blocks":[{"type":"checkpoint","id":"cp-c1","kind":"single","prompt":"Which loss ranks the tournament, and why that one?","options":["RMSE, the standard regression loss","QLIKE, because it penalizes underestimating volatility more than overestimating it","MAE, robust to outliers","Sharpe ratio of the straddle backtest"],"answer":1,"provenance":"evaluation/metrics.py names QLIKE the primary metric and states the asymmetry; statistical_tests.py sorts the tournament by QLIKE ascending.","explanation":"Under-predicting vol is the expensive mistake in risk terms, so the loss is asymmetric on purpose. The Sharpe comes later, as the economic check on top."},{"type":"checkpoint","id":"cp-c2","kind":"order","prompt":"Put these feature layers in ascending layer-number order.","options":["\u003ccode>har_core\u003c/code> (HAR lags and quarticity)","\u003ccode>asymmetry\u003c/code> (semivariances, jumps)","\u003ccode>options\u003c/code> (VRP, skew, tenors)","\u003ccode>microstructure\u003c/code> (VPIN, Kyle lambda)","\u003ccode>cross_asset\u003c/code> (rates, FX, spillover)","\u003ccode>calendar\u003c/code> (FOMC, NFP, OpEx)"],"answer":[1,2,3,4,5,6],"provenance":"Each file's first docstring line states its layer number: har.py Layer 0 through calendar.py Layer 5.","explanation":"The options are listed in the correct order: HAR is the Layer 0 backbone and calendar closes the numbered spine at Layer 5."},{"type":"checkpoint","id":"cp-c3","kind":"single","prompt":"What h=1 QLIKE did the current champion record, and which model is it?","options":["0.1292, XGBoost (trial-067)","0.1289, LightGBM (trial-036)","0.13397, ridge HAR (trial-055)","0.1500, har_iv"],"answer":0,"provenance":"workspace/research/research-journal.md records XGBoost as the new h=1 champion at 0.1292; the trial-036 0.1289 was retracted after the reseed study.","explanation":"The retired number is the trap: 0.1289 looks better but sat below the seed-variance envelope, so it was withdrawn. The standing champion is XGBoost at 0.1292."},{"type":"checkpoint","id":"cp-c4","kind":"single","prompt":"Why does this repo ban random k-fold cross-validation?","options":["It is slower than blocked k-fold","It leaks future information into training on time-series data","It produces unequal fold sizes","It cannot handle multiple symbols"],"answer":1,"provenance":"utils/cv.py: never use random k-fold on time-series data, it causes catastrophic look-ahead bias; policy/ml-constraints.md repeats the ban naming KFold(shuffle=True).","explanation":"Shuffling puts future observations into training folds for earlier test periods. The ban appears twice: in the code and in agent policy, so neither a human nor a model can miss it."}]}]},{"title":"FOLLOW ONE PATH","minutes":14,"stops":[{"id":"trace","title":"One command, end to end","kind":"stop","minutes":10,"lede":"vol ingest-ohlcv, followed through 8 real hops from the shell wrapper to the parquet file it writes. Later hops ask you to predict where the call lands before showing you; that is deliberate.","blocks":[{"type":"trace","steps":[{"claim":"The vol shell wrapper is the front door: its ingest-ohlcv case forwards every argument to python -m volforecast ingest-ohlcv, deciding nothing itself beyond library paths.","next":"main in src/volforecast/__main__.py","anchor":{"file":"vol","start":308,"end":323,"focus":[313,314],"sha256":"7e5112b09db8cd59fa58f0e1df63d78f3526a9eff33b309432f1fc5b7f557fab"}},{"claim":"Running the module lands in main, which builds the parser and lets argparse decide which subcommand was asked for.","next":"_build_parser in src/volforecast/__main__.py","anchor":{"file":"src/volforecast/__main__.py","start":804,"end":819,"focus":[809,810],"sha256":"3aef5493de11403f2149ac6ec37d5c463fe1b8576e15e1e915160ca1474d7a99"}},{"claim":"The parser does not define the subcommand itself: it imports the module's register function and hands it the subparsers object, the pattern every one of the two dozen commands follows.","next":"register in src/volforecast/cli/ingest_ohlcv.py","predict":"This hop ends in __main__.py. Which file does the path reach next?","anchor":{"file":"src/volforecast/__main__.py","start":188,"end":204,"focus":[193,195],"sha256":"04ff041fc65f24b437e7820f8e0ada3101d4d541b7c5b539912bb4e0c4742068"}},{"claim":"register declares the flags: a start date defaulting to 2015-01-02, an optional end date defaulting to yesterday, a symbol filter, and force to bypass the cache.","next":"handle in src/volforecast/cli/ingest_ohlcv.py","anchor":{"file":"src/volforecast/cli/ingest_ohlcv.py","start":103,"end":118,"focus":[108,109],"sha256":"51191a77b923727ce0e7c1a263bd91d0eef6ddffa3916eed68d34dabf736a4f9"}},{"claim":"set_defaults binds handle as the callable for this subcommand; handle converts the parsed strings into dates and delegates to run.","next":"run in src/volforecast/cli/ingest_ohlcv.py","anchor":{"file":"src/volforecast/cli/ingest_ohlcv.py","start":128,"end":143,"focus":[133],"sha256":"1a963001ffb73729134ee794eb26f749e4f6da1a6a6f16320ceb1fca95cc89b6"}},{"claim":"run is the pipeline proper: for each symbol it consults the cache, fetches daily OHLCV from TSDB when needed, and records the ingestion in the manifest.","next":"save_ohlcv_cache in src/volforecast/data/ohlcv.py","predict":"This hop ends in ingest_ohlcv.py. Which file does the path reach next?","anchor":{"file":"src/volforecast/cli/ingest_ohlcv.py","start":69,"end":89,"focus":[77],"sha256":"bd6b5b55e06ba30a78dc9097d4b0a38eead408758740d9374866322bef8a0525"}},{"claim":"Each fetched frame reaches save_ohlcv_cache, which writes parquet through a temporary file and an os.replace, so a crash mid-write can never leave a half-written cache.","next":"ohlcv_cache_path in src/volforecast/utils/paths.py","predict":"This hop ends in ohlcv.py. Which file does the path reach next?","anchor":{"file":"src/volforecast/data/ohlcv.py","start":178,"end":193,"focus":[181],"sha256":"e86e601d9b774c4b93d6ce45fb7710688669337b42231106870e28d259dad022"}},{"claim":"The destination is decided by ohlcv_cache_path: one parquet file per symbol under data/raw/ohlcv, the same repo-root-anchored layout every other cache uses.","next":null,"anchor":{"file":"src/volforecast/utils/paths.py","start":82,"end":91,"focus":[88],"sha256":"857c290ac9ecaa535c4857d5af31b833b9e841d3d119a515a0198492cae51885"}}]},{"type":"callout","level":"inferred","title":"WHAT THIS TRACE DOES NOT PROVE","text":"These hops are a static read of the source: each anchor was re-read and hash-matched, but nothing on this path was executed during generation (the TSDB fetch needs the GS network). The register / handle / run trio you just walked is the shape of every other CLI command in the repo."}]},{"id":"cp-d","title":"Checkpoint D","kind":"cp","minutes":4,"blocks":[{"type":"checkpoint","id":"cp-d1","kind":"single","prompt":"The trace starts in vol and crosses 5 files. Which one does the chain end in?","options":["\u003ccode>src/volforecast/data/ohlcv.py\u003c/code>","\u003ccode>src/volforecast/__main__.py\u003c/code>","\u003ccode>src/volforecast/cli/ingest_ohlcv.py\u003c/code>","\u003ccode>src/volforecast/utils/paths.py\u003c/code>"],"answer":3,"provenance":"Trace hop 8 of 8: its anchor file is src/volforecast/utils/paths.py, sha256-verified like every other hop.","explanation":"The chain ends where the path is decided. The other three are real hops earlier in the same trace, each where the chain would appear to end if you stopped one call too soon."},{"type":"checkpoint","id":"cp-d2","kind":"order","prompt":"Put the stages of a full vol run in the order they execute.","options":["Load the YAML into an ExperimentConfig","Ingest gate: fetch data for universe symbols missing an RV cache","Tournament: train and compare all configured models","Update the trial registry from metrics.json"],"answer":[1,2,3,4],"provenance":"src/volforecast/__main__.py: from_yaml, then the missing-symbol ingest gate, then all modes route through the tournament, then update_trial_from_metrics.","explanation":"Config first, data second, competition third, bookkeeping last. The options are listed in the correct order."}]}]},{"title":"THE AGENT LAYER","minutes":10,"stops":[{"id":"agents","title":"An operating system for agents","kind":"stop","minutes":7,"lede":"The half of the repo no codebase explainer would notice: most day-to-day work here is done by GitHub Copilot agents, and the repo is built so they cannot go off the rails.","blocks":[{"type":"stats","items":[{"v":"48","l":"skills","s":"8 ML vol, 40 GS infrastructure"},{"v":"5","l":"active personas","s":"11 more inlined and deleted"},{"v":"15","l":"workflows","s":"keyword-dispatched state machines"},{"v":"12","l":"policy documents","s":"non-negotiable rules"},{"v":"50k","l":"memory token budget","s":"P0+P1, lint-enforced"},{"v":"6","l":"max concurrent subagents","s":"hard protocol cap"}]},{"type":"prose","claims":[{"id":"c-065","text":"The philosophy is stated outright: context bloat kills agent performance, so the orchestrating agent is a coordinator, not a laborer, decomposing non-trivial work into bounded subtasks run by subagents with fresh context.","status":"verified","anchor":{"file":"AGENTS.md","start":10,"end":24,"focus":[15],"sha256":"8abb9baaf3c151aca5e4fca70a04184212a8cf37b014bfcf6a9e99ccfae59273"}},{"id":"c-066","text":"A [[skill|skill]] is a narrow executable capability with declared authority bounds, and skills are kept honest by a size lint: a SKILL.md over 250 lines warns, over 400 errors, forcing knowledge out of skills and into memory.","status":"verified","anchor":{"file":"skills/design.md","start":43,"end":46,"focus":[46],"sha256":"837a31ffac2b7a4fe8be627bf011ebe8d5fd1b420efc85622a5747e99c00092f"}},{"id":"c-067","text":"The ML discipline is encoded where agents work: the MODEL_TRAIN skill hard-codes the random k-fold ban and the log-RV training convention, the same rules the Python code enforces.","status":"verified","anchor":{"file":"skills/MODEL_TRAIN/SKILL.md","start":36,"end":43,"focus":[41,42],"sha256":"c4e46f81d50112a75a04ba56faf68388c919eba6570d6cd3ab4e9a4c32eed382"}},{"id":"c-068","text":"Personas carry explicit cannot-do bounds: the researcher persona is authorized for feature exploration and literature synthesis but may write no code, train no model, and touch no data pipeline.","status":"verified","anchor":{"file":"personas/INDEX.md","start":3,"end":7,"focus":[7],"sha256":"fd226a86a7fb83a32c9c14070b6c488768943bd71388b9a00b6cd2bc2568dab2"}},{"id":"c-069","text":"The evaluation watchdog persona is read-only with Write and Edit blocked, can never approve results carrying critical issues, and its protocol-compliance stage must pass before statistical quality is even assessed.","status":"verified","anchor":{"file":"personas/eval-sentinel.md","start":8,"end":20,"focus":[13,14,15],"sha256":"d5cbbf9ae6176d9d9ed3e3638ad2dcfb3d83d8139b1bafcf3aca15deacbe000e"}},{"id":"c-070","text":"Memory follows [[coala|CoALA]] with hard budgets: boot loads exactly two P0 files, and total memory is capped near 60 percent of the context window, with a lint measuring actual token counts.","status":"verified","anchor":{"file":"AGENTS.md","start":124,"end":133,"focus":[129,132],"sha256":"daee90c0da122bb3fd118b551ccc005e5b7ce10d29f4709b20a63d250188b288"}},{"id":"c-071","text":"Even the model is governed: every subagent is pinned to one exact model string, held in a single lint-checked constant, and any other model literal in the tracked surfaces fails the gate.","status":"verified","anchor":{"file":"workspace/lint/lint_model_pins.py","start":16,"end":22,"focus":[21],"sha256":"5a74952a64b3c73ac84407de714900e5370be3854cf06349522a3fe5d270b68d"}},{"id":"c-072","text":"Research itself is proceduralised: the research workflow requires a Hypothesis Card, stating the question, method, success criterion, and null hypothesis, before any data exploration begins.","status":"verified","anchor":{"file":"workflows/research.md","start":51,"end":65,"focus":[56],"sha256":"3f7e6acd6b62f76a330abde071c416c7b3312d1ce5b4b3f6e40b1aac0b7753d6"}}]},{"type":"callout","level":"info","title":"WHY THIS MATTERS TO A NEW JOINER","text":"You will not just read this repo, you will collaborate with the agents that maintain it. The contract you both answer to is AGENTS.md; the rules that bind you both are in policy/; and the same 21-check lint gate fires on your commits and theirs."}]},{"id":"cp-e","title":"Checkpoint E","kind":"cp","minutes":3,"blocks":[{"type":"checkpoint","id":"cp-e1","kind":"single","prompt":"How many memory files does the agent boot protocol load at session start?","options":["2","5","12","every P0 and P1 file"],"answer":0,"provenance":"AGENTS.md boot protocol: Boot = 2 P0 files (user.md and project-state.md); everything else loads on demand via INDEX.md triggers.","explanation":"Two files, always; the rest is loaded per task from the index. The whole memory design exists to keep boot cheap and context lean."},{"type":"checkpoint","id":"cp-e2","kind":"single","prompt":"Which CV method does agent policy name as never acceptable on this project's data?","options":["Expanding-window walk-forward","Purged k-fold with a gap","sklearn KFold with shuffle=True","Blocked k-fold"],"answer":2,"provenance":"policy/ml-constraints.md names sklearn.model_selection.KFold(shuffle=True), or any random split on time-indexed data, as never acceptable.","explanation":"The same ban that lives in utils/cv.py is repeated at the policy layer with the exact API named, so an agent cannot claim ambiguity."}]}]},{"title":"CLOSE","minutes":9,"stops":[{"id":"conventions","title":"Conventions and gotchas","kind":"stop","minutes":4,"lede":"Everything on this stop is inferred from patterns across many files. None of it is anchored to a single line, so all of it is amber: strong hints, not verified rules.","blocks":[{"type":"callout","level":"inferred","title":"THIS ENTIRE STOP IS UNVERIFIED","text":"These are reads of the codebase, quarantined here and marked once, rather than mixed into the verified material and diluting it."},{"type":"prose","claims":[{"id":"c-073","text":"Heavy imports are deferred into function bodies, so the CLI stays responsive and a broken optional dependency only fails the command that needs it.","status":"inferred"},{"id":"c-074","text":"Every CLI subcommand follows the register / handle / run trio you saw in the trace; a new command is added by copying that shape into a new module.","status":"inferred"},{"id":"c-075","text":"Cache writes go through a temp file and an atomic replace, and ingestion merges rather than overwrites, so re-running any ingest is expected to be safe.","status":"inferred"},{"id":"c-076","text":"Numbers are guarded culturally as well as statistically: champions get reseed studies, thresholds get walk-forward revalidation, and the journal keeps retractions in plain sight. Treat any single-seed improvement under 10 bps as noise until bagged.","status":"inferred"},{"id":"c-077","text":"When you see a suffix, trust it: _d, _w, _m are daily, weekly, monthly; d_*_1d and z_* are momentum conventions; a feature ending in _0dte is an exact one-day tenor. The naming is disciplined enough to navigate by.","status":"inferred"}]}]},{"id":"glossarystop","title":"The glossary","kind":"stop","minutes":2,"lede":"Every dotted term on this page, in one table. Most entries link to the line of code where the concept actually lives.","blocks":[{"type":"table","caption":"Click any dotted term in the prose to see this content in place, with a jump to the defining code.","sortable":true,"columns":["TERM","DEFINITION"],"rows":[["\u003cb>QLIKE\u003c/b>","The quasi-likelihood loss for variance forecasts, mean(RV/h - log(RV/h) - 1), equivalently exp(e) - e - 1 on the log-space error e. It punishes under-predicting volatility more than over-predicting it, which matches the economics: being short of realized vol is the expensive mistake. Every trainable model here optimizes it directly and the tournament ranks by it."],["\u003cb>realized variance\u003c/b>","The sum of squared intraday returns over one trading day, computed from 5 minute returns with no mean subtraction. It is the quantity every model in this repo forecasts."],["\u003cb>HAR\u003c/b>","The heterogeneous autoregressive model: regress tomorrow's log RV on the daily value, the 5 day mean, and the 22 day mean of past RV. Three parameters, brutally hard to beat, and the baseline every ML model in the tournament is scored against."],["\u003cb>bipower variation\u003c/b>","A jump-robust estimate of integrated variance: (pi/2) times the sum of products of adjacent absolute returns. Where RV includes jumps, BPV excludes them, and the gap between the two is the raw material for jump detection."],["\u003cb>realized semivariance\u003c/b>","RV split by return sign: RS+ from non-negative returns, RS- from negative ones, with RS+ plus RS- equal to RV exactly. Downside semivariance carries the leverage effect signal."],["\u003cb>realized kernel\u003c/b>","A microstructure-noise-robust variance estimator that weights return autocovariances with a flat-top Parzen kernel. On noisy tick data it recovers true variance better than naive tick RV, and the tests prove that property directly."],["\u003cb>VPIN\u003c/b>","Volume-Synchronized Probability of Informed Trading: the mean absolute buy-sell volume imbalance across equal-volume buckets. A daily order-flow toxicity measure from the microstructure layer."],["\u003cb>TSDB\u003c/b>","The GS internal Time Series Database, queried through gs_quant_internal with eqpad_ prefixed symbols. Source of daily OHLCV, treasury yields, FX, commodities, VIX, and SPX series."],["\u003cb>Chunk Store\u003c/b>","The GS internal tick store, accessed via pytickclient. Supplies L1 trades and quotes for the 34 symbol universe plus L2 depth for the E-mini future; raw ticks are the foundation for every realized measure."],["\u003cb>Marquee EDRVOL\u003c/b>","The Marquee dataset carrying the SPX implied volatility surface by tenor and relative strike. Bulk-fetched into a daily panel, it feeds every options-implied feature."],["\u003cb>variance risk premium\u003c/b>","Option-implied variance minus expected realized variance, computed here as (atm_iv/100)^2 - rv*252. Usually positive: investors pay a premium for volatility protection, which is exactly the premium the trading strategies harvest."],["\u003cb>IV-RV gap\u003c/b>","The spread between an implied volatility measure and the model's RV forecast. Positive gap: options look rich, sell vol. Negative: options look cheap, buy vol. This one number is what the whole pipeline exists to estimate well."],["\u003cb>Kvar\u003c/b>","A variance swap strike. Exec Kvar is the strike actually dealt at GSVIVS execution fills, recovered from option fill prices with the CBOE discrete variance swap formula; it is the production IV input to the signal."],["\u003cb>GSVIVS01\u003c/b>","A GS short-volatility variance swap index. The strategy holds it long by default and flips short when the RV forecast exceeds the Kvar; daily P&L is the signal times the next-day index return."],["\u003cb>delta-hedged straddle\u003c/b>","An ATM call plus put with the directional exposure hedged away. What remains is gamma P&L that pays the spread between realized and implied variance, making it the natural instrument for monetizing a vol forecast."],["\u003cb>Diebold-Mariano test\u003c/b>","The standard test of equal predictive accuracy between two forecast series, run on their QLIKE loss differential with Newey-West HAC errors. This repo's version averages losses per date first so panel lags never cross symbol boundaries."],["\u003cb>Model Confidence Set\u003c/b>","The Hansen et al. 2011 procedure that returns the subset of models statistically indistinguishable from the best, via sequential elimination with a block bootstrap. Membership, not rank, is the honest headline."],["\u003cb>Duan correction\u003c/b>","The retransformation applied when log-space forecasts are converted back to variance levels: plain exponentiation is biased low, so predictions are scaled by mean(exp(residuals)). The conditional variant re-estimates it per sample, walk-forward."],["\u003cb>purge gap\u003c/b>","A buffer of dates deleted around every CV test block so overlapping RV windows cannot leak across the train/test boundary. Random k-fold is banned outright in this repo for the same reason."],["\u003cb>walk-forward CV\u003c/b>","Expanding-window evaluation: the training window grows through time and the test window always sits strictly after it, mimicking live deployment. The panel variant splits on unique dates so all symbols share fold boundaries."],["\u003cb>tenor matching\u003c/b>","Feeding each forecast horizon the implied vol of matching maturity: 0DTE IV for one day ahead, 1 week IV for five days, 1 month IV for twenty two. Trial-032 measured roughly 100 bps of QLIKE from this one idea."],["\u003cb>seed envelope\u003c/b>","The spread of QLIKE across retrainings that differ only in random seed, measured at 6.6 bps at h=1. Any single-seed improvement smaller than that is noise, which is why one champion was retracted."],["\u003cb>deflated Sharpe ratio\u003c/b>","The Bailey and Lopez de Prado correction for strategy selection luck: the probability that an observed Sharpe beats the maximum expected by chance given how many configurations were tried."],["\u003cb>dealer gamma exposure\u003c/b>","The aggregate gamma of SPX option dealers. Its sign determines whether dealer hedging dampens moves (long gamma) or amplifies them (short gamma), so the feature layer encodes sign, regime, and momentum."],["\u003cb>CoALA memory\u003c/b>","The cognitive-architecture scheme the agent memory follows: compressed, atomic, linked, actionable files in P0 to P3 priority tiers with hard token budgets that a lint actually enforces."],["\u003cb>skill\u003c/b>","A narrow executable capability with declared inputs, outputs, and authority bounds. An agent invokes one by writing a JSON args file, firing a predefined VS Code task, and reading an output file that must end EXIT_CODE=0."],["\u003cb>QLIKE custom objective\u003c/b>","The hand-derived gradient (1 - exp(e)) and hessian (exp(e)) of log-space QLIKE, plugged into LightGBM and XGBoost so the trees split on the exact loss the tournament scores."],["\u003cb>0DTE IV\u003c/b>","Implied volatility of options expiring the same day: the only implied measure whose window exactly matches a one-day-ahead RV forecast."]]}]},{"id":"audit","title":"The ledger","kind":"stop","minutes":3,"lede":"What this page claimed, what survived verification, and what was deleted. The deleted rows are the point: a walkthrough you can trust is one that shows you its failures.","blocks":[{"type":"callout","level":"info","title":"HOW THIS PAGE WAS BUILT AND CHECKED","text":"Authors wrote every claim with a verbatim quote, never a line number. A build script resolved each quote against the snapshot, computed the line range and a sha256 over the excerpt, and deleted claims whose quotes failed to resolve. An independent verifier then re-read every anchor from disk and re-computed every hash. Command output was captured from real runs on this machine and never edited, except that dash characters are transliterated for this artifact's no-dash rule."},{"type":"callout","level":"info","title":"WHAT THIS PAGE DID NOT READ","text":"Anchors resolve into the 1,063 files of this snapshot and nowhere else. The GS originals of the 14 missing modules were not available to this build; claims about them describe only what the surviving code says. The GSVIVS01 index methodology beyond this repo, and anything behind the GS network, is out of scope."},{"type":"ledger"}]}]}]};
/* ============================================================

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* claim / lede text supports two inline forms after escaping:
   `code`  ->  <code>code</code>
   [[term]] or [[id|label]]  ->  glossary term button */
const GLO={}; (DATA.glossary||[]).forEach(g=>GLO[g.id]=g);
function rich(s){
  let h=esc(s);
  h=h.replace(/`([^`]+)`/g,(m,c)=>`<code>${c}</code>`);
  h=h.replace(/\[\[([a-z0-9-]+)\|([^\]]+)\]\]/g,(m,id,lab)=>
    GLO[id]?`<span class="gterm" role="button" tabindex="0" data-g="${id}">${lab}</span>`:lab);
  h=h.replace(/\[\[([^\]|]+)\]\]/g,(m,lab)=>{
    const id=lab.toLowerCase().replace(/[^a-z0-9]+/g,"-");
    return GLO[id]?`<span class="gterm" role="button" tabindex="0" data-g="${id}">${lab}</span>`:lab;
  });
  return h;
}
let D=DATA, KEY, STOPS, S;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

function boot(){
  KEY="trailhead:"+D.repo.name+":"+D.repo.commit;
  STOPS=D.tracks.flatMap((t,ti)=>t.stops.map(s=>({...s,ti,track:t.title})));
  S={cur:0,done:{},ans:{},pred:{},conf:{}};
  try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
  S.pred=S.pred||{}; S.conf=S.conf||{};
  shell();
  const h=location.hash.replace("#","");
  const i=STOPS.findIndex(s=>s.id===h);
  draw(i>=0?i:S.cur||0);
}

function shell(){
  const r=D.repo||{}, p=D.report||{};
  document.title="Trailhead · "+r.name;
  $("#rname").textContent=r.name;
  $("#rmeta").textContent=[r.commit,
    "generated "+(r.generated_at||"").replace("T"," ").replace("Z"," UTC"),
    "trailhead "+p.tool_version].join(" · ");
  const lo=p.claims>0&&p.dropped/p.claims>0.40;
  $("#badge").innerHTML=
     `<span><i class="n">${p.claims}</i> claims</span>`
    +`<span class="d">${p.dropped} dropped</span>`
    +`<span><i class="n">${p.commands}</i> cmds</span>`
    +`<span class="f">${p.failed} failing</span>`
    +(lo?`<span class="lo">low confidence · ${Math.round(100*p.dropped/p.claims)}% dropped</span>`:"");
  $("#badge").classList.toggle("lowconf",lo);
}

/* ---- predict-then-reveal ---- */
function predict(id,question,options,key,prov){
  const a=S.pred[id];
  const opts=options.map((o,i)=>{
    let cls="popt";
    if(a){ if(i===key)cls+=" right"; else if(a.pick===i)cls+=" wrong"; }
    return `<div class="${cls}" ${a?"":`data-pi="${i}"`} ${a?"":'tabindex="0" role="button"'}>
      <span class="i">${a?(i===key?"✓":(a.pick===i?"✕":String.fromCharCode(65+i))):String.fromCharCode(65+i)}</span><span>${o}</span></div>`;
  }).join("");
  return `<div class="pred${a?(a.ok?" done ok":" done no"):""}" data-pred="${esc(id)}" data-key="${key}">
    <div class="q"><b>PREDICT</b>${esc(question)}</div>
    <div class="popts">${opts}</div>
    ${a?`<div class="pfoot"><span class="verdict ${a.ok?"y":"n"}">${a.ok?"CORRECT":"NOT QUITE"}</span>
         <span class="prov"><b>ANSWER KEY</b> ${esc(prov)}</span></div>`:""}
  </div>`;
}

/* ---- excerpt ---- */
function excerpt(a,cap){
  const f=D.files[a.file]||{}, focus=new Set(a.focus||[]);
  let rows="",prev=null;
  for(let n=a.start;n<=a.end;n++){
    if(!(n in f)){ if(prev!==null){rows+=`<tr class="el"><td colspan="2">… elided</td></tr>`;prev=null;} continue; }
    rows+=`<tr class="${focus.has(n)?"hl":""}"><td class="ln">${n}</td><td class="src">${esc(f[n])}</td></tr>`;
    prev=n;
  }
  const raw=Object.keys(f).filter(n=>+n>=a.start&&+n<=a.end).map(n=>f[n]).join("\n");
  return `<figure class="ex">
    <header><b>${esc(a.file)}</b><span>: ${a.start}-${a.end}</span><span class="sp"></span>
      ${a.sha256?`<span class="sha" title="sha256 over these source lines, recomputed by the verifier">#${a.sha256.slice(0,10)}</span>`:""}
      <button class="cp-btn" data-copy="${esc(raw).replace(/"/g,"&quot;")}">COPY</button></header>
    <div class="code"><table>${rows}</table></div>
    ${cap?`<figcaption>${cap}</figcaption>`:""}
  </figure>`;
}

const openPred=b=>b.type==="command"&&b.predict&&!S.pred["pc:"+b.cmd];
function veil(blocks){
  const cut=blocks.findIndex(openPred);
  const html=blocks.map((b,i)=>
    (cut>=0&&i>cut)?`<div class="veil">${B[b.type](b)}</div>`:B[b.type](b)).join("");
  return html+((cut>=0&&cut<blocks.length-1)
    ?`<div class="veilnote">The rest of this stop stays hidden until you answer the prediction above.</div>`:"");
}

/* ---- blocks ---- */
const B={
 prose:b=>`<div class="prose">${b.claims.map(c=>
   c.status==="inferred"
    ? `<p><span class="claim inf">${rich(c.text)}</span><span class="tag">INFERRED</span></p>`
    : `<p><span class="claim" role="button" tabindex="0" aria-expanded="false" data-claim="${c.id}">${rich(c.text)}</span><button class="mark" tabindex="-1" data-claim="${c.id}">${c.id.slice(-3)}</button></p>
       <div class="pop" data-pop="${c.id}" hidden>${excerpt(c.anchor,"Anchor for claim "+c.id+": re-read and hash-matched at build time.")}</div>`
  ).join("")}</div>`,

 excerpt:b=>excerpt(b.anchor,b.caption),

 command:b=>{
   const pid="pc:"+b.cmd, a=b.predict?S.pred[pid]:1, shut=b.predict&&!S.pred[pid];
   return `<div class="cmd ${b.exit&&!shut?"fail":""}">
   <header><span class="pr">$</span><code>${esc(b.cmd)}</code>
     ${shut?`<span class="pill wait">RESULT HIDDEN</span>`:""}
     <span class="res${shut?" veil":""}"><span class="pill ${b.exit?"bad":"ok"}">exit ${b.exit}</span><span class="dur">${b.dur}</span></span></header>
   ${b.predict?predict(pid,b.predict,["It passes (exit 0)","It fails (non-zero exit)"],b.exit?1:0,
       "the exit code captured by the command runner: "+esc(b.env)):""}
   <div class="${shut?"veil":""}">${b.broken?`<div class="brk"><b>BROKEN</b><div>${esc(b.broken)}
     ${b.hypothesis?`<div style="margin-top:8px;font-size:12.5px;color:var(--dim)"><span class="tag" style="margin:0 6px 0 0;vertical-align:0">INFERRED</span>${esc(b.hypothesis)}</div>`:""}</div></div>`:""}
   <details class="out"><summary>output (${b.out.split("\n").length} lines)</summary><pre>${esc(b.out)}</pre></details>
   <div class="envnote">${esc(b.env)}</div></div></div>`;
 },

 callout:b=>`<div class="call ${b.level}"><b>${esc(b.title)}</b>${rich(b.text)}</div>`,

 stats:b=>`<div class="stats">${b.items.map(x=>`<div class="stat">
   <div class="v"${x.color?` style="color:var(--${x.color})"`:""}>${x.v}${x.of?`<span class="of"> / ${x.of}</span>`:""}</div>
   <div class="l">${esc(x.l)}</div>${x.s?`<div class="s">${esc(x.s)}</div>`:""}</div>`).join("")}</div>`,

 table:b=>`<div class="tbl"><table>
   <thead><tr>${b.columns.map((c,i)=>`<th ${b.sortable?`data-sort="${i}"`:""}>${c}</th>`).join("")}</tr></thead>
   <tbody>${b.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${/^[\d,.]+( |&nbsp;)?[a-z%]*$|^n\/a$/.test(String(c).replace(/<[^>]+>/g,""))&&i>0?"r":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
   </table></div>${b.caption?`<div class="envnote" style="border:1px solid var(--rule2);border-top:0">${esc(b.caption)}</div>`:""}`,

 graph:()=>graph(),

 trace:b=>{
   const files=[...new Set(b.steps.map(s=>s.anchor.file))].sort();
   const cut=b.steps.findIndex((s,i)=>s.predict&&b.steps[i+1]&&!S.pred["pt:"+s.anchor.file]);
   return `<div class="trace">${b.steps.map((s,i)=>{
     const nx=b.steps[i+1]&&b.steps[i+1].anchor.file;
     const ask=s.predict&&nx, pid="pt:"+s.anchor.file, done=!ask||S.pred[pid];
     return `<div class="hop${cut>=0&&i>cut?" veil":""}">
   <div class="dot">${i+1}</div>
   <h4>${esc(s.anchor.file.split("/").pop())}</h4>
   <div class="an">${esc(s.anchor.file)} : ${s.anchor.start}-${s.anchor.end}</div>
   <div class="prose" style="margin-bottom:10px"><span class="claim inf" style="border-bottom:0;cursor:default">${rich(s.claim)}</span></div>
   ${excerpt(s.anchor,"")}
   ${ask?predict(pid,s.predict,files.map(f=>"<code>"+f+"</code>"),files.indexOf(nx),
       "the next hop's resolved anchor: "+esc(nx)):""}
   <div class="${done?"":"veil"}">${s.next?`<div class="nx">next → <b>${esc(s.next)}</b></div>`:`<div class="nx">the chain ends here</div>`}</div>
 </div>`;}).join("")}</div>`;
 },

 checkpoint:b=>{
  const a=S.ans[b.id], k=S.conf[b.id];
  const gate=!a&&!k;
  const conf=(!a&&!k)
    ? `<div class="conf"><span>Before you answer, how sure are you?</span>
        <button class="cbtn" data-conf="${b.id}" data-c="sure">I'M SURE</button>
        <button class="cbtn" data-conf="${b.id}" data-c="guess">I'M GUESSING</button></div>`
    : (k?`<div class="conf said"><span>You said you were <b>${k==="sure"?"sure":"guessing"}</b>.</span></div>`:"");
  if(b.kind==="order"){
    const opts=b.options.map((o,i)=>`<div class="ordr"><select data-ord="${b.id}" data-i="${i}" ${a||gate?"disabled":""} aria-label="Position of option ${i+1}">
        <option value="">-</option>${b.options.map((_,k2)=>`<option value="${k2+1}" ${a&&a.pick[i]===k2+1?"selected":""}>${k2+1}</option>`).join("")}
      </select><span>${o}</span>${a?(a.pick[i]===b.answer[i]?`<span class="verdict y" style="margin-left:auto">✓</span>`:`<span class="verdict n" style="margin-left:auto">✕ ${b.answer[i]}</span>`):""}</div>`).join("");
    return `<div class="cpx" data-cp="${b.id}"><div class="k">CHECKPOINT · ORDER</div><h4>${esc(b.prompt)}</h4>
      ${conf}${opts}
      ${a?verdict(b,a):`<div class="act"><button class="sub" data-go-cp="${b.id}" ${gate?"disabled":""}>CHECK</button></div>`}</div>`;
  }
  const opts=b.options.map((o,i)=>{
    let cls="opt"; if(a){ if(i===b.answer)cls+=" right"; else if(a.pick===i)cls+=" wrong"; }
    if(gate)cls+=" gated";
    return `<div class="${cls}" ${gate||a?"":`data-pick="${b.id}" data-i="${i}" tabindex="0" role="button"`}>
      <span class="i">${a?(i===b.answer?"✓":(a.pick===i?"✕":String.fromCharCode(65+i))):String.fromCharCode(65+i)}</span><span>${o}</span></div>`;
  }).join("");
  return `<div class="cpx" data-cp="${b.id}"><div class="k">CHECKPOINT · SINGLE ANSWER</div>
    <h4>${esc(b.prompt)}</h4>${conf}${opts}${a?verdict(b,a):""}</div>`;
 },

 ledger:()=>ledgerTable(),
};

function verdict(b,a){
  return `<div class="act"><span class="verdict ${a.ok?"y":"n"}">${a.ok?"CORRECT":"NOT QUITE"}</span></div>
    <div class="expl">${esc(b.explanation)}<span class="prov"><b>ANSWER KEY</b> ${esc(b.provenance)}</span></div>`;
}
function allCP(){return STOPS.flatMap(s=>s.blocks.filter(b=>b.type==="checkpoint"))}
function ledgerRows(){
  const d=D.dropped||[], n=(D.report||{}).claims||0;
  if(d.length)return d.map(x=>`<tr><td><code>${esc(x.id)}</code></td><td style="color:var(--dim)">${esc(x.text)}</td>
    <td><code>${esc(x.file)}</code></td><td><span class="st x">${esc(x.reason)}</span></td></tr>`).join("");
  const why=n
    ? `Nothing was deleted in this build. All ${n} claims resolved against this snapshot, so every sentence in the walkthrough carries a live anchor.`
    : `Nothing was deleted because nothing was claimed. That is a zero from an empty run, not a clean bill of health.`;
  return `<tr><td colspan="4" style="color:var(--dim);font-style:italic;padding:14px 12px">${why}</td></tr>`;
}
function ledgerTable(){
  const r=D.report||{};
  return `<div class="sumgrid">
    <div><div class="v">${r.claims}</div><div class="l">CLAIMS MADE</div></div>
    <div><div class="v" style="color:var(--ok)">${r.verified}</div><div class="l">VERIFIED</div></div>
    <div><div class="v" style="color:var(--inf)">${r.inferred}</div><div class="l">INFERRED</div></div>
    <div><div class="v" style="color:var(--bad)">${r.dropped}</div><div class="l">DELETED</div></div>
    <div><div class="v">${r.commands}</div><div class="l">COMMANDS RUN</div></div>
    <div><div class="v" style="color:var(--bad)">${r.failed}</div><div class="l">COMMANDS FAILED</div></div>
  </div>
  ${yourScore()}
  <div class="tbl"><table><thead><tr><th>ID</th><th>DELETED CLAIM</th><th>TARGET</th><th>REASON</th></tr></thead>
  <tbody>${ledgerRows()}</tbody></table></div>
  <div class="envnote" style="border:1px solid var(--rule2);border-top:0">${esc((D.report||{}).regen||"Hand-built target artifact: every anchor re-verified by template/verify.mjs against the snapshot.")}</div>`;
}
function yourScore(){
  const ps=Object.values(S.pred), pOk=ps.filter(p=>p.ok).length;
  const cs=allCP().map(c=>({a:S.ans[c.id],k:S.conf[c.id]})).filter(x=>x.a);
  const cOk=cs.filter(x=>x.a.ok).length;
  const sure=cs.filter(x=>x.k==="sure"), sureWrong=sure.filter(x=>!x.a.ok).length;
  if(!ps.length&&!cs.length)return "";
  const bits=[];
  if(ps.length)bits.push(`<div><div class="v">${pOk}<span class="of"> / ${ps.length}</span></div><div class="l">PREDICTIONS RIGHT</div></div>`);
  if(cs.length)bits.push(`<div><div class="v">${cOk}<span class="of"> / ${cs.length}</span></div><div class="l">CHECKPOINTS RIGHT</div></div>`);
  if(sure.length)bits.push(`<div><div class="v" style="color:${sureWrong?"var(--bad)":"var(--ok)"}">${sureWrong}<span class="of"> / ${sure.length}</span></div><div class="l">CONFIDENT AND WRONG</div></div>`);
  return `<h5 class="yh">YOUR RECORD</h5><div class="sumgrid">${bits.join("")}</div>
    <div class="envnote" style="border:0;padding-left:0">Stored in this browser only, cleared by RESET, never part of the artifact.</div>`;
}

/* ---- map: a layered board, columns are pipeline stages ---- */
let TOUR=-1;
function graph(){
  const m=D.map, N=m.nodes, E=m.edges, W=m.w||1000, H=m.h||520;
  const at=id=>N.find(n=>n.id===id);
  const cols=(m.columns||[]).map(c=>
    `<text class="map-collab" x="${c.x}" y="20" text-anchor="middle">${esc(c.label)}</text>
     <line class="map-colline" x1="${c.x}" y1="28" x2="${c.x}" y2="${H-10}" opacity="${c.line?".5":"0"}"/>`).join("");
  const edges=E.map(e=>{
    const a=at(e.a),b=at(e.b); if(!a||!b)return "";
    const x1=a.x+a.w,y1=a.y+a.h/2, x2=b.x,y2=b.y+b.h/2, mx=(x1+x2)/2;
    return `<path class="edge" data-a="${e.a}" data-b="${e.b}" stroke-width="${.8+Math.min(e.n,40)/12}"
      d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"><title>${esc(at(e.a).label+" imports "+at(e.b).label+" from "+e.n+" sites")}</title></path>`;
  }).join("");
  const nodes=N.map(n=>`<g class="node" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.label)} module, open details">
      <rect class="n-body" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="2"/>
      <text class="n-lab" x="${n.x+10}" y="${n.y+19}">${esc(n.label)}</text>
      <text class="n-loc" x="${n.x+10}" y="${n.y+n.h-9}">${n.loc.toLocaleString()} loc · ${n.files} files</text>
    </g>`).join("");
  return `<div class="mapwrap"><div class="mapbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Module dependency board, columns ordered by pipeline stage">
      <g>${cols}</g><g id="edges">${edges}</g><g id="nodes">${nodes}</g></svg>
      <div class="maptools"><button class="tbtn" id="tourbtn">${TOUR>=0?"EXIT TOUR":"GUIDED TOUR"}</button></div>
      <div class="hint">HOVER TO ISOLATE · CLICK A MODULE FOR DETAIL · ESC CLOSES</div></div>
    <div id="tourbox">${TOUR>=0?tourCard():""}</div>
    ${m.note?`<div class="call info" style="margin-top:12px"><b>${esc(m.note.title)}</b>${rich(m.note.text)}</div>`:""}
    <details class="fallback"><summary>Text equivalent (${N.length} modules, ${E.length} dependencies)</summary>
      <ul>${N.map(n=>`<li><b>${esc(n.label)}</b>: ${n.loc.toLocaleString()} loc, ${n.files} files. Imports:
        ${E.filter(e=>e.a===n.id).map(e=>esc(at(e.b).label)+" ×"+e.n).join(", ")||"none"}</li>`).join("")}</ul></details></div>`;
}
function tourCard(){
  const t=D.map.tour||[]; if(TOUR<0||TOUR>=t.length)return "";
  const s=t[TOUR];
  return `<div class="tourcard"><div class="tk">TOUR · STEP ${TOUR+1} OF ${t.length}</div>
    <p>${rich(s.text)}</p>
    <div class="tnav">
      <button class="tbtn" id="tprev" ${TOUR===0?"disabled":""}>← BACK</button>
      <button class="tbtn" id="tnext">${TOUR===t.length-1?"FINISH":"NEXT →"}</button>
      <button class="tbtn" id="topen">OPEN ${esc((D.map.nodes.find(n=>n.id===s.id)||{}).label||"")}</button>
    </div></div>`;
}
function tourPaint(){
  const t=D.map.tour||[];
  $$(".node").forEach(g=>g.classList.remove("tourlit","dim"));
  $$(".edge").forEach(e=>e.classList.remove("lit","dim"));
  if(TOUR>=0&&t[TOUR]){
    const id=t[TOUR].id;
    $$(".node").forEach(g=>g.classList.toggle("tourlit",g.dataset.id===id));
    $$(".node").forEach(g=>{if(g.dataset.id!==id)g.classList.add("dim")});
    $$(".edge").forEach(e=>{
      if(e.dataset.a===id||e.dataset.b===id)e.classList.add("lit");else e.classList.add("dim")});
  }
  const tb=$("#tourbox"); if(tb)tb.innerHTML=TOUR>=0?tourCard():"";
  const btn=$("#tourbtn"); if(btn)btn.textContent=TOUR>=0?"EXIT TOUR":"GUIDED TOUR";
}

/* ---- node drawer ---- */
function openDrawer(id){
  const n=D.map.nodes.find(x=>x.id===id); if(!n)return;
  closeOverlays();
  const role=(n.role||[]).map(p=>`<p>${rich(p)}</p>`).join("");
  const dIn=D.map.edges.filter(e=>e.b===id).map(e=>D.map.nodes.find(x=>x.id===e.a)),
        dOut=D.map.edges.filter(e=>e.a===id).map(e=>D.map.nodes.find(x=>x.id===e.b));
  $("#overlay").innerHTML=`<div class="scrim" data-close="1"></div>
  <aside class="drawer" role="dialog" aria-label="${esc(n.label)} module detail">
    <button class="xbtn" data-close="1">ESC ✕</button>
    <div class="k">MODULE</div><h4>${esc(n.label)}</h4>
    <div class="dsub">${esc(n.path||"")} · ${n.loc.toLocaleString()} loc · ${n.files} files</div>
    <div class="role">${role}</div>
    ${n.reads?`<h5>What flows in</h5><div class="dep">${rich(n.reads)}</div>`:""}
    ${n.feeds?`<h5>What flows out</h5><div class="dep">${rich(n.feeds)}</div>`:""}
    <h5>Key files</h5><div class="kf">${(n.key_files||[]).map(k=>`<div><code>${esc(k.file)}</code> · ${rich(k.purpose)}</div>`).join("")||"<div>none recorded</div>"}</div>
    ${(n.concepts||[]).length?`<h5>Concepts that live here</h5><div class="chips">${n.concepts.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`:""}
    <h5>Dependencies</h5>
    <div class="dep"><b>imports</b> ${dOut.map(x=>esc(x.label)).join(", ")||"nothing on this board"}</div>
    <div class="dep"><b>imported by</b> ${dIn.map(x=>esc(x.label)).join(", ")||"nothing on this board"}</div>
    ${n.anchor?`<h5>One excerpt</h5>${excerpt(n.anchor,n.anchor_caption||"")}`:""}
  </aside>`;
  $(".drawer").focus&&$(".drawer").focus();
}
function openGloss(id,x,y){
  const g=GLO[id]; if(!g)return;
  closeGloss();
  const div=document.createElement("div");
  div.className="gpop"; div.id="gpop";
  div.innerHTML=`<div class="gt">${esc(g.term)}</div><div class="gd">${esc(g.def)}</div>
    ${g.anchor?`<div class="gsrc">defined at <button data-gev="${id}">${esc(g.anchor.file)}:${g.anchor.focus&&g.anchor.focus[0]||g.anchor.start}</button></div>`:""}`;
  document.body.appendChild(div);
  const r=div.getBoundingClientRect();
  let left=Math.min(x,window.innerWidth-r.width-16), top=y+14;
  if(top+r.height>window.innerHeight-10)top=y-r.height-10;
  div.style.left=Math.max(8,left)+"px"; div.style.top=Math.max(8,top+window.scrollY)+"px";
}
function closeGloss(){const p=$("#gpop");if(p)p.remove()}
function openAudit(){
  closeOverlays();
  $("#overlay").innerHTML=`<div class="scrim" data-close="1"></div>
  <div class="modal" role="dialog" aria-label="Verification ledger">
    <button class="xbtn" data-close="1">ESC ✕</button>
    <h3>The verification ledger</h3>${ledgerTable()}</div>`;
}
function openEvidence(id){
  const g=GLO[id]; if(!g||!g.anchor)return;
  closeOverlays();
  $("#overlay").innerHTML=`<div class="scrim" data-close="1"></div>
  <div class="modal" role="dialog" aria-label="Evidence for ${esc(g.term)}">
    <button class="xbtn" data-close="1">ESC ✕</button>
    <h3>${esc(g.term)}</h3><p style="color:var(--dim);margin-bottom:14px">${esc(g.def)}</p>
    ${excerpt(g.anchor,"Where this concept lives in the code.")}</div>`;
}
function closeOverlays(){$("#overlay").innerHTML="";closeGloss()}

/* ---- rail ---- */
function rail(){
  $("#rail").innerHTML=D.tracks.map(t=>`<div class="track">
    <h3>${esc(t.title)}<i>${t.minutes}m</i></h3>
    ${t.stops.map(s=>{const i=STOPS.findIndex(x=>x.id===s.id);
      return `<div class="stop ${i===S.cur?"on":""} ${S.done[s.id]?"done":""} ${s.kind==="cp"?"cp":""}"
        data-go="${i}" tabindex="0" role="button"><span class="num">${String(i).padStart(2,"0")}</span><span>${esc(s.title)}</span></div>`;
    }).join("")}</div>`).join("")
  +`<div class="prog"><div class="lab"><span id="plab"></span><span id="ppct"></span></div>
     <div class="pbar"><i id="pfill"></i></div></div>`;
  const n=STOPS.length, d=Object.keys(S.done).length;
  $("#ppct").textContent=Math.round(d/n*100)+"%";
  $("#plab").textContent=d+" / "+n+" STOPS";
  $("#pfill").style.width=Math.round(d/n*100)+"%";
}

/* ---- stage ---- */
function draw(i){
  TOUR=-1; closeOverlays();
  S.cur=Math.max(0,Math.min(STOPS.length-1,i)); save();
  const s=STOPS[S.cur];
  $("#stage").innerHTML=`<div class="stopwrap ${s.id==="cover"?"cover":""}">
    <div class="plate"><span>STOP ${String(S.cur).padStart(2,"0")} / ${String(STOPS.length-1).padStart(2,"0")}</span>
      <hr><span>${esc(s.track)}</span><hr><span>${s.minutes} MIN</span></div>
    <h1>${esc(s.title)}</h1>
    ${s.lede?`<p class="lede">${rich(s.lede)}</p>`:""}
    <div class="blocks">${veil(s.blocks)}</div>
    ${s.id==="cover"?`<div class="startrow"><button class="start" data-nav="1">START THE WALKTHROUGH →</button><span style="font:11.5px var(--sans);color:var(--faint)">or use the arrow keys</span></div>`:""}
    <div class="fnav">
      <button ${S.cur===0?"disabled":""} data-nav="-1"><span class="k">← PREV</span>${S.cur>0?esc(STOPS[S.cur-1].title):""}</button>
      <button class="nxt" ${S.cur===STOPS.length-1?"disabled":""} data-nav="1"><span class="k">NEXT →</span>${S.cur<STOPS.length-1?esc(STOPS[S.cur+1].title):""}</button>
    </div></div>`;
  if(s.kind!=="cp"){S.done[s.id]=1;save();}
  history.replaceState(null,"","#"+s.id);
  rail(); window.scrollTo({top:0,behavior:"instant"});
  wireMap();
}

/* ---- map interactions ---- */
function wireMap(){
  const box=$(".mapbox"); if(!box)return;
  const nodes=$$(".node",box), edges=$$(".edge",box);
  const clear=()=>{if(TOUR>=0)return tourPaint();
    nodes.forEach(n=>n.classList.remove("dim"));edges.forEach(e=>e.classList.remove("dim","lit"))};
  nodes.forEach(g=>{
    const id=g.dataset.id;
    g.addEventListener("mouseenter",()=>{ if(TOUR>=0)return;
      nodes.forEach(n=>n.classList.toggle("dim",n!==g));
      edges.forEach(e=>{const hit=e.dataset.a===id||e.dataset.b===id;
        e.classList.toggle("lit",hit);e.classList.toggle("dim",!hit);
        if(hit){[e.dataset.a,e.dataset.b].forEach(o=>{const n2=nodes.find(x=>x.dataset.id===o);n2&&n2.classList.remove("dim")})}});
    });
    g.addEventListener("mouseleave",clear);
  });
  tourPaint();
}

/* ---- printing: linearise every stop ---- */
let PRINTSAVE=null;
window.addEventListener("beforeprint",()=>{
  PRINTSAVE=$("#stage").innerHTML;
  document.body.classList.add("printall");
  $("#stage").innerHTML=STOPS.map((s,i)=>`<div class="stopwrap">
    <div class="plate"><span>STOP ${String(i).padStart(2,"0")}</span><hr><span>${esc(s.track)}</span></div>
    <h1>${esc(s.title)}</h1>${s.lede?`<p class="lede">${rich(s.lede)}</p>`:""}
    <div class="blocks">${s.blocks.map(b=>B[b.type](b)).join("")}</div></div>`).join("");
  $$("#stage details").forEach(d=>d.open=true);
});
window.addEventListener("afterprint",()=>{
  document.body.classList.remove("printall");
  if(PRINTSAVE!==null){$("#stage").innerHTML=PRINTSAVE;PRINTSAVE=null;wireMap()}
});

/* ---- events ---- */
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#railbtn")){$("#rail").classList.toggle("open");return}
  const go=t.closest("[data-go]"); if(go){draw(+go.dataset.go);$("#rail").classList.remove("open");return}
  const nav=t.closest("[data-nav]"); if(nav&&!nav.disabled){draw(S.cur+ +nav.dataset.nav);return}
  if(t.closest("#badge")){openAudit();return}
  if(t.closest("[data-close]")){closeOverlays();return}
  if(t.closest("#resetbtn")){
    if(confirm("Clear local progress, answers and predictions for this walkthrough?")){
      localStorage.removeItem(KEY);S={cur:S.cur,done:{},ans:{},pred:{},conf:{}};save();draw(S.cur);}
    return}
  if(t.closest("#themebtn")){
    const r=document.documentElement;
    const cur=r.dataset.theme||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark");
    r.dataset.theme=cur==="dark"?"light":"dark";
    try{localStorage.setItem("trailhead:theme",r.dataset.theme)}catch(err){} return}
  if(t.closest("#projbtn")){
    const r=document.documentElement,b=$("#projbtn");
    const on=r.dataset.proj==="1"; r.dataset.proj=on?"":"1";
    b.setAttribute("aria-pressed",String(!on)); return}
  const gev=t.closest("[data-gev]"); if(gev){openEvidence(gev.dataset.gev);return}
  const gt=t.closest(".gterm"); if(gt){e.stopPropagation();openGloss(gt.dataset.g,e.clientX,e.clientY);return}
  const cl=t.closest("[data-claim]"); if(cl){
    const id=cl.dataset.claim,pop=$(`[data-pop="${id}"]`);
    if(pop){pop.hidden=!pop.hidden;
      $$(`[data-claim="${id}"]`).forEach(x=>x.setAttribute&&x.setAttribute("aria-expanded",String(!pop.hidden)));}
    return}
  const cp=t.closest("[data-copy]"); if(cp){
    navigator.clipboard&&navigator.clipboard.writeText(cp.dataset.copy);
    cp.textContent="COPIED";setTimeout(()=>cp.textContent="COPY",900); return}
  const cf=t.closest("[data-conf]"); if(cf){S.conf[cf.dataset.conf]=cf.dataset.c;save();draw(S.cur);return}
  const pk=t.closest("[data-pick]"); if(pk){
    const id=pk.dataset.pick,b=allCP().find(x=>x.id===id);
    const pick=+pk.dataset.i, ok=pick===b.answer;
    S.ans[id]={pick,ok};save();cpDone();draw(S.cur);return}
  const sb=t.closest("[data-go-cp]"); if(sb){
    const id=sb.dataset.goCp,b=allCP().find(x=>x.id===id);
    const sels=$$(`select[data-ord="${id}"]`),pick=sels.map(x=>+x.value||0);
    if(pick.some(v=>!v))return alert("Give every row a position first.");
    const ok=pick.every((v,i2)=>v===b.answer[i2]);
    S.ans[id]={pick,ok};save();cpDone();draw(S.cur);return}
  const po=t.closest(".popt[data-pi]"); if(po){
    const wrap=po.closest("[data-pred]"),id=wrap.dataset.pred,key=+wrap.dataset.key;
    const pick=+po.dataset.pi;S.pred[id]={pick,ok:pick===key};save();draw(S.cur);return}
  const node=t.closest(".node"); if(node){ if(TOUR>=0){TOUR=-1}
    openDrawer(node.dataset.id);return}
  if(t.closest("#tourbtn")){TOUR=TOUR>=0?-1:0;tourPaint();return}
  if(t.closest("#tprev")){TOUR=Math.max(0,TOUR-1);tourPaint();return}
  if(t.closest("#tnext")){const n=(D.map.tour||[]).length;TOUR=TOUR+1>=n?-1:TOUR+1;tourPaint();return}
  if(t.closest("#topen")){const s=(D.map.tour||[])[TOUR];if(s)openDrawer(s.id);return}
  const th=t.closest("th[data-sort]"); if(th){sortTable(th);return}
  if(!t.closest(".gpop"))closeGloss();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(TOUR>=0){TOUR=-1;tourPaint();}closeOverlays();return}
  const el=document.activeElement;
  if(el&&(el.tagName==="INPUT"||el.tagName==="SELECT"||el.tagName==="TEXTAREA"))return;
  if(e.key==="Enter"||e.key===" "){
    const b=el&&el.closest&&el.closest('[role="button"]');
    if(b){e.preventDefault();b.click();return}}
  if(e.key==="ArrowLeft"&&S.cur>0)draw(S.cur-1);
  if(e.key==="ArrowRight"&&S.cur<STOPS.length-1)draw(S.cur+1);
});
function cpDone(){
  for(const s of STOPS){
    if(s.kind!=="cp")continue;
    const cps=s.blocks.filter(b=>b.type==="checkpoint");
    if(cps.length&&cps.every(b=>S.ans[b.id]))S.done[s.id]=1;
  }
  save();
}
function sortTable(th){
  const table=th.closest("table"),i=+th.dataset.sort;
  const rows=[...table.tBodies[0].rows];
  const dir=th.dataset.dir==="a"?"d":"a"; th.dataset.dir=dir;
  $$("th",table).forEach(x=>{const a=x.querySelector(".ar");if(a)a.remove()});
  th.insertAdjacentHTML("beforeend",`<span class="ar"> ${dir==="a"?"▲":"▼"}</span>`);
  const num=s=>parseFloat(String(s).replace(/[^\d.-]/g,""));
  rows.sort((r1,r2)=>{
    const a=r1.cells[i].textContent.trim(),b=r2.cells[i].textContent.trim();
    const n1=num(a),n2=num(b);
    const c=(!isNaN(n1)&&!isNaN(n2))?n1-n2:a.localeCompare(b);
    return dir==="a"?c:-c;
  });
  rows.forEach(r=>table.tBodies[0].appendChild(r));
}
window.addEventListener("hashchange",()=>{
  const i=STOPS.findIndex(s=>s.id===location.hash.replace("#",""));
  if(i>=0&&i!==S.cur)draw(i);
});
try{const t=localStorage.getItem("trailhead:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
boot();
</script>
</body>
