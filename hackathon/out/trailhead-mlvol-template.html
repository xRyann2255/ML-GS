<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailhead</title>
<style>
/* ============================================================
   TRAILHEAD, hand-built target artifact: the walkthrough the
   generator should aspire to produce.
   Aesthetic: GS institutional workstation.
     - cool navy-slate surfaces; sky blue is the one interactive accent
     - workflow status (verified / inferred / broken) kept strictly
       separate from brand colour
     - sans for interface text; mono confined to code, commands, paths
       and figures; serif reserved for display headings
     - tabular numerals wherever a number appears
     - a quiet engineering grid sits behind everything: the page is a
       drawing board, not a poster
   Self-contained: no external requests, no fonts, no scripts.
   Goldman Sans / GS Sans cannot ship in this file (embedded font
   at-rules are barred by the bundle gate), so --sans approximates it
   from system faces.
   ============================================================ */

:root{
  /* surfaces */
  --ink:#0a0e14; --ink2:#111722; --ink3:#18202d; --ink4:#212b3a;
  /* text */
  --bone:#e8ecf2; --dim:#9ba8ba; --faint:#8494a8;
  /* structure */
  --rule:#1e2735; --rule2:#2c3849;
  /* brand / interactive: GS sky blue */
  --brand:#7399c6; --brand2:#acd4f1; --brandd:#12243a;
  /* workflow status */
  --ok:#4fa97a; --inf:#d8a23c; --bad:#e06c5b;
  --okd:#0f2a20; --infd:#2a2210; --badd:#2e1614;
  /* the engineering grid */
  --grid:rgba(115,153,198,.055); --grid2:rgba(115,153,198,.10);
  /* type */
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,"Times New Roman",Times,serif;
  --mono:"Cascadia Code","JetBrains Mono","SF Mono","Berkeley Mono","IBM Plex Mono",ui-monospace,monospace;
  /* shape + elevation: nothing rounder than 4px */
  --r1:2px; --r2:4px;
  --e1:0 1px 2px rgba(4,8,14,.28);
  --e2:0 8px 24px rgba(4,8,14,.40);
  --base:16px; --rail:272px; --bar:52px;
}
/* Sky blue is the dark-theme interactive colour; on white it fails 4.5:1
   as text, so light drops to deep navy with Mariner for hover. */
:root[data-theme="light"]{
  --ink:#ffffff; --ink2:#f5f7fa; --ink3:#eaeef4; --ink4:#dde4ed;
  --bone:#14181f; --dim:#4a5464; --faint:#5c6775;
  --rule:#e3e8ef; --rule2:#c2ccd9;
  --brand:#00355f; --brand2:#2178c4; --brandd:#e8f1fa;
  --ok:#1a6b43; --inf:#8a5c10; --bad:#b3261e;
  --okd:#e4f2ea; --infd:#fbf0da; --badd:#fbe9e7;
  --grid:rgba(0,53,95,.05); --grid2:rgba(0,53,95,.09);
  --e1:0 1px 2px rgba(20,24,31,.10);
  --e2:0 8px 24px rgba(20,24,31,.16);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme]){
    --ink:#ffffff; --ink2:#f5f7fa; --ink3:#eaeef4; --ink4:#dde4ed;
    --bone:#14181f; --dim:#4a5464; --faint:#5c6775;
    --rule:#e3e8ef; --rule2:#c2ccd9;
    --brand:#00355f; --brand2:#2178c4; --brandd:#e8f1fa;
    --ok:#1a6b43; --inf:#8a5c10; --bad:#b3261e;
    --okd:#e4f2ea; --infd:#fbf0da; --badd:#fbe9e7;
    --grid:rgba(0,53,95,.05); --grid2:rgba(0,53,95,.09);
    --e1:0 1px 2px rgba(20,24,31,.10);
    --e2:0 8px 24px rgba(20,24,31,.16);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink); color:var(--bone);
  font:var(--base)/1.6 var(--sans);
  overflow-x:hidden;
}
/* The grid: a fine 26px pitch with a heavier line every 130px, fixed so
   content scrolls over a stable board. Decoration budget spent here and
   nowhere else. */
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:
    linear-gradient(var(--grid2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:130px 130px,130px 130px,26px 26px,26px 26px;
}
code,pre,samp,kbd{font-family:var(--mono)}
.badge,.dur,.stop .num,.prog .lab,.code .ln,.sumgrid .v,.tbl .r,
.drawer .dsub,.opt .i,.hop>.dot,.meta,.stat .v{font-variant-numeric:tabular-nums}
::selection{background:var(--brand);color:var(--ink)}

/* ---------- top bar ---------- */
.bar{
  position:fixed; top:0; left:0; right:0; height:var(--bar); z-index:60;
  display:flex; align-items:center; gap:16px; padding:0 16px;
  background:var(--ink2); border-bottom:1px solid var(--rule2); box-shadow:var(--e1);
}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand .tm{font:600 11px var(--sans);letter-spacing:.14em;color:var(--brand);flex:none}
.brand b{font:600 15px var(--sans);letter-spacing:-.01em;white-space:nowrap}
.meta{font:11.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{
  margin-left:auto;display:flex;align-items:center;border:1px solid var(--rule2);
  border-radius:var(--r1);background:var(--ink3);cursor:pointer;flex:none;
  font:11.5px var(--sans);overflow:hidden;color:var(--dim)
}
.badge:hover{border-color:var(--brand)}
.badge span{padding:5px 10px;border-right:1px solid var(--rule)}
.badge span:last-child{border-right:0}
.badge .n{color:var(--bone);font-weight:600;font-style:normal}
.badge .d{color:var(--inf)} .badge .f{color:var(--bad)}
.badge.lowconf{border-color:var(--inf)} .badge .lo{color:var(--inf);font-weight:600}
.tools{display:flex;gap:4px;flex:none}
.tbtn{
  background:transparent;border:1px solid var(--rule2);border-radius:var(--r1);
  color:var(--dim);cursor:pointer;font:600 11px var(--sans);letter-spacing:.04em;padding:5px 8px
}
.tbtn:hover{color:var(--bone);border-color:var(--brand)}
.tbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--ink)}

/* ---------- shell ---------- */
.wrap{display:flex;min-height:100vh;padding-top:var(--bar)}
.rail{
  width:var(--rail);flex:none;position:sticky;top:var(--bar);
  height:calc(100vh - var(--bar));overflow-y:auto;
  background:var(--ink2);border-right:1px solid var(--rule);
  padding:16px 0 24px;
}
.track{margin-bottom:4px}
.track h3{
  font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:12px 16px 6px;display:flex;justify-content:space-between;align-items:baseline
}
.track h3 i{font-style:normal;font-weight:400;color:var(--faint);font-size:10.5px}
.stop{
  display:flex;gap:10px;align-items:baseline;padding:7px 16px 7px 14px;cursor:pointer;
  border-left:2px solid transparent;font-size:13.5px;color:var(--dim)
}
.stop:hover{background:var(--ink3);color:var(--bone)}
.stop.on{border-left-color:var(--brand);background:var(--ink3);color:var(--bone)}
.stop .num{font:500 11px var(--mono);color:var(--faint);flex:none;width:20px;position:relative}
.stop.done .num{color:var(--ok)}
.stop.done .num::after{content:"✓";position:absolute;left:20px;font-size:9px;top:-3px}
.stop.cp .num{color:var(--inf)}
.prog{padding:14px 16px 4px;border-top:1px solid var(--rule);margin-top:12px}
.prog .lab{font:11px var(--mono);color:var(--faint);display:flex;justify-content:space-between;margin-bottom:6px}
.pbar{height:4px;background:var(--ink4);border-radius:var(--r1);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);width:0}

.stage{flex:1;min-width:0;padding:36px 40px 80px}
.stopwrap{max-width:860px;margin:0 auto}
.plate{
  display:flex;gap:10px;align-items:center;font:600 10.5px var(--sans);
  letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-bottom:14px
}
.plate hr{flex:none;width:24px;border:0;border-top:1px solid var(--rule2)}
h1{font:700 34px/1.15 var(--serif);letter-spacing:-.01em;margin-bottom:10px}
.lede{color:var(--dim);font-size:16.5px;max-width:72ch;margin-bottom:28px}
.blocks>*{margin-bottom:24px}
.blocks .prose p{max-width:72ch;margin-bottom:14px}

/* ---------- claims: the atomic unit ---------- */
.claim{cursor:pointer;border-bottom:1px solid rgba(79,169,122,.55);padding-bottom:1px}
.claim:hover{border-bottom-color:var(--ok);background:rgba(79,169,122,.07)}
.claim[aria-expanded="true"]{background:rgba(79,169,122,.10)}
.claim.inf{cursor:default;border-bottom:1px dotted var(--inf);background:none}
.claim.inf:hover{background:rgba(216,162,60,.07)}
.mark{
  display:inline-block;vertical-align:super;font:600 9px var(--mono);
  color:var(--ok);background:var(--okd);border:1px solid var(--ok);
  border-radius:var(--r1);padding:0 4px;margin-left:5px;cursor:pointer;line-height:1.5
}
.mark:hover{background:var(--ok);color:var(--ink)}
.tag{
  display:inline-block;font:600 9px var(--sans);letter-spacing:.06em;color:var(--inf);
  background:var(--infd);border:1px solid var(--inf);border-radius:var(--r1);
  padding:0 5px;margin-left:6px;vertical-align:super;line-height:1.6
}
.pop{margin:4px 0 18px}

/* glossary terms */
.gterm{
  cursor:help;border-bottom:1px dotted var(--brand);color:inherit;
  background:none;border-top:0;border-left:0;border-right:0;font:inherit;padding:0
}
.gterm:hover{color:var(--brand2);border-bottom-style:solid}
.gpop{
  position:absolute;z-index:80;max-width:380px;background:var(--ink2);
  border:1px solid var(--rule2);border-left:2px solid var(--brand);
  border-radius:var(--r2);box-shadow:var(--e2);padding:12px 14px;font-size:13px
}
.gpop .gt{font:600 12px var(--sans);letter-spacing:.03em;margin-bottom:4px}
.gpop .gd{color:var(--dim);margin-bottom:8px}
.gpop .gsrc{font:11px var(--mono);color:var(--faint)}
.gpop .gsrc button{
  background:none;border:0;color:var(--brand);cursor:pointer;font:inherit;padding:0;text-decoration:underline
}

/* ---------- code excerpt ---------- */
.ex{border:1px solid var(--rule2);border-radius:var(--r2);overflow:hidden;background:var(--ink2)}
.ex header{
  display:flex;align-items:center;gap:6px;background:var(--ink3);
  padding:7px 12px;font:12px var(--mono);color:var(--dim);border-bottom:1px solid var(--rule)
}
.ex header b{color:var(--bone);font-weight:500}
.ex header .sp{flex:1}
.ex header .sha{color:var(--faint);font-size:10.5px}
.cp-btn{
  background:none;border:1px solid var(--rule2);border-radius:var(--r1);color:var(--dim);
  cursor:pointer;font:600 10px var(--sans);letter-spacing:.05em;padding:2px 7px
}
.cp-btn:hover{color:var(--bone);border-color:var(--brand)}
.code{max-height:432px;overflow:auto}
.code table{border-collapse:collapse;width:100%;font:12.5px/1.55 var(--mono)}
.code .ln{
  color:var(--faint);text-align:right;padding:0 10px 0 14px;user-select:none;
  width:1%;white-space:nowrap;vertical-align:top
}
.code .src{white-space:pre;padding-right:16px}
.code tr.hl{background:var(--okd)}
.code tr.hl .ln{color:var(--ok);position:relative}
.code tr.hl .ln::before{content:"▸";position:absolute;left:3px;color:var(--ok)}
.code tr.el td{color:var(--faint);font-style:italic;padding:2px 14px}
.ex figcaption{padding:8px 12px;font-size:12px;color:var(--faint);border-top:1px solid var(--rule)}

/* ---------- command block ---------- */
.cmd{border:1px solid var(--rule2);border-radius:var(--r2);overflow:hidden;background:var(--ink2)}
.cmd.fail{border-left:2px solid var(--bad)}
.cmd header{
  display:flex;align-items:center;gap:10px;background:var(--ink3);
  padding:9px 12px;font:13px var(--mono)
}
.cmd .pr{color:var(--dim)}
.cmd header code{color:var(--bone)}
.cmd .res{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{font:600 10.5px var(--mono);border-radius:var(--r1);padding:2px 7px}
.pill.ok{color:var(--ok);background:var(--okd)}
.pill.bad{color:var(--bad);background:var(--badd)}
.pill.wait{color:var(--inf);background:var(--infd);margin-left:auto}
.dur{font:11.5px var(--mono);color:var(--faint)}
.brk{background:var(--badd);border-top:1px solid var(--rule);padding:10px 12px;font-size:13px}
.brk b{color:var(--bad);font:600 10.5px var(--sans);letter-spacing:.06em;display:block;margin-bottom:4px}
.out{border-top:1px solid var(--rule)}
.out summary{
  cursor:pointer;padding:7px 12px;font:600 11px var(--sans);letter-spacing:.04em;color:var(--dim);list-style:none
}
.out summary::before{content:"▸ ";color:var(--faint)}
.out[open] summary::before{content:"▾ "}
.out summary:hover{color:var(--bone)}
.out pre{
  padding:10px 14px;font:12px/1.5 var(--mono);color:var(--dim);
  overflow-x:auto;max-height:420px;overflow-y:auto;border-top:1px solid var(--rule)
}
.envnote{padding:6px 12px;font:11px var(--mono);color:var(--faint);border-top:1px solid var(--rule)}

/* predict-then-reveal */
.pred{border-top:1px solid var(--rule);padding:10px 12px;background:var(--ink2)}
.pred .q{font-size:13.5px;margin-bottom:8px}
.pred .q b{
  font:600 9.5px var(--sans);letter-spacing:.08em;color:var(--brand);
  border:1px solid var(--brand);border-radius:var(--r1);padding:1px 5px;margin-right:8px;vertical-align:1px
}
.popts{display:flex;flex-direction:column;gap:6px}
.popt{
  display:flex;gap:10px;align-items:baseline;border:1px solid var(--rule2);
  border-radius:var(--r1);padding:6px 10px;cursor:pointer;font-size:13px
}
.popt:hover{border-color:var(--brand);background:var(--brandd)}
.popt .i{font:600 11px var(--mono);color:var(--faint);flex:none}
.pred.done .popt{cursor:default}
.pred.done .popt:hover{border-color:var(--rule2);background:none}
.popt.right{border-color:var(--ok);background:var(--okd)}
.popt.right .i{color:var(--ok)}
.popt.wrong{border-color:var(--bad);background:var(--badd)}
.popt.wrong .i{color:var(--bad)}
.pfoot{display:flex;gap:12px;align-items:baseline;margin-top:8px;flex-wrap:wrap}
.verdict{font:600 11px var(--sans);letter-spacing:.05em}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--bad)}
.prov{font:11.5px var(--mono);color:var(--faint)}
.prov b{font:600 9.5px var(--sans);letter-spacing:.06em;color:var(--dim);margin-right:6px}
.veil{visibility:hidden;height:0;overflow:hidden;margin:0 !important}
.veilnote{
  border:1px dashed var(--rule2);border-radius:var(--r2);color:var(--faint);
  font-size:12.5px;padding:10px 14px
}

/* ---------- callout ---------- */
.call{
  border:1px solid var(--rule2);border-left:2px solid var(--rule2);
  border-radius:var(--r2);padding:12px 16px;font-size:13.5px;color:var(--dim);
  background:var(--ink2);max-width:none
}
.call b{
  display:block;font:600 10.5px var(--sans);letter-spacing:.07em;
  color:var(--faint);margin-bottom:5px
}
.call.inferred{border-left-color:var(--inf)} .call.inferred b{color:var(--inf)}
.call.broken{border-left-color:var(--bad)} .call.broken b{color:var(--bad)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--rule2);border:1px solid var(--rule2);border-radius:var(--r2);overflow:hidden}
.stat{background:var(--ink2);padding:14px 16px}
.stat .v{font:600 26px/1.1 var(--sans);letter-spacing:-.01em}
.stat .v .of{font-size:15px;color:var(--faint);font-weight:400}
.stat .l{font:600 10px var(--sans);letter-spacing:.07em;color:var(--faint);margin-top:4px;text-transform:uppercase}
.stat .s{font:11.5px var(--sans);color:var(--dim);margin-top:2px}

/* ---------- table ---------- */
.tbl{border:1px solid var(--rule2);border-radius:var(--r2);overflow:auto;max-height:560px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.tbl th{
  position:sticky;top:0;background:var(--ink3);text-align:left;
  font:600 10.5px var(--sans);letter-spacing:.06em;color:var(--faint);
  padding:8px 12px;border-bottom:1px solid var(--rule2);white-space:nowrap
}
.tbl th[data-sort]{cursor:pointer}
.tbl th[data-sort]:hover{color:var(--bone)}
.tbl th .ar{color:var(--brand)}
.tbl td{padding:7px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl td.r{text-align:right;font-family:var(--mono);font-size:12.5px}
.tbl td code{font-size:12px;color:var(--brand2)}
:root[data-theme="light"] .tbl td code{color:var(--brand)}
.tbl tr:hover td{background:var(--ink3)}

/* ---------- map ---------- */
.mapwrap{max-width:1080px}
.mapbox{
  border:1px solid var(--rule2);border-radius:var(--r2);background:var(--ink2);
  position:relative;overflow:hidden
}
.mapbox svg{display:block;width:100%;height:auto}
.map-collab{font:600 10px var(--sans);letter-spacing:.1em;fill:var(--faint)}
.map-colline{stroke:var(--rule);stroke-dasharray:2 4}
.edge{fill:none;stroke:var(--brand);opacity:.16;transition:opacity .15s}
.edge.lit{opacity:.85;stroke:var(--brand)}
.edge.dim{opacity:.04}
.node{cursor:pointer}
.node .n-body{fill:var(--ink3);stroke:var(--rule2);transition:fill .15s,stroke .15s}
.node:hover .n-body,.node:focus-visible .n-body{fill:var(--brandd);stroke:var(--brand)}
.node.sel .n-body{fill:var(--brandd);stroke:var(--brand);stroke-width:1.5}
.node.dim{opacity:.30}
.node.tourlit .n-body{stroke:var(--brand);stroke-width:2;fill:var(--brandd)}
.n-lab{font:600 12.5px var(--sans);fill:var(--bone);pointer-events:none}
.n-loc{font:10px var(--mono);fill:var(--faint);pointer-events:none}
.hint{
  position:absolute;right:10px;bottom:8px;font:600 9.5px var(--sans);
  letter-spacing:.08em;color:var(--faint)
}
.maptools{display:flex;gap:6px;position:absolute;left:10px;bottom:8px}
.tourcard{
  border:1px solid var(--brand);border-radius:var(--r2);background:var(--ink2);
  box-shadow:var(--e2);padding:12px 16px;margin-top:10px;max-width:640px
}
.tourcard .tk{font:600 10px var(--sans);letter-spacing:.08em;color:var(--brand);margin-bottom:4px}
.tourcard p{font-size:13.5px;color:var(--dim);margin-bottom:10px}
.tourcard .tnav{display:flex;gap:6px}
.fallback{margin-top:12px;font-size:13px;color:var(--dim)}
.fallback summary{cursor:pointer;font:600 11px var(--sans);letter-spacing:.04em;color:var(--faint)}
.fallback summary:hover{color:var(--bone)}
.fallback ul{margin:10px 0 0 18px;display:flex;flex-direction:column;gap:6px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,8,14,.55);z-index:70}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);z-index:75;
  background:var(--ink2);border-left:1px solid var(--rule2);box-shadow:var(--e2);
  overflow-y:auto;padding:20px 22px 40px
}
.drawer .k{font:600 10px var(--sans);letter-spacing:.1em;color:var(--faint);margin-bottom:6px}
.drawer h4{font:700 22px var(--serif);margin-bottom:2px}
.drawer .dsub{font:11.5px var(--mono);color:var(--faint);margin-bottom:14px}
.drawer .role p{font-size:13.5px;color:var(--dim);margin-bottom:10px}
.drawer h5{
  font:600 10.5px var(--sans);letter-spacing:.07em;color:var(--faint);
  margin:16px 0 8px;text-transform:uppercase;border-top:1px solid var(--rule);padding-top:12px
}
.drawer .dep{font-size:12.5px;color:var(--dim);margin-bottom:6px}
.drawer .dep b{color:var(--bone);font-weight:600}
.kf{display:flex;flex-direction:column;gap:6px}
.kf div{font-size:12.5px;color:var(--dim)}
.kf code{color:var(--brand2);font-size:12px}
:root[data-theme="light"] .kf code{color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font:600 10.5px var(--sans);letter-spacing:.03em;color:var(--dim);
  border:1px solid var(--rule2);border-radius:var(--r1);padding:2px 8px
}
.xbtn{
  position:sticky;top:0;float:right;background:var(--ink3);border:1px solid var(--rule2);
  border-radius:var(--r1);color:var(--dim);cursor:pointer;font:600 11px var(--sans);padding:4px 8px
}
.xbtn:hover{color:var(--bone);border-color:var(--brand)}

/* ---------- trace ---------- */
.trace{position:relative;padding-left:34px}
.trace::before{content:"";position:absolute;left:11px;top:8px;bottom:26px;width:1px;background:var(--rule2)}
.hop{position:relative;margin-bottom:26px}
.hop>.dot{
  position:absolute;left:-34px;top:0;width:23px;height:23px;border-radius:50%;
  background:var(--ink3);border:1px solid var(--brand);color:var(--brand);
  font:600 11px var(--mono);display:flex;align-items:center;justify-content:center
}
.hop h4{font:600 15px var(--sans);margin-bottom:1px}
.hop .an{font:11.5px var(--mono);color:var(--faint);margin-bottom:8px}
.hop .nx{font:12.5px var(--sans);color:var(--dim);margin-top:8px}
.hop .nx b{color:var(--brand2);font-weight:600}
:root[data-theme="light"] .hop .nx b{color:var(--brand)}

/* ---------- checkpoint ---------- */
.cpx{border:1px solid var(--rule2);border-radius:var(--r2);background:var(--ink2);padding:16px 18px}
.cpx>.k{font:600 10px var(--sans);letter-spacing:.09em;color:var(--inf);margin-bottom:8px}
.cpx h4{font:600 16.5px var(--sans);margin-bottom:12px;max-width:66ch}
.conf{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim);margin-bottom:12px;flex-wrap:wrap}
.conf.said{color:var(--faint)}
.cbtn{
  background:none;border:1px solid var(--rule2);border-radius:var(--r1);color:var(--dim);
  cursor:pointer;font:600 10.5px var(--sans);letter-spacing:.05em;padding:4px 10px
}
.cbtn:hover{border-color:var(--brand);color:var(--bone)}
.opt{
  display:flex;gap:10px;align-items:baseline;border:1px solid var(--rule2);
  border-radius:var(--r1);padding:8px 12px;margin-bottom:6px;cursor:pointer;font-size:13.5px
}
.opt:hover{border-color:var(--brand);background:var(--brandd)}
.opt.gated{opacity:.55;cursor:not-allowed}
.opt.gated:hover{border-color:var(--rule2);background:none}
.opt .i{font:600 11.5px var(--mono);color:var(--faint);flex:none}
.opt.right{border-color:var(--ok);background:var(--okd)}
.opt.right .i{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badd)}
.opt.wrong .i{color:var(--bad)}
.ordr{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:13.5px}
.ordr select{
  background:var(--ink3);color:var(--bone);border:1px solid var(--rule2);
  border-radius:var(--r1);font:12.5px var(--mono);padding:3px 6px
}
.act{display:flex;align-items:center;gap:12px;margin-top:12px}
.sub{
  background:var(--brand);border:1px solid var(--brand);border-radius:var(--r1);
  color:var(--ink);cursor:pointer;font:600 11px var(--sans);letter-spacing:.05em;padding:6px 14px
}
:root[data-theme="light"] .sub{color:#fff}
.sub:disabled{background:var(--ink3);border-color:var(--rule2);color:var(--faint);cursor:not-allowed}
.expl{
  border-top:1px solid var(--rule);margin-top:12px;padding-top:10px;
  font-size:13px;color:var(--dim)
}
.expl .prov{display:block;margin-top:8px}

/* ---------- ledger / audit ---------- */
.sumgrid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
  background:var(--rule2);border:1px solid var(--rule2);border-radius:var(--r2);overflow:hidden;margin-bottom:16px
}
.sumgrid>div{background:var(--ink2);padding:12px 14px}
.sumgrid .v{font:600 24px/1.1 var(--sans)}
.sumgrid .v .of{font-size:14px;color:var(--faint);font-weight:400}
.sumgrid .l{font:600 9.5px var(--sans);letter-spacing:.07em;color:var(--faint);margin-top:3px}
.yh{font:600 10.5px var(--sans);letter-spacing:.08em;color:var(--faint);margin:18px 0 8px}
.st{font:600 10px var(--sans);letter-spacing:.04em;border-radius:var(--r1);padding:1px 6px}
.st.x{color:var(--bad);background:var(--badd)}

/* ---------- footer nav ---------- */
.fnav{display:flex;gap:10px;margin-top:40px}
.fnav button{
  flex:1;text-align:left;background:var(--ink2);border:1px solid var(--rule2);
  border-radius:var(--r2);color:var(--bone);cursor:pointer;padding:12px 16px;font:14px var(--sans)
}
.fnav button:hover:not(:disabled){border-color:var(--brand)}
.fnav button:disabled{opacity:.35;cursor:default}
.fnav .k{display:block;font:600 10px var(--sans);letter-spacing:.07em;color:var(--faint);margin-bottom:3px}
.fnav .nxt{text-align:right}

/* ---------- modal ---------- */
.modal{
  position:fixed;inset:6vh 8vw;z-index:90;background:var(--ink2);
  border:1px solid var(--rule2);border-radius:var(--r2);box-shadow:var(--e2);
  overflow-y:auto;padding:24px 28px
}
.modal h3{font:700 24px var(--serif);margin-bottom:14px}

/* ---------- cover ---------- */
.cover h1{font-size:46px;margin-bottom:6px}
.cover .thesis{font-size:18px;color:var(--dim);max-width:64ch;margin-bottom:26px}
.startrow{display:flex;gap:12px;align-items:center;margin:26px 0 6px}
.start{
  background:var(--brand);border:1px solid var(--brand);border-radius:var(--r1);
  color:var(--ink);cursor:pointer;font:600 13px var(--sans);letter-spacing:.05em;padding:10px 22px
}
:root[data-theme="light"] .start{color:#fff}
.start:hover{filter:brightness(1.1)}

/* ---------- projector ---------- */
:root[data-proj="1"]{--base:20px}
:root[data-proj="1"] .rail{display:none}
:root[data-proj="1"] .code{max-height:300px}
:root[data-proj="1"] .stopwrap{max-width:1000px}

/* ---------- focus / motion / print / responsive ---------- */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media print{
  body::before{display:none}
  .bar,.rail,.fnav,.tools,.hint,.maptools{display:none !important}
  .wrap{padding-top:0}
  .stage{padding:0}
  .veil{visibility:visible;height:auto;overflow:visible}
  .out pre{max-height:none}
  .code{max-height:none}
  .printall .stopwrap{page-break-after:always}
}
.railbtn{display:none}
@media (max-width:900px){
  .railbtn{display:inline-block}
  .rail{position:fixed;left:0;top:var(--bar);width:100%;height:auto;max-height:60vh;z-index:55;
    border-bottom:1px solid var(--rule2);display:none;box-shadow:var(--e2)}
  .rail.open{display:block}
  .stage{padding:24px 16px 80px}
  .meta{display:none}
  .brand .tm{display:none}
  .modal{inset:4vh 4vw}
}
</style>

<script>
const DATA = {"contract":"trailhead/verified@3-template","repo":{"name":"ml-vol-estimator","commit":"nogit-1c4f5dc3","generated_at":"2026-07-30T22:59:18Z"},"report":{"claims":77,"verified":69,"dropped":0,"inferred":8,"commands":5,"failed":4,"tool_version":"template 1.0 (hand-built target)","duration_s":1,"regen":"Hand-built target artifact. Rebuild: node hackathon/template/build.mjs; re-check: node hackathon/template/verify.mjs. Every anchor re-resolved from a verbatim quote and sha256-hashed against the snapshot; dash characters in captured output are transliterated to hyphens."},"map":{"note":{"title":"WHAT IS NOT ON THIS BOARD","text":"Two things are deliberately off the board. src/tests/ (225 files, 55,156 loc) imports every column and drew eleven edges that turned the graph into a hairball; it gets its own stop instead. And 14 modules that the code imports do not exist in this snapshot, including the tournament runner and the HAR model family: see the restore ledger on the setup stop. The survey counts them; the board only draws files that exist."},"tour":[{"id":"n-cli","text":"Start here. Every interaction is a `vol` subcommand: one primary command, `vol run --config \u003cyaml>`, plus about two dozen utilities for ingestion, auditing, and the live forecast. Each subcommand registers itself, so the surface grows without touching the entry point."},{"id":"n-core","text":"The hub. registry.py holds three string-to-class maps for models, feature layers, and graph builders. A YAML config names components; the registry turns names into classes. This is why 69 files import it, and why you cannot change it quietly."},{"id":"n-data","text":"The heaviest lifting. Ticks from [[chunk-store|Chunk Store]], daily series from [[tsdb|TSDB]], the SPX vol surface from [[marquee|Marquee EDRVOL]]. measures.py turns millions of ticks into a handful of daily numbers: [[rv|realized variance]], [[bpv|bipower variation]], jump tests, [[rk|the realized kernel]]."},{"id":"n-features","text":"The design matrix factory: layers 0 to 5, from HAR lags through options-implied, microstructure, cross-asset, and calendar features, each a registered class a config can stack. Suffixes are systematic: _d daily, _w the 5 day mean, _m the 22 day mean."},{"id":"n-models","text":"The zoo: 24 registered names from nine naive baselines through LightGBM, XGBoost, and seven graph models. One shared contract, and nearly every trainable model optimizes [[qlike|QLIKE]] directly during training. The linear HAR family and the LSTM are imported here but missing from this snapshot."},{"id":"n-pipeline","text":"The anti-cheating layer: per-symbol normalisers fitted on training rows only, a content-addressed fold cache for expensive sequence models, and the per-sample conditional [[duan|Duan correction]] estimated strictly walk-forward."},{"id":"n-evaluation","text":"Where claims go to die: [[qlike|QLIKE]] ranking, panel-aware [[dm|Diebold-Mariano]] tests, the [[mcs|Model Confidence Set]], and then the money tests: realistic delta-hedged straddles with a full P&L waterfall, and the [[gsvivs|GSVIVS01]] signal backtest."},{"id":"n-utils","text":"Last, the quiet dependency: utils/paths.py anchors every cache path to the repo root, and utils/cv.py holds the splitters that make every result walk-forward honest. Everything above imports these; nothing here imports back."}],"nodes":[{"id":"n-cli","label":"cli","path":"src/volforecast/cli/","loc":7342,"files":28,"role":["One module per subcommand, each exposing a register(subparsers) function that `__main__` calls lazily, so the command surface is owned by the modules that implement it. The primary command is `vol run`, which drives the whole experiment pipeline; around it sit eleven ingest commands, audit and status for data integrity, cache tools, and three experiment-management commands over the trial registry.","Two commands are ends in themselves: `vol forecast` is the live product, an ensemble that predicts next-day RV, compares it to current ATM IV, and prints LONG, SHORT, or FLAT; `vol kvar` prints the GSVIVS signal scoreboard across cached IV sources.","The shell wrappers sit in front: ./vol is hard-guarded to the GS Linux workspace and bootstraps uv, system site-packages, and nix library paths, while vol.cmd on Windows supports only the dev loop."],"reads":"User intent: argv, YAML config paths, and the interactive config picker over `workspace/configs/`.","feeds":"Everything: it triggers ingestion in `data`, experiment runs through `core`, and result browsing in `evaluation`.","key_files":[{"file":"console.py","purpose":"shared Rich console singleton and logging setup used by every command"},{"file":"config_picker.py","purpose":"interactive menu over workspace/configs/ YAMLs when vol run gets no --config"},{"file":"audit.py","purpose":"validates every cached parquet against manifest contracts and regenerates data/manifest.json"},{"file":"forecast.py","purpose":"the live signal: multi-model ensemble to LONG / SHORT / FLAT against current ATM IV"},{"file":"kvar.py","purpose":"GSVIVS signal performance tables (Sharpe, drawdown, hit rate) across IV sources"}],"concepts":["register() pattern","ingest commands","live IV-RV signal","trial registry"],"anchor_caption":"The live end product: forecast.py compares the RV forecast to ATM IV and emits a position.","w":150,"h":56,"x":14,"y":40,"anchor":{"file":"src/volforecast/cli/forecast.py","start":1,"end":14,"focus":[3,4,5],"sha256":"699fd6efe870e4fb9af5bfd0ce144f116bacd668dd393627ee3980ad6b81e297"}},{"id":"n-core","label":"core + registry","path":"src/volforecast/","loc":1013,"files":3,"role":["The package root holds three files that everything else orbits. The `__init__` docstring states the thesis: enrich HAR baselines with microstructure, options, and cross-asset features via gradient boosting until the QLIKE gain is statistically significant and tradeable.","`__main__.py` is the single entry point: it assembles the parser, applies the ingest gate, then routes every run mode through the tournament, wiring progress callbacks for folds, Optuna trials, MCS statistics, straddle P&L, and SHAP into the terminal display, and finally updates the trial registry from metrics.json.","registry.py is why this tiny package is imported by 69 files: three dicts map string names to model, feature-layer, and graph-builder classes, so YAML configs can name components without importing them."],"reads":"A YAML experiment file, resolved into an ExperimentConfig (whose source module is missing from this snapshot).","feeds":"Dispatch: every other package is reached from here by name lookup.","key_files":[{"file":"__init__.py","purpose":"the thesis docstring and package version"},{"file":"__main__.py","purpose":"CLI entry: parser assembly, ingest gate, tournament routing, trial registry update"},{"file":"registry.py","purpose":"MODEL_REGISTRY, FEATURE_REGISTRY, GRAPH_REGISTRY and their decorators"}],"concepts":["registry pattern","ingest gate","tournament routing","trial registry"],"anchor_caption":"Three registries, one hub: the reason 69 files import this module.","w":150,"h":47,"x":151,"y":40,"anchor":{"file":"src/volforecast/registry.py","start":1,"end":14,"focus":[5,6,7],"sha256":"76cd3542fa317e45383bd17db4315499b38ba5d589eda99c8cdb6fe30de080e8"}},{"id":"n-data","label":"data","path":"src/volforecast/data/","loc":9195,"files":21,"role":["The ingestion and caching tier: it turns three GS market data services into per-symbol parquet caches and model-ready tensors. Chunk Store supplies raw L1 ticks for the 34 symbol universe, TSDB supplies daily OHLCV and cross-asset series, and Marquee EDRVOL_PERCENT supplies the SPX implied vol surface.","measures.py is the scientific heart: realized variance from squared 5 minute returns, jump-robust bipower variation, the BNS z-test splitting RV into continuous and jump parts, Patton-Sheppard semivariances, realized quarticity, and a Parzen realized kernel for noise robustness. Every formula is paper-anchored and gold-value tested.","Beyond daily scalars it builds sequences: micro.py aggregates ticks into 10 second signed-volume bars with VPIN and order-flow aggregates, and sequence_cache.py pre-stacks them into padded float32 tensors so deep models train as pure GPU ops. Cache writes are atomic (temp file then rename) and merging, never destructive."],"reads":"Chunk Store ticks, TSDB daily series, and the Marquee vol surface, via GS-network-only client libraries.","feeds":"Daily panels to `features`, sequence tensors to the deep models, and IV panels to the signal stack.","key_files":[{"file":"measures.py","purpose":"the canonical estimators: RV, BPV, semivariances, jump tests, realized kernel"},{"file":"rv_panel.py","purpose":"streaming, checkpointed builder of the per-symbol daily RV panel"},{"file":"micro.py","purpose":"10 second signed-volume bars, VPIN, order flow; sequences for LSTM / TCN"},{"file":"sequence_cache.py","purpose":"padded (dates, bars, features) tensors cached as .pt, leakage-free normalisation"},{"file":"iv_features.py","purpose":"causal shift(1) IV features: VRP, term slope, butterfly, vol of VIX"},{"file":"gsvivs_kvar.py","purpose":"recovers the exact execution Kvar from GSVIVS01 option fills via the CBOE formula"}],"concepts":["realized variance","bipower variation","jump detection","VPIN","atomic parquet caches","IV surface"],"anchor_caption":"Jump-robust bipower variation, one of the estimators computed for every symbol-day.","w":150,"h":58,"x":288,"y":40,"anchor":{"file":"src/volforecast/data/measures.py","start":70,"end":85,"focus":[75,76],"sha256":"8a3647ebf19e14f2486f061072d037e647a8aeffddeddaceaf56b823e99ad8a0"}},{"id":"n-features","label":"features","path":"src/volforecast/features/","loc":3110,"files":18,"role":["Eighteen registered feature layers turn daily measures and enriched market columns into the design matrix. The numbered spine is layers 0 to 5: HAR core (log RV at d/w/m horizons plus HARQ quarticity terms), asymmetry (semivariances, jumps), options (VRP, skew, term slope, 0DTE tenors, IV x RV interactions), microstructure (VPIN, Kyle lambda, Amihud), cross-asset (rates, FX, commodities, spillover), and calendar (FOMC, NFP, OpEx proximity).","Registered extensions go further: dealer gamma exposure, implied and realized correlation, the 73 feature GSVIVS01 signal set, long-memory lags for h=22, Markov regime probabilities, and noise-robust estimators. Each layer is a class with a uniform compute(daily_data, context) contract, so a config stacks them declaratively and order matters only where documented.","Naming is systematic and worth memorising: _d is the daily value, _w the 5 day rolling mean, _m the 22 day mean; momentum features use d_*_1d, d_*_5d and z_* rolling z-scores."],"reads":"Daily RV panels and enriched market columns from `data`; caches under data/raw/ for GEX, correlation, and options data.","feeds":"The design matrix consumed by every tabular model in `models`.","key_files":[{"file":"har.py","purpose":"Layer 0: the HAR backbone plus HARQ measurement-quality terms"},{"file":"options.py","purpose":"Layer 2: VRP, skew, term slope, 0DTE / 1W tenors, IV x log RV interactions"},{"file":"gsvivs_signals.py","purpose":"the exact 73 feature input set of the GSVIVS01 short-variance strategy"},{"file":"transforms.py","purpose":"safe_log and the lagged _d / _w / _m column factory"},{"file":"calendar.py","purpose":"Layer 5: FOMC (hardcoded 2015 to 2026), NFP, OpEx proximity"}],"concepts":["feature layers 0-5","HARQ","0DTE IV","dealer gamma","suffix naming"],"anchor_caption":"The package docstring declaring the layer architecture.","w":150,"h":51,"x":425,"y":40,"anchor":{"file":"src/volforecast/features/__init__.py","start":1,"end":10,"focus":[1,3],"sha256":"e0e6ac51a4422fb82583db546796549bb0e475cc4bf0e080da4cb74fcdebc0f4"}},{"id":"n-graphs","label":"graphs","path":"src/volforecast/graphs/","loc":826,"files":9,"role":["Point-in-time graph construction for the graph models: a graph used to forecast date t is estimated only on data up to t, re-estimated every refit_every trading days, and frozen between refits, so the network structure itself cannot leak the future.","Registered builders cover correlation threshold and kNN graphs, GLASSO conditional-independence graphs, the directed Diebold-Yilmaz spillover graph from a VAR variance decomposition, structural sector and identity graphs, a factor-residual wrapper, and a calm/stress regime blend. Diagnostics watch density explosions and refit-to-refit edge stability."],"reads":"Rolling windows of the log RV panel and returns from `data`.","feeds":"GraphSnapshot objects (COO edges plus weights) to the GNN and GHAR models in `models`.","key_files":[{"file":"base.py","purpose":"GraphSnapshot, the GraphBuilder protocol, and the point-in-time schedule"},{"file":"spillover.py","purpose":"directed Diebold-Yilmaz graph from a generalized FEVD"},{"file":"glasso.py","purpose":"sparse precision-support graph: edges are conditional dependence"}],"concepts":["point-in-time protocol","GraphSnapshot","spillover graph","edge stability"],"anchor_caption":"The point-in-time protocol that keeps look-ahead out of the graph structure.","w":150,"h":47,"x":425,"y":117,"anchor":{"file":"src/volforecast/graphs/base.py","start":1,"end":17,"focus":[6,7,8],"sha256":"dc3aff267b8427e4aa18395c8d54a1788cd07bbe24a71a7f11db540dc9da54db"}},{"id":"n-models","label":"models","path":"src/volforecast/models/","loc":9802,"files":22,"role":["The model zoo: 24 registered names, all speaking the _BaseModel contract, so the harness treats a random walk and a graph attention network identically. Families: nine naive baselines that set the QLIKE floor; the linear HAR family (missing from this snapshot, its base class and tuning grid remain); gradient boosting via LightGBM, its DART variant, and XGBoost; a seven-model graph suite; and five ensembles including bagging, calibration, stacking, and a regime-dependent blend.","The signature move is that training loss equals evaluation loss: LightGBM and XGBoost run a hand-derived QLIKE gradient and hessian as a custom objective, and the torch graph models share a QLIKE loss, all in log RV space.","The graph suite is built for honest attribution: ghar with zero adjacency recovers pooled HAR exactly, gsp_har nests QLIKE-HAR at initialization, and stid deliberately ignores edges so that any \"graph\" gain must beat pooling plus asset identity first. The research journal records the outcome: all five graph trials landed within 1 bp of the linear baseline."],"reads":"Feature matrices from `features`, graph snapshots from `graphs`, sequence tensors from `data`.","feeds":"Out-of-sample log RV predictions per fold into `evaluation`.","key_files":[{"file":"_base.py","purpose":"the shared contract: REQUIRED_LAYERS, capability flags, save / load"},{"file":"lightgbm.py","purpose":"the workhorse: QLIKE custom objective, Optuna tuning, TreeSHAP selection"},{"file":"xgboost.py","purpose":"independent cross-check of LightGBM with the same objective; current h=1 champion"},{"file":"naive.py","purpose":"nine baselines from random walk to VIX-implied that set the QLIKE floor"},{"file":"gnn.py","purpose":"GATv2 attention over per-date correlation graphs, shared QLIKE loss for torch models"},{"file":"stid.py","purpose":"the deflation control: same harness, edges ignored on purpose"}],"concepts":["model registry","QLIKE objective","naive floor","deflation control","ensembles"],"anchor_caption":"The QLIKE gradient and hessian LightGBM trains on: loss equals metric.","w":150,"h":59,"x":562,"y":40,"anchor":{"file":"src/volforecast/models/lightgbm.py","start":70,"end":86,"focus":[75,76,77],"sha256":"4084db37b56a2a7c5162bfc25ec87cac3449ab3a0e9b804ce3b8dab6eeb7814e"}},{"id":"n-pipeline","label":"pipeline","path":"src/volforecast/pipeline/","loc":1307,"files":6,"role":["Fold-level orchestration between the CV splitters and the models, built to make cheating structurally difficult. norm.py fits per-symbol z-score normalisers from training rows only; feature_selection.py runs Boruta-style TreeSHAP shadow selection inside each outer fold; graph_data.py bridges the pooled panel into per-date graph dicts.","fold_cache.py content-addresses expensive sequence-model training: a fingerprint over config, horizon, fold, split dates, and base-model predictions decides whether a fold can be skipped, so nothing retrains by accident and nothing is reused wrongly. conditional_duan.py upgrades the global log-to-level bias correction to a per-sample one, trained walk-forward on prior folds' residuals or a VVIX proxy."],"reads":"Fold definitions from utils/cv.py, features and sequences from upstream.","feeds":"Clean, leakage-controlled inputs to `models`; corrected predictions to `evaluation`.","key_files":[{"file":"fold_cache.py","purpose":"fingerprint-keyed skip of already-trained sequence folds"},{"file":"norm.py","purpose":"per-symbol z-scoring fitted on training data only"},{"file":"conditional_duan.py","purpose":"per-sample walk-forward Duan correction, optional VVIX proxy"}],"concepts":["fold fingerprint","shadow features","conditional Duan","per-symbol normalisation"],"anchor_caption":"The fold cache fingerprint: every input that affects the trained model.","w":150,"h":48,"x":562,"y":125,"anchor":{"file":"src/volforecast/pipeline/fold_cache.py","start":1,"end":9,"focus":[3,4,5,6,7],"sha256":"cbff3ce67bc14cb82f4068e379feece674d3b376e2489634e7a783022ce9358a"}},{"id":"n-evaluation","label":"evaluation","path":"src/volforecast/evaluation/","loc":7031,"files":14,"role":["The tournament and the money. statistical_tests.py builds one ranked table per horizon: QLIKE, panel-aware Diebold-Mariano against the baseline, Mincer-Zarnowitz efficiency, Model Confidence Set membership via block bootstrap, plus a calm/turbulent split so you can see where a model earns its keep.","Then forecasts are traded on paper, three ways: delta-hedged straddles, from an analytic engine with the full P&L waterfall (tenor-decayed gamma, vanna, volga, maturity-widening spreads, Boyle-Emanuel hedge-error variance) to a bar-by-bar simulator on 15 minute bars; the GSVIVS01 index signal across six registered IV sources with four sizing modes; and vol-targeting portfolios. Sharpe ratios get deflated for selection luck and bracketed with bootstrap confidence intervals and cost bands.","checkpoint.py makes tournaments resumable at model granularity with atomic writes, and explainability.py adds TreeSHAP and a from-scratch ALE implementation so the tree models can be interrogated."],"reads":"Per-fold predictions from the models, IV caches and index levels from `data`.","feeds":"metrics.json, the tournament dashboard, and the trial registry.","key_files":[{"file":"metrics.py","purpose":"QLIKE and friends, plus the Duan retransformation"},{"file":"statistical_tests.py","purpose":"DM, MCS, Mincer-Zarnowitz, the ranked tournament table"},{"file":"realistic_straddle.py","purpose":"the honest straddle engine: full P&L waterfall and deflated Sharpe"},{"file":"gsvivs.py","purpose":"GSVIVS01 backtest orchestration across six IV sources"},{"file":"checkpoint.py","purpose":"crash-safe per-model resume for tournaments"}],"concepts":["tournament table","turbulence split","P&L waterfall","deflated Sharpe","cost bands"],"anchor_caption":"One ranked table: every statistical test in a single tournament view.","w":150,"h":56,"x":699,"y":40,"anchor":{"file":"src/volforecast/evaluation/statistical_tests.py","start":475,"end":490,"focus":[480,481],"sha256":"b7064d980da6429b9327f532cc2c166667225df7d2fab567a3f914b3fb3ad021"}},{"id":"n-reporting","label":"reporting","path":"src/volforecast/reporting/","loc":461,"files":9,"role":["The HTML experiment report, honestly unfinished: the orchestrator and five of six section renderers are documented stubs that raise NotImplementedError, pointing at the plan file that specifies them. The one real section is economic value: it aligns predictions with market data, lags IV by one day to avoid look-ahead, runs the realistic straddle engine, and renders Sharpe, DSR, and cost-band tables."],"reads":"A finished experiment directory: metrics, predictions, config snapshot.","feeds":"A single-file HTML report (when finished).","key_files":[{"file":"html_report.py","purpose":"orchestrator stub documenting the seven-step assembly plan"},{"file":"sections/economic_value.py","purpose":"the implemented section: realistic straddle metrics as HTML"}],"concepts":["report sections","look-ahead avoidance"],"anchor_caption":"The implemented section lags IV by one day before backtesting.","w":150,"h":46,"x":836,"y":40,"anchor":{"file":"src/volforecast/reporting/sections/economic_value.py","start":71,"end":86,"focus":[76,77],"sha256":"dc865c9215766684de12f3b5de5906ed37529b6dcf1503a7b3f8c96335380865"}},{"id":"n-visualization","label":"visualization","path":"src/volforecast/visualization/","loc":102,"files":2,"role":["Two files survive here: the package docstring and lineage.py, which renders a model lineage spec (base model init score, LSTM feature stack, daily features) as a Mermaid flowchart for dashboards. The dashboard builder itself, visualization/dashboard.py, is one of the modules this snapshot lost."],"reads":"Model lineage specs from tournament code.","feeds":"Mermaid flowchart strings to the dashboard.","key_files":[{"file":"lineage.py","purpose":"model lineage to Mermaid flowchart"}],"concepts":["model lineage"],"w":150,"h":44,"x":836,"y":112},{"id":"n-utils","label":"utils","path":"src/volforecast/utils/","loc":1552,"files":7,"role":["The quiet foundation, imported by eight of the ten groups on this board and importing none of them back. paths.py anchors every cache directory to the repo root by marker-file search, defining the whole data/raw and data/processed layout, so caches resolve identically from any working directory.","cv.py is the leakage firewall: purged k-fold, blocked k-fold, expanding and rolling windows, and the panel-aware expanding window that splits on unique dates. Its docstring bans random k-fold outright as catastrophic look-ahead bias, and policy repeats the ban at the API level."],"reads":"Nothing from this board.","feeds":"Path resolution and CV splits to everything above.","key_files":[{"file":"paths.py","purpose":"repo-root-anchored resolvers for every cache directory"},{"file":"cv.py","purpose":"the CV splitters: purged, blocked, expanding, rolling, panel-aware"},{"file":"manifest.py","purpose":"the ingestion manifest read by vol status and vol audit"}],"concepts":["cache layout","purged CV","walk-forward"],"anchor_caption":"The house rule, stated where the splitters live.","w":150,"h":49,"x":151,"y":113,"anchor":{"file":"src/volforecast/utils/cv.py","start":4,"end":12,"focus":[9,10],"sha256":"13f52a9d581b0efb1c15cf8af9ae1f5cef2893cff807a7d396c83ac374053db7"}}],"edges":[{"a":"n-core","b":"n-graphs","n":6},{"a":"n-core","b":"n-utils","n":2},{"a":"n-cli","b":"n-core","n":6},{"a":"n-cli","b":"n-data","n":48},{"a":"n-cli","b":"n-evaluation","n":1},{"a":"n-cli","b":"n-pipeline","n":4},{"a":"n-cli","b":"n-utils","n":33},{"a":"n-data","b":"n-core","n":2},{"a":"n-data","b":"n-utils","n":22},{"a":"n-evaluation","b":"n-utils","n":3},{"a":"n-features","b":"n-core","n":17},{"a":"n-features","b":"n-data","n":17},{"a":"n-features","b":"n-utils","n":3},{"a":"n-models","b":"n-core","n":37},{"a":"n-models","b":"n-data","n":3},{"a":"n-models","b":"n-evaluation","n":6},{"a":"n-models","b":"n-graphs","n":1},{"a":"n-models","b":"n-pipeline","n":2},{"a":"n-models","b":"n-utils","n":5},{"a":"n-pipeline","b":"n-evaluation","n":2},{"a":"n-pipeline","b":"n-graphs","n":1},{"a":"n-pipeline","b":"n-utils","n":4},{"a":"n-reporting","b":"n-evaluation","n":1}],"w":1000,"columns":[{"label":"INTERFACE","x":89,"line":false},{"label":"CORE","x":226,"line":true},{"label":"DATA","x":363,"line":true},{"label":"FEATURES","x":500,"line":true},{"label":"MODELS","x":637,"line":true},{"label":"EVALUATION","x":774,"line":true},{"label":"OUTPUT","x":911,"line":true}],"h":207},"glossary":[{"id":"qlike","term":"QLIKE","def":"The quasi-likelihood loss for variance forecasts, mean(RV/h - log(RV/h) - 1), equivalently exp(e) - e - 1 on the log-space error e. It punishes under-predicting volatility more than over-predicting it, which matches the economics: being short of realized vol is the expensive mistake. Every trainable model here optimizes it directly and the tournament ranks by it.","anchor":{"file":"src/volforecast/evaluation/metrics.py","start":17,"end":32,"focus":[22,23],"sha256":"5f284d555ac89f21e6593ca51a3d1ea6f33dac59e7559adb3a6a7d5ee85de8a0"}},{"id":"rv","term":"realized variance","def":"The sum of squared intraday returns over one trading day, computed from 5 minute returns with no mean subtraction. It is the quantity every model in this repo forecasts.","anchor":{"file":"src/volforecast/data/measures.py","start":20,"end":34,"focus":[25],"sha256":"3e702197c8dc7e1fcd36039d84e45ea0c42d1169785c3b65109731ae7d4b5ae1"}},{"id":"har","term":"HAR","def":"The heterogeneous autoregressive model: regress tomorrow's log RV on the daily value, the 5 day mean, and the 22 day mean of past RV. Three parameters, brutally hard to beat, and the baseline every ML model in the tournament is scored against.","anchor":{"file":"src/volforecast/features/har.py","start":38,"end":53,"focus":[43,44],"sha256":"2bfca4097fa644c22a95731ab8ced0cecac12460b5e13f1a4ed2f95b0241696e"}},{"id":"bpv","term":"bipower variation","def":"A jump-robust estimate of integrated variance: (pi/2) times the sum of products of adjacent absolute returns. Where RV includes jumps, BPV excludes them, and the gap between the two is the raw material for jump detection.","anchor":{"file":"src/volforecast/data/measures.py","start":70,"end":85,"focus":[75,76],"sha256":"8a3647ebf19e14f2486f061072d037e647a8aeffddeddaceaf56b823e99ad8a0"}},{"id":"semivariance","term":"realized semivariance","def":"RV split by return sign: RS+ from non-negative returns, RS- from negative ones, with RS+ plus RS- equal to RV exactly. Downside semivariance carries the leverage effect signal.","anchor":{"file":"src/volforecast/data/measures.py","start":48,"end":66,"focus":[53,54,56,57],"sha256":"32e40e8dd11ddba221fbd9a39780d03274ba81ccf4f4c02706439e7e8ff856cf"}},{"id":"rk","term":"realized kernel","def":"A microstructure-noise-robust variance estimator that weights return autocovariances with a flat-top Parzen kernel. On noisy tick data it recovers true variance better than naive tick RV, and the tests prove that property directly.","anchor":{"file":"src/volforecast/data/measures.py","start":268,"end":285,"focus":[273,275,276],"sha256":"82ad9a932ac8db6872d672872dd761445a0f423e7bfb9597d5a99ec827f4c757"}},{"id":"vpin","term":"VPIN","def":"Volume-Synchronized Probability of Informed Trading: the mean absolute buy-sell volume imbalance across equal-volume buckets. A daily order-flow toxicity measure from the microstructure layer.","anchor":{"file":"src/volforecast/data/micro.py","start":326,"end":342,"focus":[331,333],"sha256":"4da28c17e94bc7d4cf228d42d8dd3f9fc9d12cc28bfce4f3d265904eefe0f0e5"}},{"id":"tsdb","term":"TSDB","def":"The GS internal Time Series Database, queried through gs_quant_internal with eqpad_ prefixed symbols. Source of daily OHLCV, treasury yields, FX, commodities, VIX, and SPX series.","anchor":{"file":"src/volforecast/data/tsdb.py","start":1,"end":6,"focus":[3,4,5],"sha256":"f2ed300df71c3f963a8fc5173dec816604461340860cf005c833a7fc161bc5f8"}},{"id":"chunk-store","term":"Chunk Store","def":"The GS internal tick store, accessed via pytickclient. Supplies L1 trades and quotes for the 34 symbol universe plus L2 depth for the E-mini future; raw ticks are the foundation for every realized measure.","anchor":{"file":"src/volforecast/data/chunk_store.py","start":1,"end":15,"focus":[3,4,5,6],"sha256":"0e64c76d17a853cbecba1d044ec41bddaaf19111cdcddc571358b819eb506712"}},{"id":"marquee","term":"Marquee EDRVOL","def":"The Marquee dataset carrying the SPX implied volatility surface by tenor and relative strike. Bulk-fetched into a daily panel, it feeds every options-implied feature.","anchor":{"file":"src/volforecast/data/iv_ingest.py","start":1,"end":6,"focus":[1,3,4],"sha256":"278c8d236be1f93aa7728eb514444764860b0edd89e982a147c5232c0c8b6613"}},{"id":"vrp","term":"variance risk premium","def":"Option-implied variance minus expected realized variance, computed here as (atm_iv/100)^2 - rv*252. Usually positive: investors pay a premium for volatility protection, which is exactly the premium the trading strategies harvest.","anchor":{"file":"src/volforecast/features/options.py","start":23,"end":56,"focus":[28,47],"sha256":"aa0b556bd0bc594ae2df4c9334f8ad64d87d5b1612146f60d61e67f088e39ebf"}},{"id":"iv-rv-gap","term":"IV-RV gap","def":"The spread between an implied volatility measure and the model's RV forecast. Positive gap: options look rich, sell vol. Negative: options look cheap, buy vol. This one number is what the whole pipeline exists to estimate well.","anchor":{"file":"src/volforecast/evaluation/economic_value.py","start":106,"end":121,"focus":[111,112],"sha256":"cbfca042545d6eae4b81680f1388cc0af4b4d8773c081194182bb2ec373fdb7c"}},{"id":"kvar","term":"Kvar","def":"A variance swap strike. Exec Kvar is the strike actually dealt at GSVIVS execution fills, recovered from option fill prices with the CBOE discrete variance swap formula; it is the production IV input to the signal.","anchor":{"file":"src/volforecast/evaluation/gsvivs.py","start":34,"end":55,"focus":[39,40,41,42,43,44,45,46],"sha256":"9b0a452602b5998c26e99f6613af233cfca9cf432aeac0230da12aada2a2d4d7"}},{"id":"gsvivs","term":"GSVIVS01","def":"A GS short-volatility variance swap index. The strategy holds it long by default and flips short when the RV forecast exceeds the Kvar; daily P&L is the signal times the next-day index return.","anchor":{"file":"src/volforecast/evaluation/economic_value.py","start":1185,"end":1199,"focus":[1190],"sha256":"c07467bf215e768d12bd29e8476ebca12dcccf671375f397f2c9f10c1df07d47"}},{"id":"straddle","term":"delta-hedged straddle","def":"An ATM call plus put with the directional exposure hedged away. What remains is gamma P&L that pays the spread between realized and implied variance, making it the natural instrument for monetizing a vol forecast.","anchor":{"file":"src/volforecast/evaluation/economic_value.py","start":505,"end":520,"focus":[510,511],"sha256":"b68cb0df4a094ac600eecfa97cd4566d4bfcd6ad9cae10ddc14d2cdc8b5797f4"}},{"id":"dm","term":"Diebold-Mariano test","def":"The standard test of equal predictive accuracy between two forecast series, run on their QLIKE loss differential with Newey-West HAC errors. This repo's version averages losses per date first so panel lags never cross symbol boundaries.","anchor":{"file":"src/volforecast/evaluation/statistical_tests.py","start":52,"end":61,"focus":[57,58,59],"sha256":"5896a4112506738a2bc7b8a616caaf20a7c2adf1fe44bedae0c33fbd3690ffde"}},{"id":"mcs","term":"Model Confidence Set","def":"The Hansen et al. 2011 procedure that returns the subset of models statistically indistinguishable from the best, via sequential elimination with a block bootstrap. Membership, not rank, is the honest headline.","anchor":{"file":"src/volforecast/evaluation/statistical_tests.py","start":144,"end":160,"focus":[149,150,151],"sha256":"72542a79646d7565a0a8cc65d6d492a32f8bdfb07820a60b2fb6289dd08b3b79"}},{"id":"duan","term":"Duan correction","def":"The retransformation applied when log-space forecasts are converted back to variance levels: plain exponentiation is biased low, so predictions are scaled by mean(exp(residuals)). The conditional variant re-estimates it per sample, walk-forward.","anchor":{"file":"src/volforecast/evaluation/metrics.py","start":103,"end":118,"focus":[108,109],"sha256":"e9ca8bd097f678df8c68752dcb19c04c0796df61c4db1747f48f075f42b7ef2d"}},{"id":"purge-gap","term":"purge gap","def":"A buffer of dates deleted around every CV test block so overlapping RV windows cannot leak across the train/test boundary. Random k-fold is banned outright in this repo for the same reason.","anchor":{"file":"src/volforecast/utils/cv.py","start":43,"end":59,"focus":[48,49,50],"sha256":"1fda6fe7c381c558cce47b336e293197703bc2514827275de88c21b13986f762"}},{"id":"walk-forward","term":"walk-forward CV","def":"Expanding-window evaluation: the training window grows through time and the test window always sits strictly after it, mimicking live deployment. The panel variant splits on unique dates so all symbols share fold boundaries.","anchor":{"file":"src/volforecast/utils/cv.py","start":202,"end":218,"focus":[207,208,209],"sha256":"11850f156a42063801872cefb4ba57815d10b6bedf7ec27ec41e673eda604e89"}},{"id":"tenor-matching","term":"tenor matching","def":"Feeding each forecast horizon the implied vol of matching maturity: 0DTE IV for one day ahead, 1 week IV for five days, 1 month IV for twenty two. Trial-032 measured roughly 100 bps of QLIKE from this one idea.","anchor":{"file":"workspace/configs/trial_036_CHAMPION.yaml","start":65,"end":88,"focus":[70,75,79],"sha256":"c54078cb17aed7e850935caf61c8213bd0f72f389526f242d060b3fcf58d9c86"}},{"id":"seed-envelope","term":"seed envelope","def":"The spread of QLIKE across retrainings that differ only in random seed, measured at 6.6 bps at h=1. Any single-seed improvement smaller than that is noise, which is why one champion was retracted.","anchor":{"file":"src/volforecast/models/ensemble.py","start":37,"end":53,"focus":[42,43,44],"sha256":"aec95ab7cfeb2d504355fa40fa2714dcb6ea1d5c4bf4be200d3f9501101d1932"}},{"id":"dsr","term":"deflated Sharpe ratio","def":"The Bailey and Lopez de Prado correction for strategy selection luck: the probability that an observed Sharpe beats the maximum expected by chance given how many configurations were tried.","anchor":{"file":"src/volforecast/evaluation/realistic_straddle.py","start":611,"end":625,"focus":[616],"sha256":"958de64eb155dedf945ff35832cf718809d0e47e75196b204d3fa52d1665e0b7"}},{"id":"gex","term":"dealer gamma exposure","def":"The aggregate gamma of SPX option dealers. Its sign determines whether dealer hedging dampens moves (long gamma) or amplifies them (short gamma), so the feature layer encodes sign, regime, and momentum.","anchor":{"file":"src/volforecast/features/dealer_gamma.py","start":24,"end":31,"focus":[29,30],"sha256":"5941cfa4f2075013a842dbbfb8fa379d9ffc9763b4a99ecf593531375c45d0be"}},{"id":"coala","term":"CoALA memory","def":"The cognitive-architecture scheme the agent memory follows: compressed, atomic, linked, actionable files in P0 to P3 priority tiers with hard token budgets that a lint actually enforces.","anchor":{"file":"workspace/lint/validate_memory.py","start":10,"end":25,"focus":[15,16],"sha256":"713ea6445dfc7a3641f38ffa0cc4536f1105102a58434a6ccdae73890523bd4d"}},{"id":"skill","term":"skill","def":"A narrow executable capability with declared inputs, outputs, and authority bounds. An agent invokes one by writing a JSON args file, firing a predefined VS Code task, and reading an output file that must end EXIT_CODE=0.","anchor":{"file":"skills/design.md","start":41,"end":46,"focus":[46],"sha256":"a422846fdc7701f910a4058a9f429c760a165364492389f1e4c0ee4cfd9ccbdd"}},{"id":"qlike-objective","term":"QLIKE custom objective","def":"The hand-derived gradient (1 - exp(e)) and hessian (exp(e)) of log-space QLIKE, plugged into LightGBM and XGBoost so the trees split on the exact loss the tournament scores.","anchor":{"file":"src/volforecast/models/lightgbm.py","start":70,"end":86,"focus":[75,76,77],"sha256":"4084db37b56a2a7c5162bfc25ec87cac3449ab3a0e9b804ce3b8dab6eeb7814e"}},{"id":"zero-dte","term":"0DTE IV","def":"Implied volatility of options expiring the same day: the only implied measure whose window exactly matches a one-day-ahead RV forecast.","anchor":{"file":"src/volforecast/features/options.py","start":191,"end":208,"focus":[196,199],"sha256":"150adebb6cc92b3e54e7f686655c447d9b21c63bed7973a702fd9fd60c923458"}}],"files":{"src/volforecast/__init__.py":{"2":"","3":"Progressively enriching HAR-family baselines with microstructure,","4":"options-implied, and cross-asset features via gradient boosting to produce","5":"statistically significant QLIKE improvements and tradeable IV-RV gap signals.","6":"\"\"\"","7":"","8":"__version__ = \"0.2.0\"","9":""},"skills/DATA_INGEST/SKILL.md":{"78":"","79":"- **Source:** Chunk Store via `pytickclient`","80":"- **Fields:** Trade price, size, BBO, timestamps"},"src/volforecast/evaluation/statistical_tests.py":{"52":"        Forecast horizon for HAC correction (default: 1).","53":"        Bandwidth = horizon - 1.","54":"    alternative : str","55":"        'two-sided', 'less' (model 1 better), or 'greater' (model 2 better).","56":"    n_cross_sections : int | None","57":"        Number of cross-sectional units (symbols) in a panel. When provided","58":"        and > 1, loss differentials are averaged per date before computing HAC","59":"        variance, preventing Newey-West lags from crossing symbol boundaries.","60":"    panel_order : str","61":"        Layout of the pooled loss arrays when n_cross_sections is set.","144":"    n_cross_sections: int | None = None,","145":"    panel_order: str = \"symbol_major\",","146":") -> dict[str, any]:","147":"    \"\"\"Hansen et al. (2011) Model Confidence Set.","148":"","149":"    Identifies the set of models that contains the best model","150":"    with (1-alpha) confidence via sequential elimination using the","151":"    range statistic T_R and block bootstrap.","152":"","153":"    Parameters","154":"    ----------","155":"    losses : dict[str, np.ndarray]","156":"        Model name -> array of element-wise losses (shape (T,)).","157":"    alpha : float","158":"        Significance level (default: 0.10 for 90% MCS).","159":"    n_bootstrap : int","160":"        Number of bootstrap replications (default: 10000).","475":"    n_cross_sections: int | None = None,","476":"    panel_order: str = \"symbol_major\",","477":") -> pd.DataFrame:","478":"    \"\"\"Generate multi-model QLIKE tournament comparison table (pure stats).","479":"","480":"    Combines QLIKE, MSE, R-squared, Diebold-Mariano test, Mincer-Zarnowitz","481":"    regression, and Model Confidence Set into a single ranked table.","482":"","483":"    For economic-value enrichment (vol-targeting Sharpe, delta-hedged straddle","484":"    metrics, naive DH baselines), compose with","485":"    :func:`volforecast.evaluation.tournament_economics.enrich_tournament_economics`.","486":"","487":"    Parameters","488":"    ----------","489":"    predictions : dict[str, np.ndarray]","490":"        Model name -> OOS prediction array (LOG space).","650":"    market_rv: pd.Series,","651":"    quantile: float = 0.9,","652":") -> dict[str, float]:","653":"    \"\"\"Split QLIKE into calm and turbulent buckets by market-RV date bucket.","654":"","655":"    Bucket membership is decided on DATES: an observation is turbulent if its","656":"    date's market RV is in the top ``quantile`` of all dates. All symbols on a","657":"    turbulent date share the turbulent bucket. This implements the Zhang","658":"    et al. (2025) \"GNNHAR\" Table 2 protocol (top-decile SPY-RV split).","659":"","660":"    Parameters","661":"    ----------","662":"    y_true, y_pred : np.ndarray","663":"        Log-space realized RV and forecast, length N (panel-flattened OK).","664":"    dates : array-like or pd.Index","665":"        Date labels aligned to ``y_true`` (length N). Multiple rows may share","666":"        a date in a panel; a date's bucket is set once and applied uniformly.","667":"    market_rv : pd.Series"},"src/volforecast/evaluation/economic_value.py":{"106":"    gap = iv_forecast - rv_forecast","107":"    if default_long:","108":"        signal = np.ones(len(gap), dtype=np.float64)","109":"    else:","110":"        signal = np.zeros(len(gap), dtype=np.float64)","111":"        signal[gap > threshold] = 1.0  # IV expensive -> sell vol","112":"    signal[gap \u003c -short_threshold] = -1.0  # IV cheap -> buy vol","113":"    return signal","114":"","115":"","116":"def kvar_rv_gap_signal(","117":"    kvar: np.ndarray,","118":"    rv_forecast: np.ndarray,","119":"    space: str = \"vol\",","120":"    threshold: float = 0.0,","121":"    is_calendar_ann: bool = True,","161":"    kvar = np.asarray(kvar, dtype=np.float64)","162":"    rv_forecast = np.asarray(rv_forecast, dtype=np.float64)","163":"","164":"    # Convert Kvar from 365-calendar to 252-trading-day annualization","165":"    if is_calendar_ann:","166":"        _CAL_TO_TRADING = np.sqrt(252.0 / 365.0)  # ~0.831","167":"        kvar_decimal = kvar / 100.0 * _CAL_TO_TRADING","168":"    else:","169":"        kvar_decimal = kvar / 100.0","170":"","171":"    if space == \"vol\":","172":"        gap = kvar_decimal - rv_forecast","173":"    elif space == \"variance\":","174":"        gap = kvar_decimal**2 - rv_forecast**2","175":"    else:","176":"        raise ValueError(f\"space must be 'vol' or 'variance', got {space!r}\")","505":"    iv_safe = np.maximum(implied_vol, 1e-8)","506":"    gamma = 2.0 / (spot_prices * iv_safe * np.sqrt(T))","507":"","508":"    # Daily gamma P&L: 0.5 * Gamma * S^2 * (realized_var_daily - iv^2 * dt)","509":"    # realized_var is daily RV (not annualized), iv^2 * dt = annualized var * dt","510":"    daily_implied_var = iv_safe**2 * dt","511":"    raw_pnl = 0.5 * gamma * spot_prices**2 * (realized_var - daily_implied_var)","512":"","513":"    # Direction: sell vol (signal=+1) profits when RV \u003c IV (negate raw_pnl)","514":"    # Buy vol (signal=-1) profits when RV > IV (keep raw_pnl sign)","515":"    # Convention: raw_pnl > 0 means long-gamma profits. Signal=+1 means short.","516":"    directed_pnl = -signal * raw_pnl","517":"","518":"    # Normalize by spot to get \"return on notional\" (dollar P&L / spot)","519":"    pnl_normalized = directed_pnl / np.maximum(spot_prices, 1e-8)","520":"","1185":"    index_levels: np.ndarray,","1186":"    signal: np.ndarray,","1187":") -> dict[str, float | str]:","1188":"    \"\"\"Compute performance metrics for signal applied to GSVIVS01 index returns.","1189":"","1190":"    Daily PnL = signal_t * (Index_{t+1} / Index_t - 1).","1191":"","1192":"    Parameters","1193":"    ----------","1194":"    index_levels : np.ndarray","1195":"        Daily GSVIVS01 index levels (absolute values, not returns).","1196":"    signal : np.ndarray","1197":"        Trading signal array {-1, 0, +1}. Same length as index_levels.","1198":"        +1 = go long the short-vol index, -1 = go short it.","1199":""},"AGENTS.md":{"4":"","5":"**Framework:** 5-primitive agent framework (Persona, Skill, Memory, Workflow, Policy). See [memory/INDEX.md](memory/INDEX.md) and [workflows/INDEX.md](workflows/INDEX.md).","6":"","7":"**Routing:** Follow the `/prompt` attachment. No prompt? Match keywords from [workflows/INDEX.md](workflows/INDEX.md). No match? Default to `plan.md`.","8":"","9":"**Critical operational rules** (terminal isolation, file output, no bare tool invocations, TDD, cleanup): see [.github/copilot-instructions.md](.github/copilot-instructions.md).","10":"","11":"---","12":"","13":"## Subagent-First Execution","14":"","15":"**Philosophy:** Context bloat kills agent performance. The orchestrating agent is a coordinator, not a laborer. For any non-trivial task, the orchestrator decomposes work into bounded subtasks and spawns subagents with fresh context to execute each one.","16":"","17":"**When to spawn subagents:**","18":"- Task reads 3+ files or touches 2+ modules","19":"- Task would accumulate >200 lines of tool output in the orchestrator's context","20":"- Task involves iterative debugging (read → edit → test cycles)","21":"- Even SEQUENTIAL tasks get subagents if they'd bloat context","22":"","23":"**Model pinning, depth limits, concurrency:** per [policy/subagent_protocol.md](policy/subagent_protocol.md) (Rule 9 in [.github/copilot-instructions.md](.github/copilot-instructions.md)).","24":"","124":"","125":"---","126":"","127":"## Memory (CoALA)","128":"","129":"- **Boot = 2 P0 files** (see Boot Protocol above).","130":"- Load additional files from [memory/INDEX.md](memory/INDEX.md) lookup tables when task type matches.","131":"- Schema reference ([memory/meta/guide.md](memory/meta/guide.md)) loaded only when writing/validating memory files.","132":"- Max ~60% of context window for memory; reserve 40% for conversation.","133":"- Large files (>150 lines): load section headers + relevant sections, not the whole file."},"src/volforecast/registry.py":{"1":"\"\"\"Model and feature layer registries with decorator-based registration.\"\"\"","2":"","3":"from __future__ import annotations","4":"","5":"MODEL_REGISTRY: dict[str, type] = {}","6":"FEATURE_REGISTRY: dict[str, type] = {}","7":"GRAPH_REGISTRY: dict[str, type] = {}","8":"","9":"_registered = False","10":"","11":"","12":"def ensure_registered() -> None:","13":"    \"\"\"Import feature and model modules to trigger decorator-based registration.","14":"","74":"    \"\"\"","75":"","76":"    def decorator(cls: type) -> type:","77":"        if name in MODEL_REGISTRY:","78":"            raise ValueError(f\"Duplicate model name: {name!r}\")","79":"        MODEL_REGISTRY[name] = cls","80":"        cls.name = name  # type: ignore[attr-defined]","81":"        return cls","82":"","83":"    return decorator","84":"","85":"","86":"def register_feature_layer(name: str):","87":"    \"\"\"Class decorator that registers a feature layer in FEATURE_REGISTRY.","88":""},"src/volforecast/__main__.py":{"188":"    from volforecast.cli.ingest_vix_futures import register as _reg_ingest_vix_futures","189":"","190":"    _reg_ingest_vix_futures(subparsers)","191":"","192":"    # ─── UTILITY: vol ingest-ohlcv ───","193":"    from volforecast.cli.ingest_ohlcv import register as _reg_ingest_ohlcv","194":
