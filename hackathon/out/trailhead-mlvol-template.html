t paths)","18":"","19":"universe:  # List of ticker symbols (max 34 in full universe)","20":"  - SPY","21":"  - AAPL","22":"  - MSFT","23":"","24":"date_range: [\"2020-01-02\", \"2024-12-31\"]  # [start, end] inclusive, ISO format","25":"","26":"horizons: [1, 5, 22]  # Forecast horizons in trading days (1=daily, 5=weekly, 22=monthly)","27":"","46":"#","47":"# ORDERING CONSTRAINTS:","48":"#   - iv_surface MUST come before options (provides IV data that options layer consumes)","49":"#   - tree_expansion MUST come last (expands features from all preceding layers)","50":"feature_layers:","51":"  - iv_surface","52":"  - har_core","53":"  - asymmetry","54":"  - noise_robust","55":"  - options","56":"  - calendar","57":"  - tree_expansion","58":"","81":"  #                ridge_harx_iv_h1, ridge_harx_iv_h5, ridge_harx_iv_h22,","82":"  #                lasso_harx_iv_h1, lasso_harx_iv_h5, lasso_harx_iv_h22,","83":"  #                elasticnet_harx_iv_h1, elasticnet_harx_iv_h5, elasticnet_harx_iv_h22","84":"  #   HAR-IV ext:  ridge_har_iv_ratevol, lasso_har_iv_ratevol","85":"  #   ML:          lightgbm, lightgbm_dart, lightgbm_bagged, lightgbm_calibrated, xgboost","86":"  #   Ensemble:    stacking_har_lgbm, regime_blend, blend","87":"  #   Graph:       ghar, gnn, gnn_learned, gnnhar, dcrnn_har, stid, gsp_har","88":"  #                (require graph: block; gnn family additionally requires the","237":"cv:","238":"  # Valid methods: expanding_window | purged_kfold | rolling_window | blocked_kfold","239":"  method: expanding_window","240":"  n_splits: 5          # Number of CV folds (used by kfold methods; expanding_window auto-calculates)","241":"  purge_gap: 10        # Embargo gap in DATE units between train/test to prevent leakage","243":"  train_size: 504      # Initial training window in trading days (504 = 2 years)","244":"  test_size: 126       # Test window per fold in trading days (126 = 6 months)","245":"","246":"# --- TUNING (optional) -------------------------------------------------------","302":"  baseline: har            # Reference model for DM tests / delta tables","303":"  mcs_bootstrap: 10000    # Bootstrap samples for Model Confidence Set test","304":"  parallel_models: 1      # >1 runs models in separate processes (careful with memory)","305":"","306":"  # --- Economic-value backtests ---","307":"  dh_enabled: true         # Delta-hedged straddle PnL table + plots","308":"  dh_mode: realistic       # \"realistic\" | \"discrete\" | \"simple\"","309":"  vt_enabled: true         # Vol-targeting Sharpe / PnL table + plots","310":"","311":"  # --- GSVIVS variance swap signal backtest ---","312":"  gsvivs_enabled: true     # Enable GSVIVS01 variance swap signal backtest","313":"  gsvivs_short_threshold: 0.0   # Threshold in signal_space units (0 = binary, trial-042 optimal)","314":"  gsvivs_default_long: false    # If true, default position is +1 (long) unless confident short","315":"  gsvivs_signal_type: iv_rv_gap # \"iv_rv_gap\" | \"iv_acceleration\"","316":"  gsvivs_flat_percentile: 80    # Go flat when IV acceleration exceeds this percentile","317":"  gsvivs_iv_source: edrvs       # \"edrvs\" (prev-close 1-DTE varswap, no lookahead)","318":"  gsvivs_signal_space: variance # \"vol\" | \"variance\"","319":"  # gsvivs_iv_sources:           # IV sources for signal comparison (default: [spx_allday_vols])"},"workspace/configs/trial_036_CHAMPION.yaml":{"65":"  method: expanding_window","66":"  purge_gap: 10","67":"  train_size: 504","68":"  test_size: 126","69":"","70":"# Per-horizon init: exact tenor matching","71":"horizon_overrides:","72":"  1:","73":"    model:","74":"      params:","75":"        base_model: har_iv_0dte","76":"  22:","77":"    model:","78":"      params:","79":"        base_model: har_iv","80":"","81":"tournament:","82":"  gsvivs_enabled: true","83":"  gsvivs_short_threshold: 0.0030  # variance-space dead-band (single-seed sweep, 2026-06-12): Sharpe 1.95 -> 2.27 @ h=1 on Exec Kvar; supersedes trial-042 threshold=0 finding pending multi-seed confirmation","84":"  dh_enabled: false","85":"  vt_enabled: false","86":"  parallel_models: 1  # Sequential required for SHAP/ALE (models must persist in memory)","87":"  explainability:","88":"    enabled: true","89":"    methods: [treeshap, ale]","90":"    treeshap_max_samples: 500","91":"    ale_features: top_20","92":"    models: [lgbm_hariv0dte_init]"},"src/volforecast/data/measures.py":{"20":"def compute_realized_variance(","21":"    intraday_returns: pd.Series,","22":") -> float:","23":"    \"\"\"Compute realized variance from intraday returns.","24":"","25":"    RV_t = sum(r_{t,i}^2).  No mean subtraction (Andersen et al. 2003).","26":"    \"\"\"","27":"    r = np.asarray(intraday_returns, dtype=np.float64)","28":"    return float(np.sum(r**2))","29":"","30":"","31":"def compute_rq(","32":"    intraday_returns: pd.Series,","33":") -> float:","34":"    \"\"\"Compute realized quarticity (RQ) for measurement quality.","48":"def compute_semivariances(","49":"    intraday_returns: pd.Series,","50":") -> dict[str, float]:","51":"    \"\"\"Compute positive and negative realized semivariances.","52":"","53":"    RS+ = sum(r_i^2 * I(r_i >= 0))","54":"    RS- = sum(r_i^2 * I(r_i \u003c 0))","55":"","56":"    Follows Patton & Sheppard (2015): RS+ uses >= 0 so that","57":"    RS+ + RS- = RV always holds (exhaustive partition).","58":"    \"\"\"","59":"    r = np.asarray(intraday_returns, dtype=np.float64)","60":"    r_sq = r**2","61":"    rs_pos = float(np.sum(r_sq[r >= 0]))","62":"    rs_neg = float(np.sum(r_sq[r \u003c 0]))","63":"    return {","64":"        \"rs_positive\": rs_pos,","65":"        \"rs_negative\": rs_neg,","66":"        \"signed_jump\": rs_pos - rs_neg,","70":"def compute_bpv(","71":"    intraday_returns: pd.Series,","72":") -> float:","73":"    \"\"\"Compute bipower variation (BPV).","74":"","75":"    BPV = (pi/2) * sum(|r_i| * |r_{i-1}|) for i = 2, ..., N.","76":"    BPV is robust to jumps and estimates integrated variance","77":"    (Barndorff-Nielsen & Shephard 2004).","78":"    \"\"\"","79":"    r = np.asarray(intraday_returns, dtype=np.float64)","80":"    abs_r = np.abs(r)","81":"    products = abs_r[1:] * abs_r[:-1]","82":"    return float((np.pi / 2.0) * np.sum(products))","83":"","84":"","85":"def compute_realized_tripower_quarticity(","109":"    n_obs: int,","110":"    alpha: float = 0.999,","111":") -> dict[str, float]:","112":"    \"\"\"Test for significant jumps using the BNS (2006) Theorem 2 z-test.","113":"","114":"    Z_BNS = (RV - BPV) / sqrt(theta * RTQ / n)","115":"    where theta = (pi^2/4 + pi - 5) approx 0.6090.","116":"    \"\"\"","117":"    theta = (np.pi**2 / 4.0) + np.pi - 5.0","118":"    denom_sq = max(theta * rtq / n_obs, 1e-20)","119":"    z_stat = (rv - bpv) / np.sqrt(denom_sq)","120":"","121":"    from scipy.stats import norm","122":"","123":"    p_value = 1.0 - norm.cdf(z_stat)","124":"    critical_value = norm.ppf(alpha)","268":"    log_prices: np.ndarray,","269":"    bandwidth: int | None = None,","270":") -> float:","271":"    \"\"\"Compute Realized Kernel estimator of integrated variance.","272":"","273":"    RK_t = sum_{h=-H}^{H} k(h/(H+1)) * gamma_hat_h","274":"","275":"    Uses the flat-top Parzen kernel (Barndorff-Nielsen, Hansen, Lunde &","276":"    Shephard 2008, Econometrica). Achieves the optimal n^{-1/5} MSE rate.","277":"","278":"    Default bandwidth: H = ceil(n^{3/5}). This is a plug-in approximation","279":"    of the BNHLS optimal H* = c* * xi^{4/5} * n^{3/5} where xi is the","280":"    noise-to-signal ratio and c* depends on the kernel. Without a pilot","281":"    estimate of xi, H = n^{3/5} (i.e., c*xi^{4/5} = 1) is standard.","282":"    \"\"\"","283":"    log_prices = np.asarray(log_prices, dtype=np.float64)","284":"    returns = np.diff(log_prices)","285":"    n = len(returns)"},"src/volforecast/data/micro.py":{"326":"    bucket_volume: int | float,","327":"    n_buckets: int = VPIN_N_BUCKETS,","328":") -> float:","329":"    \"\"\"Compute Volume-Synchronized Probability of Informed Trading (VPIN).","330":"","331":"    Reference: Easley, Lopez de Prado & O'Hara (2012), Eq. 1.","332":"","333":"    VPIN = (1/n) * Σ |V^B_i - V^S_i| / V_bucket","334":"","335":"    Volume-time buckets: each bucket accumulates bars until total volume","336":"    reaches `bucket_volume`. Bars crossing bucket boundaries are split","337":"    proportionally between the current and next bucket.","338":"","339":"    Parameters","340":"    ----------","341":"    buy_vols : ndarray","342":"        Buy volume per bar."},"src/volforecast/data/iv_features.py":{"107":"    iv_raw: pd.DataFrame,","108":"    rv_panel: pd.DataFrame,","109":") -> pd.DataFrame:","110":"    \"\"\"Transform raw IV panel into model-ready features.","111":"","112":"    All features are shifted by 1 day to enforce causality: the feature","113":"    value at time t uses only information available at market close t-1.","114":"","115":"    Parameters","116":"    ----------","117":"    iv_raw : pd.DataFrame","118":"        Output of ingest_iv_surface(). Must contain columns:","119":"        atm_iv_1m, atm_iv_3m, iv_put_25d_1m, iv_call_25d_1m, skew_1m, vix.","120":"    rv_panel : pd.DataFrame","121":"        Daily RV panel. Must contain column 'rv' (daily realized variance).","122":"        Index must be DatetimeIndex aligned with iv_raw."},"src/volforecast/data/sequence_cache.py":{"1":"\"\"\"Sequence tensor cache for LSTM/TCN models.","2":"","3":"Pre-stacks the per-symbol 10s bar parquets under ``data/raw/micro/sequences/``","4":"into a single padded tensor of shape ``(n_dates, max_bars, n_features)`` so","5":"the training loop is pure GPU tensor ops with no pandas / parquet overhead.","6":"","7":"Cached tensors live under ``data/processed/sequences/{SYMBOL}_{hash}.pt`` and","8":"are keyed on the ``SequenceSpec`` (features tuple + max_bars). Changing either","9":"field invalidates the cache automatically.","10":"","11":"Public API:"},"src/volforecast/utils/paths.py":{"59":"    \"\"\"Absolute path to data/raw/.\"\"\"","60":"    return data_path(\"raw\")","61":"","62":"","63":"def ticks_cache_dir() -> Path:","64":"    \"\"\"Absolute path to data/raw/ticks/ (daily RV panel parquets).\"\"\"","65":"    return data_path(\"raw/ticks\")","66":"","67":"","68":"def ticks_cache_path(symbol: str) -> Path:","69":"    \"\"\"Parquet path for a symbol's daily RV panel: data/raw/ticks/{SYMBOL}.parquet.\"\"\"","70":"    return data_path(\"raw/ticks\", f\"{symbol}.parquet\")","71":"","72":"","73":"def iv_cache_dir() -> Path:","74":"    \"\"\"Absolute path to data/raw/iv/ (per-symbol IV from TSDB edrvol_).\"\"\"","75":"    return data_path(\"raw/iv\")","76":"","77":"","78":"def iv_cache_path(symbol: str) -> Path:","79":"    \"\"\"Parquet path for a symbol's IV surface: data/raw/iv/{SYMBOL}.parquet.\"\"\"","80":"    return data_path(\"raw/iv\", f\"{symbol}.parquet\")","81":"","82":"","83":"def ohlcv_cache_dir() -> Path:","84":"    \"\"\"Absolute path to data/raw/ohlcv/ (daily OHLCV from TSDB).\"\"\"","85":"    return data_path(\"raw/ohlcv\")","86":"","87":"","88":"def ohlcv_cache_path(symbol: str) -> Path:","89":"    \"\"\"Parquet path for a symbol's daily OHLCV: data/raw/ohlcv/{SYMBOL}.parquet.\"\"\"","90":"    return data_path(\"raw/ohlcv\", f\"{symbol}.parquet\")","91":"","92":"","93":"def micro_cache_dir() -> Path:"},"src/volforecast/features/__init__.py":{"1":"\"\"\"Feature engineering layers 0-6 for realized volatility forecasting.","2":"","3":"Access registered layers via ``FEATURE_REGISTRY`` dict.","4":"Call ``volforecast.registry.ensure_registered()`` to populate registries.","5":"\"\"\"","6":"","7":"from volforecast.registry import FEATURE_REGISTRY, register_feature_layer","8":"","9":"__all__ = [\"FEATURE_REGISTRY\", \"register_feature_layer\"]","10":""},"src/volforecast/features/har.py":{"38":"    rv_up_to = rv_series.loc[:date]","39":"    if len(rv_up_to) \u003c 22:","40":"        raise ValueError(f\"Need at least 22 observations up to {date}, got {len(rv_up_to)}\")","41":"","42":"    rv_d = rv_up_to.iloc[-1]","43":"    rv_w = rv_up_to.iloc[-5:].mean()","44":"    rv_m = rv_up_to.iloc[-22:].mean()","45":"","46":"    return {","47":"        \"log_rv_d\": float(safe_log(rv_d)),","48":"        \"log_rv_w\": float(safe_log(rv_w)),","49":"        \"log_rv_m\": float(safe_log(rv_m)),","50":"    }","51":"","52":"","53":"def compute_harq_features(","68":"","69":"    sqrt_rq_d = float(np.sqrt(rq_up_to.iloc[-1]))","70":"","71":"    return {","72":"        **log_rv,","73":"        \"sqrt_rq_d\": sqrt_rq_d,","74":"        \"rq_rv_interaction_d\": log_rv[\"log_rv_d\"] * sqrt_rq_d,","75":"    }","76":"","77":"","78":"def build_har_design_matrix(","79":"    rv_series: pd.Series,","80":"    rq_series: pd.Series | None = None,","81":"    include_rq_interaction: bool = False,","82":") -> pd.DataFrame:","83":"    \"\"\"Build the full HAR/HARQ design matrix for a time series."},"src/volforecast/features/options.py":{"23":"","24":"","25":"def compute_vrp(atm_iv: pd.Series, rv: pd.Series) -> pd.Series:","26":"    \"\"\"Compute ex-post variance risk premium (Carr & Wu 2009 proxy).","27":"","28":"    VRP = (atm_iv_pct / 100)^2 - rv_daily * 252","29":"","30":"    This is the \"realized\" or \"ex-post\" VRP proxy that uses contemporaneous","31":"    realized variance. For the conditional VRP (Bollerslev, Tauchen & Zhou","32":"    2009, RFS), use iv_features.build_iv_feature_panel which substitutes","33":"    E_t[RV_{t+1:t+22}] from a HAR-CJ model.","34":"","35":"    Parameters","36":"    ----------","37":"    atm_iv : pd.Series","38":"        ATM implied volatility in percentage points (e.g., 20.0 = 20%).","39":"    rv : pd.Series","40":"        Daily realized variance (not annualized).","41":"","42":"    Returns","43":"    -------","44":"    pd.Series","45":"        Variance risk premium. Can be negative.","46":"    \"\"\"","47":"    return (atm_iv / 100.0) ** 2 - rv * 252.0","48":"","49":"","50":"def compute_skew(iv_put_25d: pd.Series, iv_call_25d: pd.Series) -> pd.Series:","51":"    \"\"\"Compute 25-delta risk reversal (skew).","52":"","53":"    Skew = IV(25d put) - IV(25d call).","54":"    Positive skew indicates higher demand for downside protection.","55":"","56":"    Parameters","191":"            result[\"iv_term_slope_1w1m_d\"] = atm_iv - atm_iv_1w","192":"","193":"        # --- 0DTE ATM IV: exact tenor match for h=1 forecasting ---","194":"        if \"iv_0dte_atm\" in daily_data.columns:","195":"            atm_iv_0dte = daily_data[\"iv_0dte_atm\"]","196":"            result[\"log_atm_iv_0dte_d\"] = safe_log(atm_iv_0dte)","197":"            # Ultra-short-term slope: 1w - 0dte (positive = contango, negative = inversion)","198":"            if \"iv_1w_atm\" in daily_data.columns:","199":"                result[\"iv_term_slope_0dte1w_d\"] = daily_data[\"iv_1w_atm\"] - atm_iv_0dte","200":"                # Log-ratio: de-biased event-intensity signal (pcorr=0.24 with fwd RV)","201":"                # Strips VRP bias by construction; captures when near-term vol","202":"                # pricing diverges from 1W surface (event days, gamma spikes)","203":"                result[\"log_iv_0dte_1w_ratio_d\"] = safe_log(atm_iv_0dte) - safe_log(","204":"                    daily_data[\"iv_1w_atm\"]","205":"                )","206":"            # IV acceleration: 0dte deviation from 5-day moving average","207":"            # Positive = IV spiking above recent norm (stress signal)","208":"            iv_0dte_ma5 = atm_iv_0dte.rolling(5, min_periods=1).mean()","281":"                result[\"vvix_rp_d\"] = vvix / 100.0 - rvol_vix","282":"","283":"        # --- IV × log(RV) interactions (CSV 2023: #1 ML gain source) ---","284":"        if \"rv\" in daily_data.columns:","285":"            log_rv_d = np.log(daily_data[\"rv\"].clip(lower=1e-10))","286":"            # Weekly/monthly log-RV: use pre-computed from HAR layer if available,","287":"            # otherwise compute locally from rv.","288":"            if \"log_rv_w\" in daily_data.columns:","289":"                log_rv_w = daily_data[\"log_rv_w\"]","290":"            else:","291":"                log_rv_w = np.log(daily_data[\"rv\"].rolling(5).mean().clip(lower=1e-10))"},"src/volforecast/features/calendar.py":{"1":"\"\"\"Calendar and event features (Layer 5).","2":"","3":"Captures scheduled macro events and calendar effects on volatility:","4":"- FOMC meeting proximity","5":"- Non-Farm Payrolls (NFP) proximity","6":"- Options expiration (OpEx) effects","7":"- Day-of-week and month effects","8":"","184":"            return d","185":"    return None","186":"","187":"","188":"def _next_nfp(target: date) -> date:","189":"    \"\"\"Find next NFP date on or after target. NFP = first Friday of month.\"\"\"","190":"    year, month = target.year, target.month","191":"    nfp = _nth_weekday(year, month, 4, 1)  # First Friday","192":"    if nfp \u003c target:","193":"        # Move to next month","194":"        if month == 12:","195":"            year += 1","196":"            month = 1","197":"        else:","198":"            month += 1","199":"        nfp = _nth_weekday(year, month, 4, 1)","200":"    return nfp","201":"","202":"","203":"def _next_opex(target: date) -> date:","204":"    \"\"\"Find next OpEx date on or after target. OpEx = third Friday of month.\"\"\"","205":"    year, month = target.year, target.month","206":"    opex = _nth_weekday(year, month, 4, 3)  # Third Friday","207":"    if opex \u003c target:","208":"        # Move to next month","209":"        if month == 12:","210":"            year += 1","211":"            month = 1","212":"        else:","213":"            month += 1"},"src/volforecast/features/gsvivs_signals.py":{"1":"\"\"\"GSVIVS01 strategy signal features (73 features).","2":"","3":"Produces the feature set used by the GSVIVS01 short-variance strategy:","4":"returns / realized volatility on SPX / VIX / VX1, VIX vol-of-vol dynamics,","5":"VIX option skew, VIX term structure, SPX 1M put-skew dynamics, 1M/3M skew","6":"term-structure ratios, and IG/HY credit CDS returns.","7":"","8":"All inputs are read from ``daily_data`` (the enriched frame produced upstream","9":"by ``IVSurfaceLayer``). No external data loading happens here.","10":"","11":"Graceful degradation: if any required enriched column is missing, the derived","12":"features that depend on it are returned as all-NaN. The output DataFrame","13":"always has exactly 73 columns and shares ``daily_data``'s index."},"src/volforecast/models/_base.py":{"16":"","17":"","18":"class _BaseModel:","19":"    \"\"\"Shared interface for all volforecast models.\"\"\"","20":"","21":"    REQUIRED_LAYERS: list[str] = [\"har_core\"]","22":"    supports_tuning: bool = False","23":"    family: str = \"unknown\"","24":"    description: str = \"\"","25":"    # Sequence-first models (LSTM/TCN) set this True so the Pipeline runner","26":"    # dispatches to the sequence path, feeding a SequenceTensor instead of a","27":"    # tabular DataFrame. Tabular models keep the default (False) and the","28":"    # existing path is unchanged.","29":"    requires_sequences: bool = False","30":""},"src/volforecast/models/naive.py":{"1":"\"\"\"Naive baseline models (zero-parameter or single-parameter).","2":"","3":"These implement the fit/predict interface but require no training or minimal","4":"training (just computing a mean). They provide a floor for QLIKE comparison:","5":"any useful model must beat these.","6":"","7":"All predictions are in log-RV space (same convention as HAR family).","8":"\"\"\"","9":"","10":"from __future__ import annotations","11":"","12":"import numpy as np","13":"import pandas as pd","14":""},"src/volforecast/models/lightgbm.py":{"70":"","71":"","72":"def qlike_objective(y_pred: np.ndarray, dtrain: Any) -> tuple[np.ndarray, np.ndarray]:","73":"    \"\"\"Custom QLIKE objective for LightGBM.","74":"","75":"    Log-space QLIKE: L = exp(y_true - y_pred) - (y_true - y_pred) - 1","76":"    gradient (dL/dy_pred) = 1 - exp(y_true - y_pred)","77":"    hessian  (d²L/dy_pred²) = exp(y_true - y_pred)","78":"","79":"    Parameters","80":"    ----------","81":"    y_pred : np.ndarray","82":"        Current predictions (log-RV space).","83":"    dtrain : lgb.Dataset","84":"        Training dataset (labels accessed via get_label()).","85":"","86":"    Returns"},"src/volforecast/models/xgboost.py":{"101":"    diff = y_true - y_pred","102":"    loss = float(np.mean(np.exp(np.clip(diff, -10.0, 10.0)) - diff - 1.0))","103":"    return [(\"qlike\", loss)]","104":"","105":"","106":"@register_model(\"xgboost\")","107":"class XGBoostVolModel(_BaseModel):","108":"    \"\"\"XGBoost model for realized volatility forecasting.","109":"","110":"    Optimizes QLIKE loss via custom objective. Supports feature","111":"    importance analysis.","112":"","113":"    Parameters are accepted as flat kwargs:","114":"        max_leaves, learning_rate, colsample_bytree, etc.","115":"    Plus training-control kwargs:","116":"        n_estimators, early_stopping_rounds, val_fraction.","117":"    \"\"\""},"src/volforecast/models/stid.py":{"1":"\"\"\"STID: Spatial-Temporal Identity embedding deflation control (Shao et al. 2022).","2":"","3":"y_hat_i = MLP(concat(x_i, embed[i]))","4":"","5":"A mandatory deflation baseline: per-node learned identity embeddings + MLP,","6":"consuming the same graph-dict harness but ignoring edges entirely. If STID","7":"matches GNNHAR, the honest conclusion is \"pooling + asset identity suffices\",","8":"not \"spillovers matter\".","9":""},"src/volforecast/models/ensemble.py":{"37":"class LightGBMBaggedSeeds(_BaseModel):","38":"    \"\"\"K-seed bagging ensemble of LightGBM models with prediction averaging.","39":"","40":"    Rationale","41":"    ---------","42":"    The trial-047 reseed baseline measured a 6.6 bps seed envelope at h=1","43":"    on the trial-036 champion spec. Single-seed numbers are inside this noise","44":"    floor, so feature-engineering deltas \u003c~10 bps cannot be distinguished","45":"    from seed shuffle. Averaging K predictions reduces prediction variance","46":"    proportionally to K (under uncorrelated assumption; less in practice","47":"    but always non-negative).","48":"","49":"    Beyond QLIKE: a smoother h=1 forecast produces a smoother IV - RV_forecast","50":"    gap, which means fewer GSVIVS01 signal flips per week, lower turnover,","51":"    and a higher trading Sharpe even when QLIKE improvement is modest.","52":"","53":"    Parameters"},"src/volforecast/models/regime_blend.py":{"1":"\"\"\"Regime-conditional ensemble: HAR + LightGBM with regime-dependent weights.","2":"","3":"Research finding (2026-05-27): Optimal blend weight is massively","4":"regime-dependent at h=22:","5":"  - Low-vol: LightGBM dominates (optimal HAR weight ~0.05)","6":"  - High-vol: HAR dominates (optimal HAR weight ~0.80)","7":"","8":"Architecture:","9":"    1. Fit HAR and LightGBM on full training data","10":"    2. Classify test observations into regimes using log_rv_w threshold","11":"    3. Apply regime-specific blend weights","12":"","13":"Variants (controlled by `blend_strategy` param):","14":"    - \"fixed_regime\": Pre-set weights per regime (no calibration)","15":"    - \"val_calibrated\": Calibrate weights per regime on validation holdout"},"src/volforecast/evaluation/metrics.py":{"1":"\"\"\"Evaluation metrics for realized volatility forecasting.","2":"","3":"Primary metric: QLIKE (quasi-likelihood loss).","4":"Secondary: MSE, MAE, R-squared.","5":"","6":"QLIKE penalizes underestimation more severely than overestimation,","7":"aligning with the economic asymmetry of volatility forecasting.","8":"\"\"\"","9":"","10":"from __future__ import annotations","11":"","12":"import numpy as np","13":"","14":"","15":"def qlike(","16":"    y_true: np.ndarray,","17":"    y_pred: np.ndarray,","18":"    log_space: bool = True,","19":") -> float:","20":"    \"\"\"Compute QLIKE (quasi-likelihood) loss.","21":"","22":"    In variance space: QLIKE = mean(RV/h - log(RV/h) - 1)","23":"    In log space: QLIKE = mean(exp(y_true - y_pred) - (y_true - y_pred) - 1)","24":"","25":"    Raises ValueError if arrays differ in length or contain NaN.","26":"    \"\"\"","27":"    y_true = np.asarray(y_true, dtype=np.float64)","28":"    y_pred = np.asarray(y_pred, dtype=np.float64)","29":"","30":"    if len(y_true) != len(y_pred):","31":"        raise ValueError(f\"Arrays must have same length: {len(y_true)} vs {len(y_pred)}\")","32":"    if np.any(np.isnan(y_true)) or np.any(np.isnan(y_pred)):","103":"    residuals: np.ndarray | None = None,","104":"    residual_variance: float | None = None,","105":") -> np.ndarray:","106":"    \"\"\"Apply Duan (1995) retransformation bias correction.","107":"","108":"    Non-parametric (preferred): RV_hat = exp(log_RV_hat) * mean(exp(residuals))","109":"    Parametric (fallback):      RV_hat = exp(log_RV_hat + sigma^2 / 2)","110":"","111":"    The non-parametric version is distribution-free and correct for","112":"    fat-tailed residuals where the parametric formula underestimates.","113":"","114":"    Parameters","115":"    ----------","116":"    log_rv_pred : array","117":"        Log-space predictions.","118":"    residuals : array, optional"},"src/volforecast/utils/cv.py":{"4":"- Purged k-fold CV (with gap to prevent leakage)","5":"- Blocked k-fold CV (contiguous blocks, no shuffling)","6":"- Expanding window (walk-forward) CV","7":"- Rolling window CV","8":"","9":"CRITICAL: Never use random k-fold on time-series data.","10":"Random k-fold causes catastrophic look-ahead bias.","11":"","12":"Key classes:","43":"","44":"","45":"class PurgedKFoldCV(_BaseCVSplitter):","46":"    \"\"\"Purged k-fold cross-validation for time series.","47":"","48":"    Splits data into k contiguous folds and purges observations","49":"    within a gap window between training and test sets to prevent","50":"    information leakage from overlapping RV windows.","51":"","52":"    ``embargo`` (Phase 2.8): rows in ``[test_end, test_end + embargo)`` are also","53":"    excluded from the train sets of all SUBSEQUENT folds. Default 0 (no-op).","54":"    \"\"\"","55":"","56":"    def __init__(","57":"        self,","58":"        n_splits: int = 5,","59":"        purge_gap: int = 5,","202":"","203":"","204":"class PanelExpandingWindowCV:","205":"    \"\"\"Expanding window CV for panel (multi-symbol) DataFrames.","206":"","207":"    Splits are defined on **unique dates** in the index, then mapped","208":"    to all rows sharing those dates. This ensures all symbols for a","209":"    given date land in the same fold, preventing cross-temporal leakage.","210":"","211":"    ``embargo`` (Phase 2.8): dates in ``[test_end, test_end + embargo)``","212":"    (positions in the unique-date sequence) are excluded from the train sets","213":"    of all SUBSEQUENT folds. All symbols sharing an embargoed date are","214":"    dropped together. Default 0 (no-op).","215":"    \"\"\"","216":"","217":"    def __init__(","218":"        self,"},"src/volforecast/pipeline/conditional_duan.py":{"2":"","3":"Replaces the global Duan scalar with per-sample corrections estimated","4":"from a lightweight variance model trained on OOS residuals.","5":"","6":"Walk-forward protocol:","7":"  For fold k, the variance model trains on OOS residuals from folds 1..k-1."},"src/tests/unit/formulas/FORMULAS.md":{"1":"# Formula Registry","2":"","3":"Central audit file mapping every mathematical function to its source paper, implementation, and test.","4":"","5":"**Last Full Audit:** 2026-05-29","6":"","7":"---","8":"","9":"## Verification Protocol","10":"","11":"When adding a new formula to the codebase:","12":""},"src/volforecast/evaluation/realistic_straddle.py":{"1":"\"\"\"Realistic delta-hedged straddle backtest (Phase 1: analytic corrections).","2":"","3":"Implements the full P&L waterfall from the plan:","4":"    Gross gamma PnL (tenor-decayed gamma)","5":"    + Vanna PnL (spot-vol correlation)","6":"    + Volga PnL (vol-of-vol convexity)","7":"    - Option cost (maturity-varying, event-driven)","8":"    - Hedge cost (N rebalances x spread)","9":"    ± Hedge error (zero-mean, inflates RISK only)","10":"    = Net P&L with honest Sharpe denominator","11":"","12":"References:","13":"    - Boyle & Emanuel (1980): discrete hedging error variance, 1/N scaling","14":"    - Leland (1985): modified vol for hedge cost","15":"    - Doshi, Pari, Shamsuddin (2025): maturity-dependent option spreads","16":"    - Li & Wu (2026): graded sizing beats binary","17":"\"\"\"","58":"    Returns","59":"    -------","60":"    float","61":"        Adjusted spread in vol points.","62":"    \"\"\"","63":"    if T_rem_days \u003c= 6:","64":"        return base_spread * 4.5","65":"    elif T_rem_days \u003c= 13:","66":"        return base_spread * 1.75","67":"    else:","68":"        return base_spread","69":"","70":"","71":"def compute_tenor_decayed_gamma(spot: float, iv: float, T_rem_days: float) -> float:","72":"    \"\"\"ATM straddle gamma with tenor decay.","73":"","74":"    Gamma_ATM = 2 / (S * sigma * sqrt(T_rem))","75":"","252":"    kappa: float = 4.0,","253":"    N: int = 26,","254":") -> np.ndarray:","255":"    \"\"\"Per-day discrete hedging error variance (Boyle-Emanuel 1980).","256":"","257":"    Var(HE_day) = (0.5 * Gamma * S^2)^2 * (kappa - 1) * sigma^4 / (252^2 * N)","258":"","259":"    Parameters","260":"    ----------","261":"    gamma : np.ndarray","262":"        Straddle gamma per day.","263":"    spot : np.ndarray","264":"        Spot prices.","265":"    iv : np.ndarray","266":"        ATM implied vol (annualized).","611":"    T: int,","612":"    skewness: float,","613":"    kurtosis: float,","614":"    N_trials: int,","615":") -> float:","616":"    \"\"\"Deflated Sharpe Ratio (Bailey & Lopez de Prado 2014).","617":"","618":"    DSR = Phi((SR_hat - SR_0) * sqrt(T-1) / sqrt(1 - gamma3*SR + (gamma4-1)/4 * SR^2))","619":"","620":"    SR_0 = sqrt(Var[SR_n]) * [(1-gamma_E)*Phi^{-1}(1-1/N) + gamma_E*Phi^{-1}(1-1/(Ne))]","621":"","622":"    Parameters","623":"    ----------","624":"    observed_sharpe : float","625":"        Annualized observed Sharpe ratio (non-annualized internally: divide by sqrt(252))."},"src/volforecast/evaluation/gsvivs.py":{"34":"        return \"Exec Kvar (true fill)\"","35":"    return next(iter(stats_by_iv), None)","36":"","37":"","38":"# Registry mapping config keys to (dashboard_label, iv_data_column, is_calendar_annualized).","39":"IV_SOURCE_REGISTRY: dict[str, tuple[str, str, bool]] = {","40":"    \"spx_allday_vols\": (\"SPX AllDay Mark Kvar (09:10)\", \"iv_allday_kvar\", True),","41":"    \"spx_allday_vols_tc\": (\"SPX AllDay TC-adj Kvar (09:10)\", \"iv_allday_kvar_tc\", True),","42":"    \"exec_kvar\": (\"Exec Kvar (true fill)\", \"iv_exec_kvar\", True),","43":"    \"edrvs_prev_close_1dte\": (\"EDRVS prev-close 1-DTE\", \"iv_vs_0dte\", True),","44":"    \"spx_atm_iv_1d\": (\"SPX ATM IV (1d)\", \"iv_0dte_atm\", False),","45":"    \"spx_atm_iv_1w\": (\"SPX ATM IV (1w)\", \"iv_1w_atm\", False),","46":"}","47":"","48":"","49":"def resolve_iv_sources(","50":"    configured_keys: list[str] | None = None,","51":") -> list[tuple[str, str, bool]]:","52":"    \"\"\"Resolve config keys to (label, column, is_calendar_ann) tuples.","53":"","54":"    Parameters","55":"    ----------"},"workspace/research/research-journal.md":{"18":"","19":"### Retracted / superseded (kept for reference)","20":"","21":"| Horizon | Reported QLIKE | Trial | Reason rejected |","22":"|---------|----------------|-------|-----------------|","23":"| h=1 | 0.1289 | trial-036 | trial-047 reseed: 79 bps below 5-seed envelope min |","24":"| h=5 | 0.1067 | trial-036 | trial-047 reseed: 13 bps below 5-seed envelope min |","25":"| h=22 | 0.1628 | trial-036 | trial-047 reseed: 55 bps below 5-seed envelope min |","26":"| h=1 | 0.1336 | trial-033 | never multi-seed validated |","27":"| h=5 | 0.1077 | trial-033 | neve nce.","9":"Non-goals: Implementing models, engineering features, or fetching data.","10":"\u003c/identity>","11":"","12":"\u003cconstraints>","13":"- Read-only: Write and Edit tools are blocked.","14":"- Never approve results with CRITICAL or HIGH severity issues.","15":"- Stage 1 (Protocol Compliance) MUST pass before Stage 2 (Statistical Quality).","16":"- Explain WHY it is an issue and HOW to fix it.","17":"- ML discipline: apply the **Key Constraints** table in `../AGENTS.md`; operative detail in `../policy/ml-constraints.md`. Do not restate or reinterpret these rules.","18":"","19":"\u003ceffort_gate>","20":"- Default: thorough (all 3 stages must complete before verdict)."},"workspace/lint/lint_model_pins.py":{"16":"","17":"import re","18":"import sys","19":"from pathlib import Path","20":"","21":"EXPECTED_MODEL = \"Claude Opus 4.6\"","22":""},"workflows/research.md":{"51":"1. Define the research question precisely (one sentence).","52":"2. Identify what data is needed (symbol, date range, frequency, data source).","53":"3. Identify what computation to perform (feature, model, statistical test).","54":"4. State the expected outcome (what would confirm/refute the hypothesis).","55":"5. Check for potential pitfalls: look-ahead bias, COVID regime, insufficient data.","56":"6. Present the **Hypothesis Card** (mandatory before moving to EXPLORE):","57":"","58":"```","59":"## Hypothesis Card","60":"- Question: [one testable sentence]","61":"- Feature layer: [0-6]","62":"- Data needed: [symbols, date range, frequency, source]","63":"- Method: [exact computation or statistical test]","64":"- Success criterion: [quantitative threshold that confirms]","65":"- Null hypothesis: [what rejection looks like]"},"src/volforecast/data/tsdb.py":{"1":"\"\"\"Daily data access from TSDB (Time Series Database).","2":"","3":"Provides functions to fetch daily OHLCV data, treasury yields,","4":"FX rates, commodity prices, VIX, VIX futures, and SPX index data","5":"used for cross-asset feature construction.","6":""},"src/volforecast/data/chunk_store.py":{"1":"\"\"\"Tick data access via pytickclient (Chunk Store).","2":"","3":"Provides functions to fetch L1 trade/quote data for all 34 symbols and","4":"L2 order book depth data for E-mini S&P 500. Raw tick data is the","5":"foundation for computing realized volatility measures at arbitrary","6":"frequencies (5-min, 1-min, tick-by-tick).","7":"\"\"\"","8":"","9":"from __future__ import annotations","10":"","11":"import logging","12":"import threading","13":"import time","14":"from collections.abc import Callable","15":"from concurrent.futures import ThreadPoolExecutor"},"src/volforecast/data/iv_ingest.py":{"1":"\"\"\"IV surface ingestion from Marquee EDRVOL_PERCENT.","2":"","3":"Bulk-fetches the SPX implied volatility surface and VIX, assembles into","4":"a daily panel suitable for Layer 2 feature computation.","5":"","6":"Public API:"},"src/volforecast/features/dealer_gamma.py":{"24":"@register_feature_layer(\"dealer_gamma\")","25":"class DealerGammaLayer:","26":"    \"\"\"Load SPX dealer gamma exposure and produce ML features.","27":"","28":"    Loads from data/raw/options_oi/spx_gex_daily.parquet via load_gex_cache().","29":"    Computes 5 features via build_gex_features():","30":"        gex_sign_d, gex_zscore_d, gex_quintile_d, gex_regime_d, gex_momentum_d","31":""},"workspace/lint/validate_memory.py":{"10":"  4. Date ordering: updated >= created","11":"  5. Naming: lowercase with hyphens, no spaces/underscores","12":"  6. Domain subfolder must be a recognized domain","13":"  7. Size limits per domain (soft caps, warnings only)","14":"  8. Trust gates: agent-inferred → draft + low confidence","15":"  9. Loaded budget: P0+P1 ≤ 50k tokens","16":" 10. On-demand budget: P2 ≤ 100k tokens","17":" 11. P3: no total budget (per-file caps only)","18":"\"\"\"","19":"","20":"import sys","21":"import re","22":"import math","23":"from datetime import date, timedelta","24":"from pathlib import Path","25":""},"src/volforecast/cli/forecast.py":{"1":"\"\"\"CLI entry point for live RV forecast and IV-RV gap signal.","2":"","3":"Config-driven multi-model ensemble. Loads a YAML config specifying which","4":"models to run, trains each on full available history, predicts next-day","5":"RV, compares to current ATM IV, and outputs weighted LONG/SHORT/FLAT.","6":"","7":"Usage:","8":"    vol forecast","9":"    vol forecast --config workspace/configs/forecast_live.yaml","10":"    vol forecast --symbol SPY --horizon 1,5","11":"    vol forecast --live-iv 18.5","12":"    vol forecast --threshold 1.0","13":"\"\"\"","14":""},"src/volforecast/graphs/base.py":{"1":"\"\"\"Graph snapshot container, builder protocol, and point-in-time scheduling.","2":"","3":"Numpy-first by design: linear models (GHAR) consume dense adjacency matrices","4":"without importing torch; neural models call ``GraphSnapshot.to_torch()``.","5":"","6":"Point-in-time protocol (Zhang et al. 2025): a graph used to forecast date t","7":"is estimated on data \u003c= t only, re-estimated every ``refit_every`` trading","8":"days on the trailing ``window``, and frozen between refits.","9":"\"\"\"","10":"from __future__ import annotations","11":"","12":"from dataclasses import dataclass","13":"from typing import Any, Protocol, runtime_checkable","14":"","15":"import numpy as np","16":"import pandas as pd","17":""},"src/volforecast/pipeline/fold_cache.py":{"1":"\"\"\"Per-fold training cache for sequence models (LSTM/TCN).","2":"","3":"Skips fold-level training when an identical fold has already been trained","4":"under the same config + data + CV split + base-model predictions. Cache is","5":"keyed on a deterministic fingerprint of every input that affects the trained","6":"model's outputs, so any change (model params, sequence features, train dates,","7":"base preds) invalidates the relevant entries automatically.","8":"","9":"Storage layout (under ``data/models/lstm_cache/{config_fp16}/{cache_key}/``):"},"src/volforecast/reporting/sections/economic_value.py":{"71":"                continue","72":"            common_idx = common_idx.sort_values()","73":"","74":"            log_rv_preds = pred_df.loc[common_idx, \"prediction\"].values","75":"","76":"            # IV: shift(1) to avoid look-ahead, convert from % to decimal","77":"            iv_series = sym_md[\"iv_1m_atm\"].reindex(common_idx).shift(1)","78":"            spot_series = sym_md[\"close\"].reindex(common_idx)","79":"","80":"            # Realized variance from log_rv if available","81":"            if \"log_rv\" in sym_md.columns:","82":"                rv_series = np.exp(sym_md[\"log_rv\"].reindex(common_idx))","83":"            else:","84":"                # Fallback: use predictions as proxy (less useful)","85":"                rv_series = np.exp(pd.Series(log_rv_preds, index=common_idx))","86":""}},"dropped":[],"tracks":[{"title":"ORIENT","minutes":18,"stops":[{"id":"cover","title":"What you are looking at","kind":"stop","minutes":3,"lede":"A verified walkthrough of ml-vol-estimator, the ML realized volatility forecasting platform, generated from snapshot nogit-1c4f5dc3. Every underlined sentence is anchored to a line range in this repo and re-checked after it was written; click one and the evidence opens under it. Dotted terms open the glossary. Claims whose anchors failed were deleted, and the count is in the top bar.","blocks":[{"type":"stats","items":[{"v":"96,897","l":"lines of code","s":"455 Python files of 1,063 total"},{"v":"24","l":"registered models","s":"naive floor to graph attention"},{"v":"18","l":"feature layers","s":"HAR core to dealer gamma"},{"v":"209","l":"test files","s":"roughly 2,700 test functions"},{"v":"48","l":"agent skills","s":"plus 5 personas, 15 workflows"},{"v":"14","l":"modules lost in restore","s":"counted, not hidden","color":"inf"}]},{"type":"callout","level":"info","title":"BEFORE YOU START","text":"The repo is two things at once: a Python package (`volforecast`) that forecasts next-day stock volatility and trades the forecast, and an operating system for GitHub Copilot agents that do the day-to-day research. This walkthrough covers both. It was built from a QR-video restore of the GS repo, so a known list of 14 modules is missing; where that bites, this page says so instead of writing around it."},{"type":"table","caption":"Generation record","sortable":false,"columns":["FIELD","VALUE"],"rows":[["repository","\u003ccode>ml-vol-estimator\u003c/code> (package \u003ccode>volforecast\u003c/code> 0.2.0)"],["snapshot","\u003ccode>nogit-1c4f5dc3\u003c/code> · QR restore of 2026-07-06, no git history"],["surveyed","2026-07-30 · 364 modules in 11 groups on the board"],["entry point","\u003ccode>volforecast.__main__:main\u003c/code> via the \u003ccode>vol\u003c/code> wrapper"],["commands executed","5 (4 failing, all real output)"],["est. time","about 95 minutes, checkpoints included"]]}]},{"id":"five","title":"Five sentences","kind":"stop","minutes":4,"lede":"If you read nothing else, read these. Every one is anchored; the last is marked inferred because an absence cannot be anchored to a line.","blocks":[{"type":"prose","claims":[{"id":"c-001","text":"This repo forecasts next-day stock market volatility with machine learning: its stated thesis is to progressively enrich [[har|HAR]] baselines with microstructure, options-implied, and cross-asset features via gradient boosting, until the [[qlike|QLIKE]] improvement is statistically significant and the [[iv-rv-gap|IV-RV gap]] it implies is tradeable.","status":"verified","anchor":{"file":"src/volforecast/__init__.py","start":2,"end":9,"focus":[3,4,5],"sha256":"14cfb23c6e81ed23733ce4a320c6ab8611c56ec227002c88cb053befec51ab48"}},{"id":"c-002","text":"Its raw material is GS market data: tick-level trades from [[chunk-store|Chunk Store]], daily OHLCV and cross-asset series from [[tsdb|TSDB]], and the SPX implied volatility surface from [[marquee|Marquee]], all cached locally as parquet.","status":"verified","anchor":{"file":"skills/DATA_INGEST/SKILL.md","start":78,"end":80,"focus":[79,80],"sha256":"16ad3614ca8773c5d96df7aa35a2dd33168e98fcb6dfb71d57b89f1fdf3f1165"}},{"id":"c-003","text":"Models do not just report a score, they compete: every run is a tournament that ranks the field by [[qlike|QLIKE]] and backs the ranking with [[dm|Diebold-Mariano]] tests, Mincer-Zarnowitz efficiency regressions, and [[mcs|Model Confidence Set]] membership.","status":"verified","anchor":{"file":"src/volforecast/evaluation/statistical_tests.py","start":475,"end":490,"focus":[480,481],"sha256":"b7064d980da6429b9327f532cc2c166667225df7d2fab567a3f914b3fb3ad021"}},{"id":"c-004","text":"Winning forecasts are then traded on paper: when implied volatility is rich against the forecast the [[straddle|delta-hedged straddle]] engine sells vol, when cheap it buys, and the same gap drives the [[gsvivs|GSVIVS01]] index signal.","status":"verified","anchor":{"file":"src/volforecast/evaluation/economic_value.py","start":106,"end":121,"focus":[111,112],"sha256":"cbfca042545d6eae4b81680f1388cc0af4b4d8773c081194182bb2ec373fdb7c"}},{"id":"c-005","text":"The other half of the repo is not Python: it is an operating system for GitHub Copilot agents, five primitives (Persona, Skill, Memory, Workflow, Policy) that let an agent run this pipeline without breaking its rules.","status":"verified","anchor":{"file":"AGENTS.md","start":4,"end":14,"focus":[5],"sha256":"5c8e72b800892d32d7fd61efa45a0be0b248125f85cb1fa04d39fdb3db37f8a2"}},{"id":"c-006","text":"What it is not: a live trading system. Nothing listens on a socket, every entry point is a batch command that runs to completion, and the only thing resembling an order is a printed LONG, SHORT, or FLAT.","status":"inferred"}]},{"type":"callout","level":"inferred","title":"WHY THE LAST SENTENCE IS AMBER","text":"An absence cannot be anchored to a line of code. Where this page searched and found nothing, it says inferred rather than dressing the sentence up as verified. Every amber mark in this document means the same thing: plausible, unproven."}]},{"id":"map","title":"The map","kind":"stop","minutes":6,"lede":"The real import graph, laid out as the pipeline flows: interface to core to data to features to models to evaluation to output. Edges stay faint until you hover a module; click any module for the full story, or take the guided tour.","blocks":[{"type":"graph"},{"type":"prose","claims":[{"id":"c-007","text":"The most-imported module on the board is the registry: three string-to-class dicts (models, feature layers, graph builders) that let a YAML config name components without importing them, which is why 69 files point at it.","status":"verified","anchor":{"file":"src/volforecast/registry.py","start":1,"end":14,"focus":[5,6,7],"sha256":"76cd3542fa317e45383bd17db4315499b38ba5d589eda99c8cdb6fe30de080e8"}},{"id":"c-008","text":"The columns are ordered so that value flows left to right: commands trigger ingestion, data becomes features, features feed models, models are judged, judgments become reports. Edges pointing right-to-left are almost all imports of the registry and utils, the two shared hubs.","status":"inferred"}]}]},{"id":"where","title":"Where the code lives","kind":"stop","minutes":4,"lede":"The same information as the map, as a sortable list, plus the half of the repo that is not a Python package at all.","blocks":[{"type":"table","caption":"src/ packages. Purpose summarised from each package docstring; LOC and file counts from the survey.","sortable":true,"columns":["PATH","PURPOSE","FILES","LOC"],"rows":[["\u003ccode>src/volforecast/\u003c/code>","package root: thesis, entry point, registry","3","1,013"],["\u003ccode>src/volforecast/data/\u003c/code>","ticks, OHLCV and IV surfaces to parquet caches and tensors","21","9,195"],["\u003ccode>src/volforecast/cli/\u003c/code>","one module per vol subcommand","28","7,342"],["\u003ccode>src/volforecast/features/\u003c/code>","feature layers 0-5 plus registered extensions","18
