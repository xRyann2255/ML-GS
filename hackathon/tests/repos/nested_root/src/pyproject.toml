[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "widget"
version = "0.1.0"
description = "A very small widget."
requires-python = ">=3.11"

[project.scripts]
widget = "widget.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["widget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
