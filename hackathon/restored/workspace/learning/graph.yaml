    why_it_matters: "Maps conceptual features to actual column names for experiment configuration and debugging."

  # ============================================================
  # LAYER eval: Statistical Tests & Evaluation
  # ============================================================

  - id: qlike_loss
    name: "Why QLIKE is the primary metric for vol forecast evaluation"
    layer: 99
    chapter: 16
    requires: [rv_construction, log_rv_transform]
    connects_to:
      - { node_id: diebold_mariano, how: "DM tests significance of QLIKE differences" }
      - { node_id: model_confidence_set, how: "MCS uses QLIKE as the loss function" }
      - { node_id: retransformation_bias, how: "level-space QLIKE requires Duan correction" }
      - { node_id: vrp_as_ml_feature, how: "QLIKE improvement makes VRP signal cleaner" }
    key_points:
      - "Variance-space: (sigma^2/h - ln(sigma^2/h) - 1); log-space: exp(y-y_hat) - (y-y_hat) - 1"
      - "WHY not MSE: MSE dominated by outlier crisis days (quadratic), QLIKE linear in ratio"
      - "Asymmetric: underestimation penalized more (risk management priority)"
      - "Proxy-robust: correct rankings even with noisy RV (Patton 2011)"
      - "Optimal forecast = true variance (asymmetry shapes curve, not minimum)"
      - "Improvement in bps: (Q_base - Q_model)/Q_base * 10000"
      - "Implementation clip: np.clip(diff, -10.0, 30.0) before exp to prevent overflow"
    misconceptions:
      - "MSE is fine for vol (wrong -- MSE not proxy-robust and crisis-dominated)"
      - "QLIKE asymmetry biases the optimal forecast (wrong -- optimal is still true variance)"
      - "MAE or HMSE could work (wrong -- only QLIKE and MSE are proxy-robust)"
    why_it_matters: "The entire tournament ranking depends on QLIKE -- choosing the wrong metric can reverse model rankings."

  - id: diebold_mariano
    name: "How the DM test determines if one forecast is statistically better"
    layer: 99
    chapter: 16
    requires: [qlike_loss]
    connects_to:
      - { node_id: model_confidence_set, how: "MCS generalizes pairwise DM to multiple models" }
    key_points:
      - "d_t = L(sigma^2, h_A) - L(sigma^2, h_B); DM = d_bar / sqrt(Var_HAC(d_bar))"
      - "WHY HAC standard errors: forecast errors cluster (vol clustering -> error clustering)"
      - "Plain variance biased downward -> over-rejection without HAC"
      - "Bandwidth l = h-1 (MA(h-1) structure in multi-step errors), Bartlett kernel"
      - "Threshold: |DM|>1.96 at 5%, |DM|>2.58 at 1%"
      - "Positive DM = model B better"
    misconceptions:
      - "Use OLS standard errors (wrong -- serial correlation in d_t inflates test stat)"
      - "DM is different from paired t-test (wrong -- it IS paired t-test but with HAC s.e.)"
    why_it_matters: "Prevents reporting noise as signal -- a 2% QLIKE improvement may not survive a DM test with 3 years of data."

  - id: model_confidence_set
    name: "How MCS filters a set of models down to the statistically indistinguishable best"
    layer: 99
    chapter: 16
    requires: [diebold_mariano]
    connects_to:
      - { node_id: qlike_loss, how: "MCS uses QLIKE loss differentials" }
    key_points:
      - "Sequential elimination: start with all M models, test equal loss, remove worst, repeat"
      - "Range statistic T_R = max|t_ij| over surviving models"
      - "WHY MCS not many DM tests: C(M,2) pairwise tests -> multiple testing problem"
      - "Block bootstrap preserves serial dependence (block length ~ sqrt(T))"
      - "p-value = smallest alpha at which model would be excluded; p>0.10 = survives"
      - "Key insight: many models often statistically indistinguishable"
    misconceptions:
      - "Just pick lowest QLIKE (wrong -- differences may be noise)"
      - "i.i.d. bootstrap is fine (wrong -- destroys serial dependence, underestimates variance)"
    why_it_matters: "Controls familywise error rate across the full model tournament -- the formal way to declare winners."

  - id: mincer_zarnowitz
    name: "How MZ regression tests whether forecasts are efficient (unbiased + calibrated)"
    layer: 99
    chapter: 16
    requires: [qlike_loss, retransformation_bias]
    connects_to:
      - { node_id: diebold_mariano, how: "complementary diagnostic -- MZ checks bias, DM checks relative accuracy" }
    key_points:
      - "Regression: sigma^2 = alpha + beta*h + epsilon; efficient if alpha=0, beta=1 jointly (F-test)"
      - "alpha>0 = systematic under-prediction; alpha<0 = over-prediction"
      - "beta<1 = too smooth/conservative; beta>1 = too reactive (chasing noise)"
      - "WHY HAC: same serial correlation issue as DM"
      - "Inputs must be variance-space (apply Duan retransformation first)"
      - "Pooled MZ warning: N>10K makes even beta=1.12 significant (Lindley's paradox)"
    misconceptions:
      - "Use log-space predictions directly (wrong -- must retransform to levels first)"
      - "beta=1.2 means model is terrible (wrong -- it's diagnostic, typical for HAR)"
    why_it_matters: "Detects systematic bias and miscalibration that QLIKE alone may miss -- a model can have good QLIKE but biased forecasts."

  - id: retransformation_bias
    name: "Why naive exp(y_hat) underestimates and how Duan correction fixes it"
    layer: 99
    chapter: 16
    requires: [log_rv_transform]
    connects_to:
      - { node_id: mincer_zarnowitz, how: "MZ requires level-space predictions with Duan applied" }
      - { node_id: qlike_loss, how: "level-space QLIKE also affected" }
    key_points:
      - "Problem: E[exp(X)] > exp(E[X]) -- Jensen's inequality, exp is convex"
      - "Parametric: exp(y_hat + sigma^2_epsilon/2) -- assumes Gaussian residuals"
      - "Non-parametric (preferred): exp(y_hat) * mean(exp(residuals)) -- distribution-free"
      - "WHY non-parametric: residuals fat-tailed (kurtosis~1.3), parametric underestimates ~5.3%"
      - "Verified: parametric beta=1.176, non-parametric beta=1.117 (closer to 1.0)"
    misconceptions:
      - "Just exp(y_hat) is fine (wrong -- systematically biased low)"
      - "Gaussian parametric correction suffices (wrong -- 5% underestimate with fat tails)"
    why_it_matters: "Every log-space model needs this correction before level-space evaluation (MZ, vol-targeting) -- without it, forecasts are systematically biased."

  - id: vol_targeting_sharpe
    name: "How vol-targeting tests whether better QLIKE translates to economic value"
    layer: 99
    chapter: 17
    requires: [qlike_loss, retransformation_bias, vol_targeting_formula, why_vol_targeting_adds_sharpe]
    connects_to:
      - { node_id: deflated_sharpe, how: "multiple strategy testing inflates best Sharpe" }
      - { node_id: vol_targeting_failure_modes, how: "failure modes constrain interpretation" }
      - { node_id: tsmom_connection, how: "vol-targeting is the sizing engine of TSMOM" }
    key_points:
      - "Strategy: w_t = min(sigma_target / sigma_hat_t, max_leverage) -- scale inversely with predicted vol"
      - "Portfolio return: r_VT = w_t * r_asset; Sharpe = mean(r_VT)/std(r_VT) * sqrt(252)"
      - "WHY this test: bridges statistical -> economic significance"
      - "Parameters: target vol 10% ann, max leverage 2x, floor at 1e-8"
      - "Conversion: log-RV -> ann vol: sigma_hat_ann = sqrt(252 * exp(y_hat))"
    misconceptions:
      - "Good QLIKE always means good Sharpe (wrong -- statistical != economic significance)"
      - "Sharpe is computed on raw returns (wrong -- on vol-targeted portfolio returns)"
    why_it_matters: "Answers the trading desk question: does this model make money? A model with 50bps better QLIKE but same Sharpe has academic but not practical value."

  - id: deflated_sharpe
    name: "Why testing many strategies inflates the best Sharpe ratio spuriously"
    layer: 99
    chapter: 17, 18
    requires: [vol_targeting_sharpe]
    connects_to:
      - { node_id: pooled_vs_persymbol_sharpe, how: "must choose pooled vs per-symbol before deflating" }
      - { node_id: ivrv_validation_experiments, how: "deflated Sharpe is the final judge in experiment 4" }
    key_points:
      - "E[max SR over N trials] ~ sqrt(2 ln N) -- even with zero skill"
      - "N=30 trials -> expected max SR from luck alone ~ 2.61"
      - "Rule of thumb: observed SR must exceed sqrt(2 ln N) to be credible"
      - "Bailey & Lopez de Prado 2014"
      - "Full formula: DSR = Phi((SR_hat - SR_0)*sqrt(T-1) / sqrt(1 - gamma_3*SR_hat + (gamma_4-1)/4*SR_hat^2)); SR_0 uses Euler-Mascheroni gamma_E ~ 0.5772"
      - "Trap 1: denominator uses OBSERVED SR_hat, not SR_0 (a common web summary gets this wrong)"
      - "Trap 2: feed NON-ANNUALIZED inputs at native frequency; T = raw observation count. Annualizing first double-counts"
      - "Trap 3: be honest about N. N=20 variants -> SR_0 ~ sqrt(2*ln(20)) = 2.45. High bar to clear"
    misconceptions:
      - "Report best Sharpe across all experiments (wrong -- selection bias)"
      - "SR > 2 is always good (wrong -- depends on how many strategies you tested)"
      - "Use SR_0 in the DSR denominator (wrong -- use OBSERVED SR_hat; a common web summary gets this backwards)"
    why_it_matters: "Guards against p-hacking in backtest research -- without this correction, every tournament with 30+ models will find a 'winner' by chance."

  - id: purged_kfold_cv
    name: "Why time-series CV requires purging and embargo to prevent data leakage"
    layer: 99
    chapter: 16
    requires: [har_model, feature_alignment]
    connects_to:
      - { node_id: qlike_loss, how: "CV folds evaluated by QLIKE" }
      - { node_id: model_confidence_set, how: "MCS applied to OOS predictions from CV" }
    key_points:
      - "WHY random k-fold fails: training on day 501 while testing day 500 = future predicting past"
      - "Label overlap: 5-day forward RV for day 498 shares returns with day 502's label"
      - "Purging: remove training obs whose labels overlap with test period (gap = h days)"
      - "Embargo: additional buffer after test fold end (1-2% of sample ~ 10-50 days)"
      - "Expanding window: min_train=504, test=63, step=63, purge_gap=5"
      - "WHY expanding not sliding: more training data per fold, sliding wastes early data"
    misconceptions:
      - "Random k-fold is fine if you shuffle (wrong -- shuffling IS the problem)"
      - "Just leave out neighboring days (wrong -- need formal purge + embargo for multi-step targets)"
    why_it_matters: "The #1 methodological error in ML finance papers -- random k-fold produces 20-40% inflated R^2 that vanishes out-of-sample."

  # ============================================================
  # INTER-LAYER BRIDGE NODES (synthesis across branches)
  # ============================================================

  - id: why_harq_helps_h1_not_h5
    name: "Why HARQ improves forecasts at h=1 but not at longer horizons"
    layer: 1
    chapter: 2, 6
    requires: [harq_model, har_approximates_long_memory, rv_is_noisy]
    connects_to: []
    key_points:
      - "Daily RV is a single noisy observation; weekly/monthly averages already smooth over 5/22 days"
      - "At h=1, today's noisy daily RV dominates the forecast (beta_d ~ 0.36)"
      - "At h=5+, weekly/monthly terms carry most weight and they're already noise-averaged"
      - "HARQ's noise-modulation (beta_dQ * sqrt(RQ)) only matters where noise is worst: daily"
      - "Averaging IS denoising -- weekly RV averages 5 independent noise draws, reducing variance by 1/5"
      - "Implication: noise-aware features add value at short horizons, less at long horizons"
    misconceptions:
      - "HARQ should help at all horizons equally (wrong -- averaging already denoises at longer horizons)"
      - "The h=5 failure means HARQ is broken (wrong -- it means the problem HARQ solves doesn't exist at h=5)"
    why_it_matters: "You saw HARQ improve at h=1 (+12.7 bps) but overfit at h>=5. This explains why -- and tells you which features to prioritize per horizon."

  - id: why_shar_needs_pooling
    name: "Why SHAR underperforms on single-stock but works with pooled data"
    layer: 1
    chapter: 6, 10
    requires: [shar_model, semivariances, har_hard_to_beat]
    connects_to: []
    key_points:
      - "SHAR adds 2 extra parameters (RS+_d, RS-_d replace RV_d) on top of HAR's 3"
      - "On single-stock (~2,500 rows), RS+_m and RS-_m are collinear (rho=0.977)"
      - "Extreme collinearity makes OLS coefficients unstable and meaningless"
      - "Pooled panel (30K+ rows) varies the RS+/RS- ratio across assets, breaking collinearity"
      - "General principle: extra parameters need proportionally more data to estimate reliably"
      - "Alternative fix: Ridge-SHAR (regularization stabilizes without pooling)"
    misconceptions:
      - "SHAR is a bad model (wrong -- it's a good model with insufficient data)"
      - "This is specific to SHAR (wrong -- any model adding correlated features struggles on small N)"
    why_it_matters: "You saw beta_neg/beta_pos = 0.88 on SPY vs 2.0 in the paper (which used pooled panel). This pattern recurs in any extra-parameter extension."

  - id: continuous_vs_jump_persistence
    name: "Why the continuous component forecasts but jumps don't persist"
    layer: 1
    chapter: 4, 6
    requires: [jump_component_feature, vol_clustering, har_cj_model]
    connects_to: []
    key_points:
      - "Vol clustering = autocorrelation driven by persistent market participants and regimes"
      - "Continuous component inherits clustering: same institutional flows, margin pressure, hedging activity drive it day after day"
      - "Jumps are event-driven (earnings, FOMC, flash crash) -- once resolved, the discontinuity doesn't repeat"
      - "C_t autocorrelation 0.6-0.7 vs J_t autocorrelation 0.0-0.1"
      - "This is why HAR-CJ keeps C coefficients large/significant but J coefficients near zero at weekly/monthly"
      - "For ML: continuous variation features dominate importance; jump features provide marginal lift"
    misconceptions:
      - "Jumps should predict future jumps (wrong -- events are largely independent; only jump clustering during crises)"
      - "Removing jumps from RV loses information (wrong -- jump transience means it's mostly noise for forecasting)"
    why_it_matters: "This explains why your feature importance shows continuous variation features dominating, with jump features providing marginal lift."

  - id: feature_count_vs_sample_size
    name: "Why more features can hurt when training data is limited"
    layer: 1
    chapter: 10, 11
    requires: [triple_expansion, har_hard_to_beat, lasso_har]
    connects_to: []
    key_points:
      - "Triple expansion takes ~20 base features to ~60 (level + change + z-score)"
      - "On single-stock SPY (~1,700 rows), feature-to-sample ratio is 1:28"
      - "Trees with depth>3 partition into cells with <50 samples -- splits become noise-driven"
      - "Minimum viable ratio for trees: ~1:50 to 1:100 per feature"
      - "Ridge/Lasso cope by shrinking coefficients toward zero (implicit feature selection)"
      - "Pooling to 30K+ rows fixes the ratio to 1:500, making trees viable"
      - "Alternative: reduce features (use only ~20 raw, no expansion) for small-sample regime"
    misconceptions:
      - "More features always helps if you regularize (wrong -- trees can't be regularized the same way)"
      - "This only affects trees (wrong -- affects any model, but linear regularization handles it better)"
    why_it_matters: "You saw all 8 LightGBM configs lose by +2700 to +7700 bps on single-stock SPY. Ridge-HAR (3 features) won because it doesn't need to discover splits in thin data."

  - id: noise_quality_vs_asymmetry
    name: "Why HARQ and SHAR are orthogonal improvements to HAR"
    layer: 1
    chapter: 6, 10
    requires: [harq_model, shar_model]
    connects_to: []
    key_points:
      - "HARQ answers: how much should I trust today's RV signal? (measurement quality dimension)"
      - "SHAR answers: was today's vol driven by fear or calm? (directional decomposition dimension)"
      - "Orthogonal because: a high-noise day can be symmetric or asymmetric; a crash day can have clean or noisy RV"
      - "Empirically: sqrt_rq_d and log_rs_negative_d have correlation < 0.3"
      - "Combining both = adaptively weight AND capture leverage effect"
      - "Ridge-SHAR with RQ interaction is the natural combination (measurement quality + asymmetry)"
      - "For ML: include both feature families; trees will discover when quality modulates asymmetry signal"
    misconceptions:
      - "HARQ and SHAR are competing models (wrong -- they address different dimensions and can be combined)"
      - "You must choose one (wrong -- ML benefits from both simultaneously)"
    why_it_matters: "Understanding orthogonality tells you which features to combine rather than choosing between them -- the foundation of feature stacking in your pipeline."

  # ============================================================
  # LAYER 2: Options-Implied Features
  # ============================================================

  # --- A. Options Fundamentals ---

  - id: option_contracts_payoffs
    name: "Option contracts and payoff diagrams: the building blocks of vol trading"
    layer: 2
    chapter: 8
    requires: [price_process, normal_distribution]
    connects_to:
      - { node_id: black_scholes_formula, how: "BS prices these payoffs under specific assumptions" }
      - { node_id: atm_straddle_gamma, how: "straddle = call + put with same strike" }
    key_points:
      - "Call option: right to BUY at strike K. Payoff = max(S_T - K, 0). Unlimited upside, zero downside."
      - "Put option: right to SELL at strike K. Payoff = max(K - S_T, 0). Profits from decline."
      - "Moneyness: ITM (intrinsic value > 0), ATM (S ~ K), OTM (intrinsic = 0). Options trade in moneyness terms."
      - "Put-call parity: C - P = S - K*e^{-rT}. Connects calls and puts; violation = arbitrage."
      - "Time value = option price - intrinsic value. Always non-negative. Decays as T approaches 0."
      - "American vs European: early exercise matters for puts (rates) and dividends. Most analysis uses European."
    misconceptions:
      - "OTM options are worthless (wrong -- they have time value and are key inputs to VIX construction)"
      - "You must exercise to profit (wrong -- most options are closed before expiry by selling the option itself)"
      - "Call payoff = S - K always (wrong -- max(S-K, 0); the option expires worthless if S < K)"
    why_it_matters: "Options are the instruments from which IV is extracted -- understanding payoffs is prerequisite to understanding why IV exists and what it represents."

  - id: black_scholes_formula
    name: "Black-Scholes as a translation device: from vol to price and back"
    layer: 2
    chapter: 8
    requires: [option_contracts_payoffs, lognormal_distribution, normal_distribution, log_returns]
    connects_to:
      - { node_id: implied_volatility, how: "IV = inverting BS to recover sigma from market price" }
      - { node_id: the_greeks, how: "Greeks are partial derivatives of BS formula" }
      - { node_id: gamma_pnl_formula, how: "BS PDE gives the hedging P&L decomposition" }
    key_points:
      - "C = S*Phi(d1) - K*e^{-rT}*Phi(d2) where d1 = [ln(S/K) + (r + sigma^2/2)T] / (sigma*sqrt(T)), d2 = d1 - sigma*sqrt(T)"
      - "Assumptions: constant sigma, continuous trading, no jumps, GBM for S, no transaction costs, risk-free rate r constant"
      - "EVERY assumption is violated in practice -- but model is still used as a TRANSLATION DEVICE (price to vol and back)"
      - "Role: not a physical model of reality but a common language. Everyone quotes options in implied-vol units using BS inversion."
      - "Risk-neutral pricing: E^Q[payoff] discounted at r. The Q-measure probability is NOT the real-world probability."
      - "Volatility is the ONLY unobservable input. All others (S, K, T, r) are known. Hence 'implied' vol."
    misconceptions:
      - "BS assumes markets are efficient (wrong -- it assumes no arbitrage, which is weaker than efficiency)"
      - "If BS assumptions fail, IV is meaningless (wrong -- IV is a quoting convention; the surface shape shows HOW assumptions fail)"
      - "The model gives the 'correct' price (wrong -- it translates between price and vol; the market gives the price)"
    why_it_matters: "BS is the Rosetta Stone of vol trading -- you need it to convert between option prices and IV, which is the raw input to Layer 2 features."

  - id: the_greeks
    name: "Option Greeks: sensitivities that drive P&L decomposition"
    layer: 2
    chapter: 8
    requires: [black_scholes_formula]
    connects_to:
      - { node_id: gamma_pnl_formula, how: "Gamma drives the variance-dependent P&L component" }
      - { node_id: atm_straddle_gamma, how: "straddle gamma = 2*call_gamma at ATM" }
      - { node_id: delta_hedged_straddle, how: "delta-hedging removes first-order S exposure leaving gamma P&L" }
    key_points:
      - "Delta (d = dC/dS): first-order price sensitivity. ATM call ~ 0.5. Used for hedging directional exposure."
      - "Gamma (G = d2C/dS2 = dDelta/dS): curvature. How much delta changes per $1 move. Drives convexity P&L."
      - "Theta (Th = dC/dT): time decay. Always negative for long options. The 'cost of gamma' -- mirrors G*sigma^2."
      - "Vega (v = dC/dsigma): sensitivity to implied vol. Most important Greek for vol trading. ATM vega ~ S*sqrt(T)*phi(d1)."
      - "BS PDE equilibrium: Theta + 0.5*G*S^2*sigma^2 + r*S*Delta - r*C = 0. Links theta and gamma -- you pay theta to own gamma."
      - "Rho (rho = dC/dr): rate sensitivity. Small for short-dated options. Matters for LEAPS."
      - "For vol forecasting: Vega tells you HOW MUCH a vol forecast error costs in dollar terms."
    misconceptions:
      - "Gamma is always good to own (wrong -- you pay theta for it; only profits if realized moves exceed implied)"
      - "Delta is constant (wrong -- it changes with S via gamma; delta-hedging must be continuous in theory)"
      - "Vega = vol exposure (partially -- vega measures IV sensitivity, but gamma gives RV exposure)"
    why_it_matters: "Greeks are how you convert a vol forecast into trading decisions -- vega gives IV exposure, gamma gives RV exposure, and theta is the cost of being wrong."

  - id: implied_volatility
    name: "Implied volatility: the market's price of uncertainty, not a forecast"
    layer: 2
    chapter: 8
    requires: [black_scholes_formula, variance_and_std_dev]
    connects_to:
      - { node_id: iv_surface, how: "IV varies by strike and maturity forming a 2D surface" }
      - { node_id: vrp_definition, how: "VRP = IV^2 - RV^2 (the gap between implied and realized)" }
      - { node_id: layer2_feature_set, how: "ATM IV is the first and most important Layer 2 feature" }
    key_points:
      - "Definition: sigma_imp such that BS(S, K, T, r, sigma_imp) = market_price. Unique solution (BS monotone in sigma)."
      - "Numerical inversion: Newton-Raphson using vega as derivative. sigma_{n+1} = sigma_n - (BS(sigma_n) - P_mkt) / vega(sigma_n). Converges in 3-5 iterations."
      - "IV is NOT a forecast of future RV. It is a PRICE that includes risk premium. Systematically IV > RV."
      - "Rebonato's 'wrong number in wrong formula': IV is the wrong sigma put into the wrong model to recover the right price."
      - "IV is quoted in annualized percent terms. To convert to daily: sigma_daily = sigma_ann / sqrt(252)."
      - "For ATM options: IV approximates the market's best guess of future annualized vol PLUS a risk premium."
      - "IV responds to supply/demand: bid for protection (puts) raises IV even without fundamental vol change."
    misconceptions:
      - "IV predicts future RV (wrong -- IV = E^Q[vol] which includes risk premium; IV systematically overestimates RV)"
      - "IV should equal historical vol (wrong -- the difference is the VRP, which compensates risk-bearing)"
      - "Higher IV always means the market expects bigger moves (partially -- it can also mean higher demand for protection)"
    why_it_matters: "IV is the raw signal from options markets -- it carries FORWARD-LOOKING information that lagged RV cannot, making it the most powerful single feature for RV forecasting at h=5 and h=22."

  # --- B. The IV Surface ---

  - id: iv_surface
    name: "The implied volatility surface: where Black-Scholes breaks down visibly"
    layer: 2
    chapter: 8
    requires: [implied_volatility, option_contracts_payoffs]
    connects_to:
      - { node_id: vol_skew_and_smile, how: "strike dimension of the surface shows skew/smile shape" }
      - { node_id: iv_term_structure, how: "maturity dimension shows term structure dynamics" }
      - { node_id: pca_iv_surface, how: "PCA decomposes surface movements into 3 orthogonal factors" }
      - { node_id: svi_parametrization, how: "SVI provides a parsimonious parametric fit to each smile slice" }
    key_points:
      - "sigma_imp(K, T) is a 2D surface: strike K (or moneyness) on x-axis, maturity T on y-axis, IV on z-axis."
      - "If BS were correct (GBM with constant vol): surface would be FLAT. Any shape != flat reveals model failure."
      - "Strike dimension: skew (equities) or smile (FX) -- driven by fat tails, jumps, leverage effect."
      - "Maturity dimension: term structure -- driven by mean reversion of vol and event scheduling."
      - "The surface is NOT static -- it moves in level, slope, and curvature (3 factor structure)."
      - "Quoting conventions: delta-space (25dP, ATM, 25dC) preferred over absolute strike for cross-asset comparison."
      - "Arbitrage constraints: no calendar spread arb (forward variance > 0), no butterfly arb (convex in strike)."
    misconceptions:
      - "The IV surface is a model output (wrong -- it's OBSERVED from market prices; models try to fit/explain it)"
      - "A flat surface means low vol (wrong -- a flat surface means BS is 'working' -- vol is constant across strikes/maturities)"
      - "Each point on the surface is independently set (wrong -- no-arbitrage constraints link them)"
    why_it_matters: "The IV surface is the raw data from which ALL Layer 2 features are extracted -- skew, term slope, butterfly, and VRP all come from reading this surface."

  - id: vol_skew_and_smile
    name: "Volatility skew and smile: why OTM puts cost more than OTM calls"
    layer: 2
    chapter: 8
    requires: [iv_surface, leverage_effect, fat_tails]
    connects_to:
      - { node_id: layer2_feature_set, how: "risk reversal (skew) is a direct Layer 2 feature" }
      - { node_id: butterfly_spread, how: "butterfly is the symmetric component orthogonal to skew" }
    key_points:
      - "Equity skew: IV_OTM_put > IV_ATM > IV_OTM_call. Monotonically decreasing in moneyness. Post-1987 crash phenomenon."
      - "Causes: (1) leverage effect (falling prices raise vol), (2) crash protection demand, (3) fat left tail in returns."
      - "Risk reversal: RR_25d = sigma_25dC - sigma_25dP. Negative for equities (put skew). Typical: -3 to -8 vol points."
      - "FX smile: U-shaped (jumps in both directions). RR approximately 0. Butterfly captures the symmetric kurtosis."
      - "Skew as regime indicator: steepening skew = rising fear. Flattening = complacency. Inversion = panic."
      - "In code: iv_skew_d = iv_1m_25dp - iv_1m_25dc (put minus call wing, positive = put skew dominant)."
    misconceptions:
      - "Skew has always existed (wrong -- pre-1987, surfaces were nearly flat; crash created permanent skew demand)"
      - "Skew means puts are 'overpriced' (wrong -- skew reflects real tail risk + risk premium; shorting puts is risky)"
      - "RR is always negative (wrong -- for individual stocks near earnings, upside call demand can flip skew positive)"
    why_it_matters: "Skew (risk reversal) is a Layer 2 feature capturing directional crash fear -- when skew steepens without RV rising, it signals expected future volatility increase."

  - id: iv_term_structure
    name: "IV term structure: short-dated fear vs long-dated mean reversion"
    layer: 2
    chapter: 8
    requires: [iv_surface, vol_clustering]
    connects_to:
      - { node_id: layer2_feature_set, how: "term slope = sigma_3m - sigma_1m is a Layer 2 feature" }
      - { node_id: vix_construction, how: "VIX is a specific point on the term structure (30-day)" }
    key_points:
      - "Normal: upward sloping (long-dated IV > short-dated). Reflects vol mean reversion to long-run level."
      - "Crisis: inverted (short-dated IV spikes above long-dated). Short-dated captures immediate fear."
      - "Mean reversion mechanism: if current RV is high, market expects it to decay so long-dated < short-dated."
      - "Term slope = sigma_long - sigma_short. Positive in calm markets, negative in stress. Key predictive signal."
      - "Short-dated IV is more volatile than long-dated (vol-of-vol decreases with tenor)."
      - "In code: iv_term_slope_d = iv_3m_atm - iv_1m_atm. Also iv_term_slope_w = 5-day rolling mean."
      - "VTS ratio (Bennett 2014): VTS = ATM_3m / ATM_1m. VTS > 1 = contango. VTS < 1 = backwardation."
    misconceptions:
      - "Inverted term structure means vol will stay high forever (wrong -- it means short-term spike expected to decay)"
      - "All maturities move together (wrong -- short-dated is 3-5x more volatile than long-dated)"
      - "Term slope is just noise (wrong -- strongly predicts VRP compression/expansion and RV mean reversion)"
    why_it_matters: "Term structure slope signals the speed of mean reversion priced by the market -- steep positive slope after a spike says 'RV will decay fast', which directly informs forecast horizons h=5 and h=22."

  - id: butterfly_spread
    name: "Butterfly spread: measuring symmetric tail thickness (kurtosis demand)"
    layer: 2
    chapter: 8
    requires: [vol_skew_and_smile, higher_moments]
    connects_to:
      - { node_id: layer2_feature_set, how: "butterfly is a direct Layer 2 feature, orthogonal to skew" }
    key_points:
      - "BF_25d = 0.5 * (sigma_25dP + sigma_25dC) - sigma_ATM. Average wing IV minus center. Measures smile curvature."
      - "Interpretation: high BF = market pricing fat tails in BOTH directions (kurtosis premium)."
      - "Orthogonal to skew: RR captures asymmetry (left vs right tail), BF captures symmetric tail weight."
      - "Typical values: equity BF_25d ~ 1-3 vol points. Spikes to 5+ in crisis (Oct 2008, Mar 2020)."
      - "In code: iv_butterfly_d = 0.5 * (iv_1m_25dp + iv_1m_25dc) - iv_1m_atm. Also iv_butterfly_w = 5-day rolling."
      - "Crisis detector: BF rising while ATM flat means market expects jumps (either direction) without a directional view."
    misconceptions:
      - "Butterfly is just skew squared (wrong -- it's the symmetric component; skew is antisymmetric)"
      - "High butterfly means directional crash fear (wrong -- that's skew; butterfly is directionless kurtosis)"
      - "Butterfly is redundant with VIX (wrong -- VIX captures level; BF captures curvature/jump probability)"
    why_it_matters: "Butterfly captures jump probability pricing that is orthogonal to directional skew -- it signals when the market expects large moves without knowing the direction, directly relevant to jump-driven RV spikes."

  - id: svi_parametrization
    name: "SVI: parsimonious parametric fit to the volatility smile"
    layer: 2
    chapter: 8
    requires: [iv_surface]
    connects_to:
      - { node_id: pca_iv_surface, how: "SVI parameters provide compact features for PCA instead of raw IV grid" }
    key_points:
      - "SVI formula: w(k) = a + b{rho*(k-m) + sqrt((k-m)^2 + sigma^2)} where k = ln(K/F), w = sigma_imp^2 * T."
      - "5 parameters: a (overall level), b (slope magnitude), rho (rotation/skew), m (translation), sigma (curvature at ATM)."
      - "Fits one maturity slice. Full surface = SVI per slice + interpolation across T."
      - "Arbitrage-free: constraints on parameters ensure no butterfly or calendar spread arbitrage."
      - "Lee's moment formula: w(k) ~ 2|k| as |k| large. SVI automatically satisfies this asymptotic limit."
      - "Industry standard: Gatheral (2004). Used by exchanges (CBOE) and market makers for interpolation."
      - "Connection to Heston: in the Heston limit, SVI parameters map to vol-of-vol, correlation, and mean reversion."
    misconceptions:
      - "SVI IS the volatility model (wrong -- it's a parametric interpolation device, not a dynamic model)"
      - "5 parameters means overfitting (wrong -- 5 params for a curve with 20+ option strikes is parsimonious)"
      - "SVI works across maturities automatically (wrong -- each slice is fit separately; SSVI handles cross-maturity)"
    why_it_matters: "SVI provides a compact 5-number summary of each smile slice -- these parameters can serve as features instead of raw IV values, reducing dimensionality while preserving arbitrage-free structure."

  - id: pca_iv_surface
    name: "PCA of the IV surface: level, slope, curvature explain 95%"
    layer: 2
    chapter: 8
    requires: [iv_surface, covariance_correlation]
    connects_to:
      - { node_id: layer2_feature_set, how: "PCA factors validate that ATM+skew+butterfly+term captures the surface" }
    key_points:
      - "Cont and da Fonseca (2002): 3 principal components explain 95% of daily IV surface changes."
      - "PC1 (~70% variance): LEVEL shift -- entire surface moves up/down. Correlates with VIX changes."
      - "PC2 (~15% variance): SLOPE -- short-dated vs long-dated diverge. Term structure steepening/flattening."
      - "PC3 (~10% variance): CURVATURE -- wings move relative to center. Smile widening/narrowing."
      - "Implication for features: ATM IV (level), term slope (PC2), butterfly (PC3) together span the surface information."
      - "Why only 3-4 features suffice: RR (skew) captures the strike-asymmetric part PCA misses."
      - "Stability: factor structure is stable across equity indices globally. Less stable for single stocks."
    misconceptions:
      - "You need the full IV grid as features (wrong -- 3-4 summary statistics capture 95%+ of the information)"
      - "PCA of prices = PCA of changes (wrong -- PCA should be done on daily CHANGES to the surface, not levels)"
      - "PC1 IS VIX (close but not exact -- PC1 is the dominant eigenvector of surface changes)"
    why_it_matters: "Validates our Layer 2 feature choice: ATM IV + term slope + butterfly + skew together reconstruct essentially all the information in the full IV surface with just 4 numbers."

  # --- C. Model-Free Variance and VIX ---

  - id: model_free_implied_variance
    name: "Model-free implied variance: no Black-Scholes needed"
    layer: 2
    chapter: 8, 9
    requires: [option_contracts_payoffs, implied_volatility, rv_construction]
    connects_to:
      - { node_id: vix_construction, how: "VIX is the CBOE discrete approximation of model-free variance" }
      - { node_id: variance_swaps, how: "fair variance swap strike = model-free implied variance" }
    key_points:
      - "Britten-Jones and Neuberger (2000): E^Q[integral of sigma^2 dt] = 2*integral of OTM_price/K^2 dK."
      - "No model assumptions needed -- derived purely from no-arbitrage. Works even if BS is wrong."
      - "Requires a continuum of strikes (liquid OTM options at all K). In practice: discrete sum over available strikes."
      - "The integral weights OTM options by 1/K^2 -- deep OTM options contribute more per dollar of premium."
      - "Key insight: the OPTIONS MARKET implicitly prices a VARIANCE expectation, not a vol expectation."
      - "Demeterfi et al (1999): connects to log-contract replication for variance swap payoff."
      - "Full derivation chain: (1) Ito log identity -> (2) log-contract = forward + 1/K^2 strip -> (3) risk-neutral pricing gives closed-form strike."
      - "Requires no-jump (continuous-path) assumption at derivation stage; breaks for jump-laden 0DTE."
    misconceptions:
      - "Model-free means assumption-free (wrong -- still assumes no-arbitrage and continuous price process)"
      - "You can compute this with just ATM options (wrong -- you need the full OTM strip across strikes)"
      - "Model-free variance = E[RV] (wrong -- it's E^Q[RV] under risk-neutral measure, includes VRP)"
      - "Model-free derivation is independent of path regularity assumptions (wrong -- no-jump required)"
    why_it_matters: "Model-free variance is the theoretically correct measure of options-implied vol -- VIX is just its discrete approximation. Understanding this clarifies what VIX actually measures."

  - id: vix_construction
    name: "VIX: CBOE's discrete approximation of 30-day risk-neutral variance"
    layer: 2
    chapter: 8, 9
    requires: [model_free_implied_variance]
    connects_to:
      - { node_id: vrp_definition, how: "VRP = VIX^2 - RV_forecast" }
      - { node_id: vvix_vol_of_vol, how: "VVIX = implied vol of VIX options (vol-of-vol)" }
      - { node_id: layer2_feature_set, how: "VIX level and VIX term structure ratio are Layer 2 features" }
    key_points:
      - "VIX^2 = (2/T) * sum(dK_i/K_i^2) * e^{rT} * midpoint(K_i) -- sum over OTM calls and puts."
      - "30-day horizon: interpolates between two nearest monthly expirations to get exactly 30 calendar days."
      - "VIX is quoted in annualized vol points (not variance). VIX=20 means expected 30-day annualized vol ~ 20%."
      - "Systematically overestimates RV: mean VIX ~ 19%, mean 30-day RV ~ 15%. Gap = VRP ~ 4 vol points."
      - "VIX spikes are asymmetric: can double in days but takes months to halve."
      - "VIX is NOT directly tradeable -- only via futures/options. VIX futures != VIX spot (term structure premium)."
      - "Forward-correction term: -(1/T)*(F/K0 - 1)^2 for nearest-below-forward strike K0 offset (negligible at 0DTE)."
      - "Endpoint DeltaK is single-sided (half-width), giving edge strikes half the weight of interior strikes."
      - "CBOE truncation: includes strikes until two consecutive zero-bid strikes encountered."
    misconceptions:
      - "VIX measures 'fear' (partially -- it measures risk-neutral variance which includes both expected vol AND risk premium)"
      - "VIX predicts market direction (wrong -- VIX measures magnitude, not direction; high VIX != market will fall)"
      - "You can invest directly in VIX (wrong -- VIX futures have roll cost; VXX decays heavily over time)"
      - "Discrete VIX sum always equals full continuous-strip fair strike (wrong -- truncation and corridor bias)"
    why_it_matters: "VIX is the most accessible options-implied feature and the numerator of VRP -- understanding its construction reveals what information it actually contains."

  - id: variance_swaps
    name: "Variance swaps: the pure bet on realized variance"
    layer: 2
    chapter: 9
    requires: [model_free_implied_variance, rv_construction]
    connects_to:
      - { node_id: vrp_definition, how: "VRP is the expected profit from selling variance swaps" }
      - { node_id: gamma_pnl_formula, how: "var swap replication = continuous delta-hedged option strip (gamma P&L integral)" }
      - { node_id: vix_construction, how: "CBOE discrete formula is practical implementation of fair strike inputs used in swap replication" }
    key_points:
      - "Payoff = N_var * (RV^2 - K_var) where K_var = strike (fair variance), RV = realized variance over period."
      - "Fair strike K_var = model-free implied variance. At inception, swap has zero value. VIX^2 ~ K_var for SPX."
      - "Vega notional conversion: N_vega = N_var * 2*sqrt(K_var). Industry quotes in vega notional ($ per vol point)."
      - "Long var swap: profits when RV > IV (realized moves exceed implied). Short var swap: collects VRP."
      - "Convexity: payoff is LINEAR in variance but CONVEX in volatility. Long var swap benefits from vol spikes disproportionately."
      - "Replication: achieved by continuously delta-hedging a strip of OTM options weighted by 1/K^2."
      - "Mark-to-market: during life, value depends on current implied variance for remaining period + accrued RV."
      - "Variance is additive across time (two-day var = sum of daily vars); volatility is not. This additivity enables static replication."
      - "Payoff units: N_var*(sigma_realized^2 - K_var^2) where both terms in annualized variance."
    misconceptions:
      - "Variance swaps and vol swaps are the same (wrong -- var swap is linear in sigma^2, vol swap is linear in sigma)"
      - "K_var = VIX (wrong -- VIX = sqrt(K_var * 100); also VIX has specific 30-day construction)"
      - "Selling variance is free money (wrong -- left tail blowups; Feb 2018 Volmageddon wiped out XIV)"
      - "Volatility-swap intuition transfers directly to variance-swap settlement (it does not -- different payoff structure)"
    why_it_matters: "Variance swaps are the cleanest instrument for isolating the variance risk premium -- understanding them clarifies why VRP exists and how our model's RV forecast translates to trading profit."

  # --- D. Variance Risk Premium ---

  - id: vrp_definition
    name: "Variance risk premium: the wedge between risk-neutral and physical volatility"
    layer: 2
    chapter: 9
    requires: [vix_construction, rv_construction, implied_volatility]
    connects_to:
      - { node_id: vrp_predicts_returns, how: "VRP time-variation predicts equity returns" }
      - { node_id: vrp_predicts_vol, how: "VRP level signals future RV mean reversion direction" }
      - { node_id: vrp_as_ml_feature, how: "ML-improved RV forecast makes VRP signal cleaner" }
      - { node_id: layer2_feature_set, how: "VRP is a core Layer 2 feature" }
      - { node_id: delta_hedged_straddle, how: "positive VRP = expected profit from selling straddles" }
    key_points:
      - "Definition: VRP = E^Q[RV] - E^P[RV]. Unobservable in both terms -- must be estimated."
      - "Operational proxy: VRP_t = (VIX_t/100)^2 - RV_forecast_t. Better RV forecast produces cleaner VRP estimate."
      - "Sign: VRP is positive ~85% of the time (Carr and Wu 2009). IV systematically exceeds subsequent RV."
      - "Magnitude: mean VRP ~ 15-25 variance points (~4 vol points annualized). Time-varying."
      - "Intuition: investors pay insurance premium for downside protection. Sellers earn this for bearing crash risk."
      - "In code: vrp_d = (atm_iv/100)^2 - rv*252. Also vrp_w (5-day) and vrp_m (22-day) rolling means."
      - "Cross-sectional: VRP larger for high-beta stocks, smaller for low-vol names. Varies by sector."
    misconceptions:
      - "VRP = VIX - HV (wrong -- VRP uses variance not vol, and HV is backward-looking; need FORECAST of future RV)"
      - "Positive VRP means IV is 'wrong' (wrong -- VRP is rational compensation for bearing risk)"
      - "VRP is constant (wrong -- it varies 5x-10x over cycles; this variation is the signal)"
    why_it_matters: "VRP is the bridge between statistical forecasting (QLIKE) and economic value (P&L) -- our model's improved RV forecast produces a cleaner VRP signal that drives trading decisions."

  - id: vrp_predicts_returns
    name: "Why high VRP predicts future equity returns"
    layer: 2
    chapter: 9
    requires: [vrp_definition]
    connects_to:
      - { node_id: vrp_as_ml_feature, how: "if VRP predicts returns, an ML pipeline can exploit this" }
    key_points:
      - "Bollerslev, Tauchen, Zhou (2009): VRP predicts quarterly equity returns with R^2 = 4-15%."
      - "Mechanism: high VRP = elevated risk aversion -> investors demand higher expected returns -> future returns higher."
      - "Time horizon: predictive power strongest at 3-12 month horizons. Weak at daily frequency."
      - "Alternative to dividend yield: VRP captures short-run risk appetite changes; DY captures long-run valuation."
      - "Drechsler and Yaron (2011): long-run risk model generates VRP from preference for early resolution of uncertainty."
      - "Not directly used in our RV forecasting -- but motivates WHY VRP time-variation matters economically."
    misconceptions:
      - "R^2=15% means reliably predictable returns (yes but: out-of-sample R^2 is much lower; transaction costs eat most)"
      - "VRP causes future returns (wrong -- both driven by risk aversion changes; VRP is a symptom not a cause)"
      - "This is useful for daily RV forecasting (not directly -- but understanding VRP dynamics informs feature design)"
    why_it_matters: "Establishes that VRP is not noise but a genuine risk factor with economic significance -- motivating its inclusion as a feature and its role in economic value tests."

  - id: vrp_predicts_vol
    name: "VRP as a mean reversion signal for realized volatility"
    layer: 2
    chapter: 9
    requires: [vrp_definition, vol_clustering]
    connects_to:
      - { node_id: layer2_feature_set, how: "VRP level informs RV forecast directly at h=5 and h=22" }
      - { node_id: vrp_as_ml_feature, how: "VRP encodes forward vol information beyond lagged RV" }
    key_points:
      - "Mechanism: high VRP -> IV >> RV -> market expects RV to RISE toward IV. VIX carries forward event info."
      - "Conversely: low/negative VRP -> IV < RV -> market expects RV to FALL. Post-spike normalization signal."
      - "Why better than lagged RV alone: IV incorporates scheduled events (earnings, FOMC) that lagged RV cannot see."
      - "Predictive horizon: strongest at h=5 and h=22 days. At h=1 day, lagged RV persistence dominates."
      - "Empirical: adding VRP to HAR models improves QLIKE by 3-8% at h=5 (Bekaert and Hoerova 2014)."
      - "Direction: when VIX >> RV_recent (high VRP), expect RV to increase toward VIX level over coming weeks."
    misconceptions:
      - "VRP always means 'sell vol' (wrong -- high VRP after a spike can mean RV is about to catch UP to IV)"
      - "Lagged RV is sufficient for forecasting (wrong -- it misses forward-looking event information in options)"
      - "VRP carries same info as IV level (partially -- but VRP = IV - RV_forecast, the RELATIVE gap matters more)"
    why_it_matters: "This is the core mechanism by which Layer 2 features improve RV forecasts -- options markets see scheduled events and regime shifts BEFORE they appear in realized volatility."

  - id: vrp_decomposition
    name: "Decomposing VRP: diffusive, jump, and tail components"
    layer: 2
    chapter: 9
    requires: [vrp_definition, jumps_vs_diffusion]
    connects_to:
      - { node_id: vvix_vol_of_vol, how: "VVIX captures jump-tail VRP component" }
    key_points:
      - "Bekaert and Hoerova (2014): VRP = expected variance component + pure risk premium component."
      - "Bollerslev and Todorov (2011): VRP = diffusive VRP + jump-tail VRP. Most time-variation from tail component."
      - "Diffusive VRP: compensation for bearing continuous variance risk. Relatively stable over time."
      - "Jump-tail VRP: compensation for bearing crash risk (large negative jumps). Spikes dramatically in crises."
      - "Implication: during 'normal' times, VRP ~ constant. During stress, tail VRP dominates all variation."
      - "For feature engineering: total VRP + a tail-specific measure (VVIX or deep OTM put IV) captures both."
    misconceptions:
      - "VRP is one thing (wrong -- it has structurally different components with different dynamics)"
      - "Diffusive and jump VRP move together (wrong -- tail VRP can spike while diffusive stays flat)"
      - "We need to decompose VRP to use it (not necessarily -- but understanding components explains why VVIX adds info)"
    why_it_matters: "Explains why multiple options features are needed: ATM IV captures level, VRP captures the gap, but VVIX and butterfly specifically target the TAIL component that drives crisis dynamics."

  - id: vvix_vol_of_vol
    name: "VVIX and vol-of-vol: uncertainty about uncertainty"
    layer: 2
    chapter: 9
    requires: [vix_construction, vrp_decomposition]
    connects_to:
      - { node_id: layer2_feature_set, how: "VVIX is a direct Layer 2 feature capturing vol-of-vol" }
    key_points:
      - "VVIX = implied volatility of VIX options. Computed the same way as VIX but using VIX options as underlying."
      - "Interpretation: how uncertain is the market about FUTURE vol? High VVIX = vol could go anywhere."
      - "Typical range: VVIX 80-100 (calm), 100-120 (elevated), 120-170 (crisis). Mean ~ 90."
      - "Realized vol-of-VIX: in code, computed from 22-day rolling sum of squared VIX log-returns * 252."
      - "VVIX risk premium (in code: vvix_rp_d) = VVIX/100 - realized_vol_of_vix. Implied minus realized vol-of-vol."
      - "Predictive power: high VVIX predicts larger VIX moves (both up and down) -- useful for RV forecasting at h=5+."
      - "Captures the TAIL component of VRP (Bollerslev-Todorov): jump risk uncertainty specifically."
    misconceptions:
      - "VVIX = VIX of VIX (close but: VVIX uses VIX options, not S&P options of options)"
      - "High VVIX means VIX will rise (wrong -- it means large VIX MOVES in either direction; directionally neutral)"
      - "VVIX is redundant with VIX (wrong -- correlation ~ 0.5; VVIX captures jump-tail uncertainty VIX misses)"
    why_it_matters: "VVIX adds information orthogonal to VIX level -- it captures the market's uncertainty about whether vol will spike or collapse, directly relevant to forecast confidence at h=5 and h=22."

  # --- E. Layer 2 Feature Engineering ---

  - id: layer2_feature_set
    name: "Layer 2 feature engineering: the complete options-implied feature pipeline"
    layer: 2
    chapter: 5, 9
    requires: [implied_volatility, vrp_definition, vol_skew_and_smile, iv_term_structure, butterfly_spread, vvix_vol_of_vol]
    connects_to:
      - { node_id: horizon_dependence_options, how: "options features gain power at longer horizons" }
      - { node_id: vrp_as_ml_feature, how: "VRP feature benefits from ML's improved denominator" }
      - { node_id: delta_hedged_straddle, how: "features drive the signal for vol trading P&L" }
    key_points:
      - "Core features (from code): log_atm_iv_{d,w,m}, vrp_{d,w,m}, iv_skew_{d,w}, iv_term_slope_{d,w}, iv_butterfly_{d,w}, vvix_d, iv_rv_gap_d, iv_momentum_d."
      - "Interaction features: atm_iv_x_log_rv_d (per-symbol ATM IV * log RV -- CSV 2023 #1 ML gain source), vix_x_log_rv_d (market-wide)."
      - "Vol-of-vol features: vvix_innovation_d, realized_vol_of_vix_d, vvix_rp_d (implied - realized vol-of-vol)."
      - "Market-wide context: iv_dispersion_d (cross-sectional IV std), vix (raw level for interactions)."
      - "Term structure extras: VTS = ATM_3m/ATM_1m (Bennett 2014), forward_vol_1m3m = sqrt(max(sigma_3m^2*T3-sigma_1m^2*T1,0)/(T3-T1))."
      - "ALL features use t-1 close (shift(1) in code) to prevent look-ahead bias. Same-day IV is not available at forecast time."
      - "Data source: Marquee EDRVOL_PERCENT_STANDARD for SPX; per-symbol ATM IV from IVSurfaceLayer cache."
    misconceptions:
      - "More surface features = better (wrong -- beyond ~15 features, multicollinearity hurts; PCA shows 3-4 factors suffice)"
      - "Per-stock IV is always needed (desirable but not required -- SPX IV drives most variation via market factor)"
      - "Options features help at all horizons equally (wrong -- h=1 gains only 1-3%; h=5/22 gains 5-10%)"
    why_it_matters: "This is the complete specification of Layer 2 in our feature pipeline -- these features represent the options market's forward view and provide the largest QLIKE improvement at h=5 and h=22."

  - id: horizon_dependence_options
    name: "Why options features matter more at longer forecast horizons"
    layer: 2
    chapter: 5, 9
    requires: [layer2_feature_set, har_model, vol_clustering]
    connects_to:
      - { node_id: vrp_as_ml_feature, how: "horizon effect explains when to weight IV-derived features more heavily" }
    key_points:
      - "h=1 day: lagged RV persistence is very strong (~0.6 autocorrelation). Hard for options to beat yesterday's RV. Gain: +1-3% QLIKE."
      - "h=5 days: persistence decays. HAR's weekly component weakens. Options fill gap with EVENT info. Gain: +5-8% QLIKE."
      - "h=22 days: persistence nearly gone. Monthly RV unpredictable from past alone. Options provide most signal. Gain: +5-10% QLIKE."
      - "Mechanism: options price SCHEDULED events (FOMC in 2 weeks, earnings in 10 days). These are invisible to lagged RV."
      - "Analogy: weather -- tomorrow's ~ today's (persistence). Next month's needs atmospheric models (forward info)."
      - "Implication for model design: at h=1, weight Layer 0-1 heavily. At h=5+, weight Layer 2 features more."
    misconceptions:
      - "Options features always dominate (wrong -- at h=1, lagged RV is king; options add marginal value)"
      - "The effect is linear in horizon (wrong -- roughly step-function: small at h=1, big jump at h=5, plateau at h=22)"
      - "Longer horizon = harder forecast (partially -- but options provide MORE relative value precisely because persistence fades)"
    why_it_matters: "Explains the strategic value of Layer 2: our biggest QLIKE gains (5-10%) come at h=5 and h=22 where options features shine -- this is where academic novelty and trading desk value converge."

  - id: vrp_as_ml_feature
    name: "VRP as ML feature: better forecasts create cleaner signals"
    layer: 2
    chapter: 9
    requires: [vrp_definition, layer2_feature_set, qlike_loss]
    connects_to:
      - { node_id: delta_hedged_straddle, how: "cleaner VRP signal produces better straddle entry timing" }
      - { node_id: vol_targeting_sharpe, how: "cleaner VRP means better vol forecast -> improved vol-targeting Sharpe" }
    key_points:
      - "Circular feedback: VRP = IV^2 - E^P[RV]. ML gives better E^P[RV] so VRP estimate becomes less noisy."
      - "Fouhy (2024): hierarchical XGBoost pipeline -- first model forecasts RV, VRP drives trading signal."
      - "Standard VRP proxy (VIX^2 - lagged_RV^2) is noisy because lagged RV != expected future RV. ML fixes denominator."
      - "In practice: first estimate RV_hat from Layer 0-1 features. Then compute VRP_hat = IV^2 - RV_hat. Use VRP_hat in Layer 2."
      - "This is a SEQUENTIAL pipeline, not simultaneous: base forecast first, then VRP feature second."
      - "The atm_iv_x_log_rv interaction (in code) directly captures the non-linear relationship between IV level and RV state."
    misconceptions:
      - "VRP is exogenous (wrong in ML context -- your forecast quality determines how clean the VRP signal is)"
      - "Use lagged RV as the P-measure component (crude approximation -- ML forecast is better because it's forward-looking)"
      - "This creates circular dependency (no -- it's sequential: forecast RV first without VRP, then compute VRP, then re-forecast)"
    why_it_matters: "This creates a virtuous cycle: better QLIKE -> cleaner VRP -> better trading signal -> higher Sharpe. It's the mechanism by which statistical improvement translates to economic value."

  # ============================================================
  # LAYER 99: Economic Value — Delta-Hedged Straddle & Vol-Targeting
  # ============================================================

  - id: gamma_pnl_formula
    name: "Gamma P&L: the fundamental equation of vol trading profit"
    layer: 99
    chapter: 17, 18
    requires: [the_greeks, black_scholes_formula, rv_construction]
    connects_to:
      - { node_id: delta_hedged_straddle, how: "straddle P&L is integral of daily gamma P&L over holding period" }
      - { node_id: atm_straddle_gamma, how: "gamma value determines P&L sensitivity per variance point" }
      - { node_id: gamma_identity_limitations, how: "vanna, volga, jumps, and discreteness break the clean identity" }
      - { node_id: boyle_emanuel_hedging_error, how: "discrete hedging adds zero-mean noise on top of gamma P&L" }
    key_points:
      - "Daily P&L = 0.5 * Gamma * S^2 * (sigma^2_realized - sigma^2_implied) * dt. The core formula of vol trading."
      - "Derivation: from BS PDE, theta + 0.5*G*S^2*sigma^2 = cost of carry. If RV != IV, there's a P&L residual."
      - "Long gamma (positive G): profits when realized moves EXCEED implied. Lose when markets are quiet."
      - "Short gamma (negative G): profits when realized moves are SMALLER than implied. Lose on big moves."
      - "Path dependence: Gamma changes with S (moneyness drift). Total P&L = sum of daily gamma P&L, each with different G_t."
      - "KEY INSIGHT: P&L is proportional to (RV^2 - IV^2). Our model forecasts RV. If forecast > IV, buy gamma."
      - "In code: raw_pnl = 0.5 * gamma * spot^2 * (realized_var - iv^2 * dt) per day in economic_value.py."
      - "Daily discrete form (variance notation): PnL_t = 0.5*Gamma_t*S_t^2*(RV_t - IV^2/252) where RV_t = realized VARIANCE, IV^2/252 = daily implied var."
      - "Dollar-gamma weight S^2*Gamma is bell-shaped (peaks at ATM, decays in wings) -- source of path dependence in total P&L."
      - "Ahmad & Wilmott (2005): summed discounted P&L = 0.5*(sigma^2-sigma_tilde^2)*integral(e^{-r(t-t0)}*S^2*Gamma^i dt) -- always positive if view correct, but path-dependent."
      - "Theta-gamma balance: theta + 0.5*sigma^2*S^2*Gamma = 0 means long theta IS short gamma -- two views of same coin."
    misconceptions:
      - "Gamma P&L is riskless (wrong -- only riskless if you know future RV in advance; forecast errors create variance)"
      - "Formula assumes continuous hedging (yes -- discrete hedging adds noise proportional to G*kurtosis*dt^2)"
      - "P&L is proportional to vol difference (wrong -- proportional to VARIANCE difference: sigma^2_real - sigma^2_imp)"
      - "Positive theta is independent free carry (wrong -- it's mechanically linked to short gamma via the balance equation)"
    why_it_matters: "This formula directly connects our RV forecast to dollar P&L -- every basis point of QLIKE improvement translates to a better estimate of (sigma^2_real - sigma^2_imp), which IS the trading signal."

  - id: atm_straddle_gamma
    name: "ATM straddle gamma: peak sensitivity at-the-money"
    layer: 99
    chapter: 17
    requires: [the_greeks, option_contracts_payoffs, gamma_pnl_formula]
    connects_to:
      - { node_id: delta_hedged_straddle, how: "straddle gamma determines P&L magnitude per unit move" }
    key_points:
      - "Gamma_straddle = 2 * Gamma_call = 2 / (S * sigma_imp * sqrt(T)) for ATM straddle (call + put at same strike)."
      - "Peak at ATM: gamma is maximized when S = K. Falls off as |S-K| increases."
      - "Maturity effect: Gamma proportional to 1/sqrt(T). Short-dated options have HIGHER gamma."
      - "Dollar gamma: $G = 0.5 * Gamma * S^2 = S / (sigma_imp * sqrt(T)). Times (sigma^2_real - sigma^2_imp)*dt = daily P&L."
      - "Practical: with 1-month ATM straddle, 1 variance point difference ~ 3-5 bps P&L per day on notional."
      - "In code: gamma = 2.0 / (spot * iv_safe * sqrt(T)) where T = tenor_days/252."
      - "As spot moves from strike: gamma decreases -> P&L sensitivity drops -> 'gamma bleed' from moneyness drift."
    misconceptions:
      - "Gamma is constant during the trade (wrong -- it changes with S, T, and sigma; must be recalculated daily)"
      - "Straddle gamma = single option gamma (wrong -- straddle = 2 options -> 2x the gamma at ATM)"
      - "Longer-dated = more exposure (wrong -- longer-dated has LESS gamma but MORE vega; different risk profiles)"
    why_it_matters: "Quantifies how much P&L we extract per unit forecast accuracy -- the higher the gamma, the more our RV forecast edge translates into realized trading profit."

  - id: delta_hedged_straddle
    name: "Delta-hedged straddle: converting RV forecasts into vol trading P&L"
    layer: 99
    chapter: 17, 18
    requires: [gamma_pnl_formula, atm_straddle_gamma, vrp_definition, retransformation_bias]
    connects_to:
      - { node_id: vol_trading_transaction_costs, how: "costs determine breakeven accuracy threshold" }
      - { node_id: why_delta_hedged_straddle_works, how: "positive VRP makes short straddle baseline profitable" }
      - { node_id: vol_targeting_sharpe, how: "alternative economic value test using different mechanism" }
      - { node_id: ivrv_signal_construction, how: "signal construction details how the forecast drives entry decisions" }
      - { node_id: ivrv_backtest_algorithm, how: "backtest algorithm assembles all components into executable loop" }
    key_points:
      - "Strategy: Buy (or sell) ATM straddle + delta-hedge. Removes directional S exposure entirely."
      - "Signal: SELL straddle when ML forecast of RV < IV (expect low vol). BUY when RV_forecast > IV."
      - "In code: signal = +1 (sell vol) when gap > threshold, -1 (buy vol) when gap < -threshold, 0 otherwise."
      - "P&L per day = -signal * 0.5 * Gamma * S^2 * (realized_var - iv^2*dt). Normalized by spot for returns."
      - "Holding period: typically match forecast horizon (h=5 -> hold 1 week, h=22 -> hold 1 month)."
      - "Duan correction: must apply retransformation bias when converting log-RV forecast to variance for IV comparison."
      - "In code: delta_hedged_sharpe() takes log_rv_predictions, converts to annualized vol, computes signal and P&L."
    misconceptions:
      - "Delta-hedging is free (wrong -- each hedge costs bid-ask spread; discrete hedging introduces noise)"
      - "The strategy is purely long or short vol (wrong -- it's CONDITIONAL; model decides direction from RV vs IV gap)"
      - "Any QLIKE improvement guarantees P&L improvement (wrong -- must be better than market's implicit forecast, net of costs)"
    why_it_matters: "This is the PRIMARY economic value test for our ML model -- it directly monetizes the RV forecast by trading the gap between our prediction and the market's implied expectation."

  - id: vol_trading_transaction_costs
    name: "Transaction costs in vol trading: the breakeven for forecast edge"
    layer: 99
    chapter: 17, 18
    requires: [delta_hedged_straddle, the_greeks]
    connects_to:
      - { node_id: why_delta_hedged_straddle_works, how: "costs determine minimum VRP needed for profitability" }
      - { node_id: leland_modified_volatility, how: "Leland loads hedge costs into the vol used for pricing" }
      - { node_id: pnl_attribution_waterfall, how: "costs bite the mean in the P&L waterfall" }
    key_points:
      - "Option bid-ask: SPX ATM straddle spread ~ 0.3-0.5 vol points. Per leg: ~0.15-0.25 vol points."
      - "In code: cost_vol_points = 0.5 per leg. Vega_norm = sqrt(T)*0.3989. Daily cost = 2*cost*vega_norm/holding_period."
      - "Delta-hedging cost: each hedge ~ 0.5-1 bp of notional. Daily hedging for 22 days ~ 15-22 bp total."
      - "Amortization: spread paid at entry, amortized over holding_period (22 days default in code)."
      - "Breakeven: need RV forecast error < (bid-ask + hedge costs). Typically ~20-30 var bps accuracy edge."
      - "QLIKE gains of 30-80 bps over HAR translate to ~ 10-25 var bps better accuracy -> marginal after costs."
      - "Regime-dependent: costs lower in calm markets but VRP also lower. Costs higher in crisis but VRP wider."
      - "Option cost formula (ch18): c_opt = Vega * 0.5*(sigma_ask - sigma_bid). Charge per EVENT (entry/flip/exit), not daily."
      - "Muravyev-Pearson (2020): quoted spread ~8.1c, effective ~6.2c, timing-aware ~1.3c. Straddle collapses from 22.7%/mo gross to 3.9%/mo with full spread."
      - "Cost-BAND required: report Sharpe across full quoted, effective, and timing-aware assumptions. Sign of conclusion can flip."
      - "Maturity schedule (Doshi et al. 2025): 21-48d ~2%, 7-13d ~3.5%, 0DTE ~9% of premium. Short-dated much more expensive."
    misconceptions:
      - "Only option spread matters (wrong -- delta-hedging costs can exceed option spread for long holding periods)"
      - "Paper P&L ~ real P&L (wrong -- costs can eat 30-50% of raw signal P&L)"
      - "High-frequency hedging is always better (wrong -- more frequent = more cost; optimal depends on gamma/kurtosis)"
    why_it_matters: "Sets the bar for how much forecast improvement is economically meaningful -- our 30-80 bps QLIKE target translates to barely enough edge to cover costs, making every bps valuable."

  - id: why_delta_hedged_straddle_works
    name: "Why selling delta-hedged straddles is profitable: VRP mechanics"
    layer: 99
    chapter: 17
    requires: [delta_hedged_straddle, vrp_definition, vol_trading_transaction_costs]
    connects_to:
      - { node_id: vol_targeting_sharpe, how: "both tests measure economic value from different angles" }
    key_points:
      - "VRP is positive ~85% of the time (Carr and Wu 2009). Short straddle collects theta > average realized gamma losses."
      - "Base rate: unconditional short vol earns ~ 4 vol points/year (VRP). Sharpe ~ 0.3-0.5. But left tail is brutal."
      - "ML edge: better RV forecast identifies WHEN premium is genuinely rich (VRP > cost) vs fair (VRP ~ cost)."
      - "Hit rate: with ML timing, hit rate ~ 88.8% vs 85% unconditional. Small improvement, large P&L impact."
      - "Conditional entry: only sell when model confidence is high AND VRP exceeds cost threshold. Reduces drawdown."
      - "Risk management: max position limits, stop-losses, circuit breakers for VIX > 40."
      - "Key insight: model only needs to correctly rank whether RV will be above or below IV, not predict exact level."
    misconceptions:
      - "This is a carry trade with no risk (wrong -- left-tail losses in 2008, 2020 wipe months of premium in hours)"
      - "ML guarantees better hit rate (wrong -- only if OOS forecast improvement is real; overfitting destroys edge)"
      - "You need to predict exact RV level (wrong -- binary accuracy (above/below IV) matters more than point precision)"
    why_it_matters: "Connects statistical forecasting to real money: the model needs to identify rich premium with high hit rate -- this is the ultimate test of whether our QLIKE improvement has practical value."

  - id: ewma_baseline
    name: "EWMA: the industry baseline that vol-targeting must beat"
    layer: 99
    chapter: 17
    requires: [variance_and_std_dev, vol_clustering, conditional_variance]
    connects_to:
      - { node_id: why_vol_targeting_adds_sharpe, how: "EWMA is the benchmark; ML must improve beyond it" }
      - { node_id: vol_targeting_sharpe, how: "EWMA provides the baseline Sharpe for comparison" }
    key_points:
      - "Formula: sigma^2_t = (1-lambda)*r^2_{t-1} + lambda*sigma^2_{t-1}. Exponential decay of past squared returns."
      - "One parameter: lambda (decay factor). Higher lambda = longer memory. RiskMetrics default: lambda = 0.94 (half-life ~ 11 days)."
      - "Half-life: h = -ln(2)/ln(lambda). Typical range for vol-targeting: 20-60 days. lambda=0.97 -> h~23 days."
      - "Strengths: simple, no estimation needed, daily updates, captures vol clustering mechanically."
      - "Weaknesses: symmetric (no leverage effect), equal weighting of up/down, no regime detection, no forward-looking info."
      - "Industry standard: most risk systems use EWMA or GARCH(1,1) for position sizing. Must beat this or ML adds no value."
      - "Calibration: optimize lambda to minimize QLIKE over training period. Or use half-life=20 as reasonable default."
    misconceptions:
      - "EWMA captures all persistence (wrong -- it has ONE decay rate; HAR's multi-scale better approximates long memory)"
      - "EWMA is a naive baseline (wrong -- surprisingly hard to beat consistently; many ML models fail to improve on it OOS)"
      - "lambda=0.94 is always optimal (wrong -- RiskMetrics default was for VaR, not vol-targeting; optimal varies)"
    why_it_matters: "EWMA is the practical bar: trading desks already use it for position sizing. Our ML model must demonstrate CLEAR OOS Sharpe improvement over EWMA-based vol-targeting to justify complexity."

  - id: vol_targeting_formula
    name: "Vol-targeting position sizing: inversely proportional to forecast vol"
    layer: 99
    chapter: 17
    requires: [ewma_baseline, retransformation_bias]
    connects_to:
      - { node_id: why_vol_targeting_adds_sharpe, how: "formula implements the mechanism" }
      - { node_id: vol_targeting_failure_modes, how: "formula can produce dangerous leverage in low-vol regimes" }
      - { node_id: vol_targeting_sharpe, how: "this IS the formula referenced in the synthesis node" }
    key_points:
      - "Core formula: w_t = sigma_target / sigma_hat_t. Position weight inversely proportional to forecast vol."
      - "sigma_target: desired portfolio vol level (e.g., 10% annualized). Chosen to match risk budget."
      - "sigma_hat_t: forecast of next-period vol. From pipeline: sqrt(252 * exp(log_rv_hat)) after Duan correction."
      - "Leverage cap: w_t = min(sigma_target / sigma_hat_t, max_leverage). Typically max_leverage = 2.0."
      - "Portfolio return: r_VT_t = w_t * r_asset_t. Realized portfolio vol ~ sigma_target if forecast is accurate."
      - "In code: vol_targeting_pnl() takes returns + vol_forecast, returns weighted portfolio returns."
      - "In code: vol_targeting_sharpe() converts log-RV predictions to annualized vol via sqrt(252*exp(log_rv))."
    misconceptions:
      - "Vol-targeting guarantees constant portfolio vol (wrong -- only if forecast is perfect; errors create variation)"
      - "Lower sigma_target is safer (wrong -- just a scaling; Sharpe ratio is invariant to sigma_target level)"
      - "Position weight can be any value (wrong -- must cap leverage; without cap, predicted-low-vol gets infinite weight)"
    why_it_matters: "This formula is the mechanism by which every log-RV forecast we produce becomes a portfolio allocation decision -- the entire statistical pipeline terminates here for the vol-targeting economic value test."

  - id: why_vol_targeting_adds_sharpe
    name: "Why vol-targeting improves Sharpe: truncating the left tail"
    layer: 99
    chapter: 17
    requires: [vol_targeting_formula, ewma_baseline, leverage_effect]
    connects_to:
      - { node_id: vol_targeting_failure_modes, how: "the same mechanism that helps can hurt if forecast is wrong" }
      - { node_id: vol_targeting_sharpe, how: "provides the theoretical explanation for the synthesis" }
      - { node_id: tsmom_connection, how: "TSMOM uses same inverse-vol sizing mechanism" }
    key_points:
      - "Moreira and Muir (2017): vol-targeting adds +0.3 Sharpe across equities, bonds, FX, commodities."
      - "Mechanism 1: vol is PREDICTABLE (clustering). Rising vol -> reduce exposure BEFORE drawdown."
      - "Mechanism 2: leverage effect. Rising vol IS correlated with falling prices. Cutting high-vol = cutting before losses."
      - "Mechanism 3: return/vol ratio is NOT constant. High-vol periods don't proportionally reward risk."
      - "The Sharpe gain comes almost entirely from REDUCING LEFT TAIL exposure, not from increasing right returns."
      - "Better forecast -> earlier detection of vol rise -> more timely position cut -> larger left-tail truncation."
      - "Quantification: HAR-based targeting gives Sharpe ~ 0.65. EWMA gives ~ 0.55. ML target: >= 0.70."
    misconceptions:
      - "Vol-targeting works because of market timing (wrong -- it's RISK timing, reducing exposure when risk is high)"
      - "Sharpe improvement comes from earning more (wrong -- comes from LOSING LESS in bad times)"
      - "Any vol forecast produces the same Sharpe gain (wrong -- better forecasts detect regime changes earlier)"
    why_it_matters: "This is the economic mechanism behind our evaluation target: ML's ability to detect vol spikes EARLIER than EWMA (via forward-looking features) translates directly to Sharpe through left-tail truncation."

  - id: vol_targeting_failure_modes
    name: "Vol-targeting failure modes: when inverse-vol sizing backfires"
    layer: 99
    chapter: 17
    requires: [vol_targeting_formula, why_vol_targeting_adds_sharpe]
    connects_to:
      - { node_id: vol_targeting_sharpe, how: "failure mode awareness required when interpreting Sharpe results" }
    key_points:
      - "Failure mode 1: UNDERPREDICTION in crisis onset. Model slow to detect regime shift -> overweight INTO drawdown."
      - "Failure mode 2: OVERPREDICTION in recovery. Model keeps predicting high vol during recovery -> underweight rebound."
      - "Failure mode 3: Low-vol leverage. VIX < 12 -> formula implies leverage > 2x -> amplifies sudden jumps."
      - "Mitigation FM1: safety floor -- vol_estimate = max(ML_forecast, 1.5*EWMA). Never trust ML below 1.5x EWMA alone."
      - "Mitigation FM3: hard leverage cap at 2x. In code: np.minimum(target_vol / vol_safe, max_leverage)."
      - "COVID example: models trained on normal data badly underestimated; levered 2x on Feb 19 lost 30%+ by Mar 23."
      - "Key lesson: vol-targeting Sharpe is NOT free -- it trades left-tail truncation for liquidity/leverage risk."
    misconceptions:
      - "Vol-targeting is always safe (wrong -- can amplify losses if model is late to detect regime shift)"
      - "The leverage cap solves everything (helps but: 2x still means double exposure in low-vol if vol spikes overnight)"
      - "ML is always faster than EWMA (not necessarily -- ML might overfit to gradual changes and miss sudden jumps)"
    why_it_matters: "Understanding failure modes ensures we interpret backtest Sharpe honestly -- and build in safety mechanisms (vol floor, leverage cap) required for any live deployment."

  - id: tsmom_connection
    name: "Connection to time-series momentum: vol-inverse sizing everywhere"
    layer: 99
    chapter: 17
    requires: [why_vol_targeting_adds_sharpe]
    connects_to:
      - { node_id: vol_targeting_sharpe, how: "TSMOM is the broader family; vol-targeting is its sizing engine" }
    key_points:
      - "Moskowitz, Ooi, Pedersen (2012): TSMOM = sign(r_past) * (sigma_target/sigma_hat). Signal * inverse-vol sizing."
      - "Every TSMOM implementation uses vol-inverse position sizing as the denominator. QLIKE improvement -> better TSMOM sizing."
      - "Our project connection: vol-targeting IS the TSMOM sizing engine stripped of the directional signal."
      - "AQR, Man, Winton all use vol-inverse sizing in CTA/managed-futures strategies. Industry-wide application."
      - "Implication: any improvement to vol forecasting scales across ALL strategies using inverse-vol sizing."
      - "Not just equities: TSMOM applies to commodities, FX, fixed income -- all benefit from better vol estimates."
    misconceptions:
      - "Vol-targeting and momentum are the same thing (wrong -- momentum provides DIRECTION; vol-targeting only does SIZING)"
      - "Our model must predict direction to add TSMOM value (wrong -- improving the sizing denominator alone adds value)"
      - "Only vol-targeting tests matter (wrong -- TSMOM is a bigger applications universe; vol-targeting is the cleanest test)"
    why_it_matters: "Broadens the project's impact: our vol forecasting improvement doesn't just help one strategy -- it improves position sizing across the entire managed-futures/TSMOM industry."

  # ============================================================
  # LAYER 99: Chapter 18 — Realistic IV-RV Delta-Hedged Straddle
  # ============================================================

  # --- A. Signal Construction & Timing ---

  - id: ivrv_signal_construction
    name: "IV-RV gap signal: functional forms, de-annualization, and anti-lookahead"
    layer: 99
    chapter: 18
    requires: [delta_hedged_straddle, implied_volatility, rv_construction]
    connects_to:
      - { node_id: ivrv_backtest_algorithm, how: "signal is step 1 of the backtest loop" }
      - { node_id: variance_swaps, how: "signal benchmark should map to traded variance strike, not generic single-option IV" }
    key_points:
      - "Signal: X_{t-1} = f(RV_hat_t, IV_{t-1}) where f in {difference, ratio, log-ratio}"
      - "De-annualization: IV_daily = IV_ann / sqrt(252) to match RV units before computing gap"
      - "Anti-lookahead protocol: compute at 3:55pm ET, execute by 4:00pm close, realize P&L over day t+1"
      - "Graded sizing beats binary switch (Li & Wu 2026): scale with gap magnitude, not just sign"
      - "Functional form barely matters; sign and rough magnitude drive results"
      - "The signal is the ONLY place the forecast enters; everything downstream is execution and accounting"
      - "For strip strategies (variance swap replication), benchmark must be K_var not ATM IV -- ATM systematically underestimates what is sold"
    misconceptions:
      - "Log-ratio is always best (wrong -- all three behave similarly; sign is what matters)"
      - "Use same-day IV at close (wrong -- 5-minute gap ensures no execution-time info leaks in)"
    why_it_matters: "This is the precise mechanism by which a lower QLIKE becomes higher P&L -- sharpening both the sign (are we on the right side?) and magnitude (how hard to press?) of the trade."

  # --- B. Where the Gamma Identity Breaks ---

  - id: vanna_delta_leakage
    name: "Vanna: how vol changes make your delta stale"
    layer: 99
    chapter: 18
    requires: [the_greeks, leverage_effect]
    connects_to:
      - { node_id: gamma_identity_limitations, how: "vanna is the first crack in the clean gamma P&L identity" }
    key_points:
      - "Vanna = d2V/(dS*dsigma) = -e^{-q*tau} * N'(d1) * d2/sigma: measures how delta drifts when vol moves"
      - "Leverage effect makes vanna systematic: price down -> vol up -> delta shifts -> 'neutral' hedge becomes directional"
      - "P&L leakage: backtest that ignores vanna misattributes directional drift to forecast error"
      - "Near-ATM vanna is small; but off-ATM or near expiry it can dominate gamma as P&L driver"
    misconceptions:
      - "Vanna is negligible for ATM straddles (wrong -- leverage effect creates systematic bias even near-the-money)"
      - "Vanna is a second-order effect (wrong -- in equities it's FIRST-order because vol/price correlation is persistent)"
    why_it_matters: "Vanna is why a delta-hedged straddle's P&L departs from the clean gamma formula in trending markets -- ignoring it misattributes real friction to model error."

  - id: volga_vol_convexity
    name: "Volga: convexity in volatility and vol-of-vol exposure"
    layer: 99
    chapter: 18
    requires: [the_greeks, vvix_vol_of_vol]
    connects_to:
      - { node_id: gamma_identity_limitations, how: "volga is the second crack -- curvature in sigma itself" }
    key_points:
      - "Volga = d2V/dsigma^2 = Vega * d1*d2/sigma: curvature of option value in volatility ('gamma of vega')"
      - "Positive volga = implicitly long vol-of-vol: gains more from large sigma swings than loses from small"
      - "Wings carry volga: straddle held through vol regime change behaves differently from textbook variance bet"
      - "When realized vol is itself volatile (VVIX high), volga turns linear-in-variance payoff into something curved"
    misconceptions:
      - "Volga only matters for exotics (wrong -- any straddle held through a regime change feels it)"
      - "Volga is symmetric (wrong -- wings contribute asymmetrically as spot drifts from strike)"
    why_it_matters: "Volga is the channel through which a correct level forecast can still produce surprising P&L -- high vol-of-vol environments bend the payoff away from the textbook gamma formula."

  - id: gamma_identity_limitations
    name: "Four cracks in the gamma identity: vanna, volga, jumps, discreteness"
    layer: 99
    chapter: 18
    requires: [gamma_pnl_formula, vanna_delta_leakage, volga_vol_convexity]
    connects_to:
      - { node_id: boyle_emanuel_hedging_error, how: "discreteness (crack 4) is quantified by Boyle-Emanuel" }
      - { node_id: ivrv_backtest_algorithm, how: "backtest must account for all four cracks honestly" }
    key_points:
      - "The gamma P&L identity rests on 4 assumptions: single near-ATM option, continuous diffusion, constant vol, continuous hedging"
      - "Crack 1 (vanna): vol-price correlation creates systematic directional leakage"
      - "Crack 2 (volga): vol-of-vol creates curvature beyond the linear-in-variance payoff"
      - "Crack 3 (jumps): gaps produce O(return^3) error (Carr & Lee 2009); small most days, catastrophic on events"
      - "Crack 4 (discreteness): finite rebalancing leaves tracking error -- the only one we quantify"
      - "A single straddle is NOT a clean variance bet; variance swap (1/K^2 strip) is, but far less liquid"
    misconceptions:
      - "These cracks cancel out on average (wrong -- vanna and jumps can be systematically biased)"
      - "The gamma identity is exact for ATM options (wrong -- still needs continuous hedging and no jumps)"
    why_it_matters: "Understanding where the identity breaks tells you what the backtest ignores -- and whether that gap is large enough to flip the strategy's sign."

  # --- C. Transaction Costs & Leland ---

  - id: leland_modified_volatility
    name: "Leland's hedge-cost formula and its convergence critique"
    layer: 99
    chapter: 18
    requires: [vol_trading_transaction_costs, gamma_pnl_formula]
    connects_to:
      - { node_id: ivrv_backtest_algorithm, how: "Leland-modified vol is used in step 3 (hedge) of the backtest" }
    key_points:
      - "Formula: sigma_hat^2 = sigma^2*(1 + sqrt(2/pi) * k/(sigma*sqrt(dt))); k = round-trip cost, dt = rebalance interval"
      - "sqrt(2/pi) ~ 0.798: E[|u|] for u~N(0,1); converts expected absolute size of hedge trade"
      - "1/sqrt(dt) factor: hedging more often raises the vol adjustment (costs grow with frequency)"
      - "Kabanov-Safarian (1997): Leland does NOT converge if costs held constant as N -> infinity"
      - "Convergence requires costs scaling as k_n = k_0*n^{-1/2} (Lepinette-Kabanov 2010)"
      - "Modern alternatives: Whalley-Wilmott no-transaction band, neural-network hedgers (beat Leland)"
    misconceptions:
      - "Leland is the optimal hedge (wrong -- heuristic baseline; band policies dominate in practice)"
      - "More frequent hedging always reduces error net of cost (wrong -- Leland shows cost grows with frequency)"
    why_it_matters: "Gives the backtest a transparent, deterministic way to charge hedge costs -- but must be understood as a baseline, not the truth."

  # --- D. Discrete Hedging Error ---

  - id: boyle_emanuel_hedging_error
    name: "Boyle-Emanuel: discrete hedging noise scales as 1/sqrt(N)"
    layer: 99
    chapter: 18
    requires: [gamma_pnl_formula, higher_moments]
    connects_to:
      - { node_id: kurtosis_hedging_error_extension, how: "kurtosis extension generalizes the Gaussian variance factor" }
      - { node_id: pnl_attribution_waterfall, how: "hedging error is the zero-mean risk in the waterfall" }
    key_points:
      - "Per-step error: H_i = 0.5*Gamma*S^2*sigma^2*dt*(1 - u_i^2), where u_i ~ N(0,1); mean zero by E[u^2]=1"
      - "Aggregate variance (Gaussian): Var(HE(T)) = (0.5*Gamma*S^2*sigma^2)^2 * T^2 * 2/N. Scales as 1/N"
      - "RMSE shrinks as 1/sqrt(N): hedge 4x more often -> halve the noise (Bertsimas, Kogan, Lo 2000)"
      - "This is ZERO-MEAN: does not bias P&L, but inflates the Sharpe ratio denominator (risk, not drag)"
      - "The shock 1-u^2 is shifted chi-squared (skewed, leptokurtic); only approximately Gaussian after summing many steps"
    misconceptions:
      - "Hedging error reduces expected P&L (wrong -- zero-mean; it widens risk band, not the center)"
      - "The formula works for jumpy underlyings (wrong -- under jumps the error doesn't vanish at 1/sqrt(N) rate)"
    why_it_matters: "This noise is the floor on how cleanly any forecast can be monetized through a discretely hedged straddle -- it doesn't care how good the forecast is."

  - id: realized_kurtosis_calibration
    name: "Calibrating kurtosis from 5-min data for the hedging-error formula"
    layer: 99
    chapter: 18
    requires: [realized_quarticity, rv_construction]
    connects_to:
      - { node_id: kurtosis_hedging_error_extension, how: "provides the kappa input to the extended variance formula" }
    key_points:
      - "Formula: RK_t = n*sum(r_{t,i}^4) / (sum(r_{t,i}^2))^2 -- normalized so Gaussian day scores 3"
      - "More robust to microstructure noise than RV (Amaya et al. 2015): noise-sensitive moment is variance, not 4th-ratio"
      - "Interval-variant (Ahadzie & Jeyasreedharan 2020): RK does NOT converge to daily sample kurtosis"
      - "Per-symbol preferred; varies by beta/size/BM. Universal kappa=4.0 is conservative default"
      - "Stress-test: report deflated Sharpe for kappa in {3, 4, 6}; if conclusion flips, edge is inside noise"
    misconceptions:
      - "kappa=3 is fine because returns are Gaussian at high frequency (wrong -- 5-min returns are fat-tailed, kappa ~ 4-6)"
      - "One kappa fits all (wrong -- varies by name, but universal conservative value defensible as baseline)"
    why_it_matters: "The kurtosis feeds straight into the hedging-error variance and therefore the Sharpe denominator -- getting it wrong inflates or deflates the strategy's apparent significance."

  - id: kurtosis_hedging_error_extension
    name: "Kurtosis-inflated hedging error: our leptokurtic extension and jump floor"
    layer: 99
    chapter: 18
    requires: [boyle_emanuel_hedging_error, realized_kurtosis_calibration]
    connects_to:
      - { node_id: ivrv_backtest_algorithm, how: "provides the risk term attached in step 5 of the backtest" }
    key_points:
      - "For kurtosis kappa: Var(u^2) = kappa-1 (Gaussian kappa=3 gives 2). Substituting: Var(HE) proportional to sigma^4*(kappa-1)/N"
      - "Empirical 5-min kappa ~ 4 -> factor 3 vs Gaussian factor 2: 50% more noise than Gaussian formula predicts"
      - "Provenance: 1/N scaling is Boyle-Emanuel; kappa-1 substitution is OUR leptokurtic extension (not in any cited paper)"
      - "Jump floor (Broden & Tankov 2010): under jumps, lim n*E[epsilon^2] > 0; analytic formula is a LOWER BOUND"
      - "Vega-form shortcut: sigma_PnL = Vega*sigma*sqrt(pi/(4N)); coefficient ambiguity depends on norm choice (L1 vs L2)"
    misconceptions:
      - "Ahmad-Wilmott gave this formula (wrong -- their Result 2 is continuous-hedging variance with no 1/N or kappa)"
      - "The 1/N rate always holds (wrong -- under jumps the rate is slower and a positive floor remains)"
    why_it_matters: "This is the honest risk number for the Sharpe denominator -- using the Gaussian version understates noise by 50% and overstates strategy significance."

  # --- E. P&L Attribution & Backtest Assembly ---

  - id: pnl_attribution_waterfall
    name: "P&L waterfall: costs bite mean, hedging error widens risk"
    layer: 99
    chapter: 18
    requires: [vol_trading_transaction_costs, boyle_emanuel_hedging_error]
    connects_to:
      - { node_id: ivrv_backtest_algorithm, how: "waterfall logic is the bookkeeping heart of the backtest" }
    key_points:
      - "Gross gamma P&L is reduced by two costs: option spread (entry/flip/exit) + hedge cost (per rebalance)"
      - "Costs bite the MEAN (expected P&L drag). Hedging error widens the RISK (denominator of Sharpe)"
      - "Keeping these separate is the #1 bookkeeping distinction in vol-strategy backtests"
      - "In Sharpe: numerator = mean gamma P&L minus cost drag; denominator = std of gamma P&L inflated by hedging noise"
    misconceptions:
      - "Add all costs to the denominator (wrong -- option/hedge costs are deterministic drag on the MEAN)"
      - "Hedging error is another cost (wrong -- it's zero-mean risk, not a drift term)"
    why_it_matters: "Conflating mean drag with risk inflation is the most common error in vol-strategy backtests -- getting this wrong produces either inflated or deflated Sharpe ratios."

  - id: ivrv_backtest_algorithm
    name: "The IV-RV straddle backtest: the 6-step per-(symbol,day) loop"
    layer: 99
    chapter: 18
    requires: [ivrv_signal_construction, leland_modified_volatility, pnl_attribution_waterfall]
    connects_to:
      - { node_id: pooled_vs_persymbol_sharpe, how: "backtest output is the (symbol,day) P&L panel fed to evaluation" }
      - { node_id: statistical_economic_link, how: "the backtest produces the P&L that tests QLIKE-to-money bridge" }
    key_points:
      - "6 steps per (symbol, day): Signal -> Enter -> Hedge -> Mark -> Risk -> Accumulate"
      - "Step 1: signal X_{t-1} from forecast + lagged IV; direction + graded size"
      - "Step 2: charge c_opt = Vega * 0.5*(sigma_ask - sigma_bid) on entry/flip/exit only (event-driven)"
      - "Step 3: delta-hedge N times per day; cost via Leland-modified vol"
      - "Step 4: mark P&L = 0.5*Gamma*S^2*(RV_{t+1} - IV^2/252)"
    misconceptions:
      - "Run the loop daily regardless of signal (wrong -- flat when gap < threshold; avoid churning)"
      - "Charge option cost as a daily fee (wrong -- charge per event: entry, flip, and exit only)"
    why_it_matters: "This is the executable specification of the strategy -- every component from ch18 assembled into a testable loop that turns forecasts into a judged P&L stream."

  # --- F. Evaluation & Deflation ---

  - id: pooled_vs_persymbol_sharpe
    name: "Pooled vs per-symbol Sharpe: cross-sectional dependence and block bootstrap"
    layer: 99
    chapter: 18
    requires: [ivrv_backtest_algorithm, deflated_sharpe]
    connects_to:
      - { node_id: ivrv_validation_experiments, how: "both Sharpe measures are inputs to experiment 4" }
      - { node_id: ivrv_straddle_pipeline, how: "evaluation choice feeds the end-to-end verdict" }
    key_points:
      - "Pooled Sharpe: single SR from all (symbol,day) observations; inflates effective N"
      - "Per-symbol Sharpe: compute per name then average; respects that each name is one bet"
      - "Cross-sectional dependence: on common-vol days, all symbols win/lose together; pooling overstates significance"
      - "Block-bootstrap BY DAY: resample whole days (all symbols together) to preserve cross-sectional correlation"
      - "If pooled >> per-symbol: edge concentrated in a few common-vol days (itself a finding)"
      - "Report BOTH metrics; if they disagree, explain via cross-sectional correlation structure"
    misconceptions:
      - "Pooled is always better because more data (wrong -- ignores cross-sectional dependence; inflates significance)"
      - "Per-symbol is always better (wrong -- discards cross-section information)"
    why_it_matters: "The choice of Sharpe definition can flip the verdict on a strategy -- reporting both with day-block bootstrap is the honest minimum."

  - id: statistical_economic_link
    name: "Does better QLIKE produce better P&L? The open question"
    layer: 99
    chapter: 18
    requires: [ivrv_backtest_algorithm, qlike_loss, diebold_mariano]
    connects_to:
      - { node_id: ivrv_validation_experiments, how: "experiment 3 directly tests this bridge" }
    key_points:
      - "Core question: does DM-significant QLIKE improvement guarantee higher P&L? No published theorem says so"
      - "Pollok (2025): marginal forecast improvements CAN translate to significant straddle P&L (empirical, not theorem)"
      - "Pollok's toolkit is MSE/MAE/QLIKE + Mincer-Zarnowitz R^2; no DM, no MCS. Bridge from DM to P&L is ours to build"
      - "The mechanism is precise: better RV_hat sharpens both SIGN (right side) and MAGNITUDE (sizing) of signal"
    misconceptions:
      - "40 bps QLIKE improvement automatically means money (wrong -- costs and path dependence intervene)"
      - "No QLIKE gain means no P&L gain (wrong -- economic test can separate models the loss function cannot)"
    why_it_matters: "This is the open research question at the heart of our capstone -- proving or disproving this link with statistical rigor IS the contribution."

  - id: ivrv_validation_experiments
    name: "Four experiments to validate the IV-RV straddle on our data"
    layer: 99
    chapter: 18
    requires: [statistical_economic_link, deflated_sharpe]
    connects_to:
      - { node_id: ivrv_straddle_pipeline, how: "experiments provide the pass/fail verdicts for the full pipeline" }
    key_points:
      - "Experiment 1 (hedging-error floor): simulate N=1..26 rebalances, fit Var=a/N+b; if b>0 (jump floor), use simulated variance"
      - "Experiment 2 (cost-band Sharpe): quoted (pessimistic) -> effective (empirical) -> timing-aware (optimistic); survive at least effective"
      - "Experiment 3 (statistical-to-economic regression): P&L on realized gap + forecast error; DM on residual edge"
      - "Experiment 4 (deflated Sharpe): honest N configs tried, block-bootstrap by day, SR must exceed SR_0"
      - "Pass criterion: strategy survives pessimistic cost end; deflated Sharpe clears bar for true N"
    misconceptions:
      - "One experiment suffices (wrong -- each tests a different failure mode; must pass ALL four)"
      - "Surviving gross Sharpe is enough (wrong -- must survive net of costs AND deflation for trial count)"
    why_it_matters: "These are the exact tests that turn ch18 from a design into a result on our data -- each with an explicit pass criterion that cannot be hand-waved."

