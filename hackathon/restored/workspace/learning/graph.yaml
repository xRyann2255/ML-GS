      - "If RQ exists and not all-NaN: + sqrt_rq_d, rq_rv_interaction_d"
      - "If open/close exist and uncorrupted: + overnight_return"
      - "Corruption detection: warns and drops overnight_return if any |r| > 0.5"
    misconceptions:
      - "All columns always present (wrong -- conditional on data availability and quality)"
    why_it_matters: "Know exactly what features are available for downstream models depending on data quality."

  # --- Layer 1 additions ---

  - id: bns_jump_test
    name: "How the BNS test statistically detects jumps from the RV-BPV gap"
    layer: 1
    chapter: 4
    requires: [rv_construction, bpv_jump_robustness, realized_quarticity]
    connects_to:
      - { node_id: jump_component_feature, how: "gates the jump variation feature" }
      - { node_id: lee_mykland_test, how: "daily aggregate vs intraday detection" }
    key_points:
      - "Z = (RV - BPV) / sqrt(vartheta * RTQ / n)"
      - "vartheta = pi^2/4 + pi - 5 ~ 0.6090 (from Var(RV-BPV) under null)"
      - "Under H0 (no jumps): Z -> N(0,1)"
      - "Conservative alpha=0.999 (Z>3.09) to minimize false positives"
      - "WHY RTQ not RQ: RQ contaminated by jumps (4th power amplifies), RTQ jump-robust"
    misconceptions:
      - "Use RQ in the denominator (wrong -- RQ is jump-contaminated)"
      - "Standard 5% threshold is fine (wrong -- false jump flags inject noise into J_t feature)"
    why_it_matters: "Gates the jump_component_feature -- without formal testing, negative estimation noise leaks into the jump series."

  - id: realized_tripower_quarticity
    name: "Why RTQ uses 4/3 powers across three neighbors for jump-robust quarticity"
    layer: 1
    chapter: 4
    requires: [realized_quarticity, bpv_jump_robustness]
    connects_to:
      - { node_id: bns_jump_test, how: "RTQ provides the standard error for BNS" }
    key_points:
      - "Formula: n * mu_{4/3}^{-3} * sum(|r_i|^{4/3} * |r_{i-1}|^{4/3} * |r_{i-2}|^{4/3})"
      - "mu_{4/3} = 2^{2/3} * Gamma(7/6) / Gamma(1/2) -- moment constant for |Z|^{4/3}"
      - "WHY 4/3: powers in [1,2) are jump-robust; 4/3 * 3 = 4 recovers quarticity"
      - "WHY three neighbors: extends BPV neighbor-dampening to 3 consecutive returns"
    misconceptions:
      - "Just use RQ (n/3 sum r^4) everywhere (wrong -- RQ amplifies jumps via 4th power)"
    why_it_matters: "Required for BNS test denominator -- without RTQ, jump test is unreliable on jump-contaminated days."

  - id: lee_mykland_test
    name: "How Lee-Mykland identifies WHICH intraday returns are jumps"
    layer: 1
    chapter: 4
    requires: [bpv_jump_robustness, bns_jump_test]
    connects_to:
      - { node_id: signed_jumps, how: "provides per-return jump flags needed for signed J+/J-" }
    key_points:
      - "L_{t,i} = r_{t,i} / sigma_hat_{t,i} where sigma_hat = sqrt(local BPV over K returns / K)"
      - "Local window K=156 (~2 trading days of context)"
      - "Threshold C_n = sqrt(2 ln n) from Gumbel extreme-value theory"
      - "WHY Gumbel: distribution of max of n normals -- proper multiple-testing correction"
      - "WHY local BPV: vol changes within the day, whole-day estimate misses intraday regimes"
      - "Outputs: per-return binary flag, r^2 (size), sign (direction)"
      - "vs BNS: BNS=daily binary, LM=intraday timing+sizes"
    misconceptions:
      - "Just flag returns >3sigma (wrong -- need multiple-testing correction for 78 returns/day)"
      - "BNS and Lee-Mykland are interchangeable (wrong -- BNS=daily aggregate, LM=individual return level)"
    why_it_matters: "Required for signed jump variation -- BNS can only say 'a jump happened today' but not which return or what direction."

  - id: realized_skewness_kurtosis
    name: "Why intraday higher moments predict future volatility"
    layer: 1
    chapter: 4
    requires: [rv_construction, realized_quarticity]
    connects_to:
      - { node_id: semivariances, how: "both capture distributional asymmetry" }
      - { node_id: harq_feature, how: "RKurt related to but distinct from RQ" }
    key_points:
      - "RSkew = sqrt(N) * (1/N)sum(r^3) / ((1/N)sum(r^2))^{3/2}"
      - "RKurt = N * (1/N)sum(r^4) / ((1/N)sum(r^2))^2"
      - "WHY sqrt(N) for skewness: makes it scale-invariant to sampling frequency"
      - "Negative skewness = leftward asymmetry = crash likelihood -> elevated future vol"
      - "High kurtosis = tail risk -> elevated future vol"
      - "RKurt vs RQ: RKurt is NORMALIZED (ratio), RQ is UNnormalized (estimates integral sigma^4)"
    misconceptions:
      - "Realized kurtosis is the same as RQ (wrong -- RKurt is normalized by RV^2, RQ is not)"
    why_it_matters: "Provides distributional information beyond variance level -- negative skew and excess kurtosis signal regime shifts."

  - id: lasso_har
    name: "How Lasso-HAR bridges HAR to machine learning via automatic feature selection"
    layer: 1
    chapter: 6
    requires: [har_model, har_hard_to_beat]
    connects_to:
      - { node_id: harq_model, how: "both extend HAR; Lasso adds features, HARQ adds noise awareness" }
      - { node_id: shar_model, how: "Lasso can discover asymmetry automatically" }
    key_points:
      - "HAR-X: RV_{t+1} = HAR terms + sum(gamma_j * X_{j,t}) -- extend with extra features"
      - "Common X_j: VIX, VIX innovation, signed return, overnight, volume"
      - "Lasso penalty: min sum(y-y_hat)^2 + lambda*sum|gamma_j| -- L1 sets weak predictors exactly to zero"
      - "Automatic variable selection while keeping core HAR features intact"
      - "Bridge to ML: if Lasso-HAR beats HAR, extra features carry signal; ML tests nonlinear interactions"
    misconceptions:
      - "Need complex models for feature selection (wrong -- Lasso does it automatically)"
      - "HAR features are sufficient (wrong -- Lasso-HAR often improves by adding VIX, signed return)"
    why_it_matters: "The simplest test of whether extra features carry signal before committing to full ML complexity."

  - id: noise_gap_feature
    name: "Why the gap between noise-robust and standard RV proxies for liquidity"
    layer: 1
    chapter: 5
    requires: [noise_robust_estimators, rv_construction]
    connects_to:
      - { node_id: harq_feature, how: "both are data-quality signals for trees" }
      - { node_id: microstructure_noise_concept, how: "directly measures noise intensity" }
    key_points:
      - "Formula: (RK - RV_5min) / RV_5min"
      - "WHY as feature: measures microstructure noise intensity"
      - "High noise_gap = illiquid stock/day = higher future vol risk"
      - "Currently 100% NaN in dataset (requires RK computation from tick data)"
    misconceptions:
      - "Noise-robust estimators always improve forecasts (wrong -- they improve estimation but Liu 2015 shows forecasting gains minimal)"
    why_it_matters: "A direct liquidity/noise proxy that tree models can split on -- once populated, may improve forecasts on illiquid symbols."

  - id: asymmetry_layer_outputs
    name: "What AsymmetryLayer.compute() produces"
    layer: 1
    chapter: 6
    requires: [semivariances, bpv_jump_robustness, jump_component_feature]
    connects_to:
      - { node_id: feature_alignment, how: "output columns feed into alignment pipeline" }
    key_points:
      - "log_rs_positive_d/w/m, log_rs_negative_d/w/m (6 semivariance features)"
      - "log_bpv_d/w (bipower at 2 horizons)"
      - "log_jump_d (jump variation daily only)"
      - "log_cont_d/w (continuous variation at 2 horizons)"
      - "signed_return_d (daily log return as leverage proxy)"
