    why_it_matters: "The capstone application: a real, traded product whose drawdowns we predict. Everything in the guide leads here."

  - id: gsvivs_0dte_replication_mechanics
    name: "0DTE quantity rule: q_i = w*DeltaK/K^2 and the constant-exposure fingerprint"
    layer: 99
    chapter: 19
    requires: [inverse_square_weighting_proof, vix_construction]
    connects_to:
      - { node_id: gsvivs_delta_hedge_index_construction, how: "strip quantities determine residual delta to hedge" }
      - { node_id: short_variance_theta_gamma_profile, how: "the strip's aggregate Greeks define the risk shape" }
    key_points:
      - "Per-strike quantity: q_i = w * DeltaK_i / K_i^2, where w = variance notional (single scaling constant)"
      - "Verification: |q_i| * K_i^2 ≈ constant for all interior strikes (flat plateau = constant variance exposure)"
      - "Edge strikes (lowest/highest K) carry HALF weight because DeltaK is single-sided at endpoints"
      - "Forward strike K=F is split between a put and a call, each with half-quantity"
      - "Real example (2022-05-26): 14 puts K=3875-4000, 11 calls K=4000-4095, spacing 10pts, |q|*K^2 ≈ 86,700"
      - "Net option quantity sums to zero (each short matched by an expiry-close long) -- flat by EOD"
      - "Compare straddle: single peak at ATM vs strip: flat plateau everywhere. The plateau IS the clean variance bet"
    misconceptions:
      - "Equal contracts at each strike replicates variance (wrong -- must weight by 1/K^2)"
      - "The half-weight edges are a bug (wrong -- they're correct DeltaK endpoint handling per CBOE formula)"
    why_it_matters: "Turns the theoretical 1/K^2 integral into an executable order schedule. The flat |q|*K^2 plateau is the visual proof that this IS a variance bet."

  - id: gsvivs_delta_hedge_index_construction
    name: "ES futures TWAP hedging and daily index compounding"
    layer: 99
    chapter: 19
    requires: [delta_hedged_straddle, gamma_pnl_formula, gsvivs_0dte_replication_mechanics]
    connects_to:
      - { node_id: short_variance_theta_gamma_profile, how: "delta-neutral position isolates gamma/theta shape" }
      - { node_id: gsvivs_overlay_evaluation_framework, how: "index path is the object the overlay improves" }
    key_points:
      - "Residual strip delta neutralized by ~25 ES futures TWAP trades per day in 5-minute intervals"
      - "Daily P&L = sum(q_i * premium_i) - sum(Delta_j * (S_close - S_exec_j)) - transaction costs"
      - "Index compounds daily increments from base 100; divisor method keeps index continuous across rebalances"
      - "The hedge is NOT free: discrete 5-min TWAP introduces slippage and hedging error noise"
      - "Real example: first week drips +27, +10, -2 bps, then -28 bps crash on June 1 -- the short-variance signature"
    misconceptions:
      - "Strip P&L = option premium collected (wrong -- must subtract hedge slippage and costs)"
      - "The index is just cumulative P&L (wrong -- divisor method handles notional changes correctly)"
    why_it_matters: "Defines the TRADABLE P&L object that Act 2 overlays. The index path with its drip-and-crash shape is what the forecast must predict."

  - id: short_variance_theta_gamma_profile
    name: "Short gamma, short vega, long theta: the carry vs crash balance"
    layer: 99
    chapter: 19
    requires: [the_greeks, gamma_pnl_formula, gsvivs_delta_hedge_index_construction]
    connects_to:
      - { node_id: down_jump_cubic_loss_asymmetry, how: "the gamma risk on jump days has additional asymmetry" }
      - { node_id: gsvivs_vrp_gap_signal, how: "understanding when theta-carry is at risk motivates the signal" }
    key_points:
      - "Black-Scholes balance: theta + 0.5*sigma^2*S^2*Gamma = 0 -- theta and gamma are two sides of one coin"
      - "Short gamma means delta worsens as underlying moves; large moves in EITHER direction cost money"
      - "Long theta means time decay earns income each calm day -- this IS the variance risk premium"
      - "The balance equation says: positive theta collected on calm days = negative gamma paid on big-move days ON AVERAGE"
      - "Strategy makes money when RV undershoots IV baked into theta; loses when RV overshoots"
      - "Pattern: many small gains (theta drip) punctuated by occasional large losses (gamma crash) -- the canonical short-vol shape"
      - "'Picking up pennies in front of a steamroller' -- Act 2's job is to see the steamroller coming"
    misconceptions:
      - "Theta income is free carry independent of gamma risk (wrong -- they're linked by the BS balance equation)"
      - "Short vega is the main risk (wrong -- at 0DTE, gamma dominates because vega is tiny with so little time left)"
    why_it_matters: "Explains WHY the index has the drip-and-crash shape, and precisely which days are dangerous (the gamma-overshoot days the forecast must flag)."

  - id: down_jump_cubic_loss_asymmetry
    name: "Down-jump cubic term: crashes cost more than rallies of equal size"
    layer: 99
    chapter: 19
    requires: [gamma_identity_limitations, jumps_vs_diffusion, short_variance_theta_gamma_profile]
    connects_to:
      - { node_id: drawdown_cost_sensitive_classification, how: "asymmetric losses motivate asymmetric error costs in the classifier" }
      - { node_id: gsvivs_vrp_gap_signal, how: "suggests signal should condition on jump share and downside features" }
    key_points:
      - "Jump loss expansion for the short: loss = J^2/T + (2/3)*J^3/T + ... where J>0 = down-gap"
      - "J^2/T = direction-blind variance contribution (same for up and down moves of equal size)"
      - "(2/3)*J^3/T = cubic asymmetry: POSITIVE for down-jumps (adds to loss), NEGATIVE for up-moves"
      - "A 15% down-gap costs materially MORE than a 15% up-gap of equal magnitude"
      - "Source: DDKZ (1999, Eq. 42, Table 5, p.31); Carr & Lee (2009) confirm in peer-reviewed form"
      - "Sign convention: DDKZ present for hedged book (profit on down-gap); for short strip (GSVIVS01) it's a loss"
      - "Implies drawdown prediction benefits from SIGNED jump features (negative third moment) not just variance level"
    misconceptions:
      - "Variance losses are symmetric in move direction (wrong -- cubic term tilts losses to downside)"
      - "The cubic correction is negligible (wrong -- for a 10% gap, cubic adds 30% to the symmetric loss)"
    why_it_matters: "Explains why GSVIVS01's WORST days are always crashes (not melt-ups) and motivates jump/leverage-aware features in the classifier."

  - id: gsvivs_vrp_gap_signal
    name: "Strike-based VRP gap: the drawdown timing signal"
    layer: 99
    chapter: 19
    requires: [variance_strike_skew_premium, ivrv_signal_construction, gsvivs01_strategy_overview]
    connects_to:
      - { node_id: drawdown_cost_sensitive_classification, how: "gap sign feeds the binary classification target" }
      - { node_id: gsvivs_overlay_position_sizing, how: "gap magnitude drives position sizing" }
    key_points:
      - "VRP Gap_t = (K_var/100)^2 - 252*RV_hat_t in matched annualized variance units"
      - "K_var is OBSERVABLE at trade time (from EDRVS_EXPIRY or CBOE formula); only RV_hat is forecast"
      - "Three channels: COMPRESSION (gap->0, edge thinning), INVERSION (gap<0, strong warning), CONTRARIAN (sudden gap spike after event)"
      - "Threshold: Signal=+1 if gap>tau, Signal=-1 if gap<-tau_short, Signal=0 otherwise"
      - "MUST use K_var (variance swap strike), NOT ATM IV -- ATM understates by 1-3 vol pts (skew premium)"
      - "Operational: iv_vs_0dte from EDRVS_EXPIRY dataset (sqrt(fairVariance) in vol%); fallback reconstructs from strike grid"
      - "Trial-042 result: threshold=0 is optimal; VRP gap is positive 97.9% of days (2022-2024)"
    misconceptions:
      - "ATM 0DTE IV is adequate for the signal benchmark (wrong -- systematic understatement of collected premium)"
      - "A persistently positive gap means the signal is useless (wrong -- the 2.1% of negative-gap days have 70% precision)"
    why_it_matters: "This is THE conditioning variable that turns unconditional short-vol (tail-dominated) into conditional timing that delivers risk-adjusted returns."

  - id: drawdown_cost_sensitive_classification
    name: "Imbalanced classification: asymmetric costs of prediction errors"
    layer: 99
    chapter: 19
    requires: [gsvivs_vrp_gap_signal, semivariances, down_jump_cubic_loss_asymmetry]
    connects_to:
      - { node_id: gsvivs_overlay_position_sizing, how: "classification verdict becomes position" }
      - { node_id: gsvivs_overlay_evaluation_framework, how: "precision/recall on worst days is evaluation metric" }
    key_points:
      - "Class imbalance is severe: safe days = 85-88%, drawdown days = 12-15%. Accuracy is meaningless"
      - "False negative (missed drawdown) costs 50-200 bps; false positive (needless flat) costs few bps"
      - "Cost ratio: FN can be 20x-100x more expensive than FP -- threshold must respect this asymmetry"
      - "Correct metrics: precision (of flagged days, how many were real), recall (of real drawdowns, how many caught)"
      - "Coverage target: catch the 5-10 worst drawdowns per year while remaining invested 85%+ of days"
      - "Model that says 'safe' every day is 88% accurate but WORTHLESS -- never fires the signal"
      - "Features should emphasize Layer 1 (jumps, semivariance, leverage) given down-jump mechanism"
    misconceptions:
      - "High accuracy implies useful classifier (wrong -- trivial 'always safe' gets ~88%)"
      - "Balanced precision/recall is the target (wrong -- asymmetric costs demand high recall on worst days)"
    why_it_matters: "Encodes the ECONOMICS of the strategy directly into the model objective -- the 50-200 bps cost of missing a drawdown vs few bps cost of an unnecessary flat day."

  - id: gsvivs_overlay_position_sizing
    name: "Overlay sizing: from signal to position via +1/0/-1 and graded notional"
    layer: 99
    chapter: 19
    requires: [drawdown_cost_sensitive_classification, gsvivs_vrp_gap_signal]
    connects_to:
      - { node_id: gsvivs_overlay_evaluation_framework, how: "position determines the overlaid index path that evaluation judges" }
    key_points:
      - "Position_t = Signal_t * Base_Notional. +1 = full carry, 0 = flat (sidestep), -1 = counter-trade"
      - "Buy-and-hold GSVIVS01 is the special case Signal ≡ +1; overlay modulates this baseline"
      - "Graded sizing (scale with gap magnitude) beats hard binary on/off switch (Li & Wu 2026)"
      - "-1 short reserved for highest-conviction drawdown signals only (costs convexity premium to hold)"
      - "The +24 bps Sharpe improvement over always-long comes from correctly going short on 2.1% of days (trial-042)"
      - "Position = max(min(gap/tau, 1), -1) for continuous sizing; or discrete {+1, 0, -1}"
    misconceptions:
      - "Binary on/off is robustly optimal (wrong -- Li & Wu 2026 show graded sizing beats it)"
      - "The -1 short is symmetric to +1 long (wrong -- shorting a short-vol index means BUYING convexity at a cost)"
    why_it_matters: "Converts the probabilistic prediction into an executable risk allocation -- the bridge between 'what does the model think?' and 'what do we do about it?'"

  - id: gsvivs_overlay_evaluation_framework
    name: "Overlay evaluation: deflated Sharpe, drawdown control, coverage"
    layer: 99
    chapter: 19
    requires: [deflated_sharpe, ivrv_straddle_pipeline, purged_kfold_cv, gsvivs_overlay_position_sizing]
    connects_to: []
    key_points:
      - "Three axes: risk-adjusted return (deflated Sharpe), drawdown control (max DD reduction, Calmar), coverage (% days invested)"
      - "Deflated Sharpe discounts for number of strategy variants tried -- honest multiple-testing correction"
      - "Coverage target: remain invested on 85-88% of safe days while sidestepping the 5-10 worst per year"
      - "Yang (2024) benchmark: conditional short-vol overlay raised Sharpe 1.54->1.76, cut max DD. Target to match/beat"
      - "Three traps: costs (overlay trading friction), multiple testing (deflation for all variants), small samples (few drawdowns, wide CIs)"
      - "The link from QLIKE to P&L is NOT a theorem -- it's the central experiment to validate on our data"
      - "Vilkov (2024): unconditional 0DTE short is tail-dominated; CONDITIONAL timing is what delivers performance"
      - "Evaluate under purged/combinatorial CV; report wide error bars given few tail events"
    misconceptions:
      - "QLIKE improvement alone validates the strategy (wrong -- must survive costs, deflation, small samples)"
      - "Yang (2024) numbers transfer directly to 0DTE (wrong -- different instrument, horizon, and friction profile)"
    why_it_matters: "The ultimate judge: did the forecast actually make money after all honest adjustments? This is where the project either succeeds or fails."
