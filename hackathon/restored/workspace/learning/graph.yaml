  # ============================================================
  # CHAPTER 19: GSVIVS01 — Variance Swap Replication & Drawdown Prediction
  # ============================================================

  # --- A. Derivation / Theory (Layer 2) ---

  - id: log_contract_variance_identity
    name: "Realized variance as rebalanced stock minus log contract (Ito identity)"
    layer: 2
    chapter: 19
    requires: [price_process, rv_construction, variance_vs_volatility]
    connects_to:
      - { node_id: carr_madan_log_contract_spanning, how: "the log contract in this identity is then decomposed into traded options" }
    key_points:
      - "Ito's lemma on log(S_t) gives pathwise identity: V = (2/T)[integral(dS/S) - log(S_T/S_0)]"
      - "Left side is realized variance; right side is rebalanced-stock profit minus log-contract payoff"
      - "This is an IDENTITY (pathwise, no expectations taken), not a statistical estimate"
      - "Requires continuous price path (no jumps). Under jumps, a cubic correction term appears"
      - "The identity makes variance tradable: manufacture RV from two tradable pieces"
    misconceptions:
      - "This is an expected-value statement (wrong -- it holds path-by-path under no-jump assumption)"
      - "You need a vol model to derive this (wrong -- it's pure Ito calculus, model-free)"
    why_it_matters: "The foundational step in the DDKZ (1999) derivation that makes variance swaps possible -- without it, realized variance would be an abstract statistic, not a tradable quantity."

  - id: carr_madan_log_contract_spanning
    name: "Log contract decomposition into forward + 1/K^2 OTM option strip"
    layer: 2
    chapter: 19
    requires: [option_contracts_payoffs, model_free_implied_variance, log_contract_variance_identity]
    connects_to:
      - { node_id: inverse_square_weighting_proof, how: "why the 1/K^2 kernel is uniquely forced" }
      - { node_id: variance_swaps, how: "makes variance swap replication operational" }
    key_points:
      - "-log(S_T/S*) = forward piece + integral_0^{S*} (1/K^2)*Put(K) dK + integral_{S*}^inf (1/K^2)*Call(K) dK"
      - "The log contract (not traded) is decomposed into a forward (traded) + basket of all OTM options"
      - "Each option slice is weighted by 1/K^2 -- this is forced by the math, not a design choice"
      - "S* is the boundary splitting puts from calls, in practice the forward F"
      - "Taking risk-neutral expectation gives the closed-form strike: K_var^2 = (2e^rT/T)[int P/K^2 + int C/K^2]"
    misconceptions:
      - "The 1/K^2 weighting is an empirical approximation (wrong -- it's an exact mathematical decomposition)"
      - "You need a stochastic vol model to price the variance swap (wrong -- the strip prices are sufficient)"
    why_it_matters: "Bridges the abstract log contract to traded options, making 'model-free' replication operational. This is the Carr-Madan (2002) spanning result specialized to the log payoff."

  - id: inverse_square_weighting_proof
    name: "Why 1/K^2 is uniquely required for constant variance exposure"
    layer: 2
    chapter: 19
    requires: [carr_madan_log_contract_spanning, variance_swaps]
    connects_to:
      - { node_id: gsvivs_0dte_replication_mechanics, how: "the theoretical weight becomes the practical quantity rule" }
      - { node_id: variance_strike_skew_premium, how: "1/K^2 loads on OTM puts where skew lives, pushing K_var above ATM" }
    key_points:
      - "Demand spot-invariant variance exposure: d(vega)/dS = 0 gives ODE 2*rho + K*d(rho)/dK = 0"
      - "Unique solution: rho(K) = constant/K^2. Any other weighting creates spot-dependent variance drift"
      - "Consequence: the strip's sensitivity to variance is the SAME regardless of where spot moves"
      - "This is what makes it a 'clean' variance instrument vs a straddle whose exposure peaks at one strike"
      - "Demeterfi, Derman, Kamal and Zou (1999, Appendix A, Eq. A3, p.38)"
    misconceptions:
      - "1/K^2 is a heuristic or rule of thumb (wrong -- it's the unique solution to an ODE)"
      - "Equal-dollar options at each strike replicate variance (wrong -- that gives spot-dependent exposure)"
    why_it_matters: "The mathematical reason GSVIVS01 is a clean variance bet while a single straddle is not. Without 1/K^2, the strip's variance exposure would drift as the market moves."

  - id: variance_strike_skew_premium
    name: "Why variance-swap strike exceeds ATM IV: the skew premium"
    layer: 2
    chapter: 19
    requires: [vol_skew_and_smile, variance_swaps, inverse_square_weighting_proof]
    connects_to:
      - { node_id: gsvivs_vrp_gap_signal, how: "signal must benchmark against K_var, not ATM IV, because of this premium" }
      - { node_id: ivrv_signal_construction, how: "for strip strategies, the signal benchmark is K_var not sigma_ATM" }
    key_points:
      - "1/K^2 weighting puts disproportionate weight on low-strike OTM puts where skew makes IV highest"
      - "Approximate formula: K_var^2 ≈ sigma_0^2 * (1 + 3*T*b^2 + ...) where b = skew slope"
      - "The excess grows with maturity T and with the SQUARE of the skew -- flatter skew = smaller gap"
      - "Empirical gap for SPX: 1-3 vol points above ATM. Ordering: RV < vol-swap < ATM < var-swap strike"
      - "Carr and Wu (2009) confirm: realized variance < volatility swap rate < variance swap strike"
      - "Using ATM IV as benchmark systematically UNDERSTATES what the strip sells, compressing the VRP signal"
    misconceptions:
      - "ATM IV is a good proxy for what a variance strip sells (wrong -- understates by the skew premium)"
      - "The gap is constant (wrong -- varies with skew steepness and maturity)"
    why_it_matters: "The single most important correction for the drawdown signal: benchmarking against ATM IV instead of K_var mistimes exits by compressing the apparent premium."

  - id: corridor_variance_swap_bias
    name: "Discrete-strip truncation and corridor bias at 0DTE"
    layer: 2
    chapter: 19
    requires: [vix_construction, model_free_implied_variance, jumps_vs_diffusion]
    connects_to:
      - { node_id: gsvivs_0dte_replication_mechanics, how: "real strip is a corridor swap, not full-range" }
      - { node_id: down_jump_cubic_loss_asymmetry, how: "corridor + jumps together explain strike-realization mismatch" }
    key_points:
      - "Finite strike range turns full variance swap into 'corridor' approximation that underprices variance"
      - "DDKZ Table 4: 75%-125% corridor recovers (24.9)^2 vs true (25.0)^2 for 3-month; tighter corridors lose more"
      - "GSVIVS01 strip spans only ~±2.7% of spot -- significant corridor approximation"
      - "The CBOE discrete sum prices CONTINUOUS variance; 0DTE realizations are jump-heavy (Du & Kapadia 2012)"
      - "Strike is a smooth-path object sold against jump-prone realization -- structural mismatch"
      - "Bias is one-sided: corridor always UNDERPRICES true variance, never overprices"
    misconceptions:
      - "The discrete CBOE sum is an unbiased estimator of full variance in all regimes (wrong -- truncation bias)"
      - "Corridor bias is negligible for short maturities (wrong -- narrow range at 0DTE makes it material)"
    why_it_matters: "Explains why GSVIVS01 can lose MORE than the booked strike anticipated on jump days -- the strike was computed for a smooth path, but reality jumped."

  # --- B. Application / Evaluation (Layer 99) ---

  - id: gsvivs01_strategy_overview
    name: "GSVIVS01: daily variance-swap replication via 0DTE SPX options"
    layer: 99
