  # --- Layer 0 additions ---

  - id: simple_returns
    name: "What simple returns are and why they're insufficient for aggregation"
    layer: 0
    chapter: 1
    requires: [logarithm_properties]
    connects_to:
      - { node_id: log_returns, how: "log returns fix the aggregation problem" }
    key_points:
      - "Formula: R_t = (P_t - P_{t-1}) / P_{t-1}"
      - "Dimensionless fractions for cross-asset comparison"
      - "Don't add over time: (1+R1)(1+R2)-1 != R1+R2"
      - "Needed as contrast to motivate log returns"
    misconceptions:
      - "Simple returns are fine for multi-day aggregation (wrong -- they multiply, not add)"
    why_it_matters: "Understanding the limitation of simple returns motivates why the entire RV literature uses log returns."

  - id: conditional_variance
    name: "Why we forecast time-varying (conditional) variance, not a single constant"
    layer: 0
    chapter: 1
    requires: [variance_as_spread, vol_clustering]
    connects_to:
      - { node_id: integrated_variance, how: "conditional variance is what IV measures within a day" }
      - { node_id: har_model, how: "HAR forecasts conditional variance" }
    key_points:
      - "Unconditional sigma^2 = long-run average, single constant"
      - "Conditional sigma_t^2 = Var(r_t | F_{t-1}), time-varying, what we forecast"
      - "F_{t-1} = filtration, everything observable through yesterday"
      - "Weather analogy: unconditional = annual avg rainfall, conditional = tomorrow's forecast"
      - "Law of total variance links them: sigma^2 = E[sigma_t^2] + Var(E[r_t|F])"
    misconceptions:
      - "Volatility is a fixed property of an asset (wrong -- it changes daily)"
      - "We predict THE volatility (wrong -- we predict tomorrow's CONDITIONAL variance)"
    why_it_matters: "The entire forecasting enterprise -- HAR, HARQ, LightGBM -- is about predicting sigma_t^2, not sigma^2. Without this distinction, the project motivation is unclear."

  - id: price_process
    name: "The continuous-time price process that generates returns"
    layer: 0
    chapter: 2
    requires: [log_returns]
    connects_to:
      - { node_id: integrated_variance, how: "IV is the integral of sigma_t^2 from this process" }
      - { node_id: rv_construction, how: "RV estimates QV of this process" }
      - { node_id: jumps_vs_diffusion, how: "adding jump component to this process" }
    key_points:
      - "dp_t = mu_t dt + sigma_t dW_t (Ito diffusion, no jumps)"
      - "mu_t dt = predictable drift, negligible at intraday frequency"
      - "sigma_t dW_t = random shock of magnitude sigma_t -- the volatility part"
      - "Each intraday return: r_{t,i} approx sigma_{t,i} * epsilon_i where epsilon~N(0,1)"
      - "With jumps: dp_t = mu dt + sigma dW + J dN (Poisson jump component)"
    misconceptions:
      - "Returns are directly Normal (wrong -- they're Normal CONDITIONAL on local sigma)"
      - "Drift matters for intraday (wrong -- mu*dt is negligible vs sigma*sqrt(dt))"
    why_it_matters: "This is the data-generating model underlying RV convergence, BPV, and jump tests. Without it, the r^2 approx sigma^2*epsilon^2 step is unmotivated."

  - id: variance_vs_volatility
    name: "Why confusing variance and volatility causes factor-of-100 errors"
    layer: 0
    chapter: 2
    requires: [variance_as_spread, rv_construction]
    connects_to:
      - { node_id: log_rv_transform, how: "log transform applied to variance, not vol" }
      - { node_id: annualizing_vol, how: "different annualization for var vs vol" }
    key_points:
      - "RV = realized VARIANCE (sum r^2, units of return^2)"
      - "Realized volatility = sqrt(RV) (units of return)"
      - "Typical daily SPX RV ~ 1e-4, typical daily vol ~ 0.01 (1%)"
      - "Confusing them = factor-of-100 error daily, factor-of-10 annualized"
    misconceptions:
      - "RV and realized vol are the same thing (wrong -- they differ by sqrt)"
      - "Annualized RV = RV * 252 then take sqrt (correct order: sqrt(RV*252))"
    why_it_matters: "Dimensional analysis errors silently corrupt QLIKE, position sizing, and VaR -- and are hard to catch because code still runs."

  - id: overnight_return
    name: "Why the overnight return captures information missing from intraday RV"
    layer: 0
    chapter: 3
    requires: [rv_construction]
    connects_to:
      - { node_id: har_model, how: "additional predictor beyond RV d/w/m" }
    key_points:
      - "Formula: ln(open_t / close_{t-1})"
      - "17.5 hours of information arrival not in intraday RV"
      - "Captures earnings, FOMC, geopolitical events"
      - "Not double-counting: RV measures within-day only"
      - "Data quality issue: corrupted if open unadjusted but close split-adjusted"
    misconceptions:
      - "Overnight is already in RV (wrong -- RV only sums intraday returns)"
      - "Large overnight = always use it (wrong -- data corruption makes it unreliable for some symbols)"
    why_it_matters: "After-hours information (especially earnings surprises) drives next-day vol but is invisible to pure intraday RV."

  - id: feature_alignment
    name: "Why feature-target alignment prevents lookahead bias in vol forecasting"
    layer: 0
    chapter: 3
    requires: [rv_construction, har_model]
    connects_to:
      - { node_id: harq_model, how: "same alignment applies to all HAR variants" }
      - { node_id: purged_kfold_cv, how: "CV must respect the same time boundaries" }
    key_points:
      - "Features computed as-of end-of-day t (available after market close)"
      - "Target: RV_{t+h} at horizons h=1, 5, 22"
      - "Shift applied at TRAINING time by pipeline, NOT in layer code"
      - "First 21 rows = NaN due to 22-day rolling window requirement"
      - "Violating alignment = lookahead bias = inflated backtest results"
    misconceptions:
      - "Shift features in the layer code (wrong -- double-shifting corrupts alignment)"
      - "Use all rows including initial NaN period (wrong -- first 21 have incomplete history)"
    why_it_matters: "Lookahead bias is the #1 cause of unreproducible ML results in finance -- this pattern prevents it at the architecture level."

  - id: har_core_layer_outputs
    name: "What HARCoreLayer.compute() produces and under what conditions"
    layer: 0
    chapter: 6
    requires: [har_model, realized_quarticity]
    connects_to:
