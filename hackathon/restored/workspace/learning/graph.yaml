# Vol Learning Framework — Dependency Graph
# Source of truth: workspace/docs/vol-learning-framework-design.md Section 7
# Schema: Section 1 of design spec

nodes:
  # ============================================================
  # LAYER -1: Math & Stats Foundations
  # ============================================================

  # --- A. Algebra & Functions ---

  - id: logarithm_properties
    name: "Logarithms and exponentials: the language of multiplicative processes"
    layer: -1
    chapter: 1
    requires: []
    connects_to:
      - { node_id: log_returns, how: "log returns use these properties directly" }
      - { node_id: lognormal_distribution, how: "log-normal arises from exp of normal" }
    key_points:
      - "ln is the inverse of exp: ln(e^x) = x, e^{ln x} = x"
      - "Product rule: ln(AB) = ln(A) + ln(B) -- turns multiplication into addition"
      - "Quotient rule: ln(A/B) = ln(A) - ln(B) -- turns division into subtraction"
      - "Taylor approximation: ln(1+x) ≈ x for small x (why log and simple returns are close)"
      - "Shape: ln(x) is concave, grows slowly, compresses large values"
      - "exp(x) is convex, grows explosively -- exp(a+b) = exp(a)*exp(b)"
    misconceptions:
      - "ln and log10 are the same (in finance/math, 'log' almost always means natural log ln)"
      - "ln(A+B) = ln(A) + ln(B) (WRONG -- that's the product rule, not the sum rule)"
    why_it_matters: "Every formula in this project uses ln. If you can't manipulate logs fluently, you'll be stuck on page 1."

  - id: summation_notation
    name: "Sigma notation: reading and writing sums compactly"
    layer: -1
    chapter: 1
    requires: []
    connects_to:
      - { node_id: expected_value, how: "E[X] is defined as a weighted sum" }
    key_points:
      - "Σ_{i=1}^{n} x_i means x_1 + x_2 + ... + x_n"
      - "Index variable (i), lower bound, upper bound -- three parts to read"
      - "Constants pull out: Σ c*x_i = c * Σ x_i"
      - "Splitting sums: Σ(a_i + b_i) = Σa_i + Σb_i"
      - "Σ_{i=1}^{n} c = n*c (summing a constant n times)"
      - "Double sums: Σ_i Σ_j means iterate over all (i,j) pairs"
    misconceptions:
      - "The index variable matters (it's a dummy -- Σ_i x_i = Σ_j x_j)"
      - "You must always start at i=1 (any starting index is valid)"
    why_it_matters: "RV = Σ r²_i, BPV = Σ|r_i||r_{i-1}|, sample mean = (1/n)Σx_i. You'll read Σ hundreds of times."

  - id: indicator_functions
    name: "Indicator functions: filtering with 0s and 1s"
    layer: -1
    chapter: 4
    requires: []
    connects_to:
      - { node_id: semivariances, how: "RS+ sums r² only where r>0 using I(r>0)" }
      - { node_id: jump_component_feature, how: "jump variation uses I(jump detected)" }
    key_points:
      - "I(condition) = 1 if condition is true, 0 otherwise"
      - "Multiplying by I(A) keeps the term only when A holds: x*I(x>0) = x if positive, else 0"
      - "Summing indicators counts events: Σ I(r_i > threshold) = number of exceedances"
      - "Enables 'conditional sums' without if-statements in formulas"
      - "Equivalent to filtering/masking in code: df[df['r'] > 0]"
    misconceptions:
      - "Indicator functions are just for theory (they map directly to boolean masks in pandas/numpy)"
    why_it_matters: "Semivariances, signed jumps, and jump detection all use indicator functions to partition returns."

  # --- B. Probability & Distributions ---

  - id: random_variables
    name: "Random variables: mapping uncertainty to numbers"
    layer: -1
    chapter: 1
    requires: []
    connects_to:
      - { node_id: pdf_and_cdf, how: "a distribution describes how likely each value is" }
    key_points:
      - "A random variable X assigns a number to each possible outcome"
      - "Discrete: countable values (coin flip: 0 or 1). Continuous: any value in a range"
      - "X ~ Distribution notation means 'X follows this distribution'"
      - "Realization vs. random variable: x is the observed value, X is the uncertain quantity"
      - "i.i.d. = independent and identically distributed (same distribution, no influence on each other)"
      - "A sample {x_1, ..., x_n} is n realizations of the same random variable"
    misconceptions:
      - "A random variable is a number (it's a function from outcomes to numbers -- the number is a realization)"
      - "Random means unpredictable (it means we model it probabilistically; patterns like vol clustering are still 'random')"
    why_it_matters: "Returns, volatility, and noise are all modeled as random variables. This is the foundational abstraction."

  - id: pdf_and_cdf
    name: "PDFs and CDFs: two ways to describe a distribution"
    layer: -1
    chapter: 1
    requires: [random_variables]
    connects_to:
      - { node_id: normal_distribution, how: "the normal PDF is the bell curve formula" }
      - { node_id: expected_value, how: "E[X] = integral of x*f(x)" }
    key_points:
      - "PDF f(x): probability density -- height shows relative likelihood, NOT probability itself"
      - "Area under PDF between a and b = P(a ≤ X ≤ b); total area = 1"
      - "P(X = exact value) = 0 for continuous variables (need intervals)"
      - "CDF F(x) = P(X ≤ x): starts at 0, ends at 1, always non-decreasing"
      - "Relationship: F'(x) = f(x), and F(b) - F(a) = P(a ≤ X ≤ b)"
      - "Quantile = inverse CDF: 'what value has 5% probability below it?'"
      - "Percentile/quantile is how critical values (1.645, 1.96) are defined"
    misconceptions:
      - "PDF gives probability (it gives density; only areas give probability)"
      - "f(x) must be ≤ 1 (wrong -- density can exceed 1 if the distribution is very concentrated)"
    why_it_matters: "Every significance test uses quantiles. BPV scaling uses E[|Z|] which requires integrating the normal PDF."

  - id: expected_value
    name: "Expected value E[X]: the probability-weighted average"
    layer: -1
    chapter: 1
    requires: [summation_notation, pdf_and_cdf]
    connects_to:
      - { node_id: variance_and_std_dev, how: "variance is E[(X-μ)²]" }
      - { node_id: jensens_inequality, how: "Jensen's compares E[f(X)] with f(E[X])" }
      - { node_id: higher_moments, how: "skewness and kurtosis are expectations of powers" }
    key_points:
      - "Discrete: E[X] = Σ x_i * P(X=x_i) -- each value weighted by its probability"
      - "Continuous: E[X] = ∫ x * f(x) dx -- same idea with density"
      - "Linearity: E[aX + bY] = aE[X] + bE[Y] (always, even if dependent)"
      - "E[X²] ≠ (E[X])² in general -- the gap is the variance"
      - "Law of the unconscious statistician: E[g(X)] = ∫ g(x)*f(x) dx"
      - "Sample mean x̄ = (1/n)Σx_i is the estimator of E[X]"
    misconceptions:
      - "E[X] is the most likely value (that's the mode; E[X] is the center of mass)"
      - "E[XY] = E[X]*E[Y] always (only true when X,Y are independent)"
    why_it_matters: "Every theoretical result uses E[·]. Variance, covariance, bias, CLT -- all defined through expected values."

  - id: normal_distribution
    name: "The Normal (Gaussian) distribution: the bell curve baseline"
    layer: -1
    chapter: 1, 2
    requires: [pdf_and_cdf]
    connects_to:
      - { node_id: central_limit_theorem, how: "CLT says sums converge to normal" }
      - { node_id: lognormal_distribution, how: "exp(Normal) = Log-Normal" }
      - { node_id: hypothesis_testing, how: "test statistics often have normal null distribution" }
    key_points:
      - "N(μ,σ²): PDF = (1/√(2πσ²)) * exp(-(x-μ)²/(2σ²))"
      - "Symmetric, bell-shaped; completely described by mean and variance"
      - "Standard normal Z ~ N(0,1): subtract mean, divide by SD to standardize any normal"
      - "Key facts: E[Z²] = 1, E[|Z|] = √(2/π) ≈ 0.798"
      - "Quantiles: z_{0.05}=1.645, z_{0.025}=1.96 (critical values for tests)"
      - "68-95-99.7 rule: ±1σ/±2σ/±3σ capture these percentages"
      - "The 'benchmark' distribution -- deviations from normal reveal real-world structure"
    misconceptions:
      - "Financial returns are normally distributed (they have fat tails -- kurtosis >> 3)"
      - "The normal is just theoretical (CLT makes it arise as the limit of sums, even of non-normal things)"
    why_it_matters: "The normal is the reference distribution for all of finance. Fat tails, BPV scaling (π/2), test statistics, CLT limits -- all defined relative to the normal."

  - id: lognormal_distribution
    name: "The Log-Normal distribution: what RV actually looks like"
    layer: -1
    chapter: 2, 6
    requires: [normal_distribution, logarithm_properties]
    connects_to:
      - { node_id: log_rv_transform, how: "log-RV ~ Normal justifies working in log space" }
      - { node_id: jensens_inequality, how: "retransformation bias arises from Jensen's on exp" }
    key_points:
      - "If ln(X) ~ N(μ,σ²) then X is log-normal"
      - "Right-skewed, strictly positive, heavy right tail -- looks like RV's distribution"
      - "E[X] = exp(μ + σ²/2) -- NOT exp(μ); the σ²/2 term is Jensen's correction"
      - "Multiplicative processes: X = e^{Z1+Z2+...} where Z_i ~ Normal → X is log-normal"
      - "Why we model in log space: log-normal X becomes Gaussian after ln transform"
      - "Median = exp(μ) < Mean = exp(μ+σ²/2) due to right skew"
    misconceptions:
      - "exp(E[ln X]) = E[X] (WRONG -- off by exp(σ²/2); this is the retransformation bias)"
      - "Log-normal has thin tails (it has a heavy RIGHT tail; just no negative values)"
    why_it_matters: "RV is approximately log-normal. The entire project trains in log-RV space because of this. Retransformation bias (the σ²/2 correction) is a direct consequence."

  - id: higher_moments
    name: "Skewness and kurtosis: beyond mean and variance"
    layer: -1
    chapter: 1
    requires: [expected_value]
    connects_to:
      - { node_id: fat_tails, how: "kurtosis > 3 = fat tails" }
      - { node_id: realized_skewness_kurtosis, how: "realized moments are the intraday versions" }
      - { node_id: realized_quarticity, how: "quarticity uses 4th power like kurtosis" }
    key_points:
      - "kth moment: E[X^k]; kth central moment: E[(X-μ)^k]"
      - "Skewness = E[(X-μ)³]/σ³: negative = left tail heavier (equity returns are negatively skewed)"
      - "Kurtosis = E[(X-μ)⁴]/σ⁴: measures tail weight relative to normal"
      - "Normal has kurtosis = 3; excess kurtosis = κ - 3 (how much fatter than normal)"
      - "Equities: excess kurtosis 5-10 (extreme events are 5-10x more likely than normal predicts)"
      - "4th power amplifies large deviations dramatically -- one outlier dominates the sum"
    misconceptions:
      - "Kurtosis measures 'peakedness' (Westfall 2014 debunked this -- it measures tail weight)"
      - "Skewness = 0 means symmetric (only for simple distributions; multimodal can be asymmetric with zero skewness)"
    why_it_matters: "Realized quarticity (RQ) in your pipeline is the intraday analog of kurtosis. Fat tails (kurtosis >> 3) are why normal-based models fail."

  # --- C. Statistical Estimation ---

  - id: variance_and_std_dev
    name: "Population vs sample variance, and the SD distinction"
    layer: -1
    chapter: 1
    requires: [expected_value]
    connects_to:
      - { node_id: independence_variance_addition, how: "additivity is the key variance property" }
      - { node_id: degrees_of_freedom_bessel, how: "why sample variance divides by T-1" }
      - { node_id: covariance_correlation, how: "covariance generalizes variance to pairs" }
      - { node_id: bias_consistency_mse, how: "sample variance is an estimator of population variance" }
    key_points:
      - "Population variance: Var(X) = E[(X-μ)²] -- the 'true' spread"
      - "Standard deviation: SD = √Var (same units as X; variance is in squared units)"
      - "Var(aX) = a² Var(X) -- scaling by a multiplies variance by a²"
      - "Var(X+c) = Var(X) -- shifting doesn't change spread"
      - "Sample variance: s² = (1/(n-1)) Σ(x_i - x̄)² -- estimator of population Var"
      - "SD is NOT half the range; variance is NOT the same as volatility (vol = annualized SD of returns)"
    misconceptions:
      - "Variance and standard deviation are interchangeable (different units, different scale -- variance of daily returns ~0.0001, SD ~0.01)"
      - "High variance = bad (in finance, high variance IS the product you're forecasting)"
    why_it_matters: "Your forecast target is variance. The entire pipeline manipulates variances and their estimators."

  - id: degrees_of_freedom_bessel
    name: "Degrees of freedom and Bessel's correction: why we divide by n-1"
    layer: -1
    chapter: 1
    requires: [variance_and_std_dev]
    connects_to:
      - { node_id: variance_as_spread, how: "Bessel's correction appears in the sample variance formula" }
    key_points:
      - "Degrees of freedom (df) = number of independent pieces of information in a sample"
      - "n observations, but we estimated the mean from the same data → 1 df used → n-1 remain"
      - "The sample mean 'pulls' all residuals toward zero: they must sum to zero (one constraint)"
      - "Dividing by n underestimates variance (biased low); dividing by n-1 corrects this"
      - "Proof sketch: E[Σ(x_i - x̄)²] = (n-1)σ², so E[s²] = σ² only when dividing by n-1"
      - "For large n, the difference is negligible (1000 vs 999), but for small samples it matters"
      - "Same concept appears in t-tests, chi-squared tests, regression (df = n - p)"
    misconceptions:
      - "Bessel's correction makes the estimate exact (it makes it unbiased in expectation, not exact for any single sample)"
      - "Always use n-1 (RV computation uses n because we don't subtract the mean -- intraday mean ≈ 0)"
    why_it_matters: "The n-1 in sample variance is Bessel's correction. RV skips it because intraday mean ≈ 0. Understanding when and why to apply it prevents subtle estimation bugs."

  - id: bias_consistency_mse
    name: "Bias, consistency, and the bias-variance tradeoff"
    layer: -1
    chapter: 2, 3
    requires: [variance_and_std_dev]
    connects_to:
      - { node_id: rv_is_noisy, how: "RV's noise decreases with more observations (consistency)" }
      - { node_id: noise_robust_estimators, how: "noise-robust estimators trade bias for lower variance" }
    key_points:
      - "Bias = E[θ̂] - θ: average error of estimator (systematic over- or under-estimation)"
      - "Unbiased: E[θ̂] = θ (correct on average, but could be noisy)"
      - "Consistent: θ̂ →_p θ as n→∞ (gets arbitrarily close with enough data)"
      - "MSE = Bias² + Variance: total error = systematic error + noise"
      - "A slightly biased estimator with much lower variance can have lower MSE (the tradeoff)"
      - "Example: RV_5min is slightly biased (microstructure noise) but has low variance; tick-RV is severely biased upward"
    misconceptions:
      - "Unbiased is always better (a biased estimator with lower MSE is often preferred)"
      - "Consistent means unbiased (no -- an estimator can be biased at any finite n but still converge)"
    why_it_matters: "The sampling frequency choice (5-min vs 1-min vs tick) is literally a bias-variance tradeoff. This concept explains the signature plot and why noise-robust estimators exist."

  - id: independence_variance_addition
    name: "Independence and why variances add"
    layer: -1
    chapter: 1
    requires: [variance_and_std_dev]
    connects_to:
      - { node_id: annualizing_vol, how: "the √252 rule requires independence" }
    key_points:
      - "Independent events: knowing one tells you nothing about the other -- P(A∩B) = P(A)·P(B)"
      - "Independent random variables: E[XY] = E[X]·E[Y], so Cov(X,Y) = 0"
      - "THE key result: Var(X+Y) = Var(X) + Var(Y) when X,Y are independent"
      - "Extends: Var(Σ X_i) = n·Var(X_i) for n i.i.d. variables"
      - "Does NOT hold for SD: SD(X+Y) ≠ SD(X) + SD(Y); instead SD(sum) = SD·√n"
      - "Fails when variables are dependent (autocorrelated returns violate this)"
      - "i.i.d. shorthand: independent AND identically distributed (same law, no memory)"
    misconceptions:
      - "Uncorrelated = independent (uncorrelated only means linear relationship is zero; nonlinear dependence can still exist)"
      - "Standard deviations add (WRONG -- variances add, so SD scales by √n not n)"
    why_it_matters: "The √252 annualization rule is a direct consequence. When vol clusters (dependence), the rule breaks -- this is exactly what your models exploit."

  - id: covariance_correlation
    name: "Covariance and correlation: measuring linear co-movement"
    layer: -1
    chapter: 1
    requires: [variance_and_std_dev]
    connects_to:
      - { node_id: autocorrelation, how: "ACF is self-correlation at different lags" }
      - { node_id: semivariances, how: "leverage effect is negative correlation between returns and future vol" }
    key_points:
      - "Cov(X,Y) = E[(X-μ_X)(Y-μ_Y)] = E[XY] - E[X]E[Y]"
      - "Positive cov: both above or both below average together; negative: one up, other down"
      - "Correlation: ρ = Cov(X,Y) / (SD(X)·SD(Y)) -- normalized to [-1, +1]"
      - "ρ = ±1 means perfect linear relationship; ρ = 0 means no LINEAR relationship"
      - "Var(X+Y) = Var(X) + Var(Y) + 2Cov(X,Y) -- general formula (independence sets Cov=0)"
      - "Sample correlation: r = Σ(x_i-x̄)(y_i-ȳ) / [√Σ(x_i-x̄)² · √Σ(y_i-ȳ)²]"
    misconceptions:
      - "Correlation = causation (correlation measures co-movement, not causal direction)"
      - "ρ = 0 means independent (only means no LINEAR dependence; could still be nonlinearly dependent)"
    why_it_matters: "The leverage effect is Corr(r_t, σ²_{t+1}) < 0. Multicollinearity (ρ>0.99 between features) explains why SHAR fails without pooling. Covariance is everywhere."

  # --- D. Inference & Convergence ---

  - id: hypothesis_testing
    name: "Hypothesis testing: making decisions under uncertainty"
    layer: -1
    chapter: 4
    requires: [normal_distribution]
    connects_to:
      - { node_id: jumps_vs_diffusion, how: "BNS test is a hypothesis test for jumps" }
      - { node_id: bns_jump_test, how: "null = no jumps, test stat ~ N(0,1)" }
      - { node_id: diebold_mariano, how: "DM test is a hypothesis test for forecast accuracy" }
    key_points:
      - "Null hypothesis H₀: the default/boring explanation (e.g., 'no jumps today')"
      - "Alternative H₁: what we're looking for (e.g., 'a jump occurred')"
      - "Test statistic: a number computed from data, with KNOWN distribution under H₀"
      - "Significance level α: probability of rejecting H₀ when it's actually true (false positive rate)"
      - "Critical value: boundary -- if test stat exceeds it, reject H₀ (e.g., Z > 1.645 at 5%)"
      - "p-value: probability of seeing data this extreme if H₀ were true (small p → reject)"
      - "Type I error (α): false positive. Type II (β): false negative. Power = 1-β"
      - "One-sided vs two-sided: testing > threshold vs testing ≠ threshold"
    misconceptions:
      - "p-value = probability that H₀ is true (WRONG -- it's P(data|H₀), not P(H₀|data))"
      - "Failure to reject means H₀ is true (no -- just insufficient evidence to reject)"
      - "α = 0.05 is always right (it's a convention; smaller α when false positives are costly)"
    why_it_matters: "Jump detection (BNS, Lee-Mykland), Diebold-Mariano tests, and Mincer-Zarnowitz regression all require this logic. Without it, you can't interpret any statistical significance claim."

  - id: central_limit_theorem
    name: "Central Limit Theorem: why averages become normal"
    layer: -1
    chapter: 2
    requires: [normal_distribution, variance_and_std_dev]
    connects_to:
      - { node_id: rv_construction, how: "RV's sampling error follows a CLT" }
      - { node_id: rv_is_noisy, how: "noise shrinks at rate 1/√n due to CLT" }
    key_points:
      - "Take n i.i.d. draws from ANY distribution with mean μ and variance σ²"
      - "Their sample mean X̄ satisfies: √n(X̄ - μ)/σ → N(0,1) as n→∞"
      - "The distribution of X̄ becomes approximately normal regardless of the original shape"
      - "Convergence rate: standard error of mean = σ/√n (halving error needs 4x more data)"
      - "This is why 'more observations = less noise' -- but you need √n more for half the error"
      - "RV uses a related CLT: √n(RV_t - IV_t) → Normal (sampling error of RV shrinks)"
    misconceptions:
      - "CLT says individual observations are normal (NO -- it says their AVERAGE is approximately normal)"
      - "CLT works instantly (requires 'large enough' n; for heavy-tailed data, may need n > 100)"
      - "CLT means all noise disappears (it shrinks at 1/√n but never vanishes for finite n)"
    why_it_matters: "The entire justification for why more intraday observations improve RV is a CLT result. The 1/√n rate explains why 5-min (78 obs) is so much better than hourly (6.5 obs)."

  - id: jensens_inequality
    name: "Jensen's inequality: why transformations shift the mean"
    layer: -1
    chapter: 2, 6
    requires: [expected_value, logarithm_properties]
    connects_to:
      - { node_id: log_rv_transform, how: "explains retransformation bias" }
      - { node_id: retransformation_bias, how: "exp(E[log RV]) < E[RV] due to Jensen's" }
      - { node_id: lognormal_distribution, how: "E[e^X] = e^{μ+σ²/2} not e^μ" }
    key_points:
      - "For convex f: E[f(X)] ≥ f(E[X]) -- the average of outputs ≥ output of the average"
      - "For concave f (like ln): E[f(X)] ≤ f(E[X]) -- flipped direction"
      - "Intuition: a convex function 'amplifies' variation, pushing the mean up"
      - "Key case: E[e^X] > e^{E[X]} because exp is convex"
      - "Key case: E[ln X] < ln(E[X]) because ln is concave"
      - "Direct consequence: exp(mean of log-RV) ≠ mean of RV -- systematically too low"
      - "The σ²/2 Duan correction fixes this bias: E[e^X] = e^{μ + σ²/2} for X ~ Normal"
    misconceptions:
      - "Transforming the mean gives the mean of the transform (WRONG -- Jensen's shows the gap)"
      - "The bias is small enough to ignore (at σ² = 0.5, the correction is ~28% -- not ignorable)"
    why_it_matters: "You train in log-RV space but forecast in RV space. Without Jensen's correction (Duan retransformation), predictions are systematically 5-30% too low. You already hit this bug."

  - id: autocorrelation
    name: "Autocorrelation: how a series relates to its own past"
    layer: -1
    chapter: 1, 6
    requires: [covariance_correlation]
    connects_to:
      - { node_id: vol_clustering, how: "high ACF of |returns| IS vol clustering" }
      - { node_id: har_approximates_long_memory, how: "power-law ACF decay = long memory" }
    key_points:
      - "ACF(k) = Corr(X_t, X_{t-k}): correlation of a series with itself lagged k steps"
      - "ACF(0) = 1 always (perfect self-correlation)"
      - "Fast decay (exponential): AR(1) with |φ|<1 has ACF = φ^k"
      - "Slow decay (power-law): ACF ~ k^{-d} -- still non-zero at long lags (long memory)"
      - "For returns: ACF ≈ 0 at all lags (EMH -- can't predict direction)"
      - "For |returns| or r²: ACF is strongly positive and decays slowly (vol clustering)"
      - "Partial ACF (PACF): correlation at lag k after removing shorter lags"
      - "Stationarity: the unconditional distribution doesn't change over time (required for ACF to be well-defined)"
    misconceptions:
      - "If returns have zero ACF, they're unpredictable (only their magnitude is unpredictable; abs(returns) can be very predictable)"
      - "High ACF means trending (ACF measures same-sign persistence, not directional trend)"
    why_it_matters: "HAR exists because vol has strong, slow-decaying autocorrelation. The daily/weekly/monthly decomposition approximates this slow decay with three simple terms."

  # --- E. Regression ---

  - id: ols_linear_regression
    name: "OLS linear regression: finding the best-fit hyperplane by minimizing squared residuals"
    layer: -1
    chapter: 5
    requires: [expected_value, variance_and_std_dev, covariance_correlation]
    connects_to:
      - { node_id: har_model, how: "HAR is OLS with 3 features (log_rv_d, log_rv_w, log_rv_m)" }
      - { node_id: degrees_of_freedom_bessel, how: "regression df = n - p generalizes Bessel's n - 1" }
    key_points:
      - "Goal: find coefficients b that minimize sum of squared residuals: min_b Σ(y_i - x_i'b)²"
      - "Closed-form solution: b_hat = (X'X)^{-1} X'y -- no iteration needed, instant for small p"
      - "WHY squared residuals: differentiable, convex, unique minimum (same logic as variance); absolute values have no closed form"
      - "Geometric view: b_hat is the projection of y onto the column space of X; residuals are orthogonal to features"
      - "Assumption 1 (linearity): E[y|X] = Xb -- linear in parameters, features can be nonlinear transforms like log, x²"
      - "Assumption 2 (homoskedasticity): Var(ε_i) = σ² for all i -- residual spread doesn't change with X (violated by raw vol data!)"
      - "Assumption 3 (no perfect multicollinearity): X'X must be invertible -- columns can't be exact linear combos"
      - "Assumption 4 (normality of residuals): ε ~ N(0, σ²I) -- needed for t-tests/F-tests, NOT for point estimates"
      - "When assumptions fail: heteroskedasticity → GLS/HAC; multicollinearity → Ridge/Lasso; nonlinearity → trees"
      - "Key diagnostic: R² = 1 - SS_res/SS_tot = fraction of variance explained (HAR gets 0.40-0.60)"
    misconceptions:
      - "OLS requires normally distributed Y (wrong -- normality of RESIDUALS needed only for inference; estimates valid regardless)"
      - "OLS can't handle nonlinear relationships (wrong -- 'linear' means linear in PARAMETERS, not features)"
      - "High R² means good predictions (wrong -- in-sample R² inflates with more features; out-of-sample is what matters)"
      - "OLS is outdated for ML (wrong -- it's the inner loop of Ridge, Lasso, and the benchmark every ML model must beat)"
    why_it_matters: "HAR is literally OLS with 3 features. Ridge/Lasso add a penalty to OLS. Understanding this tells you what HAR does, why multicollinearity breaks SHAR, and why regularization helps."

  # ============================================================
  # LAYER 0: HAR Core
  # ============================================================

  # --- Tier 1: Foundations (roots, no prerequisites) ---

  - id: log_returns
    name: "Why we use log returns instead of simple returns"
    layer: 0
    chapter: 1
    requires: [logarithm_properties]
    connects_to:
      - { node_id: rv_construction, how: "log returns are what get squared in RV" }
      - { node_id: annualizing_vol, how: "time-additivity enables the sqrt-T rule" }
    key_points:
      - "Time additivity: multi-period log return = sum of single-period log returns"
      - "ln(AB) = ln(A) + ln(B) makes the math work; simple returns compound multiplicatively"
      - "Approximate symmetry: +5% then -5% nets to zero exactly (simple returns don't)"
      - "For small returns (<5%), log and simple returns are nearly identical"
    misconceptions:
      - "Log returns are more accurate (they're used because the math is cleaner, not more accurate)"
      - "Simple and log returns are interchangeable (they diverge for large moves)"
    why_it_matters: "Every RV computation squares log returns. If you don't understand why log, you can't explain why RV works."

  - id: variance_as_spread
    name: "Why variance measures spread via squared deviations"
    layer: 0
    chapter: 1
    requires: [degrees_of_freedom_bessel, variance_and_std_dev]
    connects_to:
      - { node_id: rv_construction, how: "RV is variance applied to intraday data" }
      - { node_id: fat_tails, how: "kurtosis extends squaring logic to 4th power" }
    key_points:
      - "Average squared distance from mean"
      - "Squaring makes negatives positive AND amplifies outliers (by design)"
      - "Bessel's correction (T-1) compensates for estimating mean from same data"
      - "Variance is in squared units; std dev = sqrt(variance) restores original units"
    misconceptions:
      - "We square just to make numbers positive (absolute deviations do that too; squaring has specific mathematical properties tied to QV convergence)"
      - "Variance and standard deviation are the same thing (different units, different scale)"
    why_it_matters: "Variance is literally the quantity you're forecasting in this entire project."

  - id: annualizing_vol
    name: "Why we multiply daily vol by sqrt(252)"
    layer: 0
    chapter: 1
    requires: [independence_variance_addition, variance_and_std_dev]
    connects_to:
      - { node_id: log_returns, how: "time-additivity enables the rule" }
      - { node_id: vol_clustering, how: "clustering violates the independence assumption behind it" }
    key_points:
      - "Variances add for independent returns (not standard deviations)"
      - "sqrt(252) comes from 252 trading days per year"
      - "Only valid under the independence assumption"
      - "'VIX at 20' means 20% annualized volatility"
      - "Fails when vol is autocorrelated -- multi-day vol deviates from sqrt(T) prediction"
    misconceptions:
      - "The square root rule always works (vol clustering violates independence)"
      - "You annualize by multiplying by 252 (that's variance; vol uses sqrt)"
    why_it_matters: "You need this to compare daily RV with VIX and IV benchmarks."

  # --- Tier 2: Stylized Facts ---

  - id: vol_clustering
    name: "Why large moves follow large moves"
    layer: 0
    chapter: 1
    requires: [variance_as_spread, autocorrelation]
    connects_to:
      - { node_id: heterogeneous_market_hypothesis, how: "HAR exists because of clustering" }
      - { node_id: leverage_effect, how: "both are stylized facts but distinct mechanisms" }
      - { node_id: annualizing_vol, how: "clustering violates independence assumption" }
    key_points:
      - "Returns are uncorrelated but squared/absolute returns show strong positive autocorrelation"
      - "Decay is power-law (~lag^-0.3), not exponential -- much slower"
      - "Cont (2001) documented across all asset classes and decades"
      - "This persistence is what makes vol forecastable at all"
      - "Returns themselves approximately uncorrelated (EMH) -- only |returns| and r^2 cluster"
    misconceptions:
      - "Vol clustering means returns are predictable (returns are uncorrelated; only magnitude is predictable)"
      - "Clustering decays quickly (power-law means vol 100 days ago is still informative)"
    why_it_matters: "If vol didn't cluster, HAR wouldn't work and your entire project would be pointless."

  - id: fat_tails
    name: "Why extreme returns happen far more often than normal"
    layer: 0
    chapter: 1
    requires: [variance_as_spread, normal_distribution, higher_moments]
    connects_to:
      - { node_id: vol_clustering, how: "clustering partially explains fat tails" }
      - { node_id: jumps_vs_diffusion, how: "jumps are one source of fat tails" }
      - { node_id: vol_skew_and_smile, how: "fat tails explain post-1987 skew demand" }
      - { node_id: butterfly_spread, how: "butterfly prices symmetric tail thickness" }
    key_points:
      - "Kurtosis > 3 (excess kurtosis 5-10 for equities)"
      - "4-sigma daily move: once per 63 years under normal, several times per year in reality"
      - "Q-Q plot shows S-shaped departure from normal line"
      - "Mandelbrot (1963) first documented for cotton prices"
    misconceptions:
      - "Fat tails are caused by jumps (stochastic vol also produces them even without jumps)"
      - "You can fix fat tails by using log returns (helps but doesn't eliminate them)"
    why_it_matters: "Any model assuming normality will catastrophically underestimate tail risk."

  - id: leverage_effect
    name: "Why negative returns amplify vol more than positive"
    layer: 0
    chapter: 1
    requires: [variance_as_spread]
    connects_to:
      - { node_id: semivariances, how: "same phenomenon measured at intraday frequency" }
      - { node_id: shar_model, how: "SHAR operationalizes this in HAR" }
      - { node_id: vol_clustering, how: "distinct mechanism, same domain" }
      - { node_id: vol_skew_and_smile, how: "leverage effect is one cause of equity skew" }
      - { node_id: why_vol_targeting_adds_sharpe, how: "leverage effect is WHY vol-targeting cuts left tail" }
    key_points:
      - "Corr(r_t, sigma^2_{t+1}) < 0"
      - "Black (1976) leverage mechanism: price drop -> higher debt/equity -> riskier"
      - "Also driven by margin calls, stop-losses, hedging cascades"
      - "Asymmetric: 'fear is louder than greed'"
      - "Strongest in equities, weaker or reversed in FX/commodities"
    misconceptions:
      - "Leverage effect means financial leverage causes volatility (named after the mechanism but feedback trading and behavioral effects also drive it)"
      - "Positive and negative returns affect vol equally (the entire point is they don't)"
    why_it_matters: "Symmetric models systematically underpredict vol after selloffs."

  # --- Tier 3: RV Construction ---

  - id: integrated_variance
    name: "What we're actually trying to measure (IV as the true target)"
    layer: 0
    chapter: 2
    requires: [variance_as_spread]
    connects_to:
      - { node_id: rv_construction, how: "RV is the estimator of IV" }
      - { node_id: rv_is_noisy, how: "RV only approximates IV" }
    key_points:
      - "Integral of instantaneous variance over the day"
      - "Latent: never directly observed"
      - "Speedometer analogy -- IV accumulates total price wiggle"
      - "Distinct from quadratic variation (QV also captures jumps)"
    misconceptions:
      - "'IV' means implied volatility here (no -- integrated variance, confusing terminology)"
      - "You can observe IV directly (no, it's latent; RV is the estimator)"
    why_it_matters: "IV is the theoretical gold standard. Every estimator is trying to get closer to it."

  - id: rv_construction
    name: "Why summing squared intraday returns measures volatility"
    layer: 0
    chapter: 2
    requires: [log_returns, variance_as_spread, integrated_variance, central_limit_theorem]
    connects_to:
      - { node_id: five_min_convention, how: "sampling frequency choice for this sum" }
      - { node_id: rv_is_noisy, how: "this sum is an estimate, not truth" }
      - { node_id: log_rv_transform, how: "why we take log of this" }
      - { node_id: vrp_definition, how: "RV is the P-measure component of VRP" }
      - { node_id: gamma_pnl_formula, how: "realized variance drives gamma P&L" }
    key_points:
      - "RV_t = sum of r^2_{t,i} for all intraday returns"
      - "Each squared return approximates local variance because E[epsilon^2]=1"
      - "Converges to quadratic variation as n->infinity (Andersen et al. 2001, BNS 2002)"
      - "No mean subtraction needed (intraday mean is approximately zero)"
      - "With no jumps: QV=IV. With jumps: QV=IV+sum(J^2)"
      - "WHY squaring not absolute values -- QV convergence theorem requires squared increments"
      - "n=78 for 5-min sampling (6.5h x 12/hr)"
      - "CLT: sqrt(n)(RV-IV) -> N(0, 2*integral(sigma^4 ds)) -- error shrinks at 1/sqrt(n)"
    misconceptions:
      - "We square returns because we want positive numbers (the deep reason is convergence to quadratic variation)"
      - "More intraday observations always gives better RV (microstructure noise breaks this)"
      - "RV measures direction (no, only magnitude -- squaring removes sign)"
    why_it_matters: "This is the dependent variable (y) in your entire forecasting project."

  - id: five_min_convention
    name: "Why 5-minute sampling is the standard"
    layer: 0
    chapter: 2
    requires: [rv_construction]
    connects_to:
      - { node_id: microstructure_noise_concept, how: "noise is why we can't go higher frequency" }
      - { node_id: signature_plot, how: "the diagnostic tool for choosing frequency" }
    key_points:
      - "Bias-variance tradeoff: too fast = noise, too slow = imprecise"
      - "Liu Patton Sheppard (2015) tested ~400 estimators; 5-min RV 'hard to beat'"
      - "Not derived from theory -- empirical finding"
      - "78 observations per 6.5-hour US equity trading day"
      - "Key distinction: noise-robust estimators improve estimation accuracy but rarely improve forecast accuracy"
    misconceptions:
      - "5 minutes is optimal for all assets (depends on liquidity and noise ratio)"
      - "We should always use the highest frequency available (noise wins at sub-minute)"
    why_it_matters: "Choosing the wrong frequency makes your RV target garbage, poisoning every downstream model."

  # --- Tier 4: Where RV Breaks ---

  - id: rv_is_noisy
    name: "Why RV is an estimate with measurable uncertainty"
    layer: 0
    chapter: 2
    requires: [rv_construction, bias_consistency_mse]
    connects_to:
      - { node_id: realized_quarticity, how: "RQ quantifies exactly how noisy" }
      - { node_id: harq_model, how: "HARQ exploits this noise information" }
    key_points:
      - "Estimation error shrinks as 1/sqrt(n)"
      - "Error variance involves integrated quarticity (integral of sigma^4)"
      - "Days when vol-of-vol is high have less precise RV estimates"
      - "This means RV is a noisy label for your model to train on"
      - "WHY sigma^4 in CLT variance -- computing variance-of-a-variance involves squaring something already squared"
    misconceptions:
      - "RV is the true volatility (it's an estimator with sampling error)"
      - "All days' RV estimates are equally reliable (high-RQ days are much noisier)"
    why_it_matters: "If you treat all RV values as equally trustworthy, your model trains on noise."

  - id: microstructure_noise_concept
    name: "Why transaction prices are contaminated and what that does to RV"
    layer: 0
    chapter: 2-3
    requires: [rv_construction, five_min_convention]
    connects_to:
      - { node_id: signature_plot, how: "diagnostic for visualizing noise" }
      - { node_id: noise_robust_estimators, how: "the family of fixes" }
    key_points:
      - "Three sources: bid-ask bounce, discrete tick sizes, price staleness"
      - "Observed price = true price + noise (additive model)"
      - "Noise has constant variance omega^2 regardless of interval length"
      - "At high frequency, noise dominates signal"
      - "RV diverges to 2*n*omega^2 as n->infinity"
    misconceptions:
      - "Noise can be removed by data cleaning (it's structural -- bid-ask bounce is inherent)"
      - "Noise only matters for tick data (matters at any sub-1-minute frequency)"
    why_it_matters: "This is why you can't just sample every tick."

  - id: signature_plot
    name: "How to diagnose the bias-variance tradeoff visually"
    layer: 0
    chapter: 2-3
    requires: [microstructure_noise_concept]
    connects_to:
      - { node_id: five_min_convention, how: "the plot shows why 5-min is the sweet spot" }
      - { node_id: noise_robust_estimators, how: "robust estimators flatten the curve" }
    key_points:
      - "x-axis: sampling interval, y-axis: average RV"
      - "Three regions: noise-inflated (left), flat sweet spot (center), imprecise (right)"
      - "If curve still rising as frequency increases, you're in the noise zone"
      - "First diagnostic to run on any new dataset before computing RV"
    misconceptions:
      - "The flat region means the estimate is perfect (still noisy, just approximately unbiased)"
      - "You only check this once (noise levels change over time)"
    why_it_matters: "This is the first diagnostic you run before computing RV on any new data."

  - id: log_rv_transform
    name: "Why we work with ln(RV) instead of RV"
    layer: 0
    chapter: 2, 6
    requires: [rv_construction, jensens_inequality, lognormal_distribution]
    connects_to:
      - { node_id: har_model, how: "HAR is typically estimated in logs" }
      - { node_id: rv_is_noisy, how: "log stabilizes variance of the estimate" }
    key_points:
      - "Stabilizes variance (variance-of-variance is highly skewed)"
      - "Makes distribution closer to Gaussian (helps OLS)"
      - "Guarantees positive forecasts (exp(x) > 0)"
      - "Most HAR papers use log specification"
      - "Retransformation bias: E[exp(X)] > exp(E[X]) (Jensen's inequality) -- needs Duan correction when converting back to levels"
      - "Implementation: safe_log clips to 1e-20 before log (ln(1e-20)~=-46, finite but below any realistic RV)"
    misconceptions:
      - "You must always use log RV (sqrt(RV) also used; depends on loss function)"
      - "Log RV is just a convenience (it fundamentally changes the loss function)"
    why_it_matters: "Without this, HAR residuals are badly behaved and forecasts can go negative."

  # --- Tier 5: The HAR Model ---

  - id: heterogeneous_market_hypothesis
    name: "Why different market participants at different speeds create multi-scale dynamics"
    layer: 0
    chapter: 6
    requires: [vol_clustering]
    connects_to:
      - { node_id: har_model, how: "HAR directly implements HMH" }
      - { node_id: har_approximates_long_memory, how: "explains why HAR captures long memory cheaply" }
    key_points:
      - "Muller et al. (1993): market is a superposition of participants at different time scales"
      - "Day traders (daily), portfolio managers (weekly), institutional allocators (monthly)"
      - "Each responds to vol at their own horizon; interactions create multi-scale autocorrelation"
      - "Explains why AR(1) is insufficient for vol forecasting"
    misconceptions:
      - "HMH means there are literally three types of trader (simplification -- represents a continuum)"
      - "HMH is a proven mechanism (it's a hypothesis that motivates HAR; HAR works regardless)"
    why_it_matters: "This is the economic intuition behind HAR's three time scales. Without it, the model looks ad hoc."

  - id: har_model
    name: "How HAR forecasts vol from three time scales using OLS"
    layer: 0
    chapter: 6
    requires: [rv_construction, log_rv_transform, heterogeneous_market_hypothesis, ols_linear_regression]
    connects_to:
      - { node_id: har_approximates_long_memory, how: "why 3 coefficients capture 22 lags" }
      - { node_id: har_hard_to_beat, how: "why this simple model is the benchmark" }
      - { node_id: har_j_model, how: "adding jump decomposition" }
      - { node_id: shar_model, how: "adding asymmetry" }
      - { node_id: harq_model, how: "adding noise awareness" }
      - { node_id: horizon_dependence_options, how: "HAR persistence fades at h=5+, creating room for options features" }
    key_points:
      - "RV_{t+1} = b0 + b_d*RV_t + b_w*RV^(w)_t + b_m*RV^(m)_t + epsilon"
      - "Estimated by OLS -- no MLE, no iteration, no latent variables"
      - "Typical coefficients ~0.36/0.28/0.28; all three contribute meaningfully"
      - "In-sample R^2 of 0.40-0.60 from just three predictors"
      - "Estimated in log-RV in practice"
      - "WHY avg then log not log then avg -- Jensen's inequality, ln(x_bar) != mean(ln x), want average variance"
      - "Computation order: rolling(w).mean() THEN safe_log -- average in variance space first"
    misconceptions:
      - "HAR is an AR(22) (it's a restricted AR(22) where lags share coefficients via averaging)"
      - "The monthly component is less important (its coefficient is similar to daily's)"
    why_it_matters: "THE baseline. Every ML model must beat it. If yours can't beat 3 OLS coefficients, you've overfit."

  - id: har_approximates_long_memory
    name: "Why 3 coefficients capture the slow decay of vol autocorrelation"
    layer: 0
    chapter: 6
    requires: [har_model, vol_clustering]
    connects_to:
      - { node_id: heterogeneous_market_hypothesis, how: "the economic motivation" }
    key_points:
      - "Weekly average implicitly includes lags 1-5, monthly includes lags 1-22"
      - "Overlapping averages create smooth decay that mimics power-law autocorrelation"
      - "Achieves similar fit to FIGARCH with much simpler estimation"
    misconceptions:
      - "HAR actually models long memory (it approximates it -- true long memory requires fractional integration)"
    why_it_matters: "Understanding this tells you why HAR works so well with so few parameters."

  - id: har_hard_to_beat
    name: "Why HAR is the benchmark despite being dead simple"
    layer: 0
    chapter: 6
    requires: [har_model]
    connects_to:
      - { node_id: harq_model, how: "HARQ is one of the few reliable improvements" }
      - { node_id: rv_is_noisy, how: "low signal-to-noise is one reason" }
    key_points:
      - "Reason 1: vol is highly persistent and approximately linear"
      - "Reason 2: low signal-to-noise means complex models overfit"
      - "Reason 3: with only past RV at h=1, there's little nonlinear structure"
      - "ML gains come from richer features AND/OR longer horizons"
      - "Bollerslev et al. (2024): well-tuned HAR 'hard to beat' at h=1"
      - "Litmus test: if ML can't beat HAR on same features/horizon, it overfit noise"
    misconceptions:
      - "HAR is easy to beat with enough features (a badly-tuned baseline is a bigger problem than missing features)"
      - "ML should always beat HAR (at h=1 with RV-only features, it often doesn't)"
    why_it_matters: "If you don't understand this, you'll waste weeks trying to beat a badly-tuned baseline."

  # ============================================================
  # LAYER 1: Noise + Asymmetry
  # ============================================================

  # --- Noise Branch ---

  - id: realized_quarticity
    name: "Why RQ measures how much to trust today's RV"
    layer: 1
    chapter: 2, 6, 10
    requires: [rv_is_noisy, rv_construction]
    connects_to:
      - { node_id: harq_model, how: "HARQ uses RQ to modulate coefficients" }
      - { node_id: harq_feature, how: "sqrt(RQ) as standalone ML feature" }
    key_points:
      - "RQ = (n/3) * sum(r^4) -- fourth power massively upweights extreme moves"
      - "Converges to integral of sigma^4 (integrated quarticity)"
      - "High RQ = vol-of-vol was high within the day = noisy RV estimate"
      - "The asymptotic variance of RV is proportional to RQ"
      - "WHY n/3 scaling -- E[epsilon^4]=3 for standard normal, correction ensures unbiasedness for integrated quarticity"
    misconceptions:
      - "RQ measures volatility (it measures the noise in the volatility estimate -- a meta-quantity)"
      - "High RQ means high vol (high RQ means vol was variable within the day, not necessarily high on average)"
    why_it_matters: "Without RQ, you can't distinguish a trustworthy RV reading from a garbage one."

  - id: harq_model
    name: "How HARQ down-weights noisy RV days automatically"
    layer: 1
    chapter: 6
    requires: [har_model, realized_quarticity]
    connects_to:
      - { node_id: harq_feature, how: "ML generalization of HARQ's insight" }
      - { node_id: har_hard_to_beat, how: "HARQ is the strongest univariate RV forecast" }
    key_points:
      - "Effective daily coefficient = beta_d + beta_dQ * sqrt(RQ_t)"
      - "beta_dQ is negative: high noise shrinks coefficient toward zero"
      - "On noisy days, weight shifts to more stable weekly/monthly averages"
      - "Confidence-weighted HAR"
      - "Bollerslev Patton Quaedvlieg (2016): improves QLIKE by 5-15%"
      - "WHY only daily coefficient varies -- weekly/monthly already smooth (averaging over 5/22 days reduces noise)"
    misconceptions:
      - "HARQ drops noisy days (it reduces their influence, doesn't drop them)"
      - "You need to hard-code the interaction for ML (trees learn it automatically from separate features)"
    why_it_matters: "THE paper your project builds on. Measurement quality should modulate feature weights."

  - id: harq_feature
    name: "Why sqrt(RQ) is a standalone feature for ML models"
    layer: 1
    chapter: 10
    requires: [realized_quarticity, harq_model]
    connects_to:
      - { node_id: realized_quarticity, how: "derived from RQ" }
      - { node_id: triple_expansion, how: "apply level/change/z-score to sqrt(RQ)" }
    key_points:
      - "Trees split on sqrt(RQ) to learn adaptive weighting without explicit interactions"
      - "Provides data-quality signal no other feature captures"
      - "Double duty: noise proxy AND regime indicator"
      - "HARQ hard-codes the interaction; ML can discover more general patterns"
      - "Interaction formula: log_rv_d * sqrt(RQ) implements beta_dQ*sqrt(RQ)*RV from HARQ"
    misconceptions:
      - "You need to include RV*sqrt(RQ) as a feature (no -- include both separately; trees discover interactions)"
    why_it_matters: "The single most important extension beyond baseline HAR for your project."

  - id: noise_robust_estimators
    name: "Why TSRV, kernel, and pre-averaging exist and when to use them"
    layer: 1
    chapter: 3
    requires: [microstructure_noise_concept, signature_plot]
    connects_to:
      - { node_id: five_min_convention, how: "alternatives to 5-min sampling" }
      - { node_id: rv_construction, how: "they solve the noise problem RV can't" }
    key_points:
      - "TSRV subsamples at two frequencies and subtracts the bias"
      - "Realized kernel uses autocovariance weighting"
      - "Pre-averaging smooths prices before computing returns"
      - "All converge to IV at rates between n^{-1/4} and n^{-1/5}"
      - "Liu Patton Sheppard (2015): none reliably beats 5-min RV for forecasting"
      - "RK: Parzen flat-top kernel, bandwidth H proportional to n^(3/5), rate n^(-1/4)"
      - "TSRV: fast/slow scale subtraction, rate n^(-1/6), first consistent estimator with noise"
      - "Pre-avg: triangular window L proportional to n^(1/2), rate n^(-1/4) optimal"
    misconceptions:
      - "Noise-robust estimators are always better (for forecasting, 5-min RV is usually competitive)"
      - "Always use the most sophisticated estimator (complexity adds its own noise in finite samples)"
    why_it_matters: "You need to know these exist even if 5-min RV is your default."

  # --- Asymmetry Branch ---

  - id: semivariances
    name: "Why splitting RV into upside and downside captures the leverage effect"
    layer: 1
    chapter: 6, 10
    requires: [rv_construction, leverage_effect, indicator_functions]
    connects_to:
      - { node_id: shar_model, how: "SHAR uses semivariances as inputs" }
      - { node_id: leverage_effect, how: "same phenomenon at intraday frequency" }
      - { node_id: signed_jumps, how: "extends sign-splitting logic to jumps" }
    key_points:
      - "RV+ = sum of r^2 for positive returns, RV- = sum for negative"
      - "RV+ + RV- = RV by construction"
      - "RV- carries ~2x the predictive weight (Patton Sheppard 2015)"
      - "Reduces QLIKE by 3-8%"
      - "WHY squared not counts -- captures magnitude of directional moves"
      - "Signed jump = RS+ - RS- = net directional pressure"
    misconceptions:
      - "RV+ and RV- are different estimators (they're the same sum decomposed by sign)"
      - "Upside volatility doesn't matter (matters less, but still carries signal)"
    why_it_matters: "Simplest way to capture asymmetry in your feature set."

  - id: shar_model
    name: "How SHAR separates good vol from bad vol in HAR"
    layer: 1
    chapter: 6
    requires: [har_model, semivariances]
    connects_to:
      - { node_id: leverage_effect, how: "the economic mechanism it captures" }
      - { node_id: harq_model, how: "easily confused -- SHAR adds asymmetry, HARQ adds noise awareness" }
    key_points:
      - "Replaces daily RV with RS+ and RS- as separate regressors"
      - "beta_d^- > beta_d^+ (bad vol predicts more future vol)"
      - "Weekly and monthly terms stay as total RV"
      - "Patton and Sheppard (2015): strongest gains on equity indices"
      - "WHY asymmetry: selloffs trigger cascading margin calls, stop-losses, portfolio insurance, panic selling"
    misconceptions:
      - "SHAR replaces all three terms (only daily is split; weekly/monthly remain total RV)"
      - "SHAR and HARQ are the same idea (orthogonal: asymmetry vs. measurement quality)"
    why_it_matters: "Demonstrates that asymmetric treatment is worth the extra parameter for equity vol."

  # --- Jump Branch ---

  - id: jumps_vs_diffusion
    name: "Why prices have two types of movement"
    layer: 1
    chapter: 4
    requires: [rv_construction, hypothesis_testing]
    connects_to:
      - { node_id: bpv_jump_robustness, how: "BPV separates them" }
      - { node_id: fat_tails, how: "jumps are one source of fat tails" }
      - { node_id: vrp_decomposition, how: "VRP decomposes into diffusive and jump components" }
    key_points:
      - "Diffusion = smooth continuous price movement"
      - "Jump = sudden discontinuity (earnings, FOMC, flash crash)"
      - "QV = IV + sum(J^2), so RV captures both"
      - "Continuous component is persistent and forecastable; jumps are largely transient"
    misconceptions:
      - "Jumps are just large returns (large return could be high-vol diffusion; jump is specifically a discontinuity)"
      - "All jumps are negative (positive jumps exist -- short squeezes, earnings beats)"
    why_it_matters: "Without separating C from J, your forecast signal is diluted by unpredictable events."

  - id: bpv_jump_robustness
    name: "Why multiplying consecutive absolute returns filters out jumps"
    layer: 1
    chapter: 4
    requires: [jumps_vs_diffusion, rv_construction]
    connects_to:
      - { node_id: jump_component_feature, how: "BPV enables C/J decomposition" }
      - { node_id: pi_over_2_scaling, how: "the constant that makes BPV unbiased" }
    key_points:
      - "BPV = (pi/2) * sum(|r_i| * |r_{i-1}|)"
      - "Jump hits one interval but its neighbor is normal-sized, so the product is small"
      - "Converges to IV (not QV) even with jumps"
      - "The 'dilution' mechanism: isolated events get dampened"
      - "Barndorff-Nielsen and Shephard (2004)"
      - "Contrast with RV: RV -> IV+sum(J^2) (picks up jumps), BPV -> IV even with jumps"
    misconceptions:
      - "BPV uses absolute returns because squared are too noisy (the reason is jump robustness)"
      - "BPV is always better than RV (BPV has higher variance than RV when there are no jumps)"
      - "Two consecutive intervals can't both have jumps (unlikely but possible; assumption works in practice)"
    why_it_matters: "BPV is the workhorse for constructing the continuous component feature."

  - id: pi_over_2_scaling
    name: "Where the pi/2 constant in BPV comes from"
    layer: 1
    chapter: 4
    requires: [bpv_jump_robustness]
    connects_to:
      - { node_id: bpv_jump_robustness, how: "makes BPV unbiased for IV" }
    key_points:
      - "E[|Z|] = sqrt(2/pi) for Z~N(0,1)"
      - "So E[|Z|]^2 = 2/pi, not 1"
      - "Multiplying absolute returns introduces this bias vs. squaring"
      - "pi/2 = 1/(2/pi) is the exact correction"
    misconceptions:
      - "pi/2 is arbitrary (it's the precise mathematical correction for absolute-value bias)"
    why_it_matters: "Understanding this shows BPV is a principled estimator, not a hack."

  - id: jump_component_feature
    name: "How J_t = max(RV - BPV, 0) becomes a feature"
    layer: 1
    chapter: 4, 6
    requires: [bpv_jump_robustness, indicator_functions]
    connects_to:
      - { node_id: har_j_model, how: "HAR-J adds J_t as predictor" }
      - { node_id: har_cj_model, how: "HAR-CJ separates C and J at all horizons" }
      - { node_id: signed_jumps, how: "further decomposing J by sign" }
    key_points:
      - "J_t = max(RV_t - BPV_t, 0)"
      - "max() ensures non-negativity (measurement error can make RV < BPV on jumpless days)"
      - "C_t = BPV_t is the continuous component"
      - "Jumps are transient; continuous component carries the forecasting signal"
      - "WHY gate by jump_indicator -- only assign J^2 when BNS formally rejects, prevents estimation noise leaking"
      - "C autocorrelation 0.6-0.7, J autocorrelation 0.0-0.1"
    misconceptions:
      - "J_t = 0 means no jumps occurred (could be too small to detect or masked by measurement error)"
      - "max() is just for convenience (without it, negative jump estimates are meaningless)"
    why_it_matters: "This gives you separate C and J features where the model learns that C predicts and J doesn't."

  - id: har_j_model
    name: "How HAR-J adds jump info to the forecast"
    layer: 1
    chapter: 6
    requires: [har_model, jump_component_feature]
    connects_to:
      - { node_id: har_cj_model, how: "HAR-CJ extends decomposition to all horizons" }
      - { node_id: shar_model, how: "easily confused -- HAR-J separates jumps, SHAR separates sign" }
    key_points:
      - "Adds J_t as 4th regressor to standard HAR"
      - "beta_J typically negative and small (jumps don't persist)"
      - "Andersen Bollerslev Diebold (2007)"
      - "Most predictive power still from continuous component"
      - "WHY include if weak -- prevents jump contamination from inflating beta_d coefficient on jump days"
    misconceptions:
      - "HAR-J uses only the jump component (it adds jumps ON TOP of full HAR)"
    why_it_matters: "Demonstrates that explicitly modeling jumps helps, even if the coefficient is small."

  - id: har_cj_model
    name: "How HAR-CJ separates C and J at all time scales"
    layer: 1
    chapter: 6
    requires: [har_j_model]
    connects_to:
      - { node_id: jump_component_feature, how: "uses C and J at daily/weekly/monthly" }
      - { node_id: har_j_model, how: "HAR-J is the simpler version" }
    key_points:
      - "6 slope coefficients: C_d, C_w, C_m, J_d, J_w, J_m"
      - "Continuous coefficients large and significant"
      - "Jump coefficients small and often insignificant at weekly/monthly"
      - "Corsi Pirino Reno (2010)"
    misconceptions:
      - "More coefficients always means better (extra parameters can overfit with short samples)"
    why_it_matters: "Most complete linear C/J decomposition -- your ML model is the nonlinear generalization."

  - id: signed_jumps
    name: "Why separating positive from negative jumps adds signal"
    layer: 1
    chapter: 4, 10
    requires: [jump_component_feature, leverage_effect]
    connects_to:
      - { node_id: semivariances, how: "same sign-splitting logic applied to diffusion" }
      - { node_id: leverage_effect, how: "negative jumps amplify vol more -- same asymmetry" }
    key_points:
      - "J+ = squared returns from large positive moves > threshold"
      - "J- = squared returns from large negative moves > threshold"
      - "J- substantially more predictive of future vol"
      - "Adds 1-3% QLIKE improvement"
      - "Requires Lee-Mykland -- BNS can't assign direction to individual jumps"
    misconceptions:
      - "Signed jumps = semivariances (semivariances split ALL returns; signed jumps split only large/jump returns)"
    why_it_matters: "Cheap feature capturing asymmetric tail risk beyond what semivariances provide."

  # --- Cross-Cutting ---

  - id: triple_expansion
    name: "Why level/change/z-score triples features for free"
    layer: 1
    chapter: 10
    requires: [rv_construction]
    connects_to:
      - { node_id: harq_feature, how: "apply to sqrt(RQ)" }
      - { node_id: semivariances, how: "apply to RV- and RV+" }
    key_points:
      - "Level = current state, change = momentum, z-score = anomaly"
      - "Same value means different things at different scales (5c spread alarming for 3c stock, normal for 6c)"
      - "Multicollinearity harmless for trees (they pick best split)"
      - "Triples feature count from ~20 base to ~60-80"
    misconceptions:
      - "This introduces multicollinearity problems (only for linear models; trees handle it)"
      - "Z-score is always better than level (sometimes raw level is more informative)"
    why_it_matters: "Primary reason your feature count grows from ~10 base features to ~30-40 model inputs."

