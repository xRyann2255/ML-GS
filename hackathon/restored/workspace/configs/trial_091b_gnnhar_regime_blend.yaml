# Trial-091b: GNNHAR 1-layer with regime-blended GLASSO graph
#
# Treatment arm of the regime-graph experiment (Plan 09, Task 5).
# Identical to trial_091a except the graph method is regime_blend:
# splits the estimation window into calm/stress dates by trailing
# cross-sectional RV vs its within-window 75th percentile, builds
# a GLASSO graph on each subset, and emits the blend weighted by
# the window-end state (hard switching).
#
# Prior: tie expected (Brief B: monthly re-estimated single graph
# wins or ties; Cho & Lee's Hurst-triggered swap lost to periodic
# retraining). A tie IS a finding.
#
# Interpretation: regime-conditional QLIKE breakdown (top-25%
# trailing dispersion dates vs bottom-75%).

name: trial_091b_gnnhar_regime_blend
n_gpus: 8

universe: [SPY, AAPL, MSFT, NVDA, AVGO, GOOGL, AMZN, V, MA, XOM, PG,
           JNJ, HD, NFLX, TSLA, CRM, UNH, BAC, ADBE, IWM, DIA]

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

feature_layers: [har_core]

model:
  name: gnnhar
  params:
    hidden_dim: 9
    n_layers: 1
    loss: qlike
    n_seeds: 5
    max_epochs: 300
    early_stopping_rounds: 25
    learning_rate: 0.001
    device: auto
    seed: 42

graph:
  method: regime_blend
  input: returns
  window: 1000
  refit_every: 21
  min_history: 252
  node_features: [log_rv_d, log_rv_w, log_rv_m]
  params:
    base: glasso
    quantile: 0.75

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: false

training_mode: pooled
seed: 42
output_dir: data/models/trial_091b_gnnhar_regime_blend
