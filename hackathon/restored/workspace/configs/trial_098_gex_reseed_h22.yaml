# Trial-098: Multi-seed validation of trial-096 (dealer gamma) at h=22
#
# Hypothesis: Trial-096's single-seed XGBoost+GEX h=22 QLIKE (0.1615) is
# reproducible across seeds. If 5-seed mean ≤ 0.165, XGBoost+GEX is the
# new h=22 champion (beats HAR_IV 0.16755 and prior XGBoost 0.16731).
#
# Design: 5 identical XGBoost models (seeds 42/123/456/789/2024) with
# har_iv init + dealer_gamma feature layer. h=22 only to minimize compute.
# Same methodology as trial-067 (XGBoost reseed at h=1).
#
# Gate: 5-seed mean ≤ 0.165 AND 5-seed min < HAR_IV (0.16755).
# If pass: new h=22 champion. If fail: reject GEX for h=22.
#
# Baseline: trial_096 (single-seed h22=0.1615)

name: trial_098_gex_reseed_h22
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

date_range: ["2015-01-02", "2026-05-30"]
horizons: [22]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, dealer_gamma, calendar, tree_expansion]

model:
  name: xgboost
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    max_leaves: 16
    max_depth: 4
    min_child_weight: 150
    colsample_bytree: 0.8
    subsample: 0.8
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    device: "cuda"
    base_model: har_iv

n_gpus: 8

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

tournament:
  gsvivs_enabled: true
  gsvivs_short_threshold: 0.0030
  gsvivs_iv_sources:
    - spx_allday_vols
    - spx_allday_vols_tc
    - exec_kvar
    - edrvs_prev_close_1dte
    - spx_atm_iv_1d
    - spx_atm_iv_1w
  dh_enabled: false
  vt_enabled: false
  parallel_models: 5
  explainability:
    enabled: true
    methods: [treeshap, ale]
    treeshap_max_samples: 500
    treeshap_interaction: false
    ale_features: all
    ale_grid_size: 50
    models: [xgb_gex_seed_42]
  baseline: har_iv
  mcs_bootstrap: 10000
  models:
    - har
    - har_iv
    - xgb_gex_seed_42
    - xgb_gex_seed_123
    - xgb_gex_seed_456
    - xgb_gex_seed_789
    - xgb_gex_seed_2024
  model_configs:
    xgb_gex_seed_42:
      name: xgboost
      params:
        seed: 42
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv
    xgb_gex_seed_123:
      name: xgboost
      params:
        seed: 123
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv
    xgb_gex_seed_456:
      name: xgboost
      params:
        seed: 456
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv
    xgb_gex_seed_789:
      name: xgboost
      params:
        seed: 789
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
