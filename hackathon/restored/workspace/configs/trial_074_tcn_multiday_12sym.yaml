# Trial-074: Multi-day TCN with 12 symbols (more training data)
#
# Trial-072 had QLIKE=0.333 with 2 symbols (~1000 rows/fold).
# Expanding to 12 symbols gives ~6,000 rows/fold — should reduce
# overfitting and improve generalization.
#
# Same architecture as trial-072: 5 blocks, k=13, [32×5], 20-day lookback.

name: trial_074_tcn_multiday_12sym
universe: [SPY, AAPL, MSFT, AMZN, GOOGL, META, NVDA, JPM, V, UNH, HD, MA]
date_range: ["2015-01-02", "2024-12-31"]
horizons: [1]

feature_layers: [har_core]

model:
  name: tcn
  params:
    input_dim: 3
    n_channels: [32, 32, 32, 32, 32]
    kernel_size: 13
    dropout: 0.2
    learning_rate: 0.0003
    weight_decay: 0.0001
    max_epochs: 200
    batch_size: 64
    val_fraction: 0.15
    early_stopping_rounds: 20
    loss: qlike
    device: auto
    precision: auto
    seed: 42

sequences:
  source: parquet_5min_multiday
  features: [log_ret, abs_ret, rv_5min]
  max_bars: 1560
  lookback_days: 20
  norm_mode: pooled

cv:
  method: expanding_window
  purge_gap: 5
  train_size: 504
  test_size: 126

training_mode: pooled

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: false
  models:
    - tcn
    - har
