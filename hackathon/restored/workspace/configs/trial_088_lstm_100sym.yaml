date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

feature_layers: [har_core]

model:
  name: lstm
  params:
    hidden_dim: 128
    n_layers: 2
    dropout: 0.2
    bidirectional: true
    learning_rate: 5.0e-4
    weight_decay: 1.0e-4
    max_epochs: 80
    batch_size: 512
    val_fraction: 0.15
    val_purge_gap: 10
    early_stopping_rounds: 8
    loss: qlike
    device: auto
    precision: auto
    compile: false
    seed: 42
    pool_mode: attention
    head_mode: mlp

sequences:
  features:
    - log_ret
    - abs_ret
    - vol_share
    - buy_ratio
    - order_flow_imbalance
    - rolling_vpin
    - cum_rv
    - session_frac
    - price_accel
    - log_n_trades
    - intrabar_rv
    - volume_surprise
  max_bars: 78
  bar_interval: 300
  norm_mode: per_symbol
  source: parquet

n_gpus: 8

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 2000
  test_size: 252

training_mode: pooled
seed: 42

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: true
  gsvivs_short_threshold: 0.0030
  gsvivs_iv_sources:
    - spx_allday_vols
    - spx_allday_vols_tc
    - exec_kvar
    - edrvs_prev_close_1dte
    - spx_atm_iv_1d
    - spx_atm_iv_1w
  parallel_models: 1
  models:
    - har
    - har_iv
    - lstm
  baseline: har_iv

output_dir: data/models/trial_088_lstm_100sym
