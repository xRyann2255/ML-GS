# Trial-088: LSTM 5-min enriched scaled to 100-symbol universe
#
# Hypothesis: LSTM with 5-min enriched sequences (trial-073 architecture)
# trained on 100 symbols (pooled) improves QLIKE over the 2-symbol config
# by exposing the LSTM to much more cross-sectional variation. With 100
# symbols × 2000 training days = 200K sequences per fold, the LSTM has
# sufficient data to learn generalizable intraday patterns.
#
# Same architecture as trial-073 (best LSTM: QLIKE 0.1998, only 11 bps
# below HAR, in MCS, DM p=0.076):
#   - Bidirectional LSTM, hidden_dim=128, 2 layers
#   - 78 bars × 12 enriched features (5-min aggregation)
#   - train_size=2000, attention pooling
#
# Risk: 100-symbol pooled training is ~50× more data per epoch. May need
# more epochs or larger batch size. Some symbols may have shorter sequence
# history. GPU memory should be fine (78×12 is small per sample).
#
# Baseline: trial_073_lstm_5min_train2000_h1.yaml (2 symbols)

