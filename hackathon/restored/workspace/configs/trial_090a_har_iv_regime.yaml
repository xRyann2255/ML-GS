# Trial-090a: XGBoost champion + regime feature layer
#
# Arm A of the regime-feature experiment (Plan 09, Task 5).
# Baseline: trial_063 (XGBoost champion without regime).
#
# Adds the filtered Markov-switching regime probability (regime_prob_d,
# regime_prob_w) as two extra features to the champion feature stack.
# Prior: Fang & Ślepaczuk (2026) found -5.1% QLIKE on HARQ/CSI300 with
# DM significance; expect smaller on SPX/US panel.
#
# Interpretation protocol: regime-conditional QLIKE breakdown
# (median-split + top-25% regime probability dates vs bottom-75%).

name: trial_090a_har_iv_regime
n_gpus: 8

universe: [SPY, AAPL, MSFT, NVDA, AVGO, GOOGL, AMZN, V, MA, XOM, PG,
           JNJ, HD, NFLX, TSLA, CRM, UNH, BAC, ADBE, IWM, DIA]

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

# Champion features + regime layer
feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion, regime]

model:
  name: xgboost
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    max_leaves: 16
    max_depth: 4
    min_child_weight: 150
    colsample_bytree: 0.8
    subsample: 0.8
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    device: "cuda"
    base_model: har_iv_1w

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

horizon_overrides:
  1:
    model:
      params:
        base_model: har_iv_0dte
  22:
    model:
      params:
        base_model: har_iv

tournament:
  gsvivs_enabled: true
  gsvivs_short_threshold: 0.0030
  gsvivs_iv_sources:
    - spx_allday_vols
    - spx_allday_vols_tc
    - exec_kvar
    - edrvs_prev_close_1dte
    - spx_atm_iv_1d
    - spx_atm_iv_1w
  dh_enabled: false

explainability:
  enabled: true
  method: treeshap

seed: 42
output_dir: data/models/trial_090a_har_iv_regime
