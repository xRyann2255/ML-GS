# Trial-071: Multi-feature TCN with 20-day lookback (DeepVol architecture)
#
# Extends trial-070 with:
#   1. Multi-feature input (log_ret, abs_ret, rv_5min) → input_dim=3
#   2. 20-day lookback: D=20 × 78 bars = 1,560 timesteps per sequence
#   3. Deeper TCN (8 blocks) for receptive field = 3,060 > 1,560
#   4. Longer training (200 epochs) with GPU
#
# Architecture: 8 residual blocks with dilations [1,2,4,8,16,32,64,128],
# kernel_size=7. RF = 2×6×255 = 3,060 > 1,560 → full sequence coverage.

name: trial_071_tcn_multiday_h1
universe: [SPY, AAPL]
date_range: ["2015-01-02", "2024-12-31"]
horizons: [1]

feature_layers: [har_core]

model:
  name: tcn
  params:
    input_dim: 3
    n_channels: [64, 64, 64, 64, 32, 32, 32, 32]
    kernel_size: 7
    dropout: 0.2
    learning_rate: 0.001
    weight_decay: 0.0001
    max_epochs: 200
    batch_size: 32
    val_fraction: 0.15
    early_stopping_rounds: 15
    loss: qlike
    device: auto
    precision: auto
    seed: 42

sequences:
  source: parquet_5min_multiday
  features: [log_ret, abs_ret, rv_5min]
  max_bars: 1560
  lookback_days: 20
  norm_mode: pooled

cv:
  method: expanding_window
  purge_gap: 5
  train_size: 504
  test_size: 126

training_mode: pooled

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: false
  models:
    - tcn
    - har
