# Trial-084: Attention Upgrades — GATv2 vs TransformerConv vs edge-features
#
# Hypothesis: input-dependent attention weights (GATv2/TransformerConv) beat fixed
# GLASSO weights on our universe under QLIKE + DM. The edge-feature arm (SpotV2Net-
# style vol-of-vol on edges) is the most likely winner if any — "features over
# topology" (Brini & Toscano 2024). A null result is a finding.
#
# NOTE: attention may lose. The honest conclusion "fixed weights suffice" is thesis-
# grade. No published vol paper has shown attention beats fixed weights under QLIKE
# with significance tests.
#
# COVID handling: included (expanding window).
# Depends on: trial-083 gates passing (gnnhar_1l beats ghar + stid).

name: trial_084_attention_upgrades
n_gpus: 8

universe: [SPY, AAPL, MSFT, NVDA, AVGO, GOOGL, AMZN, V, MA, XOM, PG,
           JNJ, HD, NFLX, TSLA, CRM, UNH, BAC, ADBE, IWM, DIA]

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

feature_layers: [har_core, asymmetry, vol_of_vol]

model:
  name: gnn
  params:
    hidden_dim: 32
    n_heads: 4
    loss: qlike

graph:
  method: glasso
  window: 1000
  refit_every: 21
  min_history: 252
  input: returns
  node_features: [log_rv_d, log_rv_w, log_rv_m, signed_return_d, abs_ret_d,
                  log_rs_negative_d, log_jump_d, log_bpv_d, log_cont_d, vov_d]
  params: {}

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

tournament:
  models: [har, gnnhar_1l, gnn_gatv2, gnn_edgefeat, gnn_transformer]
  baseline: har
  mcs_bootstrap: 10000
  parallel_models: 1
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: false
  model_configs:
    gnnhar_1l:
      name: gnnhar
      params: {hidden_dim: 9, n_layers: 1, loss: qlike, n_seeds: 5}
    gnn_gatv2:
      name: gnn
      params: {hidden_dim: 32, n_heads: 4, loss: qlike, conv_type: gatv2}
    gnn_edgefeat:
      name: gnn
      params: {hidden_dim: 32, n_heads: 4, loss: qlike, conv_type: gatv2}
      graph: {method: glasso, window: 1000, refit_every: 21, min_history: 252,
              input: returns, edge_features: volofvol,
              node_features: [log_rv_d, log_rv_w, log_rv_m, signed_return_d, abs_ret_d,
                              log_rs_negative_d, log_jump_d, log_bpv_d, log_cont_d, vov_d]}
    gnn_transformer:
      name: gnn
      params: {hidden_dim: 32, n_heads: 4, loss: qlike, conv_type: transformer}

training_mode: pooled
seed: 42
output_dir: data/models/trial_084_attention_upgrades
