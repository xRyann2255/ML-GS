# Trial-097b: GSVIVS01 signals multi-seed validation
#
# Hypothesis: Trial-097's single-seed enriched-vs-champion QLIKE gap is
# not a seed artifact — the `gsvivs_signals` layer's contribution should
# persist across seeds.
#
# Design: 3 XGBoost seeds per variant (42/123/456), matched pairwise.
# Every hyperparameter — including base_model / horizon_overrides — is
# identical to trial-097. The only difference between the two arms is
# the presence of `gsvivs_signals` in `feature_layers`.
#
# Compare arm means and worst-seed outcomes; Diebold-Mariano across the
# six ensembles rather than a single seed.
#
# Baseline retained (ewma, har, har_iv) for reference against trial-097.

name: trial_097b_gsvivs_multiseed
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

# Top-level UNION of feature layers: `iv_surface` loads enrichment columns
# used by both arms; `gsvivs_signals` is only consumed by the enriched arm.
feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, gsvivs_signals, tree_expansion]

model:
  name: xgboost
  params:
    n_estimators: 10000
    early_stopping_rounds: 150
    learning_rate: 0.01
    max_leaves: 16
    max_depth: 4
    min_child_weight: 150
    colsample_bytree: 0.8
    subsample: 0.8
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    device: "cuda"
    base_model: har_iv_1w

n_gpus: 8

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

# Per-horizon init: exact tenor matching (same as trial-063/097)
horizon_overrides:
  1:
    model:
      params:
        base_model: har_iv_0dte
  22:
    model:
      params:
        base_model: har_iv

tournament:
  gsvivs_enabled: true
  gsvivs_short_threshold: 0.0030
  gsvivs_iv_sources:
    - spx_allday_vols
    - spx_allday_vols_tc
    - exec_kvar
    - edrvs_prev_close_1dte
    - spx_atm_iv_1d
    - spx_atm_iv_1w
  dh_enabled: false
  vt_enabled: false
  parallel_models: 1
  explainability:
    enabled: true
    methods: [treeshap, ale]
    treeshap_max_samples: 500
    treeshap_interaction: false
    ale_features: all
    ale_grid_size: 50
    models: [xgb_enriched_seed_42, xgb_champion_seed_42]
  baseline: har_iv
  mcs_bootstrap: 10000
  models:
    - ewma
    - har
    - har_iv
    - xgb_champion_seed_42
    - xgb_champion_seed_123
    - xgb_champion_seed_456
    - xgb_enriched_seed_42
    - xgb_enriched_seed_123
    - xgb_enriched_seed_456
  model_configs:
    xgb_champion_seed_42:
      name: xgboost
      feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]
      params:
        seed: 42
        n_estimators: 10000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv_1w
    xgb_champion_seed_123:
      name: xgboost
      feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]
      params:
        seed: 123
        n_estimators: 10000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv_1w
    xgb_champion_seed_456:
      name: xgboost
      feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]
      params:
        seed: 456
        n_estimators: 10000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv_1w
    xgb_enriched_seed_42:
      name: xgboost
      feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, gsvivs_signals, tree_expansion]
      params:
        seed: 42
        n_estimators: 10000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv_1w
    xgb_enriched_seed_123:
      name: xgboost
      feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, gsvivs_signals, tree_expansion]
      params:
        seed: 123
        n_estimators: 10000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv_1w
    xgb_enriched_seed_456:
      name: xgboost
      feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, gsvivs_signals, tree_expansion]
      params:
        seed: 456
        n_estimators: 10000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv_1w

training_mode: pooled
seed: 42
output_dir: data/models/trial_097b_gsvivs_multiseed
