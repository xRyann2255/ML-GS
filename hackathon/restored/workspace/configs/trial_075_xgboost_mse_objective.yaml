# Trial-075: XGBoost with MSE objective (comparison to QLIKE-trained champion)
#
# Hypothesis: Training XGBoost on MSE (reg:squarederror) instead of custom QLIKE
# objective produces worse QLIKE scores but potentially different prediction
# characteristics. This is a direct A/B comparison of loss function impact.
#
# Everything else is IDENTICAL to trial-063 (same features, same CV, same
# hyperparameters, same init). Only the training objective changes.
#
# Baseline: trial_063_xgboost_champion.yaml (QLIKE objective)

name: trial_075_xgboost_mse_objective
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

model:
  name: xgboost
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    max_leaves: 16
    max_depth: 4
    min_child_weight: 150
    colsample_bytree: 0.8
    subsample: 0.8
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    device: "cuda"
    base_model: har_iv_1w
    objective: mse

n_gpus: 8

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

# Per-horizon init: exact tenor matching (same as trial-063)
horizon_overrides:
  1:
    model:
      params:
        base_model: har_iv_0dte
  22:
    model:
      params:
        base_model: har_iv

tournament:
  gsvivs_enabled: true
  gsvivs_short_threshold: 0
  gsvivs_iv_sources:
    - exec_kvar
    - edrvs_prev_close_1dte
    - spx_atm_iv_1d
    - spx_atm_iv_1w
  dh_enabled: false
  vt_enabled: false
  parallel_models: 1
  explainability:
    enabled: true
    methods: [treeshap, ale]
    treeshap_max_samples: 500
    ale_features: top_20
    models: [xgb_mse, xgb_qlike]
  models:
    - ewma
    - har
    - har_iv
    - har_iv_1w
    - har_iv_0dte
    - same_day_rv
    - xgb_qlike
    - xgb_mse
  baseline: har_iv
  mcs_bootstrap: 10000
  model_configs:
    xgb_qlike:
      name: xgboost
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv_0dte
    xgb_mse:
      name: xgboost
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv_0dte
        objective: mse

training_mode: pooled
seed: 42
output_dir: data/models/trial_075_xgboost_mse_objective
