# BROKEN: truncated mid-key in explainability section, do not use
# Trial-067 XGBoost champion — single-fold eval aligned to GSVIVS01 inception
#
# Purpose: Train on ALL data before 2022-05-25, evaluate from 2022-05-25 onward.
# This aligns OOS evaluation with the GSVIVS01 strategy inception date.
#
# Approach: Set train_size large enough (~1855 unique trading dates from
# 2015-01-02 to ~2022-05-15) so that with purge_gap=10 the first test date
# lands around 2022-05-25. test_size=1200 ensures the stub fold covers all
# remaining dates through end of data.
#
# Model: Identical to trial_063_xgboost_champion.yaml (the trial-067 reseed base).
# Only CV config differs — single fold instead of expanding window with 504-day init.

name: trial_067_xgb_gsvivs01_eval
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA
date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

model:
  name: xgboost
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    max_leaves: 16
    max_depth: 4
    min_child_weight: 150
    colsample_bytree: 0.8
    subsample: 0.8
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    device: "cuda"
    base_model: har_iv_0dte

n_gpus: 8

cv:
  method: expanding_window
  purge_gap: 10
  # ~1855 trading dates from 2015-01-02 covers through ~mid-May 2022.
  # With purge_gap=10, first test date lands around 2022-05-25 (GSVIVS01 inception).
  train_size: 1855
  # Larger than remaining dates — forces a single stub fold covering all post-inception data.
  test_size: 1200

tournament:
  gsvivs_enabled: true
  gsvivs_short_threshold: 0
  gsvivs_iv_sources:
    - exec_kvar
    - edrvs_prev_close_1dte
    - spx_atm_iv_1d
    - spx_atm_iv_1w
  dh_enabled: false
  vt_enabled: false
  parallel_models: 1
  explainability:
