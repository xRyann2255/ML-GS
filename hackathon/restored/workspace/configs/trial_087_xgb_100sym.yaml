# Trial-087: XGBoost champion scaled to 100-symbol universe
#
# Hypothesis: XGBoost champion (trial-067 architecture) trained on 100 symbols
# (pooled) improves QLIKE over the 21-symbol pooled model by exposing the tree
# to ~5x more cross-sectional variation. More training samples per fold should
# reduce variance and potentially improve generalization.
#
# Same hyperparameters as trial-063 champion. Only change: universe expanded
# from 21 to 100 symbols (all symbols with OHLCV + ticks coverage).
#
# Risk: some symbols have shorter history or sparser IV data. The tree should
# handle NaN features gracefully, but QLIKE evaluation must be apples-to-apples
# (compare on the original 21-symbol subset for backward compatibility).
#
# Baseline: trial_063_xgboost_champion.yaml (21 symbols)

