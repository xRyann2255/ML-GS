# Trial-090 (Plan-10 headline): Grand GNN Tournament
#
# ONE pooled tournament: every graph architecture + HAR-family incumbents + tree
# champions, scored under QLIKE + panel-DM + 5% MCS + turbulence-split conditional
# QLIKE (Plan 10 Task 1). This is the capstone results table.
#
# Roster (13 models):
#   Naive/HAR bar:   ewma, har, har_iv (baseline), ridge_har_cj_iv_0dte (best HAR-family)
#   Tree champions:  xgboost (trial-063 params), lightgbm (trial-036 champion params)
#   Graph:           ghar (trial-081 winning graph = glasso placeholder),
#                    stid, gnnhar_1l (trial-083 Gate arms),
#                    gnn_best = gnn_gatv2 (trial-084 best attention arm; all arms tied
#                    within seed envelope in trials.yaml, use gatv2 per packet fallback),
#                    dcrnn_har (trial-085),
#                    gsp_har, gnn_learned (trial-086 spectral + learned adjacency)
#
# Expected-gains priors (GNNHAR literature, printed here for line-by-line contrast
# against whatever we actually find):
#   h=1  : ~3-4% QLIKE improvement of best graph over har_iv
#   h=5  : ~8%    QLIKE improvement of best graph over har_iv
#   h=22 : ~0%    QLIKE improvement (horizon fade — the null result to expect)
#
# COVID handling: included; expanding window absorbs it; conditional QLIKE + turbulence-
# split (top-decile SPY-RV dates, Plan 10 Task 1) reports regime-specific outcomes.
#
# Notes:
#   - gsp_har and gnn_learned use published-recipe params (Plan 07 scaffold) pending
#     trial-086 completion. Once trial-086 verdicts land, refresh those two blocks
#     with the winning arm params.
#   - feature_layers omits tree_expansion for pooled fairness across graph+tree arms;
#     this is a mild handicap for xgboost/lightgbm vs their standalone champions
#     (trial-036/063) and must be flagged in the interpretation writeup.
#   - checkpoint_enabled + fold_cache_enabled = true — this run is long; resume must work.
#   - parallel_models: 1 — each GPU arm owns all 8 GPUs via fold parallelism;
#     HAR-family arms are instant so sequential dispatch has near-zero overhead.

name: trial_090_gnn_grand_tournament
n_gpus: 8

universe: [SPY, AAPL, MSFT, NVDA, AVGO, GOOGL, AMZN, V, MA, XOM, PG,
           JNJ, HD, NFLX, TSLA, CRM, UNH, BAC, ADBE, IWM, DIA]

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, vol_of_vol]

# Primary "main" model (tournament dispatch owns per-arm configs below).
model:
  name: gnnhar
  params: {}

# Experiment-level default graph = trial-081 winner (glasso placeholder).
# Per-arm graph overrides live in tournament.model_configs.
graph:
  method: glasso
  input: returns
  window: 1000
  refit_every: 21
  min_history: 252
  node_features: [log_rv_d, log_rv_w, log_rv_m, signed_return_d, abs_ret_d,
                  log_rs_negative_d, log_jump_d, log_bpv_d, log_cont_d]
  params: {}

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

tournament:
  models:
    - ewma
    - har
    - har_iv
    - ridge_har_cj_iv_0dte
    - xgboost
    - lightgbm
    - ghar
    - stid
    - gnnhar_1l
    - gnn_best
    - dcrnn_har
    - gsp_har
    - gnn_learned
  baseline: har_iv
  mcs_bootstrap: 10000
  parallel_models: 1
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: false
  model_configs:
    # -- HAR-family champion (trial-055/078: alpha irrelevant, use canonical 1.0) --
    ridge_har_cj_iv_0dte:
      name: ridge_har_cj_iv_0dte
      params: {alpha: 1.0}

    # -- Tree champions (verbatim from trial-063/036 model_configs) --
    xgboost:
      name: xgboost
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"
        base_model: har_iv_0dte
    lightgbm:
      name: lightgbm
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte

    # -- Graph arms --
    # GHAR with trial-081's winning graph = glasso placeholder (mirrors trial-082 ghar_glasso).
    ghar:
      name: ghar
      params: {}
      graph:
        method: glasso
        input: returns
        window: 1000
        refit_every: 21
        min_history: 252
        node_features: [log_rv_d, log_rv_w, log_rv_m]
        params: {}

    # STID identity-embedding control (verbatim from trial-083 model_configs.stid).
    stid:
      name: stid
      params:
        embed_dim: 16
        hidden_dim: 64
        loss: qlike
        max_epochs: 300
        early_stopping_rounds: 25
        device: auto
        seed: 42

    # GNNHAR-1L on winning graph (verbatim from trial-083 model_configs.gnnhar_1l,
    # with explicit graph override to trial-081 winning glasso).
    gnnhar_1l:
      name: gnnhar
      params:
        hidden_dim: 9
        n_layers: 1
        loss: qlike
        n_seeds: 5
        max_epochs: 300
        early_stopping_rounds: 25
        learning_rate: 0.001
        device: auto
        seed: 42
      graph:
        method: glasso
        input: returns
        window: 1000
        refit_every: 21
        min_history: 252
        node_features: [log_rv_d, log_rv_w, log_rv_m]
        params: {}

    # Best attention arm = gnn_gatv2 (trial-084 arms tied within seed envelope;
    # packet fallback to gnn_gatv2). Verbatim from trial-084 model_configs.gnn_gatv2.
    gnn_best:
      name: gnn
      params:
        hidden_dim: 32
        n_heads: 4
        loss: qlike
        conv_type: gatv2

    # DCRNN-HAR with dynamic DY graph (verbatim from trial-085 model_configs.dcrnn_har).
    dcrnn_har:
      name: dcrnn_har
      params:
        hidden_dim: 16
        k: 2
        seq_len: 22
        loss: qlike
        max_epochs: 150
        early_stopping_rounds: 15
        device: auto
        seed: 42
      graph:
        method: dy
        input: log_rv
        window: 252
        refit_every: 1
        min_history: 100
        node_features: [log_rv_d, log_rv_w, log_rv_m]
        params: {var_lags: 4, fevd_horizon: 10, threshold: 0.05}

    # GSP-HAR spectral (verbatim from trial-086 scaffold; refresh after trial-086 lands).
    gsp_har:
      name: gsp_har
      params:
        q: 0.25
        loss: qlike
        n_seeds: 5
        max_epochs: 300
        early_stopping_rounds: 25
        learning_rate: 0.001
        device: auto
        seed: 42
      graph:
        method: dy
        input: log_rv
        window: 252
        refit_every: 21
        min_history: 100
        node_features: [log_rv_d, log_rv_w, log_rv_m]
        params: {var_lags: 4, fevd_horizon: 10, threshold: 0.05}

    # MTGNN-style learned adjacency (verbatim from trial-086 scaffold; refresh
    # after trial-086 lands).
    gnn_learned:
      name: gnn_learned
      params:
        embed_dim: 8
        top_k: 5
        hidden_dim: 9
        loss: qlike
        n_seeds: 5
        max_epochs: 300
        early_stopping_rounds: 25
        learning_rate: 0.001
        device: auto
        seed: 42
      graph:
        method: identity

# Resume-critical (long-running trial): cache fold sequences + checkpoint per-model.
checkpoint_enabled: true
fold_cache_enabled: true

training_mode: pooled
seed: 42
output_dir: data/models/trial_090_gnn_grand_tournament
