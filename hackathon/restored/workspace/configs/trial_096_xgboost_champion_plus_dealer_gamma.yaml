# Trial-096: XGBoost champion + dealer gamma (GEX) features
#
# Motivation: Clean feature ablation on the XGBoost champion (trial-063).
# Adds dealer gamma exposure (5 GEX features) as a new feature layer.
# Identical hyperparameters, universe, CV — only feature_layers changes.
#
# Baseline: trial_063_xgboost_champion.yaml
# Data dependency: data/raw/options_oi/spx_gex_daily.parquet must be
# backfilled over the training window before running this trial.
#
# GEX features added: gex_sign_d, gex_zscore_d, gex_quintile_d,
# gex_regime_d, gex_momentum_d (SPX-only, broadcast to panel)

name: trial_096_xgboost_champion_plus_dealer_gamma
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, dealer_gamma, calendar, tree_expansion]

model:
  name: xgboost
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    max_leaves: 16
    max_depth: 4
    min_child_weight: 150
    colsample_bytree: 0.8
    subsample: 0.8
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 1
    device: "cuda"
    base_model: har_iv_1w

n_gpus: 8

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

# Per-horizon init: exact tenor matching (same as trial-036)
horizon_overrides:
  1:
    model:
      params:
        base_model: har_iv_0dte
  22:
    model:
      params:
        base_model: har_iv

tournament:
  gsvivs_enabled: true
  gsvivs_short_threshold: 0
  gsvivs_iv_sources:
    - spx_allday_vols
    - spx_allday_vols_tc
    - exec_kvar
    - edrvs_prev_close_1dte
    - spx_atm_iv_1d
    - spx_atm_iv_1w
  dh_enabled: false
  vt_enabled: false
  parallel_models: 1
  explainability:
    enabled: true
    methods: [treeshap, ale]
    treeshap_max_samples: 500
    treeshap_interaction: false
    ale_features: all
    ale_grid_size: 50
    models: [xgboost]
  models:
    - ewma
    - har
    - har_iv
    - har_iv_1w
    - same_day_rv
    - xgboost
  baseline: har_iv
  mcs_bootstrap: 10000
  model_configs:
    xgboost:
      name: xgboost
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 1
        device: "cuda"
        base_model: har_iv_0dte

training_mode: pooled
seed: 42
output_dir: data/models/trial_096_xgboost_champion_plus_dealer_gamma
