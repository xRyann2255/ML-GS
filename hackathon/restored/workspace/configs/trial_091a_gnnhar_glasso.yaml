# Trial-091a: GNNHAR 1-layer with plain GLASSO graph (baseline)
#
# Baseline arm of the regime-graph experiment (Plan 09, Task 5).
# Mirrors the GNNHAR 1-layer arm from trial_083 for direct comparison
# against the regime_blend graph arm (trial_091b).
#
# This is the control: single monthly GLASSO graph, no regime conditioning.

name: trial_091a_gnnhar_glasso
n_gpus: 8

universe: [SPY, AAPL, MSFT, NVDA, AVGO, GOOGL, AMZN, V, MA, XOM, PG,
           JNJ, HD, NFLX, TSLA, CRM, UNH, BAC, ADBE, IWM, DIA]

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

feature_layers: [har_core]

model:
  name: gnnhar
  params:
    hidden_dim: 9
    n_layers: 1
    loss: qlike
    n_seeds: 5
    max_epochs: 300
    early_stopping_rounds: 25
    learning_rate: 0.001
    device: auto
    seed: 42

graph:
  method: glasso
  input: returns
  window: 1000
  refit_every: 21
  min_history: 252
  node_features: [log_rv_d, log_rv_w, log_rv_m]
  params: {}

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: false

training_mode: pooled
seed: 42
output_dir: data/models/trial_091a_gnnhar_glasso
