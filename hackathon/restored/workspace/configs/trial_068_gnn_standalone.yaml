# Trial-068: GNN standalone evaluation
#
# Purpose: Evaluate how the GNN performs on its own by using XGBoost with
# ONLY GNN-produced features (no HAR/options/calendar features).
#
# Architecture:
#   GNN (2-layer GATv2) → produces per-node predictions via cross-asset spillover
#   XGBoost receives ONLY: gnn_prediction + gnn_node_attention
#   This isolates GNN's contribution — XGBoost is just a thin pass-through/calibrator.
#
# What GNN outputs (as features fed to XGBoost):
#   1. gnn_prediction: per-symbol log-RV forecast from the graph attention network.
#      The GNN learns how volatility propagates across the 21-symbol network by
#      attending to correlated neighbors (e.g., NVDA vol spike → AVGO should rise).
#   2. gnn_node_attention: mean incoming attention weight per node — a measure of
#      how much "volatility signal" flows into this symbol from its neighbors.
#      High attention = this symbol is strongly influenced by network effects.
#
# Baseline: Compare QLIKE here vs trial-063 (XGBoost champion with all features).
# If GNN standalone is competitive, it validates the cross-asset signal hypothesis.

name: trial_068_gnn_standalone
n_gpus: 8

universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

# Minimal feature layers — XGBoost gets almost nothing except GNN outputs
feature_layers: [har_core]

model:
  name: xgboost
  params:
    n_estimators: 1000
    early_stopping_rounds: 50
    learning_rate: 0.05
    max_leaves: 8
    max_depth: 3
    min_child_weight: 100
    colsample_bytree: 1.0
    subsample: 1.0
    reg_lambda: 1.0
    reg_alpha: 0.0
    val_fraction: 0.15
    val_purge_gap: 10

# ---------------------------------------------------------------------------
# Feature stack: GNN prediction + attention as the primary signal
# ---------------------------------------------------------------------------
feature_stack:
  source_model: gnn
  outputs: [prediction, node_attention]
  independent: true
  model_params:
    hidden_dim: 32
    n_heads: 4
    n_layers: 2
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 1.0e-4
    max_epochs: 200
    batch_size: 32
    val_fraction: 0.15
    early_stopping_rounds: 15
    loss: qlike
    adj_window: 60
    adj_threshold: 0.3
    device: auto
    precision: auto
    seed: 42
  sequences:
    source: daily_lookback
    features:
      - log_rv_d
      - log_rv_w
      - log_rv_m
      - signed_return_d
      - abs_ret_d
      - log_rs_negative_d
      - log_jump_d
      - log_bpv_d
      - log_cont_d
    max_bars: 1
    norm_mode: pooled

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

training_mode: pooled
seed: 42
output_dir: data/models/trial_068_gnn_standalone
