# Trial-072: Prediction blending — XGBoost + LightGBM (tabular-only)
#
# Hypothesis: Blending XGBoost and LightGBM tabular predictions via
# inverse-QLIKE weighting produces lower QLIKE than either model alone
# at h=1. The two tree models use different splitting algorithms and
# regularization strategies, providing diversity in predictions.
#
# Architecture:
#   - Sub-model 1: XGBoost (trial-063 champion spec)
#   - Sub-model 2: LightGBM (complementary hyperparameters)
#   - Blend: inverse_qlike weighting calibrated on 20% temporal holdout
#
# Baseline: trial_063_xgboost_champion (QLIKE 0.1292 at h=1)
# Note: LSTM sub-model deferred until sequence dispatch is wired into blend path

name: trial_072_blend_xgb_lstm_h1
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA
date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

# Union of all sub-model feature layers (runner builds superset)
feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

model:
  name: blend

blend:
  weight_method: inverse_qlike
  val_fraction: 0.20
  val_purge_gap: 10

  models:
    - name: xgboost
      feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        device: "cuda"

    - name: lightgbm
      feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.015
        num_leaves: 24
        max_depth: 5
        min_child_samples: 100
        colsample_bytree: 0.7
        subsample: 0.85
        reg_lambda: 3.0
        reg_alpha: 0.05
        val_fraction: 0.15
        val_purge_gap: 10

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

tournament:
  gsvivs_enabled: true
  gsvivs_short_threshold: 0
  dh_enabled: false
  vt_enabled: false
  parallel_models: 1
