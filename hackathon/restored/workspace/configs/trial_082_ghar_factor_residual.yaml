# Trial-082: GHAR factor-residual graph arm — follow-up to trial_081.
#
# Hypothesis: idiosyncratic (factor-residual) edges beat raw-correlation edges for
# cross-asset volatility spillover, isolating the "pure" network effect after removing
# common factor covariance (Cartea et al. 2026 design). Run only if trial_081 gates
# through (best graph beats identity, DM p < 0.05).
# COVID handling: included; expanding window.

name: trial_082_ghar_factor_residual
n_gpus: 1

universe: [SPY, AAPL, MSFT, NVDA, AVGO, GOOGL, AMZN, V, MA, XOM, PG,
           JNJ, HD, NFLX, TSLA, CRM, UNH, BAC, ADBE, IWM, DIA]

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

feature_layers: [har_core]

model:
  name: ghar
  params: {}

graph:
  method: glasso
  input: returns
  window: 1000
  refit_every: 21
  min_history: 252
  node_features: [log_rv_d, log_rv_w, log_rv_m]
  params: {}

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

tournament:
  models: [har, ghar_glasso, ghar_factor_residual]
  baseline: har
  mcs_bootstrap: 10000
  parallel_models: 4
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: false
  model_configs:
    ghar_glasso:
      name: ghar
      params: {}
      graph: {method: glasso, input: returns, window: 1000, refit_every: 21,
              min_history: 252, node_features: [log_rv_d, log_rv_w, log_rv_m]}
    ghar_factor_residual:
      name: ghar
      params: {}
      graph: {method: factor_residual, input: returns, window: 1000, refit_every: 21,
              node_features: [log_rv_d, log_rv_w, log_rv_m],
              params: {base: corr, factor: mean, threshold: 0.4}}

training_mode: pooled
seed: 42
output_dir: data/models/trial_082_ghar_factor_residual
