# Trial-065: Rosenbaum/Zhang (2022) style LSTM — faithful replication
#
# Replicates the architecture from "On the Universality of the Volatility
# Formation Process" (arXiv:2206.14114) as closely as possible.
#
# Paper specs:
#   - Input: 22-day lookback of (σ², r_t) — we use (log_rv_d, signed_return_d)
#   - Architecture: 2-layer LSTM, hidden_dim=2, final hidden state, linear head
#   - Training: MSE loss, Adam lr=1e-3, batch=512, no early stopping
#   - Pooled across all stocks (universality hypothesis)
#   - Paper has 862 stocks × 1500 days = 1.3M rows → 12,500 grad steps in 5 epochs
#
# Adaptation for our dataset (21 symbols, ~10K rows/fold):
#   - max_epochs=200 to compensate for 100x fewer samples (→ ~4000 grad steps)
#   - MSE loss (matching paper) — QLIKE evaluated post-hoc by tournament
#   - log(RV) space (matches our target definition)
#   - Per-fold z-scoring (paper normalises over full history — minor difference)

name: trial_065_rosenbaum_daily_lstm
n_gpus: 8

universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

date_range: ["2015-01-02", "2024-12-31"]
horizons: [1]

# Feature layers needed to produce the daily columns referenced by sequences.features
feature_layers: [har_core, asymmetry]

model:
  name: lstm
  params:
    hidden_dim: 32
    n_layers: 2
    dropout: 0.0
    bidirectional: false
    learning_rate: 0.001
    weight_decay: 0.0
    max_epochs: 200
    batch_size: 512
    val_fraction: 0.0
    early_stopping_rounds: null
    loss: mse
    device: auto
    precision: auto
    compile: false
    seed: 42
    symbol_embed_dim: 0
    pool_mode: last_hidden
    head_mode: linear

sequences:
  source: daily_lookback
  features:
    - log_rv_d
    - log_rv_w
    - log_rv_m
    - signed_return_d
    - abs_ret_d
  max_bars: 22
  norm_mode: pooled

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

training_mode: pooled

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: true
  parallel_models: 4
  models:
    - lstm
    - har
    - har_iv
    - har_iv_0dte
    - lgbm_hariv0dte_init
  model_configs:
    lgbm_hariv0dte_init:
      name: lightgbm
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte
