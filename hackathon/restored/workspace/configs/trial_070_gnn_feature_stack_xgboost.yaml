# Trial-070: GNN (Graph Attention Network) feature stacking INTO XGBoost champion
#
# Architecture:
#   GNN (2-layer GATv2, 4 heads, rolling 60d correlation adjacency)
#     → trains independently to predict log-RV per symbol using cross-asset graph
#   XGBoost (trial-063 spec + gnn_prediction as extra feature) → final prediction
#
# Why GNN may succeed where LSTM failed:
#   LSTM saw the SAME features on a SINGLE symbol across time — temporal patterns
#   that XGBoost already captures via lag features. Zero marginal information.
#
#   GNN provides ORTHOGONAL information: cross-asset graph structure. XGBoost sees
#   each (symbol, date) row independently — it cannot learn "NVDA vol spiked and
#   AVGO is a downstream neighbor, so AVGO vol should rise." That relationship
#   lives in the graph topology, not in any single row's columns.
#
# Key references:
#   - Zhang, Pu, Cucuringu & Dong (2025, Int. J. Forecasting): GATv2 + QLIKE loss
#     + one-hop spillovers outperform univariate models on multi-asset RV
#   - Chen & Robert (2022, ACM ICAIF): Graph Transformer for multivariate RV
#   - SpotV2Net (Brini & Toscano 2025): vol-of-vol informed GAT
#
# Lookahead bias audit:
#   - GNN trains on fold's TRAIN dates only (graph snapshots from train window)
#   - Adjacency at date T uses rolling correlation [T-59, ..., T] — strictly causal
#   - gnn_prediction[T] = f(node_features[T], adj[T]) — no future data
#   - XGBoost trains on fold's TRAIN (with GNN train predictions)
#   - XGBoost evaluates on TEST (with GNN test predictions)
#   - feature_stack.independent=true → GNN does NOT see XGBoost predictions
#
# Baseline: trial-063 XGBoost champion QLIKE (without gnn_prediction feature).
# Success: XGBoost+GNN QLIKE < XGBoost-only QLIKE at any horizon.

name: trial_070_gnn_feature_stack_xgboost
n_gpus: 8

universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

# Feature layers for XGBoost (same as trial-063 champion)
feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

# ---------------------------------------------------------------------------
# Top-level model: XGBoost champion (gets gnn_prediction as extra feature)
# ---------------------------------------------------------------------------
model:
  name: xgboost
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    max_leaves: 16
    max_depth: 4
    min_child_weight: 150
    colsample_bytree: 0.8
    subsample: 0.8
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    base_model: har_iv_1w

# ---------------------------------------------------------------------------
# Feature stack: GNN prediction injected as column in XGBoost's feature matrix
# ---------------------------------------------------------------------------
feature_stack:
  source_model: gnn
  outputs: [prediction, node_attention]
  independent: true  # GNN trains without XGBoost predictions (no circular dependency)
  model_params:
    hidden_dim: 32
    n_heads: 4
    n_layers: 2
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 1.0e-4
    max_epochs: 200
    batch_size: 32
    val_fraction: 0.15
    early_stopping_rounds: 15
    loss: qlike
    adj_window: 60
    adj_threshold: 0.3
    device: auto
    precision: auto
    seed: 42
  sequences:
    source: daily_lookback
    features:
      - log_rv_d
      - log_rv_w
      - log_rv_m
      - signed_return_d
      - abs_ret_d
      - log_rs_negative_d
      - log_jump_d
      - log_bpv_d
      - log_cont_d
    max_bars: 1  # GNN uses single-date snapshot, not temporal lookback
    norm_mode: pooled

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

training_mode: pooled

# Per-horizon overrides: h=1 uses 0DTE IV tenor match for XGBoost init
horizon_overrides:
  1:
    model:
      params:
        base_model: har_iv_0dte

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: true
  gsvivs_short_threshold: 0
  parallel_models: 1
  mcs_bootstrap: 10000
  models:
    - har
    - har_iv
    - har_iv_0dte
    - har_iv_1w
    - xgb_with_gnn
    - xgb_no_gnn
  model_configs:
    xgb_with_gnn:
      name: xgboost
      # Gets full feature_stack (GNN prediction injected as column)
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte
    xgb_no_gnn:
      name: xgboost
      feature_stack_outputs: []  # Control: XGBoost WITHOUT GNN features
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte

seed: 42
output_dir: data/models/trial_070_gnn_feature_stack_xgboost
