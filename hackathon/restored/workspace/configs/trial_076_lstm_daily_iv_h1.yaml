# Trial-076: Daily-lookback LSTM + IV features (pure standalone, no stacking)
#
# Base: trial-065 (Rosenbaum daily LSTM, QLIKE 0.16205)
# Change: Add forward-looking IV features to the 22-day sequence:
#   log_atm_iv_d, vrp_d, vvix_d, iv_skew_d, iv_term_slope_d
#
# Hypothesis: IV features carry forward-looking information that pure RV
# history cannot capture. Adding them to the daily sequence gives the LSTM
# a richer representation of the volatility state, bridging part of the gap
# with XGBoost (which uses these as flat features).
#
# All model params identical to trial-065 — only the sequence features differ.

name: trial_076_lstm_daily_iv_h1
n_gpus: 8

universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

date_range: ["2015-01-02", "2024-12-31"]
horizons: [1]

feature_layers: [iv_surface, har_core, asymmetry, options]

fold_cache_enabled: false

model:
  name: lstm
  params:
    hidden_dim: 4
    n_layers: 4
    dropout: 0.0
    bidirectional: true
    learning_rate: 0.001
    weight_decay: 0.0
    max_epochs: 2000
    batch_size: 512
    val_fraction: 0.0
    early_stopping_rounds: null
    loss: mse
    device: auto
    precision: auto
    compile: false
    seed: 42
    symbol_embed_dim: 0
    pool_mode: last_hidden
    head_mode: linear

sequences:
  source: daily_lookback
  features:
    # Original trial-065 features
    - log_rv_d
    - log_rv_w
    - log_rv_m
    - signed_return_d
    - abs_ret_d
    # IV features (forward-looking)
    - log_atm_iv_d
    - vrp_d
    - vvix_d
    - iv_skew_d
    - iv_term_slope_d
  max_bars: 22
  norm_mode: pooled

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

training_mode: pooled

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: true
  parallel_models: 4
  models:
    - lstm
    - har
    - har_iv
