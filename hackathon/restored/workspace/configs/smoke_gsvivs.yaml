# Minimal smoke test to verify GSVIVS01 strategy table in dashboard
name: smoke_gsvivs
universe: [SPY, AAPL]
date_range: ["2020-01-02", "2023-12-31"]
horizons: [1]
feature_layers: [har_core]
model:
  name: lightgbm
  params:
    n_estimators: 50
    num_leaves: 8
    max_depth: 3
    min_child_samples: 50
    learning_rate: 0.05
    early_stopping_rounds: 10
    val_fraction: 0.15
    val_purge_gap: 5
cv:
  method: expanding_window
  purge_gap: 5
  train_size: 504
  test_size: 126
tournament:
  models: [har, lightgbm]
  mcs_bootstrap: 100
training_mode: pooled
seed: 42
output_dir: workspace/tmp/smoke_gsvivs
