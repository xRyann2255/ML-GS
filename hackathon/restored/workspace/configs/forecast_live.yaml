# Live forecast config: multi-model ensemble for daily signal generation.
#
# Models (per horizon):
#   h=1/h=5: har, har_iv_1w, lightgbm (init=har_iv_1w)
#   h=22:    har, har_iv,    lightgbm (init=har_iv)
#
# Training: full history (no holdout), pooled across universe.
# Signal: majority vote weighted by inverse QLIKE from trials.

name: forecast_live
symbol: SPY
horizons: [1, 5]
threshold: 0.0

# Universe for pooled LightGBM training (same as trial-033 LOCKED)
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

# Models to run per horizon. Each produces an independent signal.
models:
  har:
    type: har
    params: {}
  har_iv_1w:
    type: har_iv_1w
    params: {}
  har_iv:
    type: har_iv
    params: {}
  lgbm_hariv1w:
    type: lightgbm
    params:
      n_estimators: 5000
      early_stopping_rounds: 150
      learning_rate: 0.01
      num_leaves: 16
      max_depth: 4
      min_child_samples: 150
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 3
      reg_lambda: 5.0
      reg_alpha: 0.1
      val_fraction: 0.15
      val_purge_gap: 10
      base_model: har_iv_1w

# Per-horizon model selection and overrides
horizon_models:
  1: [har, har_iv, lgbm_hariv1w]
  5: [har, har_iv, lgbm_hariv1w]
  22: [har, har_iv, lgbm_hariv1w]

# Per-horizon overrides for LightGBM
horizon_overrides:
  22:
    lgbm_hariv1w:
      params:
        base_model: har_iv

# Signal aggregation: inverse-QLIKE weighted vote
aggregation: weighted_vote

# Reference QLIKE scores (from trials.yaml) for weighting
reference_qlike:
  1:
    har: 0.1598
    har_iv: 0.1500
    lgbm_hariv1w: 0.1336
  5:
    har: 0.1346
    har_iv: 0.1188
    lgbm_hariv1w: 0.1077
  22:
    har: 0.1956
    har_iv: 0.1737
    lgbm_hariv1w: 0.1764

training_mode: pooled
seed: 42
