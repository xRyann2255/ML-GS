# BROKEN: truncated mid-key in explainability section, do not use
# Trial-067 XGBoost champion — expanded to full 29-symbol universe
#
# IDENTICAL to trial_063_xgboost_champion.yaml (trial-067 base) except:
# - universe expanded from 21 → 29 symbols (all cached symbols from manifest)
# - Added: ABT, ACN, BRK.B, ES, JPM, META, QQQ, TMO
#
# Purpose: Test whether more training data (more symbols in pooled training)
# improves or degrades QLIKE. Apples-to-apples comparison with trial-067.

name: trial_067_xgb_29sym
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA
  # --- 8 additional symbols ---
  - ABT
  - ACN
  - BRK.B
  - ES
  - JPM
  - META
  - QQQ
  - TMO
date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

model:
  name: xgboost
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    max_leaves: 16
    max_depth: 4
    min_child_weight: 150
    colsample_bytree: 0.8
    subsample: 0.8
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    device: "cuda"
    base_model: har_iv_1w

n_gpus: 8

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

# Per-horizon init: exact tenor matching (same as trial-036)
horizon_overrides:
  1:
    model:
      params:
        base_model: har_iv_0dte
  22:
    model:
      params:
        base_model: har_iv

tournament:
  gsvivs_enabled: true
  gsvivs_short_threshold: 0
  gsvivs_iv_sources:
    - exec_kvar
    - edrvs_prev_close_1dte
    - spx_atm_iv_1d
    - spx_atm_iv_1w
  dh_enabled: false
  vt_enabled: false
  parallel_models: 1
  explainability:
