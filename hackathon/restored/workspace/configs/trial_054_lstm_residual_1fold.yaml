# Trial-054: Single-fold LSTM residual on CHAMPION (h=1 only).
#
# Based on trial_053_lstm_residual_on_champion_h1 EXCEPT:
#   - cv.train_size: 1260 (5 years, was 504)
#   - cv.test_size: 1590  (remaining ~6 years, was 126)
#   - Single fold: no CV overhead since we're not tuning hyperparameters.
#     Expanding window with these sizes produces exactly 1 fold:
#     train = 2015-01 to ~2020-01, test = ~2020-01 to 2026-05.
#
# Rationale: LSTM has no hyperparameter search, so multi-fold CV is pure
# computation waste. One fold with 5 years of training gives the model
# maximum data to learn temporal patterns, and tests on the full 6-year
# OOS window for robust evaluation.
#
# Reference baseline (trial-047 reseed envelope, pool21):
#   h=1  har_iv = 0.1368  lgbm_champion_mean = 0.13679

name: trial_054_lstm_residual_1fold
n_gpus: 8
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA
date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

# ---------------------------------------------------------------------------
# Sequence model (LSTM residual learner)
# ---------------------------------------------------------------------------
model:
  name: lstm
  params:
    hidden_dim: 128
    n_layers: 2
    dropout: 0.2
    bidirectional: false
    learning_rate: 0.001
    weight_decay: 1.0e-4
    max_epochs: 50
    batch_size: 1024
    val_fraction: 0.15
    early_stopping_rounds: 5
    loss: qlike
    device: auto
    precision: auto
    compile: true
    seed: 42

sequences:
  features:
    - log_ret
    - vol_share
    - buy_ratio
    - log_n_trades
    - abs_ret
  max_bars: 2340
  # Phase 2.7: per-symbol z-scoring; see workspace/research/lstm-v2-notes.md
  norm_mode: per_symbol

# ---------------------------------------------------------------------------
# Tabular base model: LightGBM CHAMPION with har_iv_0dte init at h=1
# ---------------------------------------------------------------------------
base_model:
  name: lightgbm
  feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    num_leaves: 16
    max_depth: 4
    min_child_samples: 150
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 3
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    base_model: har_iv_1w

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 1260
  test_size: 1590

training_mode: pooled

# Per-horizon overrides
horizon_overrides:
  1:
    base_model:
      params:
        base_model: har_iv_0dte

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: true
  parallel_models: 1
  baseline: lstm_residual
  mcs_bootstrap: 10000
  models:
    - har
    - har_iv
    - har_iv_1w
    - har_iv_0dte
    - lgbm_champion
    - lstm
  model_configs:
    lgbm_champion:
      name: lightgbm
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_1w

seed: 42
output_dir: data/models/trial_054_lstm_residual_1fold
