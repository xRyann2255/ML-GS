# Full 35-symbol universe ingestion
# Usage: vol run --config workspace/configs/ingest_full_universe.yaml

mode: ingest
name: ingest_full_universe
universe:
  # 30 mega-cap equities
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - META
  - GOOGL
  - GOOG
  - BRKb
  - AVGO
  - LLY
  - JPM
  - TSLA
  - UNH
  - V
  - XOM
  - MA
  - PG
  - COST
  - JNJ
  - HD
  - WMT
  - ABBV
  - NFLX
  - BAC
  - CRM
  - ADBE
  - AMD
  - CVX
  - MRK
  - KO
  # 4 ETFs
  - SPY
  - QQQ
  - IWM
  - DIA
  # 1 future
  - ES
date_range:
  - "2015-01-02"
  - "2024-12-31"
horizons:
  - 1
  - 5
  - 22
feature_layers:
  - har_core
  - asymmetry
model:
  name: har
  params: {}
cv:
  method: expanding_window
  purge_gap: 5
  train_size: 504
  test_size: 63
training_mode: pooled
seed: 42
output_dir: data/models/full_universe
