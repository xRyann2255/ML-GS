# Trial-062: long_flat with threshold=0 for GSVIVS01
#
# Hypothesis: The long_flat sizing mode with threshold=0 ("flat when gap < 0")
# is the walk-forward-validated optimal signal for GSVIVS01.
#
# Walk-forward results (252d trailing window, lgbm_hariv0dte_init, Exec Kvar):
#   h=1:  long_flat(t=0) Sharpe=1.83, pos_rate=65%, ann_ret=5.58%, max_dd=-2.53%
#   h=5:  long_flat(t=0) Sharpe=1.65, pos_rate=41%, ann_ret=3.75%, max_dd=-1.91%
#   h=22: long_flat(t=0) Sharpe=0.63, pos_rate=17%, ann_ret=1.43%, max_dd=-3.88%
#
# The static sweep (t=-0.001, Sharpe=3.29) was OVERFIT to the test period.
# Walk-forward adaptive threshold yields 1.72 Sharpe — WORSE than no threshold (1.83).
# The simple rule "flat when gap < 0" is already optimal; no tuning needed.
#
# This trial runs the same QLIKE tournament as trial-036 but with long_flat
# sizing at the sweep-optimal threshold. QLIKE numbers will be identical to
# trial-036 (same model/features/CV). The difference is in economic-value metrics.
#
# Reference:
#   workspace/tmp/gsvivs_long_flat_threshold_sweep.csv — full sweep data
#   workspace/tmp/gsvivs_long_flat_threshold_sweep_pivot.txt — pivot summary
#
# Baseline: trial_036_CHAMPION.yaml (binary signal, gsvivs_short_threshold=0.003)

name: trial_062_long_flat_optimal
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA
date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

model:
  name: lightgbm
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    num_leaves: 16
    max_depth: 4
    min_child_samples: 150
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 3
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    base_model: har_iv_1w

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

# Per-horizon init: exact tenor matching (same as trial-036)
horizon_overrides:
  1:
    model:
      params:
        base_model: har_iv_0dte
  22:
    model:
      params:
        base_model: har_iv

tournament:
  gsvivs_enabled: true
  # Walk-forward validated: threshold=0 is optimal (no tuning needed)
  gsvivs_short_threshold: 0.0
  gsvivs_signal_space: variance
  gsvivs_sizings:
    - long_flat
    - binary
  dh_enabled: false
  vt_enabled: false
  models:
    - ewma
    - har
    - har_iv
    - har_iv_1w
    - har_iv_0dte
    - same_day_rv
    - lgbm_hariv0dte_init
  baseline: lgbm_hariv1w_init
  mcs_bootstrap: 10000
  model_configs:
    lgbm_hariv0dte_init:
      name: lightgbm
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte

training_mode: pooled
seed: 42
output_dir: data/models/trial_062_long_flat_optimal
