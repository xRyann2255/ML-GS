# Trial-074 XGBoost companion: same CV as LSTM for apples-to-apples comparison
#
# Identical CV settings to trial_074_lstm_maxwin_h1.yaml:
#   - train_size=2200, test_size=252, purge_gap=10
#   - universe=[SPY, AAPL], date_range=["2015-01-02", "2026-05-30"]
#
# This ensures XGBoost and LSTM are evaluated on the EXACT same OOS dates.
# XGBoost uses the trial-067 champion architecture (har_iv_0dte init).
#
# XGBoost champion (trial-067, multi-fold): QLIKE=0.1292
# LSTM best (trial-073, multi-fold): QLIKE=0.1998
# This trial answers: on the SAME 252 test dates with maximum training data,
# what is the gap?

name: trial_074_xgb_maxwin_h1
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA
date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

model:
  name: xgboost
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    max_leaves: 16
    max_depth: 4
    min_child_weight: 150
    colsample_bytree: 0.8
    subsample: 0.8
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    device: "cuda"
    base_model: har_iv_0dte

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 2200
  test_size: 252

training_mode: pooled
seed: 42

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: false

output_dir: data/models/trial_074_xgb_maxwin
