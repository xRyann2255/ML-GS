# Trial-036 variant: drop VRP + calendar event features
#
# Identical to trial_036_CHAMPION but adds a second LightGBM model that
# excludes 8 features: fomc_week, vrp_m_change, long_jump_d, fomc_ay,
# vrp_m, vrp_d_zscore, opex_week, vrp_m_zscore.
#
# Purpose: test whether these VRP/calendar features are dead weight.

name: trial_036_drop_vrp_calendar
universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA
date_range: ["2015-01-02", "2026-05-30"]
horizons: [1, 5, 22]

feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

model:
  name: lightgbm
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    num_leaves: 16
    max_depth: 4
    min_child_samples: 150
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 3
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    base_model: har_iv_1w

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

# Per-horizon init: exact tenor matching
horizon_overrides:
  1:
    model:
      params:
        base_model: har_iv_0dte
  22:
    model:
      params:
        base_model: har_iv

tournament:
  gsvivs_enabled: true
  gsvivs_short_threshold: 0.0030
  gsvivs_sizings:
    - long_flat
  dh_enabled: false
  vt_enabled: false
  parallel_models: 1  # Sequential required for SHAP/ALE (models must persist in memory)
  explainability:
    enabled: true
    methods: [treeshap, ale]
    treeshap_max_samples: 500
    ale_features: top_20
    models: [lgbm_hariv0dte_init, lgbm_drop_vrp_cal]
  models:
    - har
    - har_iv
    - same_day_rv
    - ewma
    - lgbm_hariv0dte_init
    - lgbm_drop_vrp_cal
  baseline: lgbm_hariv0dte_init
  mcs_bootstrap: 10000
  model_configs:
    lgbm_hariv0dte_init:
      name: lightgbm
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte
    lgbm_drop_vrp_cal:
      name: lightgbm
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        num_leaves: 16
        max_depth: 4
        min_child_samples: 150
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 3
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte
        drop_features:
          - fomc_week
          - vrp_m_change
          - long_jump_d
          - fomc_ay
          - vrp_m
          - vrp_d_zscore
          - opex_week
          - vrp_m_zscore

training_mode: pooled
seed: 42
output_dir: data/models/trial_036_drop_vrp_calendar
