# Trial-066v3: LSTM feature stacking INTO XGBoost champion
#
# Architecture (REVERSED from v1/v2):
#   LSTM (44-day daily lookback, 9 features) → trains independently to predict log-RV
#   XGBoost (trial-063 spec + lstm_prediction as extra feature) → final prediction
#
# Why residual learning failed (v1 + v2):
#   The LSTM output zero in both attempts. The residual target (y - xgb_pred)
#   is near-zero with tiny gradients. All regularization (dropout, weight_decay,
#   early stopping) reinforces the zero solution. Even after removing regularization
#   and switching to MSE, the LSTM sees no learnable signal in the residual.
#
# Why feature stacking works:
#   1. LSTM trains to predict RAW log-RV (not residual). Large target variance
#      (std≈0.8) provides strong gradient signal. No zero-attractor problem.
#   2. XGBoost decides how much to trust the LSTM signal via tree splits:
#      "when lstm_prediction > X AND vrp > Y, adjust forecast by Z"
#   3. Even a noisy LSTM prediction adds value if it captures temporal patterns
#      (volatility clustering, regime transitions) that complement XGBoost's
#      cross-sectional feature splits.
#   4. Pipeline trains LSTM once per fold, caches predictions, then XGBoost
#      gets lstm_prediction as an additional column alongside 128 tabular features.
#
# Lookahead bias audit:
#   - LSTM trains on fold's TRAIN dates only, predicts on TEST dates.
#   - lstm_prediction[T] uses only features [T-43, ..., T] → no future leak.
#   - XGBoost trains on fold's TRAIN (with LSTM train predictions).
#   - XGBoost evaluates on TEST (with LSTM test predictions).
#   - feature_stack.independent=true → LSTM does NOT see XGBoost predictions.
#   - norm_mode: pooled (required — per_symbol incompatible with feature_stack).
#
# Baseline: trial-063 XGBoost champion QLIKE (without lstm_prediction feature).
# Success: XGBoost+LSTM QLIKE < XGBoost-only QLIKE at h=1.

name: trial_066_lstm_feature_stack_xgboost
n_gpus: 8

universe:
  - SPY
  - AAPL
  - MSFT
  - NVDA
  - AVGO
  - GOOGL
  - AMZN
  - V
  - MA
  - XOM
  - PG
  - JNJ
  - HD
  - NFLX
  - TSLA
  - CRM
  - UNH
  - BAC
  - ADBE
  - IWM
  - DIA

date_range: ["2015-01-02", "2026-05-30"]
horizons: [1]

# Feature layers for XGBoost (same as trial-063 champion)
feature_layers: [iv_surface, har_core, asymmetry, noise_robust, options, calendar, tree_expansion]

# ---------------------------------------------------------------------------
# Top-level model: XGBoost champion (gets lstm_prediction as extra feature)
# ---------------------------------------------------------------------------
model:
  name: xgboost
  params:
    n_estimators: 5000
    early_stopping_rounds: 150
    learning_rate: 0.01
    max_leaves: 16
    max_depth: 4
    min_child_weight: 150
    colsample_bytree: 0.8
    subsample: 0.8
    reg_lambda: 5.0
    reg_alpha: 0.1
    val_fraction: 0.15
    val_purge_gap: 10
    base_model: har_iv_1w

# ---------------------------------------------------------------------------
# Feature stack: LSTM prediction injected as column in XGBoost's feature matrix
# ---------------------------------------------------------------------------
feature_stack:
  source_model: lstm
  outputs: [prediction, attention_entropy]
  independent: true  # LSTM trains without XGBoost predictions (no circular dependency)
  model_params:
    hidden_dim: 64
    n_layers: 2
    dropout: 0.1
    bidirectional: false
    learning_rate: 0.001
    weight_decay: 1.0e-4
    max_epochs: 200
    batch_size: 128
    val_fraction: 0.15
    early_stopping_rounds: 15
    loss: mse
    device: auto
    precision: auto
    compile: false
    seed: 42
    symbol_embed_dim: 0
    pool_mode: attention
    head_mode: mlp
  sequences:
    source: daily_lookback
    features:
      - log_rv_d
      - log_rv_w
      - log_rv_m
      - signed_return_d
      - abs_ret_d
      - log_rs_negative_d
      - log_jump_d
      - log_bpv_d
      - log_cont_d
    max_bars: 44
    norm_mode: pooled  # Required: per_symbol incompatible with feature_stack

cv:
  method: expanding_window
  purge_gap: 10
  train_size: 504
  test_size: 126

training_mode: pooled

# Per-horizon overrides: h=1 uses 0DTE IV tenor match for XGBoost init
horizon_overrides:
  1:
    model:
      params:
        base_model: har_iv_0dte

tournament:
  dh_enabled: false
  vt_enabled: false
  gsvivs_enabled: true
  gsvivs_short_threshold: 0
  parallel_models: 1
  mcs_bootstrap: 10000
  models:
    - har
    - har_iv
    - har_iv_0dte
    - xgb_no_lstm
    - xgb_with_lstm
    - lstm
  model_configs:
    xgb_no_lstm:
      name: xgboost
      feature_stack_outputs: []  # Control: XGBoost WITHOUT lstm features
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte
    xgb_with_lstm:
      name: xgboost
      # Gets full feature_stack (prediction + attention_entropy) automatically
      params:
        n_estimators: 5000
        early_stopping_rounds: 150
        learning_rate: 0.01
        max_leaves: 16
        max_depth: 4
        min_child_weight: 150
        colsample_bytree: 0.8
        subsample: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
        val_fraction: 0.15
        val_purge_gap: 10
        base_model: har_iv_0dte

seed: 42
output_dir: data/models/trial_066_lstm_feature_stack_xgboost
