# uv configuration for GS internal PyPI mirror.
# This ensures uv uses the internal Nexus proxy instead of reaching out to pypi.org.
# NOTE: system-site-packages is enabled via `vol sync` (patches pyvenv.cfg after venv creation)
# to expose system-wide GS packages (pytickclient, pyslang).

[pip]
index-url = "https://pypi.aws.site.gs.com/repository/pypi-group/simple/"

[[index]]
url = "https://pypi.aws.site.gs.com/repository/pypi-group/simple/"
default = true
